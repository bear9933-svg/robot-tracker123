<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>80週機器人工程師學習追蹤器</title>
<style>
  :root{
    --bg-page:#F7F6F2;
    --card:#FFFFFF;
    --card-2:#F1EFE8;
    --border:#E5E2D8;
    --text-primary:#1F1E1B;
    --text-secondary:#6B6960;

    --p-purple-bg:#EEEDFE; --p-purple-fg:#3C3489;
    --p-teal-bg:#E1F5EE;   --p-teal-fg:#085041;
    --p-amber-bg:#FAEEDA;  --p-amber-fg:#633806;
    --p-coral-bg:#FAECE7;  --p-coral-fg:#712B13;
    --p-gray-bg:#F1EFE8;   --p-gray-fg:#444441;
    --p-blue-bg:#E6F1FB;   --p-blue-fg:#0C447C;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-page:#15140F;
      --card:#242219;
      --card-2:#1D1C15;
      --border:#3A3830;
      --text-primary:#F2F1EA;
      --text-secondary:#B4B2A9;

      --p-purple-bg:#3C3489; --p-purple-fg:#CECBF6;
      --p-teal-bg:#085041;   --p-teal-fg:#9FE1CB;
      --p-amber-bg:#633806;  --p-amber-fg:#FAC775;
      --p-coral-bg:#712B13;  --p-coral-fg:#F5C4B3;
      --p-gray-bg:#444441;   --p-gray-fg:#D3D1C7;
      --p-blue-bg:#0C447C;   --p-blue-fg:#B5D4F4;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg-page); color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  #app{max-width:720px;margin:0 auto;padding:28px 16px 80px;}

  header.top{
    background:var(--card); border:0.5px solid var(--border); border-radius:14px;
    padding:1rem 1.25rem; margin-bottom:16px;
  }
  header.top h1{
    margin:0 0 4px; font-size:17px; font-weight:500; color:var(--text-primary);
  }
  header.top .sub{color:var(--text-secondary); font-size:12px; margin-bottom:14px;}

  .progress-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:2px;}
  .progress-block{flex:1; min-width:140px;}
  .progress-label{font-size:11px; color:var(--text-secondary); margin-bottom:4px; display:flex; justify-content:space-between;}
  .progress-bar{height:7px; background:var(--card-2); border-radius:6px; overflow:hidden;}
  .progress-fill{height:100%; background:#1D9E75; border-radius:6px; transition:width .3s;}

  input#searchBox{
    width:100%; padding:9px 14px; border-radius:20px; margin-top:14px;
    border:0.5px solid var(--border); background:var(--card-2); color:var(--text-primary);
    font-size:13px; outline:none;
  }
  input#searchBox:focus{border-color:#1D9E75;}

  nav#monthNav{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .month-btn{
    padding:6px 12px; border-radius:20px; border:none;
    background:var(--p-gray-bg); color:var(--p-gray-fg); font-size:11px; cursor:pointer;
    font-weight:400;
  }
  .month-btn.active{background:#1D9E75; color:#fff;}
  .month-btn .m-progress{display:block; font-size:10px; opacity:0.85; margin-top:1px;}

  #weekGrid{display:flex; flex-direction:column; gap:12px;}

  .week-card{
    background:var(--card); border:0.5px solid var(--border); border-radius:14px;
    padding:0; overflow:hidden;
  }
  .week-head{display:flex; align-items:center; gap:10px; padding:1rem 1.25rem; cursor:pointer;}
  .week-node{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:500;
  }
  .week-node.done{outline:2px solid #1D9E75; outline-offset:1px;}
  .week-head-text{flex:1; min-width:0;}
  .week-head-text .wt{font-size:14px; font-weight:500; color:var(--text-primary);}
  .week-head-text .wg{font-size:12px; color:var(--text-secondary); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .week-mini-progress{font-size:11px; color:var(--text-secondary); flex-shrink:0;}
  .chevron{color:var(--text-secondary); transition:transform .2s; flex-shrink:0; font-size:12px;}
  .week-card.open .chevron{transform:rotate(90deg); color:#1D9E75;}

  .week-body{display:none; padding:0 1.25rem 1.1rem;}
  .week-card.open .week-body{display:block;}

  .section-label{
    font-size:11px; font-weight:500; color:var(--text-secondary);
    text-transform:uppercase; letter-spacing:.04em; margin:12px 0 4px;
  }
  .goal-box{
    background:var(--card-2); border-radius:8px; padding:8px 12px;
    font-size:13px; color:var(--text-primary); margin-bottom:6px; line-height:1.6;
  }

  .day-item{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:0.5px solid var(--border);}
  .day-item:first-child{border-top:none;}
  .day-item .chk{margin-top:3px; accent-color:#1D9E75; width:16px; height:16px; cursor:pointer; flex-shrink:0;}
  .day-item .day-label{
    font-size:11px; padding:2px 9px; border-radius:20px; flex-shrink:0;
    background:var(--p-blue-bg); color:var(--p-blue-fg); white-space:nowrap; margin-top:1px;
  }
  .day-item.project .day-label{background:var(--p-amber-bg); color:var(--p-amber-fg);}
  .day-item .day-content{flex:1; min-width:0;}
  .day-item .content-line{font-size:13px; font-weight:500; color:var(--text-primary); margin-bottom:2px;}
  .day-item .example-line{font-size:12px; color:var(--text-secondary); font-family:'Courier New',monospace;}
  .day-item .steps-line{font-size:12px; color:var(--text-secondary); margin-top:6px; white-space:pre-line;
    background:var(--card-2); border-radius:6px; padding:8px 10px;}

  details.explain-details{margin-top:8px; border:0.5px solid var(--border); border-radius:8px; overflow:hidden;}
  details.explain-details summary{
    padding:7px 12px; cursor:pointer; background:var(--card-2); color:var(--p-teal-fg);
    font-size:11.5px; font-weight:500; list-style:none;
  }
  details.explain-details summary::-webkit-details-marker{display:none;}
  .explain-body{
    padding:12px 14px; font-size:12.5px; color:var(--text-primary); line-height:1.75;
    white-space:pre-line; border-top:0.5px solid var(--border);
  }
  .explain-body code{
    background:var(--card-2); padding:1px 5px; border-radius:4px;
    font-family:'Courier New',monospace; font-size:12px;
  }
  .explain-body pre{
    margin:8px 0; padding:12px; background:var(--card-2); border-radius:6px;
    font-family:'Courier New',monospace; font-size:12px; overflow-x:auto; white-space:pre;
  }

  details.code-details{margin:12px 0 4px; border:0.5px solid var(--border); border-radius:10px; overflow:hidden;}
  details.code-details summary{
    padding:9px 14px; cursor:pointer; background:var(--card-2); color:var(--p-teal-fg);
    font-size:12px; font-weight:500; list-style:none;
  }
  details.code-details summary::-webkit-details-marker{display:none;}
  pre.code-block{
    margin:0; padding:14px; background:var(--card-2); color:var(--text-primary);
    font-family:'Courier New',monospace; font-size:12px; overflow-x:auto; white-space:pre;
    border-top:0.5px solid var(--border);
  }

  .note-label{font-size:11px; font-weight:500; color:var(--text-secondary); text-transform:uppercase;
    letter-spacing:.04em; margin:12px 0 4px; display:block;}
  textarea.note-box{
    width:100%; min-height:56px; padding:9px 12px;
    background:var(--card-2); border:0.5px solid var(--border); border-radius:8px;
    color:var(--text-primary); font-size:13px; resize:vertical;
  }

  .empty-msg{text-align:center; color:var(--text-secondary); padding:40px; font-size:13px;}
  footer.foot{text-align:center; color:var(--text-secondary); font-size:11px; margin-top:24px;}

.branch-nav{
  --nav-bg:#FFFFFF; --nav-border:#E3E1D8; --nav-text:#1F1E1B;
  --nav-text-dim:#6B6960; --nav-current-bg:#F1EFE8;
}
@media (prefers-color-scheme: dark){
  .branch-nav{
    --nav-bg:#242219; --nav-border:#3A3830; --nav-text:#F2F1EA;
    --nav-text-dim:#B4B2A9; --nav-current-bg:#1D1C15;
  }
}
.branch-nav{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:13px; background:var(--nav-bg); border-right:0.5px solid var(--nav-border);
  padding:20px 14px; box-sizing:border-box;
}
.branch-nav .branch-group{margin-bottom:18px;}
.branch-nav .branch-title{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--nav-text);margin-bottom:8px;cursor:pointer;user-select:none;}
.branch-nav .branch-title .caret{margin-left:auto;font-size:10px;color:var(--nav-text-dim);transition:transform .15s ease;}
.branch-nav .branch-group.collapsed .branch-title .caret{transform:rotate(-90deg);}
.branch-nav .branch-group.collapsed .branch-items{display:none;}
.branch-nav .branch-items{list-style:none;margin:0;padding:0;border-left:1px solid var(--nav-border);margin-left:6px;}
.branch-nav .branch-items li{position:relative;padding:5px 0 5px 16px;}
.branch-nav .branch-items li::before{content:"";position:absolute;left:-1px;top:14px;width:12px;height:1px;background:var(--nav-border);}
.branch-nav .branch-items a{color:var(--nav-text-dim);text-decoration:none;display:block;padding:4px 8px;border-radius:6px;}
.branch-nav .branch-items a:hover{background:var(--nav-current-bg);}
.branch-nav .branch-items a.current{color:var(--nav-text);font-weight:600;background:var(--nav-current-bg);}
@media (min-width:761px){
  .branch-nav{position:fixed;top:0;left:0;bottom:0;width:190px;overflow-y:auto;z-index:100;}
  body{padding-left:190px;}
}
@media (max-width:760px){
  .branch-nav{border-right:none;border-bottom:0.5px solid var(--nav-border);padding:14px;position:static;}
  .branch-nav .branch-group{margin-bottom:10px;}
  .branch-nav .branch-group.collapsed .branch-items{display:flex;}
  .branch-nav .branch-title .caret{display:none;}
  .branch-nav .branch-items{display:flex;flex-wrap:wrap;gap:4px;border-left:none;margin-left:0;}
  .branch-nav .branch-items li{padding:0;}
  .branch-nav .branch-items li::before{display:none;}
  .branch-nav .branch-items a{padding:4px 10px;border:0.5px solid var(--nav-border);border-radius:14px;}
}

</style>
</head>

document.querySelectorAll('.branch-nav .branch-title').forEach(function(t){

<div id="app">
  <header class="top">

    <h1>80週機器人工程師學習追蹤器</h1>
    <div class="sub">Week1 ~ Week80 · 進度會自動保存在瀏覽器</div>
    <div class="progress-row" id="progressRow"></div>
    <input id="searchBox" type="text" placeholder="搜尋週次關鍵字，例如：ROS2、伺服馬達、OpenCV...">
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button id="exportBtn" type="button" style="font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid var(--border);background:var(--card-2);color:var(--text-primary);cursor:pointer;">📤 匯出備份</button>
      <label style="font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid var(--border);background:var(--card-2);color:var(--text-primary);cursor:pointer;">
        📥 匯入備份
        <input id="importInput" type="file" accept="application/json" style="display:none;">
      </label>
    </div>
  </header>

  <nav id="monthNav"></nav>
  <div id="weekGrid"></div>
  <footer class="foot">資料來源：Year1_Python_Linux_Git_週規劃.xlsx</footer>
</div>

<script>
const WEEKS = [{"sheet": "Week1", "num": 1, "title": "Week 1：環境安裝", "purpose": "打好整條四年路線圖最底層的地基：把開發環境架好，之後每一週的練習都建立在這週的工具之上。", "goal": "把電腦準備好可以寫程式、控制版本，之後還能遠端操作樹莓派", "days": [{"day": "週一", "content": "安裝 Python", "example": "python3 --version", "explanation": "**做什麼**：到 python.org 下載 Python 3.12，安裝時務必勾選「Add Python to PATH」。\n\n**驗證安裝成功**：\n```bash\npython3 --version\n```\n應該會看到：\n```\nPython 3.12.x\n```\n\n**為什麼要驗證這步**：如果沒勾選「Add Python to PATH」，電腦會找不到python指令，之後每次都要打完整路徑，非常麻煩，這是新手最常卡關的第一步。\n\n**常見錯誤**：Windows有些人打 `python --version` 沒反應，但 `python3 --version` 有反應（或相反）。兩個都試試看，記住你電腦是哪一個有效。", "is_project": false}, {"day": "週二", "content": "安裝 VSCode 並寫第一支程式", "example": "print(\"Hello, Robot!\")", "explanation": "**做什麼**：\n1. 下載安裝 VSCode\n2. 在VSCode安裝「Python」擴充套件（左側方塊圖示 → 搜尋Python → Install）\n3. 新增專案資料夾，例如 robot-learning，裡面新增檔案 hello.py\n\n```python\nprint(\"Hello, Robot!\")\nrobot_name = \"AGV-01\"\nprint(f\"我是 {robot_name}，準備好開始學習了！\")\n```\n\n**逐行說明**：\n- `print()` 是最基本的輸出指令，把括號裡的內容顯示在終端機\n- `robot_name = \"AGV-01\"` 是變數賦值，把字串存進一個叫 robot_name 的容器裡\n- `f\"我是 {robot_name}...\"` 前面加 f 的字串叫f-string，{}裡面可以直接放變數\n\n**執行方式**：VSCode右上角三角形「執行」按鈕，或終端機打 `python3 hello.py`", "is_project": false}, {"day": "週三", "content": "安裝 Git", "example": "git config --global user.name \"你的名字\"", "explanation": "**做什麼**：下載安裝Git，安裝完設定身份：\n```bash\ngit config --global user.name \"你的名字\"\ngit config --global user.email \"你的email\"\n```\n\n**逐行說明**：\n- Git是版本控制工具，幫程式碼拍「存檔點」，之後可以回到任何一個存檔點，也能追蹤誰改了什麼\n- `--global` 代表這個設定套用到電腦上所有git專案\n\n**驗證設定成功**：\n```bash\ngit config --list\n```\n能看到剛剛設定的名字跟email就代表成功。", "is_project": false}, {"day": "週四", "content": "建立GitHub帳號與第一個repository", "example": "git init && git add hello.py && git commit -m \"feat: 第一支程式\"", "explanation": "**做什麼**：\n1. 到github.com註冊帳號\n2. 建立新repository，命名 robot-learning-journey\n3. 回到本機專案資料夾執行：\n```bash\ncd robot-learning-journey\ngit init\ngit add hello.py\ngit commit -m \"feat: 第一支hello world程式\"\n```\n\n**逐行說明**：\n- `git init` 讓資料夾變成Git專案（產生隱藏的.git資料夾記錄所有歷史）\n- `git add hello.py` 把檔案加入暫存區，代表「我準備要存檔這個檔案了」\n- `git commit -m \"...\"` 正式存一個檔點，-m後面接說明文字\n\n**為什麼commit訊息要寫feat:**：業界常見命名慣例，feat:代表新增功能，fix:代表修bug，之後看紀錄一眼就知道每次改了什麼類型。", "is_project": false}, {"day": "週五【小專案】", "content": "環境整合測試 + 推上GitHub", "example": "確認Python、VSCode、Git、GitHub全部串起來能正常運作", "explanation": "**逐行說明**：\n- `import sys` 和 `import platform` 是Python內建模組，import就是「把別人寫好的功能借來用」\n- `sys.version` 印出目前執行的Python版本\n- `platform.system()` 印出作業系統名稱\n\n**完成後推上GitHub**：\n```bash\ngit add environment_check.py\ngit commit -m \"feat: 新增環境檢查腳本\"\ngit remote add origin https://github.com/你的帳號/robot-learning-journey.git\ngit push -u origin main\n```\n\n**逐行說明**：\n- `git remote add origin <網址>` 把本機Git專案跟GitHub上的repository連起來\n- `git push -u origin main` 把本機存檔紀錄上傳到GitHub，-u代表之後可以直接打git push\n\n**檢查完成**：回到GitHub網頁重新整理，應該能看到hello.py和environment_check.py兩個檔案。", "is_project": true}], "full_code": "# environment_check.py\n# 目標：印出環境資訊，確認開發環境已經準備好\n\nimport sys\nimport platform\n\ndef check_environment():\n    print(\"=== 開發環境檢查 ===\")\n    print(f\"Python版本：{sys.version}\")\n    print(f\"作業系統：{platform.system()} {platform.release()}\")\n    print(\"環境確認完成，可以開始四年學習計畫了！\")\n\nif __name__ == \"__main__\":\n    check_environment()\n"}, {"sheet": "Week2", "num": 2, "title": "Week 2：變數與資料型別", "purpose": "承接『環境安裝』累積的基礎，為接下來『條件判斷與迴圈』做準備；學會用變數儲存資料，是所有程式邏輯的起點。", "goal": "熟悉變數的用法，並學會處理不同資料型別之間的轉換", "days": [{"day": "週一", "content": "變數賦值與命名規則", "example": "battery_level = 80", "explanation": "```python\nbattery_level = 80\nrobot_name = \"AGV-01\"\nis_charging = False\n\nprint(battery_level)\nprint(robot_name)\nprint(is_charging)\n```\n\n**逐行說明**：\n- Python變數不用宣告型別，直接賦值就會自動判斷是數字、文字還是布林值\n- `battery_level` 用底線分隔單字，是Python變數命名慣例（snake_case）\n- `is_charging = False` 布林值只有True或False，開頭一定要大寫\n\n**命名規則**：變數不能用數字開頭（1battery是錯的），不能有空格，盡量讓名字看得出用途。", "is_project": false}, {"day": "週二", "content": "基本運算子", "example": "battery_percent = battery % 100", "explanation": "```python\nspeed = 50\nbattery = 80\n\nnew_speed = speed + 10        # 加法\nremaining = battery - 20      # 減法\ndouble_speed = speed * 2      # 乘法\nhalf_battery = battery / 2    # 除法（結果會是小數）\nbattery_percent = battery % 100  # 取餘數\n```\n\n**逐行說明**：\n- `/` 是除法，結果一定是小數（80/2會得到40.0不是40）\n- `//` 是整數除法，會捨去小數點（7//2得到3）\n- `%` 是取餘數，常用在判斷是不是整除或做循環分組\n\n**動手練習**：試試看 `print(7 // 2)` 跟 `print(7 % 2)` 分別會印出什麼，猜猜看再驗證。", "is_project": false}, {"day": "週三", "content": "int/float/str/bool 轉換", "example": "c = float(input()); f = c*9/5+32", "explanation": "```python\nc = float(input(\"請輸入攝氏溫度：\"))\nf = c * 9/5 + 32\nprint(f\"攝氏 {c} 度 = 華氏 {f} 度\")\n```\n\n**逐行說明**：\n- `input()` 會等使用者輸入文字，並回傳一個**字串**（就算你打數字，Python也當作文字）\n- 外面要包一層 `float()`，把字串轉換成小數，才能拿去做數學運算\n- 忘記轉換直接拿字串做乘法會報錯：TypeError\n\n**常見錯誤**：新手常忘記input()回傳的是字串，直接拿去加減乘除就會報錯。記住口訣：**input出來的東西，先轉型別再計算**。", "is_project": false}, {"day": "週四", "content": "字串基本操作", "example": "f\"馬達轉速：{rpm} RPM\"", "explanation": "```python\nrpm = 1500\nmessage = f\"馬達轉速：{rpm} RPM\"\nprint(message)\nprint(message.upper())      # 全部轉大寫\nprint(len(message))         # 字串長度\nprint(message[0:6])         # 切片：取第0到第5個字元\n```\n\n**逐行說明**：\n- f-string裡的{rpm}會自動把數字轉成文字放進字串裡，不用手動轉換\n- `.upper()` 是字串的方法，句點後面接的都是這個字串能做的動作\n- `message[0:6]` 是切片語法，0:6代表從索引0開始，取到索引6之前（不包含6）", "is_project": false}, {"day": "週五【小專案】", "content": "機器人狀態顯示器", "example": "印出電池電量、目前速度、模式三個變數組成的儀表板文字", "explanation": "**為什麼要這樣寫**：\n1. 用固定的分隔線==== 讓輸出看起來像真正的儀表板，這是很多工程師會做的小細節\n2. 最後加了一個if判斷——這是下週才教的內容，先讓你看到「這週學的東西，加一點下週的概念就能做出更完整的功能」\n3. 用emoji（⚠️✅）讓狀態一眼就能分辨，這在做人機介面時很實用", "is_project": true}], "full_code": "# robot_status_display.py\n# 目標：印出電池電量、目前速度、模式組成的儀表板文字\n\ndef display_robot_status():\n    battery = 80\n    speed = 0\n    mode = \"manual\"\n\n    print(\"========================\")\n    print(\"   AGV 機器人狀態面板\")\n    print(\"========================\")\n    print(f\"電池電量：{battery}%\")\n    print(f\"目前速度：{speed} km/h\")\n    print(f\"運作模式：{mode}\")\n\n    # 多想一步：加入簡單的狀態判斷\n    if battery < 20:\n        print(\"警告：電量過低，建議充電！\")\n    else:\n        print(\"電量正常\")\n\nif __name__ == \"__main__\":\n    display_robot_status()\n"}, {"sheet": "Week3", "num": 3, "title": "Week 3：條件判斷與迴圈", "purpose": "承接『變數與資料型別複習強化』累積的基礎，為接下來『函式 Functions』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能寫出會做決定、能重複執行的程式", "days": [{"day": "週一", "content": "if / elif / else", "example": "if battery < 20: print(\"需要充電\")", "explanation": "```python\nbattery = 15\n\nif battery < 20:\n    print(\"需要充電\")\nelif battery < 50:\n    print(\"電量普通\")\nelse:\n    print(\"電量充足\")\n```\n\n**逐行說明**：\n- `if battery < 20:` 意思是「如果電量小於20，就做冒號下面縮排的事」\n- `elif` 是「否則，如果...」，只有第一個if不成立才會檢查\n- `else` 是「以上都不成立的話，就做這個」\n- 縮排（4個空格）很重要，Python靠縮排判斷哪些程式碼屬於這個if\n\n**動手練習**：把battery=15改成battery=60，猜猜看會印出什麼，再執行確認。", "is_project": false}, {"day": "週二", "content": "比較運算子、邏輯運算子 (and/or/not)", "example": "if speed > 50 and mode == \"auto\":", "explanation": "```python\nspeed = 55\nmode = \"auto\"\n\nif speed > 50 and mode == \"auto\":\n    print(\"速度過快，自動減速\")\n```\n\n**逐行說明**：\n- `and` 代表兩個條件都要成立才會進去，換成 `or` 只要其中一個成立就會進去\n- `==` 是判斷是否相等，跟 `=`（賦值）是不同的東西，這是初學者最常搞混的地方", "is_project": false}, {"day": "週三", "content": "while 迴圈", "example": "模擬AGV持續巡邏直到電量耗盡", "explanation": "```python\ndistance = 100\n\nwhile distance > 10:\n    distance -= 15\n    print(f\"目前距離障礙物：{distance} cm\")\n\nprint(\"停止！\")\n```\n\n**逐行說明**：\n- `while distance > 10:` 意思是「只要distance還大於10，就一直重複做下面的事」\n- `distance -= 15` 等於 `distance = distance - 15`，每次迴圈distance會減少15\n\n**執行結果**：\n```\n目前距離障礙物：85 cm\n目前距離障礙物：70 cm\n目前距離障礙物：55 cm\n目前距離障礙物：40 cm\n目前距離障礙物：25 cm\n目前距離障礙物：10 cm\n停止！\n```\n\n**新手最容易犯的錯**：忘記讓迴圈裡的變數改變，會變成無窮迴圈卡死。例如忘記寫distance -= 15，distance永遠是100，迴圈永遠不會結束。", "is_project": false}, {"day": "週四", "content": "for 迴圈、range()", "example": "模擬感測器每秒讀取一次，共讀10次", "explanation": "```python\nfor i in range(10):\n    print(f\"第{i+1}次讀取，感測器數值：{i * 3}\")\n```\n\n**逐行說明**：\n- `range(10)` 會產生0,1,2,...,9這10個數字\n- `for i in range(10):` 意思是「i依序拿到這10個數字，每拿到一個就跑一次迴圈內容」\n- 這跟while的差別是：for迴圈知道確切要跑幾次，while是條件滿足就一直跑，不確定跑幾次", "is_project": false}, {"day": "週五【小專案】", "content": "簡易避障邏輯模擬", "example": "while迴圈模擬AGV前進，距離<10cm就停止並印出警告", "explanation": "**為什麼要這樣寫**：\n1. 把邏輯包在simulate_agv_movement()函式裡（雖然函式是下週才教的內容，但先讓你看到程式會越寫越模組化的方向）\n2. `if __name__ == \"__main__\":` 是Python的慣例寫法，讓這支程式未來可以被其他程式import使用而不會意外執行\n3. 中間加了一個if distance <= 25的預警邏輯，這是多想一步——不是只會抄範例，而是想這個情境下還可以多做什麼", "is_project": true}], "full_code": "# 簡易避障邏輯模擬\n# 目標：模擬AGV往前走，偵測到障礙物(距離<10cm)就停止並警告\n\ndef simulate_agv_movement():\n    distance = 100  # 初始距離：假設前方100公分處才有障礙物\n    step = 15       # 每次前進，距離會減少15公分（模擬AGV移動速度）\n\n    print(\"=== AGV開始前進 ===\")\n\n    while distance > 10:\n        distance -= step\n        print(f\"前進中... 目前距離障礙物：{distance} cm\")\n\n        # 額外練習：如果距離已經很接近，可以先給預警\n        if distance <= 25:\n            print(\"注意：即將接近障礙物\")\n\n    print(\"偵測到障礙物！距離小於10cm，AGV已停止\")\n    print(f\"最終停止距離：{distance} cm\")\n\nif __name__ == \"__main__\":\n    simulate_agv_movement()\n"}, {"sheet": "Week4", "num": 4, "title": "Week 4：函式（Functions）", "purpose": "承接『條件判斷與迴圈』累積的基礎，為接下來『串列/元組/字典』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "把重複邏輯包裝成可重複使用的函式", "days": [{"day": "週一", "content": "函式定義、傳入參數", "example": "def check_battery(level):", "explanation": "```python\ndef check_battery(level):\n    if level < 20:\n        print(\"電量過低\")\n    else:\n        print(\"電量正常\")\n\ncheck_battery(15)\ncheck_battery(80)\n```\n\n**逐行說明**：\n- `def 函式名稱(參數):` 是定義函式的固定語法，def是define（定義）的縮寫\n- `level` 是參數，呼叫函式時傳進去的值會被放進這個變數\n- `check_battery(15)` 是呼叫函式，15會變成函式內的level\n\n**為什麼要用函式**：如果沒有函式，同樣的判斷邏輯要用幾次就要複製貼上幾次；包成函式之後，以後只要呼叫`check_battery(某個數字)`就能重複使用。", "is_project": false}, {"day": "週二", "content": "回傳值 return", "example": "def is_safe_distance(d): return d > 10", "explanation": "```python\ndef is_safe_distance(d):\n    return d > 10\n\nresult = is_safe_distance(5)\nprint(result)       # False\nprint(is_safe_distance(20))  # True\n```\n\n**逐行說明**：\n- `return` 讓函式「回傳一個值」給呼叫它的地方，這個值可以存進變數（例如result）或直接拿去用\n- `d > 10` 這個表達式本身的結果就是True或False，所以回傳的就是布林值\n\n**常見錯誤**：忘記寫return，函式執行完會回傳`None`，如果你把`None`拿去做if判斷或運算就會出錯或行為不如預期。", "is_project": false}, {"day": "週三", "content": "預設參數、關鍵字參數", "example": "def move(speed=50, direction=\"forward\"):", "explanation": "```python\ndef move(speed=50, direction=\"forward\"):\n    print(f\"以速度{speed}朝{direction}方向移動\")\n\nmove()                          # 用預設值：速度50、方向forward\nmove(80)                        # 只改速度\nmove(direction=\"backward\")      # 用關鍵字指定要改哪個參數\n```\n\n**逐行說明**：\n- `speed=50` 代表如果呼叫時沒給這個參數，就用50當預設值\n- `move(direction=\"backward\")` 這種寫法叫關鍵字參數，可以跳過前面的參數，直接指定要改哪一個\n\n**為什麼實用**：機器人控制常常大部分時候用預設值就好，只有少數情況需要調整某一兩個參數，這樣寫可以少打很多重複的參數。", "is_project": false}, {"day": "週四", "content": "函式作用域（區域 vs 全域變數）", "example": "說明為何機器人狀態建議用參數傳遞而非全域變數", "explanation": "```python\nbattery = 80  # 這是全域變數\n\ndef drain_battery(amount):\n    battery = battery - amount  # 這樣寫會報錯！\n    return battery\n```\n\n**逐行說明**：\n- 函式裡面直接賦值給跟外面同名的變數，Python會把它當成一個新的「區域變數」，而不是去修改外面的全域變數，因此上面這段程式碼實際上會報錯（UnboundLocalError）\n- 正確做法是把battery當參數傳進去，然後回傳新的值：\n```python\ndef drain_battery(current, amount):\n    return current - amount\n\nbattery = drain_battery(battery, 20)\n```\n\n**為什麼要這樣設計**：機器人系統常常有很多模組同時在讀寫同一個狀態，如果隨便用全域變數，很容易「不知道是哪裡改的」，養成用參數傳遞、用return拿回結果的習慣，之後除錯會輕鬆很多。", "is_project": false}, {"day": "週五【小專案】", "content": "避障邏輯改寫成函式版本", "example": "def obstacle_check(distance): ...", "explanation": "**為什麼要這樣寫**：\n1. 把Week3寫死在while迴圈裡的判斷邏輯，抽出來變成一個獨立函式`obstacle_check(distance)`，之後要改判斷門檻（例如從10cm改成15cm）只要改函式裡的一個地方\n2. 函式回傳True/False，讓「判斷」跟「執行動作」這兩件事分開，未來要接感測器真實數值，只要把distance換成感測器讀值即可，邏輯完全不用改\n3. 這就是「模組化」的第一步：把邏輯包成函式，可以被重複使用、單獨測試，也更容易讓AI工具幫你除錯（因為問題範圍縮小到一個函式內）", "is_project": true}], "full_code": "# 避障邏輯改寫成函式版本\n# 目標：把判斷邏輯獨立成函式，方便重複使用與未來替換成真實感測器數值\n\ndef obstacle_check(distance, threshold=10):\n    \"\"\"判斷是否偵測到障礙物：distance小於threshold就回傳True\"\"\"\n    return distance < threshold\n\ndef simulate_agv_movement():\n    distance = 100\n    step = 15\n\n    print(\"=== AGV開始前進 ===\")\n    while not obstacle_check(distance):\n        distance -= step\n        print(f\"前進中... 目前距離障礙物：{distance} cm\")\n\n    print(\"偵測到障礙物！AGV已停止\")\n    print(f\"最終停止距離：{distance} cm\")\n\nif __name__ == \"__main__\":\n    simulate_agv_movement()\n"}, {"sheet": "Week5", "num": 5, "title": "Week 5：串列、元組、字典", "purpose": "承接『函式 Functions』累積的基礎，為接下來『字串處理與檔案I/O』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能管理一組資料", "days": [{"day": "週一", "content": "list 建立、索引、切片", "example": "sensors = [23, 45, 12, 67]", "explanation": "```python\nsensors = [23, 45, 12, 67]\n\nprint(sensors[0])     # 23（索引從0開始）\nprint(sensors[-1])    # 67（-1代表倒數第一個）\nprint(sensors[1:3])   # [45, 12]（切片：取索引1到3之前）\n```\n\n**逐行說明**：\n- list（串列）用方括號`[]`建立，可以放很多筆同類型或不同類型的資料\n- 索引從0開始算，`sensors[0]`是第一個元素，不是`sensors[1]`\n- 負數索引很好用：`-1`永遠是最後一個，不用先算長度\n- 切片`[1:3]`是「左閉右開」：包含索引1，但不包含索引3\n\n**常見錯誤**：索引超出範圍會報`IndexError`，例如sensors只有4筆資料，你去讀`sensors[10]`就會出錯。", "is_project": false}, {"day": "週二", "content": "list 方法（append, remove, sort）", "example": "記錄每次距離讀值，找出最小值", "explanation": "```python\nreadings = []\nreadings.append(23)\nreadings.append(45)\nreadings.append(12)\n\nprint(readings)          # [23, 45, 12]\nreadings.sort()\nprint(readings)          # [12, 23, 45]\nprint(min(readings))     # 12\nreadings.remove(23)\nprint(readings)          # [12, 45]\n```\n\n**逐行說明**：\n- `.append(值)` 是在list最後面加一筆資料，模擬「每次讀到一個新的感測值就記錄下來」\n- `.sort()` 會直接把原本的list排序（由小到大），注意它是「原地排序」，沒有回傳新list\n- `min()` `max()` 是Python內建函式，可以直接對list取最小/最大值，不用自己寫迴圈比較\n- `.remove(值)` 是移除「第一個」符合這個值的元素，如果list裡有重複的值，只會刪掉第一個", "is_project": false}, {"day": "週三", "content": "tuple（不可變資料）", "example": "motor_position = (x, y)", "explanation": "```python\nmotor_position = (10, 20)\nprint(motor_position[0])   # 10\n\n# motor_position[0] = 99   # 這行會報錯！tuple不能修改\n```\n\n**逐行說明**：\n- tuple用小括號`()`建立，讀取方式跟list一樣用索引\n- 跟list最大的差別：tuple建立之後**不能修改內容**（不能新增、刪除、改值）\n- 適合用在「這組資料理論上不該被意外修改」的情境，例如座標、RGB顏色值\n\n**為什麼要用tuple**：像`(x, y)`這種座標，如果不小心在程式某處寫錯改動了其中一個值，用list的話不會報錯（但邏輯可能就壞了），用tuple的話Python會直接報錯提醒你，等於多一層保護。", "is_project": false}, {"day": "週四", "content": "dict（鍵值對）", "example": "robot_status = {\"battery\": 80, \"mode\": \"auto\"}", "explanation": "```python\nrobot_status = {\"battery\": 80, \"mode\": \"auto\"}\n\nprint(robot_status[\"battery\"])   # 80\nrobot_status[\"speed\"] = 30       # 新增一組鍵值對\nrobot_status[\"battery\"] = 75     # 修改既有的值\n\nprint(robot_status)\n```\n\n**逐行說明**：\n- dict（字典）用大括號`{}`建立，每一筆資料是「鍵:值」的配對，例如`\"battery\": 80`\n- 用鍵（key）去讀取值，不是用數字索引，例如`robot_status[\"battery\"]`而不是`robot_status[0]`\n- 可以直接用`字典[新的鍵] = 值`來新增一筆資料，如果鍵已經存在就會變成修改\n\n**為什麼比list好用**：如果用list存機器人狀態`[80, \"auto\"]`，你必須記住「第0個是電量、第1個是模式」；用dict的話`robot_status[\"battery\"]`看名字就知道意思，程式碼可讀性高很多。", "is_project": false}, {"day": "週五【小專案】", "content": "多感測器監控表", "example": "用list存4顆感測器數值，用dict存整體狀態，印出彙整報告", "explanation": "**為什麼要這樣寫**：\n1. 用list存4顆感測器數值，因為它們是「同一種東西的一組資料」，且順序有意義（例如感測器1~4的位置固定）\n2. 用dict存整體狀態，因為battery、mode這些是「不同種類的資訊」，用鍵值對讀起來比較清楚\n3. 這就是實務上很常見的資料設計方式：**同質性的一組數字用list，異質性的狀態用dict**，之後規模變大（例如ROS2的訊息格式）也是同樣的邏輯", "is_project": true}], "full_code": "# 多感測器監控表\n# 目標：用list存4顆感測器數值，用dict存整體狀態，印出彙整報告\n\ndef build_report():\n    sensor_readings = [23, 45, 12, 67]  # 4顆感測器目前讀到的距離值(cm)\n    robot_status = {\n        \"battery\": 80,\n        \"mode\": \"auto\",\n    }\n\n    print(\"=== 感測器監控報告 ===\")\n    for i, value in enumerate(sensor_readings):\n        print(f\"感測器{i+1}: {value} cm\")\n\n    print(f\"最短距離: {min(sensor_readings)} cm\")\n    print(f\"電池電量: {robot_status['battery']}%\")\n    print(f\"目前模式: {robot_status['mode']}\")\n\n    # 多想一步：加入簡單的整體判斷\n    if min(sensor_readings) < 15:\n        print(\"警告：有感測器偵測到過近的障礙物！\")\n\nif __name__ == \"__main__\":\n    build_report()\n"}, {"sheet": "Week6", "num": 6, "title": "Week 6：字串處理與檔案 I/O", "purpose": "承接『串列/元組/字典』累積的基礎，為接下來『物件導向基礎(上)』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能讀寫檔案、處理CSV", "days": [{"day": "週一", "content": "字串方法（split, strip, join）", "example": "解析序列埠收到的 \"23.5,45.2,12.1\"", "explanation": "```python\nraw = \"23.5,45.2,12.1\\n\"\nclean = raw.strip()          # 去掉頭尾的換行/空白\nparts = clean.split(\",\")    # 用逗號切開，變成list\nvalues = [float(p) for p in parts]\n\nprint(values)   # [23.5, 45.2, 12.1]\n```\n\n**逐行說明**：\n- `.strip()` 去掉字串前後的空白或換行符號，序列埠傳來的資料常常尾巴會多一個`\\n`（換行），不strip掉的話後面轉換數字會出錯\n- `.split(\",\")` 依照逗號把一整串文字切成好幾段，回傳一個list\n- `[float(p) for p in parts]` 是「列表推導式」，等同於用迴圈把每個字串都轉成float，再組成新的list\n\n**為什麼重要**：之後接ESP32用序列埠傳資料，格式常常就是像這樣的CSV字串，這是Week16 pyserial單元會直接用到的技巧。", "is_project": false}, {"day": "週二", "content": "開檔、讀檔、寫檔（with open）", "example": "把感測器數值寫入 log.txt", "explanation": "```python\nwith open(\"log.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"23.5\\n\")\n    f.write(\"45.2\\n\")\n\nwith open(\"log.txt\", \"r\", encoding=\"utf-8\") as f:\n    content = f.read()\n    print(content)\n```\n\n**逐行說明**：\n- `with open(檔名, 模式) as f:` 是Python建議的開檔寫法，離開這個縮排範圍後檔案會自動關閉，不用自己寫`f.close()`\n- `\"w\"` 是寫入模式（會覆蓋原有內容），`\"r\"` 是讀取模式\n- `encoding=\"utf-8\"` 確保中文字不會亂碼，這個習慣要一直保持\n\n**常見錯誤**：忘記用`with`，直接`f = open(...)`然後忘記`f.close()`，長時間執行的程式（例如機器人程式常常跑很久）容易造成檔案佔用或資料沒寫入完全的問題。", "is_project": false}, {"day": "週三", "content": "CSV檔案讀寫（csv模組）", "example": "建立簡單的 sensor_log.csv", "explanation": "```python\nimport csv\n\nwith open(\"sensor_log.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    writer = csv.writer(f)\n    writer.writerow([\"time\", \"distance\"])\n    writer.writerow([0, 100])\n    writer.writerow([1, 85])\n```\n\n**逐行說明**：\n- `import csv` 是Python內建的CSV處理模組，不用自己手動處理逗號分隔\n- `newline=\"\"` 是Windows上處理CSV的固定寫法，不加的話每行中間可能會多一個空白行\n- `csv.writer(f)` 建立一個寫入器，`.writerow([...])` 一次寫入一行，list裡每個元素會自動用逗號分開", "is_project": false}, {"day": "週四", "content": "try/except基本例外處理", "example": "處理檔案不存在、資料格式錯誤", "explanation": "```python\ntry:\n    with open(\"不存在的檔案.txt\", \"r\") as f:\n        content = f.read()\nexcept FileNotFoundError:\n    print(\"檔案不存在，改用預設值\")\n    content = \"\"\n\ntry:\n    value = float(\"abc\")\nexcept ValueError:\n    print(\"資料格式錯誤，無法轉換成數字\")\n```\n\n**逐行說明**：\n- `try:` 裡面放「可能會出錯」的程式碼\n- `except 錯誤類型:` 指定要攔截哪一種錯誤，攔到之後程式不會崩潰，而是執行except裡的處理方式\n- `FileNotFoundError` 是檔案找不到時的錯誤類型，`ValueError` 是型別轉換失敗時常見的錯誤類型\n\n**為什麼重要**：機器人程式如果因為讀檔案失敗或資料格式怪異就直接崩潰當機，在實際運作時是很危險的，try/except讓程式「有備案」而不是直接掛掉。", "is_project": false}, {"day": "週五【小專案】", "content": "感測器紀錄器", "example": "模擬讀取10筆感測器資料，寫入CSV，並能重新讀取印出", "explanation": "**為什麼要這樣寫**：\n1. 把「寫入」跟「讀取」拆成兩個函式（write_log、read_log），符合Week4學到的函式模組化精神\n2. 用`csv`模組而不是手動處理逗號字串，減少自己拼字串時漏掉逗號或換行的風險\n3. 讀回來後用迴圈把每一筆資料印出來，驗證資料真的有正確寫入又能正確讀出——這個「寫完馬上讀出來驗證」的習慣，之後接真實硬體時特別重要", "is_project": true}], "full_code": "# 感測器紀錄器\n# 目標：模擬讀取10筆感測器資料，寫入CSV，並能重新讀取印出\nimport csv\n\ndef write_log(filename, rows):\n    with open(filename, \"w\", newline=\"\", encoding=\"utf-8\") as f:\n        writer = csv.writer(f)\n        writer.writerow([\"time\", \"distance\"])\n        writer.writerows(rows)\n\ndef read_log(filename):\n    try:\n        with open(filename, \"r\", encoding=\"utf-8\") as f:\n            reader = csv.reader(f)\n            next(reader)  # 跳過表頭\n            return list(reader)\n    except FileNotFoundError:\n        print(\"找不到紀錄檔，回傳空資料\")\n        return []\n\nif __name__ == \"__main__\":\n    sample_data = [(i, 100 - i * 5) for i in range(10)]\n    write_log(\"sensor_log.csv\", sample_data)\n\n    data = read_log(\"sensor_log.csv\")\n    for time, distance in data:\n        print(f\"時間:{time}s 距離:{distance}cm\")\n"}, {"sheet": "Week7", "num": 7, "title": "Week 7：物件導向基礎（上）", "purpose": "承接『字串處理與檔案I/O』累積的基礎，為接下來『物件導向基礎(下)』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能定義class、屬性與方法", "days": [{"day": "週一", "content": "class / 建構子 __init__", "example": "class Robot:\n    def __init__(self, name):", "explanation": "```python\nclass Robot:\n    def __init__(self, name):\n        self.name = name\n        self.battery = 100\n\nr1 = Robot(\"AGV-01\")\nprint(r1.name)      # AGV-01\nprint(r1.battery)   # 100\n```\n\n**逐行說明**：\n- `class Robot:` 定義一個新的類別（class），可以想成是「製造機器人的模具」\n- `__init__` 是建構子，每次用`Robot(\"AGV-01\")`建立一個新機器人時，這個函式會自動被呼叫一次\n- `self.name = name` 把傳進來的name存到這個機器人「自己專屬」的資料裡\n- `r1 = Robot(\"AGV-01\")` 這個動作叫「實例化」，r1就是一個真正的機器人物件，不是模具本身\n\n**為什麼要用class**：如果有5台AGV，用之前學的方式你可能要開5組變數（agv1_battery, agv2_battery...），用class的話你只需要`Robot(\"AGV-01\")`到`Robot(\"AGV-05\")`建立5個獨立物件，每個物件自己管理自己的資料。", "is_project": false}, {"day": "週二", "content": "屬性（attributes）與方法（methods）", "example": "def move(self, speed):", "explanation": "```python\nclass Robot:\n    def __init__(self, name):\n        self.name = name\n        self.speed = 0\n\n    def move(self, speed):\n        self.speed = speed\n        print(f\"{self.name} 正在以速度{speed}移動\")\n\nr1 = Robot(\"AGV-01\")\nr1.move(50)\n```\n\n**逐行說明**：\n- `self.name`、`self.speed` 這種存在物件裡的資料叫「屬性」（attribute）\n- `def move(self, speed):` 這種定義在class裡的函式叫「方法」（method），呼叫時用`物件.方法(參數)`\n- 呼叫`r1.move(50)`時，Python會自動把`r1`當成`self`傳進去，所以你只需要額外傳`speed`這個參數", "is_project": false}, {"day": "週三", "content": "self 的意義", "example": "用機器人有多個實體來解釋", "explanation": "```python\nr1 = Robot(\"AGV-01\")\nr2 = Robot(\"AGV-02\")\n\nr1.move(50)\nr2.move(30)\n\nprint(r1.speed)   # 50\nprint(r2.speed)   # 30（r1跟r2的speed是各自獨立的）\n```\n\n**逐行說明**：\n- `self` 代表「呼叫這個方法的是哪一個物件」，`r1.move(50)`裡的self就是r1，`r2.move(30)`裡的self就是r2\n- 這就是為什麼r1和r2的speed可以各自不同、互不影響——因為每個物件都有「自己專屬」的一份屬性資料\n\n**常見誤解**：新手常常搞不懂為什麼方法定義時要多寫一個`self`參數，但呼叫的時候又不用手動傳。記住：`self`是Python自動幫你傳的，代表「這次是誰在呼叫」。", "is_project": false}, {"day": "週四", "content": "類別方法 vs 一般方法", "example": "AGV每台車的狀態獨立管理", "explanation": "```python\nclass Robot:\n    fleet_count = 0   # 這是「類別屬性」，所有物件共用同一份\n\n    def __init__(self, name):\n        self.name = name       # 這是「實例屬性」，每個物件各自獨立\n        Robot.fleet_count += 1\n\nr1 = Robot(\"AGV-01\")\nr2 = Robot(\"AGV-02\")\nprint(Robot.fleet_count)   # 2（總共建立了2台）\n```\n\n**逐行說明**：\n- 寫在`__init__`外面、class裡面的變數（如`fleet_count`）是「類別屬性」，所有物件共用同一份，常用來統計「總共建立了幾台機器人」\n- 寫在`self.xxx`的是「實例屬性」，每個物件各自獨立，例如每台AGV自己的電量\n- 這個技巧可以讓你在不寫額外變數的情況下，追蹤「目前系統裡總共有幾台機器人在運作」", "is_project": false}, {"day": "週五【小專案】", "content": "撰寫AGV class", "example": "含battery、speed屬性與move()、stop()、check_battery()方法", "explanation": "**為什麼要這樣寫**：\n1. 把AGV相關的所有資料（battery、speed）跟行為（move、stop、check_battery）包在同一個class裡，這叫「封裝」——外部只需要知道怎麼呼叫這幾個方法，不用管內部怎麼實作\n2. `check_battery()`回傳布林值（電量是否足夠），呼叫端可以直接用if判斷，這是把Week4學到的return觀念用在物件方法上\n3. 之後如果要做10台AGV，只要`AGV(\"AGV-01\")`到`AGV(\"AGV-10\")`各自建立物件即可，不用寫10份重複程式碼", "is_project": true}], "full_code": "# 撰寫AGV class\n# 目標：含battery、speed屬性與move()、stop()、check_battery()方法\n\nclass AGV:\n    def __init__(self, name, battery=100):\n        self.name = name\n        self.battery = battery\n        self.speed = 0\n\n    def move(self, speed):\n        if not self.check_battery():\n            print(f\"{self.name} 電量不足，無法移動\")\n            return\n        self.speed = speed\n        self.battery -= 5  # 模擬移動消耗電量\n        print(f\"{self.name} 正在以速度 {speed} 移動，剩餘電量 {self.battery}%\")\n\n    def stop(self):\n        self.speed = 0\n        print(f\"{self.name} 已停止\")\n\n    def check_battery(self):\n        return self.battery > 10\n\nif __name__ == \"__main__\":\n    agv1 = AGV(\"AGV-01\")\n    agv1.move(50)\n    agv1.stop()\n    print(\"電量是否充足:\", agv1.check_battery())\n"}, {"sheet": "Week8", "num": 8, "title": "Week 8：物件導向基礎（下）", "purpose": "承接『物件導向基礎(上)』累積的基礎，為接下來『Linux基礎』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "繼承、模組化", "days": [{"day": "週一", "content": "繼承（inheritance）", "example": "class DeliveryAGV(AGV):", "explanation": "```python\nclass DeliveryAGV(AGV):\n    def __init__(self, name, cargo_capacity):\n        super().__init__(name)\n        self.cargo_capacity = cargo_capacity\n\nd1 = DeliveryAGV(\"Delivery-01\", cargo_capacity=20)\nd1.move(30)             # 繼承自AGV的方法，直接可以用\nprint(d1.cargo_capacity)\n```\n\n**逐行說明**：\n- `class DeliveryAGV(AGV):` 括號裡的AGV代表「繼承」，DeliveryAGV會自動擁有AGV所有的屬性跟方法\n- `super().__init__(name)` 呼叫父類別（AGV）的建構子，先把battery、speed這些基本設定做好，再補上自己額外的cargo_capacity\n- `d1.move(30)` 這個方法沒有寫在DeliveryAGV裡，但因為繼承自AGV，所以可以直接使用\n\n**為什麼要用繼承**：如果之後有巡邏AGV、清潔AGV等不同型號，共同的部分（電量管理、基本移動）寫在AGV裡一次就好，各型號只需要額外寫自己獨有的功能。", "is_project": false}, {"day": "週二", "content": "method override", "example": "不同型號AGV有不同的move()行為", "explanation": "```python\nclass DeliveryAGV(AGV):\n    def move(self, speed):\n        print(f\"{self.name} 載貨中，限速移動\")\n        super().move(min(speed, 20))   # 載貨時速度不能超過20\n\nd1 = DeliveryAGV(\"Delivery-01\", cargo_capacity=20)\nd1.move(50)   # 實際會被限制在20\n```\n\n**逐行說明**：\n- 在子類別裡重新定義一個跟父類別「同名」的方法，就叫做override（覆寫）\n- `super().move(...)` 可以在覆寫的方法裡，還是呼叫回父類別原本的邏輯，不用整個重寫一遍\n- `min(speed, 20)` 確保無論外部傳進來的speed是多少，實際執行的值都不會超過20\n\n**為什麼實用**：不同型號的AGV可能有不同的安全限制或行為模式，override讓你在「保留共同邏輯」的前提下，針對特定型號客製化行為。", "is_project": false}, {"day": "週三", "content": "模組與套件（import自訂模組）", "example": "把AGV class拆到獨立檔案 agv.py", "explanation": "**做什麼**：把Week7寫的AGV class搬到一個獨立檔案`agv.py`裡，然後在另一支程式`main.py`裡import使用：\n\n```python\n# agv.py\nclass AGV:\n    def __init__(self, name, battery=100):\n        self.name = name\n        self.battery = battery\n```\n```python\n# main.py\nfrom agv import AGV\n\nagv1 = AGV(\"AGV-01\")\nprint(agv1.name)\n```\n\n**逐行說明**：\n- `from agv import AGV` 代表「從agv.py這個檔案裡，把AGV這個class借過來用」\n- 檔名`agv.py`不用打副檔名`.py`，Python會自動去找同資料夾下的agv.py\n\n**為什麼要拆檔案**：當專案越來越大，把所有程式碼塞在一個檔案裡會難以維護。把AGV相關邏輯獨立成一個模組，之後不管是Flask網頁、ROS2節點，都可以直接import這份agv.py，不用複製貼上。", "is_project": false}, {"day": "週四", "content": "__name__ == \"__main__\" 的用途", "example": "讓模組可以被單獨測試也可以被import", "explanation": "```python\n# agv.py\nclass AGV:\n    def __init__(self, name):\n        self.name = name\n\nif __name__ == \"__main__\":\n    # 這段只有在「直接執行agv.py」時才會跑\n    test_agv = AGV(\"測試機\")\n    print(\"測試:\", test_agv.name)\n```\n\n**逐行說明**：\n- 當你直接執行`python3 agv.py`時，Python會把這支檔案的`__name__`設成`\"__main__\"`，所以裡面的測試程式碼會執行\n- 但當你在`main.py`裡用`from agv import AGV`時，`agv.py`的`__name__`不會是`\"__main__\"`，所以裡面的測試程式碼**不會**被執行，只會拿到AGV這個class\n\n**為什麼重要**：這讓每個模組都可以「自己測試自己」（直接執行時跑測試），又不會在被別人import時意外執行不必要的測試程式碼，這是Python模組化開發的標準寫法。", "is_project": false}, {"day": "週五【小專案】", "content": "把Week7的AGV class重構成模組", "example": "建立agv.py，主程式main.py匯入使用", "explanation": "**為什麼要這樣寫**：\n1. 把AGV class獨立成`agv.py`，代表這個class已經是一個「可以被重複使用的元件」，之後Week10做成正式GitHub repo時，這樣的檔案結構會直接對應到`firmware/`、`server/`這種資料夾規劃\n2. `main.py`只負責「使用」AGV，不負責定義它的內部邏輯——這種「定義」與「使用」分離的習慣，是所有中大型專案的基本結構\n3. 加上`__name__ == \"__main__\"`的測試區塊，讓你能單獨執行`python3 agv.py`快速驗證這個class本身有沒有問題，不用每次都透過main.py測試", "is_project": true}], "full_code": "# --- 檔案1: agv.py ---\nclass AGV:\n    def __init__(self, name, battery=100):\n        self.name = name\n        self.battery = battery\n        self.speed = 0\n\n    def move(self, speed):\n        if not self.check_battery():\n            print(f\"{self.name} 電量不足，無法移動\")\n            return\n        self.speed = speed\n        self.battery -= 5\n        print(f\"{self.name} 正在以速度 {speed} 移動，剩餘電量 {self.battery}%\")\n\n    def stop(self):\n        self.speed = 0\n        print(f\"{self.name} 已停止\")\n\n    def check_battery(self):\n        return self.battery > 10\n\nif __name__ == \"__main__\":\n    # 讓這個檔案可以被單獨執行測試\n    test_agv = AGV(\"測試機\")\n    test_agv.move(30)\n    test_agv.stop()\n\n\n# --- 檔案2: main.py ---\n# from agv import AGV\n#\n# agv1 = AGV(\"AGV-01\")\n# agv1.move(50)\n# agv1.stop()\n# print(\"電量是否充足:\", agv1.check_battery())\n"}, {"sheet": "Week9", "num": 9, "title": "Week 9：Linux基礎（搭配樹莓派實作）", "purpose": "承接『物件導向基礎(下)』累積的基礎，為接下來『Git/GitHub進階』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "熟悉終端機操作、SSH連線樹莓派", "days": [{"day": "週一", "content": "檔案系統導覽", "example": "pwd, ls -la, cd, mkdir, rm -r", "explanation": "```bash\npwd                  # 印出目前所在的資料夾路徑\nls -la               # 列出目前資料夾內所有檔案(含隱藏檔)與詳細資訊\ncd robot-learning     # 切換進robot-learning資料夾\nmkdir firmware        # 建立一個新資料夾叫firmware\nrm -r 舊資料夾         # 刪除資料夾(連同裡面所有內容)\n```\n\n**逐行說明**：\n- `pwd` 是print working directory的縮寫，隨時想知道「我現在在哪」就打這個\n- `ls -la` 的`-l`是詳細列表格式(顯示權限、大小、時間)，`-a`是連隱藏檔也列出來\n- `cd ..` 可以回到上一層資料夾，`cd ~`會回到家目錄\n- `rm -r` 的`-r`代表recursive(遞迴)，資料夾裡面還有東西也會一起刪掉\n\n**常見錯誤**：`rm -r`沒有垃圾桶機制，刪掉就是真的刪掉了，下指令前務必先用`ls`確認自己在正確的資料夾。", "is_project": false}, {"day": "週二", "content": "檔案操作與權限", "example": "cp, mv, chmod +x script.sh, chown", "explanation": "```bash\ncp hello.py hello_backup.py   # 複製檔案\nmv hello.py scripts/          # 移動檔案到scripts資料夾\nchmod +x deploy.sh            # 給予這個檔案「可執行」權限\n./deploy.sh                   # 執行這個腳本\n```\n\n**逐行說明**：\n- `cp 來源 目的地` 複製，`mv 來源 目的地` 移動(也可以用來重新命名檔案)\n- Linux的檔案權限分成讀(r)、寫(w)、執行(x)三種，`chmod +x`就是加上執行權限\n- 沒有執行權限的.sh腳本，就算打對指令也會被系統拒絕執行\n\n**為什麼重要**：之後在樹莓派上寫的啟動腳本、部署腳本，常常需要先chmod +x才能執行。", "is_project": false}, {"day": "週三", "content": "套件管理與環境", "example": "apt update/upgrade, python3 -m venv venv, source venv/bin/activate", "explanation": "```bash\nsudo apt update && sudo apt upgrade   # 更新套件清單並升級系統套件\npython3 -m venv venv                  # 建立獨立的Python虛擬環境\nsource venv/bin/activate              # 啟用這個虛擬環境\npip install opencv-python-headless    # 只安裝在虛擬環境裡\ndeactivate                            # 離開虛擬環境\n```\n\n**逐行說明**：\n- 虛擬環境(venv)的重點是每個專案有自己獨立的套件版本，不會互相污染\n- `source venv/bin/activate` 後，終端機提示字元前面通常會出現(venv)字樣\n\n**常見錯誤**：忘記先activate就直接pip install，套件會裝到系統全域環境，久了容易造成版本衝突。", "is_project": false}, {"day": "週四", "content": "程序管理", "example": "ps aux, top, kill, 背景執行 &、nohup", "explanation": "```bash\nps aux              # 列出目前所有正在執行的程序\ntop                  # 即時監控CPU/記憶體使用狀況(按q離開)\npython3 app.py &     # 在背景執行這支程式\nkill 12345           # 強制結束程序ID為12345的程式\nnohup python3 app.py &  # 背景執行，且關掉終端機也不會被中斷\n```\n\n**逐行說明**：\n- `ps aux` 每一行代表一個正在跑的程序，最左邊欄位常包含PID\n- 指令後面加`&`代表丟到背景執行\n- `nohup` 讓程式在你關掉SSH連線後依然繼續執行\n\n**為什麼重要**：之後Flask伺服器、ROS2節點常常需要長時間在樹莓派上背景執行。", "is_project": false}, {"day": "週五【小專案】", "content": "SSH連進樹莓派", "example": "ssh pi@<ip>連線，建立專案資料夾與venv，跑一個hello.py", "explanation": "**做什麼**：\n```bash\nssh pi@192.168.1.50\nmkdir -p ~/robot-learning\ncd ~/robot-learning\npython3 -m venv venv\nsource venv/bin/activate\necho 'print(\"Hello from Raspberry Pi!\")' > hello.py\npython3 hello.py\n```\n\n**逐行說明**：\n- `ssh pi@IP位址` 是遠端連進樹莓派的標準指令\n- `mkdir -p` 的`-p`代表如果上層資料夾不存在也一併建立\n- 剩下步驟跟在自己電腦上做的一模一樣\n\n**為什麼是重要里程碑**：這是你第一次真正遠端操作另一台電腦，樹莓派會是你機器人的大腦。", "is_project": true}], "full_code": "#!/bin/bash\n# 目標：SSH連進樹莓派、建立專案環境並執行hello.py\n# 說明：請把 <樹莓派IP> 換成你的樹莓派實際位址\n\nssh pi@<樹莓派IP>\n\n# --- 以下指令在SSH連線成功、進入樹莓派後執行 ---\nmkdir -p ~/robot-learning\ncd ~/robot-learning\n\npython3 -m venv venv\nsource venv/bin/activate\n\ncat > hello.py << 'EOF'\nprint(\"Hello from Raspberry Pi!\")\nEOF\n\npython3 hello.py\n"}, {"sheet": "Week10", "num": 10, "title": "Week 10：Git / GitHub 進階工作流程", "purpose": "承接『Linux基礎』累積的基礎，為接下來『例外處理與簡易測試』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "branch、merge、規範化commit", "days": [{"day": "週一", "content": "branch概念與操作", "example": "git branch feature-obstacle, git checkout feature-obstacle", "explanation": "```bash\ngit branch feature-obstacle\ngit checkout feature-obstacle\n# 或一行搞定：\ngit checkout -b feature-obstacle\n```\n\n**逐行說明**：\n- 分支(branch)可以想成平行時空，你在feature-obstacle分支上的修改，不會影響main分支\n- 好處是可以放心開發新功能，就算搞砸了main分支完全不受影響\n\n**為什麼重要**：機器人專案常同時有好幾個功能在開發，分開branch開發完再合併，比全部擠在同一份程式碼安全很多。", "is_project": false}, {"day": "週二", "content": "merge與衝突處理", "example": "git merge feature-obstacle，故意製造一次衝突並解決", "explanation": "```bash\ngit checkout main\ngit merge feature-obstacle\n```\n\n**衝突發生時檔案會長這樣**：\n```\n<<<<<<< HEAD\ndistance_threshold = 10\n=======\ndistance_threshold = 15\n>>>>>>> feature-obstacle\n```\n\n**逐行說明**：\n- HEAD到=======之間是main分支目前的內容，=======到feature-obstacle之間是要合併進來的內容\n- 手動刪掉這些標記符號，留下真正想要的那一版，再重新commit", "is_project": false}, {"day": "週三", "content": ".gitignore撰寫", "example": "排除 venv/, __pycache__/, .env", "explanation": "```\nvenv/\n__pycache__/\n*.pyc\n.env\nsensor_log.csv\n```\n\n**逐行說明**：\n- .gitignore裡列出的檔案/資料夾，Git會自動忽略，不會被commit進去\n- venv/資料夾通常很大且每台電腦不完全一樣，不該上傳\n- .env通常存放密碼、API金鑰，絕對不能上傳到公開GitHub\n\n**常見錯誤**：如果venv已經commit過，之後才加.gitignore沒用，需要額外`git rm -r --cached venv`。", "is_project": false}, {"day": "週四", "content": "commit訊息規範、GitHub Issues", "example": "用feat:、fix:前綴練習寫commit message", "explanation": "```bash\ngit commit -m \"feat: 新增避障邏輯函式\"\ngit commit -m \"fix: 修正距離感測器讀值單位錯誤\"\n```\n\n**逐行說明**：\n- feat:新增功能、fix:修復bug、docs:文件相關，這是業界常用的Conventional Commits規範\n- GitHub Issues用來記錄待辦事項或已知問題", "is_project": false}, {"day": "週五【小專案】", "content": "AGV模組整理成正式repo", "example": "含README.md、requirements.txt、乾淨的commit歷史", "explanation": "**為什麼要這樣做**：\n1. requirements.txt列出這個專案用到的所有套件跟版本\n2. 乾淨的commit歷史代表每個commit都只做一件事\n3. 這是為Week23作品集整理預先鋪路", "is_project": true}], "full_code": "# requirements.txt 範例\nopencv-python-headless==4.9.0.80\npyserial==3.5\nflask==3.0.0\npandas==2.2.0\nmatplotlib==3.8.0\n\n# 使用方式：\n# python3 -m venv venv\n# source venv/bin/activate\n# pip install -r requirements.txt\n"}, {"sheet": "Week11", "num": 11, "title": "Week 11：例外處理與簡易測試", "purpose": "承接『Git/GitHub進階』累積的基礎，為接下來『M1里程碑整合週』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "讓程式不會意外崩潰", "days": [{"day": "週一", "content": "try/except/finally完整用法", "example": "處理感測器讀取失敗時的fallback", "explanation": "```python\ndef read_sensor():\n    try:\n        value = 1 / 0\n        return value\n    except ZeroDivisionError:\n        print(\"感測器讀取異常，使用預設值\")\n        return -1\n    finally:\n        print(\"本次讀取流程結束\")\n```\n\n**逐行說明**：\n- finally裡的程式碼無論成功或失敗都一定會執行\n- 回傳-1當作讀取失敗的訊號值\n\n**為什麼重要**：真實感測器不可能100%穩定，程式要有讀取失敗時的預案。", "is_project": false}, {"day": "週二", "content": "自訂例外類別", "example": "class SensorError(Exception):", "explanation": "```python\nclass SensorError(Exception):\n    pass\n\ndef read_distance(raw_value):\n    if raw_value < 0:\n        raise SensorError(f\"感測器回傳異常值: {raw_value}\")\n    return raw_value\n```\n\n**逐行說明**：\n- 繼承Exception建立專屬於感測器問題的例外類型\n- raise主動丟出錯誤，except SensorError as e只攔截這種類型\n\n**為什麼要自訂例外**：讓except只攔截感測器相關問題，不會誤攔截其他邏輯bug。", "is_project": false}, {"day": "週三", "content": "assert與基本防呆設計", "example": "檢查馬達速度不能超過安全值", "explanation": "```python\ndef set_motor_speed(speed):\n    assert 0 <= speed <= 100, f\"速度必須在0~100之間\"\n    print(f\"馬達速度設定為 {speed}\")\n```\n\n**逐行說明**：\n- assert用來抓不應該發生的狀況(程式邏輯bug)，跟try/except(處理預期內異常)用途不同\n\n**判斷原則**：呼叫端不該傳的值用assert，硬體正常會出現的異常用try/except。", "is_project": false}, {"day": "週四", "content": "簡易單元測試（pytest入門）", "example": "寫一個測試驗證 is_safe_distance()", "explanation": "```python\ndef is_safe_distance(d, threshold=10):\n    return d > threshold\n\ndef test_is_safe_distance():\n    assert is_safe_distance(20) == True\n    assert is_safe_distance(5) == False\n    assert is_safe_distance(10) == False\n```\n\n**逐行說明**：\n- 測試函式要以test_開頭，執行`pytest test_obstacle.py`會自動找到並執行\n- 特別測試邊界值是很重要的習慣\n\n**為什麼重要**：改了邏輯後重跑pytest就能立刻知道有沒有改壞舊功能。", "is_project": false}, {"day": "週五【小專案】", "content": "AGV模組加上完整例外處理", "example": "感測器斷線、電量讀取異常都要能優雅處理", "explanation": "**為什麼要這樣寫**：\n1. 把可能出錯的地方包上try/except，讓系統一個環節出錯不會導致整台當機\n2. 用自訂SensorError區分感測器問題跟其他錯誤\n3. 這週技巧會在Week13起接實體硬體時大量派上用場", "is_project": true}], "full_code": "# AGV模組加上完整例外處理\nclass SensorError(Exception):\n    pass\n\nclass AGV:\n    def __init__(self, name, battery=100):\n        self.name = name\n        self.battery = battery\n\n    def read_sensor(self, raw_value):\n        try:\n            if raw_value is None:\n                raise SensorError(\"感測器沒有回傳資料(可能斷線)\")\n            if raw_value < 0:\n                raise SensorError(f\"感測器回傳異常值: {raw_value}\")\n            return raw_value\n        except SensorError as e:\n            print(f\"[警告] {self.name} 感測器錯誤: {e}，改用安全預設值\")\n            return 999\n\n    def check_battery(self):\n        try:\n            assert 0 <= self.battery <= 100, \"電量數值超出合理範圍\"\n            return self.battery > 10\n        except AssertionError as e:\n            print(f\"[錯誤] {self.name} 電量讀取異常: {e}\")\n            return False\n\nif __name__ == \"__main__\":\n    agv = AGV(\"AGV-01\")\n    print(agv.read_sensor(23))\n    print(agv.read_sensor(-5))\n    print(agv.read_sensor(None))\n    print(\"電量是否安全:\", agv.check_battery())\n"}, {"sheet": "Week12", "num": 12, "title": "Week 12：M1里程碑整合週", "purpose": "承接『例外處理與簡易測試』累積的基礎，為接下來『ESP32基礎與數位/類比I/O』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "pandas+matplotlib資料分析", "days": [{"day": "週一", "content": "pandas基礎：讀取CSV成DataFrame", "example": "df = pd.read_csv('sensor_log.csv')", "explanation": "```python\nimport pandas as pd\n\ndf = pd.read_csv(\"sensor_log.csv\")\nprint(df.head())\nprint(df.columns)\nprint(df.shape)\n```\n\n**逐行說明**：\n- pd.read_csv()把整份CSV讀進來變成DataFrame\n- DataFrame可以想成是Python版的Excel表格\n\n**為什麼比csv模組更好用**：要做統計、篩選、畫圖，pandas提供的功能豐富得多。", "is_project": false}, {"day": "週二", "content": "資料篩選、統計（mean, max, min）", "example": "df.describe()", "explanation": "```python\nprint(df[\"distance\"].mean())\nprint(df[\"distance\"].max())\nprint(df.describe())\n\nclose_calls = df[df[\"distance\"] < 30]\n```\n\n**逐行說明**：\n- df[\"欄位名\"]取出某一欄，可直接呼叫.mean() .max() .min()\n- .describe()一次列出所有統計摘要\n- df[df[\"distance\"] < 30]是布林索引，篩選出符合條件的資料列", "is_project": false}, {"day": "週三", "content": "matplotlib畫出感測器數值折線圖", "example": "plt.plot(df['time'], df['distance'])", "explanation": "```python\nimport matplotlib.pyplot as plt\n\nplt.plot(df[\"time\"], df[\"distance\"])\nplt.xlabel(\"時間 (s)\")\nplt.ylabel(\"距離 (cm)\")\nplt.savefig(\"distance_chart.png\")\n```\n\n**逐行說明**：\n- plt.plot(x軸資料, y軸資料)畫折線圖\n- .savefig()適合在樹莓派這種沒有螢幕畫面的環境使用", "is_project": false}, {"day": "週四", "content": "把Week6的CSV記錄器資料接進來實際分析", "example": "整合先前收集的log資料", "explanation": "**做什麼**：把Week6寫的感測器紀錄器實際跑出來的sensor_log.csv，接到這週學的pandas分析流程裡。\n\n**為什麼要這樣做**：這是四年計畫第一次真正把前幾週的模組串接起來，是軟體專案「模組互相組合」的縮影。", "is_project": false}, {"day": "週五【M1交付】", "content": "sensor_analyzer.py完整版", "example": "含讀檔、統計、繪圖，推上GitHub", "explanation": "**為什麼這是里程碑**：\n1. 這是Year1前12週第一個整合型交付物\n2. 之後可以直接沿用到樹莓派實際收集到的資料\n3. 推上GitHub後就是作品集第一份資料分析能力的證明", "is_project": true}], "full_code": "# sensor_analyzer.py 完整版\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\ndef analyze(filename):\n    df = pd.read_csv(filename)\n    print(\"=== 資料摘要 ===\")\n    print(df.describe())\n\n    close_calls = df[df[\"distance\"] < 30]\n    print(f\"距離小於30cm的紀錄共有 {len(close_calls)} 筆\")\n\n    plt.plot(df[\"time\"], df[\"distance\"])\n    plt.xlabel(\"時間 (s)\")\n    plt.ylabel(\"距離 (cm)\")\n    plt.title(\"AGV感測器距離紀錄\")\n    plt.savefig(\"distance_chart.png\")\n    print(\"圖表已輸出：distance_chart.png\")\n\nif __name__ == \"__main__\":\n    analyze(\"sensor_log.csv\")\n"}, {"sheet": "Week13", "num": 13, "title": "Week 13：ESP32基礎與數位/類比I/O", "purpose": "承接『M1里程碑整合週』累積的基礎，為接下來『感測器讀取（超音波/紅外線）』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能燒錄程式、控制LED、讀取按鈕，並用SG90伺服馬達練習PWM角度控制", "days": [{"day": "週一", "content": "Arduino IDE / ESP-IDF環境設定與燒錄", "example": "安裝board套件，燒錄第一個Blink程式", "explanation": "**做什麼**：安裝Arduino IDE，在「board管理員」裡搜尋並安裝ESP32的板子支援套件，選對你手上的ESP32-S3型號。\n\n```cpp\n// Blink範例\nvoid setup() {\n  pinMode(LED_BUILTIN, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(LED_BUILTIN, HIGH);\n  delay(500);\n  digitalWrite(LED_BUILTIN, LOW);\n  delay(500);\n}\n```\n\n**逐行說明**：\n- `setup()` 只會在通電/重置時執行一次，用來做初始化設定(例如設定腳位模式)\n- `loop()` 會不斷重複執行，這是Arduino/ESP32程式的核心結構，跟Python寫`while True:`的概念類似\n- `pinMode(腳位, OUTPUT)` 告訴晶片「這個腳位要當輸出用」\n- `delay(500)` 讓程式暫停500毫秒(0.5秒)\n\n**常見錯誤**：燒錄時選錯「開發板型號」或「序列埠(Port)」，燒錄會直接失敗，這是ESP32新手第一次燒錄最常卡關的地方，記得在工具選單裡確認兩者都選對。", "is_project": false}, {"day": "週二", "content": "數位輸出：控制LED", "example": "digitalWrite(LED_PIN, HIGH);", "explanation": "```cpp\nconst int LED_PIN = 2;\n\nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(LED_PIN, HIGH);  // 點亮\n  delay(1000);\n  digitalWrite(LED_PIN, LOW);   // 熄滅\n  delay(1000);\n}\n```\n\n**逐行說明**：\n- `const int LED_PIN = 2;` 把腳位編號存成一個常數，之後要改接線只需要改這一個地方，不用整支程式碼到處找數字改\n- `digitalWrite(腳位, HIGH/LOW)` HIGH代表輸出高電位(通常是3.3V)，LOW代表輸出低電位(0V)，LED就是靠這個電位差來決定亮或滅\n\n**為什麼要用常數存腳位**：這是新手很容易忽略、但業界很重視的習慣——把「魔術數字」(直接寫死在程式裡的數字)換成有意義的名字，程式碼可讀性跟維護性都會提升很多。", "is_project": false}, {"day": "週三", "content": "數位輸入：讀取按鈕", "example": "if (digitalRead(BUTTON_PIN) == LOW) { ... }", "explanation": "```cpp\nconst int BUTTON_PIN = 4;\n\nvoid setup() {\n  pinMode(BUTTON_PIN, INPUT_PULLUP);\n}\n\nvoid loop() {\n  if (digitalRead(BUTTON_PIN) == LOW) {\n    Serial.println(\"按鈕被按下\");\n  }\n}\n```\n\n**逐行說明**：\n- `INPUT_PULLUP` 是啟用晶片內建的「上拉電阻」，這樣按鈕沒按下時腳位會穩定讀到HIGH，按下時才會變成LOW，不用自己外接電阻\n- `digitalRead(腳位)` 讀取這個腳位目前是HIGH還是LOW\n- 因為用了PULLUP，所以邏輯是「反過來的」：沒按是HIGH，按下是LOW，這是新手最容易搞混的地方\n\n**常見錯誤**：忘記設定PULLUP，按鈕沒按下時腳位電位是「浮動」的(floating)，會讀到隨機的HIGH/LOW雜訊值，導致程式誤判按鈕被按下。", "is_project": false}, {"day": "週四", "content": "SG90伺服馬達控制（搭配可變電阻）", "example": "servo.attach(SERVO_PIN); int angle = map(analogRead(POT_PIN), 0, 4095, 0, 180); servo.write(angle);", "explanation": "```cpp\n#include <ESP32Servo.h>\n\nconst int POT_PIN = 34;\nconst int SERVO_PIN = 18;\nServo myServo;\n\nvoid setup() {\n  myServo.attach(SERVO_PIN);\n}\n\nvoid loop() {\n  int raw = analogRead(POT_PIN);           // 讀到0~4095\n  int angle = map(raw, 0, 4095, 0, 180);    // 換算成0~180度\n  myServo.write(angle);\n}\n```\n\n**逐行說明**：\n- `analogRead()` 讀取類比訊號，ESP32的類比輸入解析度是12位元，範圍是0~4095(不是Arduino Uno常見的0~1023，這是新手容易搞混的地方)\n- `map(數值, 原始最小, 原始最大, 目標最小, 目標最大)` 是線性換算的內建函式，把可變電阻讀到的0~4095，等比例換算成伺服馬達能理解的0~180度\n- `myServo.write(angle)` 直接把角度送給伺服馬達，函式庫會自動處理成對應的PWM訊號\n\n**為什麼要先map()**：伺服馬達只認得0~180度的角度指令，不會理解「4095」這種原始數值，map()就是兩種數值系統之間的翻譯橋樑，這個技巧之後在深度相機、感測器數值轉換時也會一直用到。", "is_project": false}, {"day": "週五【小專案】", "content": "可變電阻控制SG90伺服馬達角度", "example": "即時讀取可變電阻值換算成0~180度並驅動SG90，按鈕按下切換自動掃描/手動控制模式", "explanation": "**為什麼要這樣寫**：\n1. 結合了本週學到的三個技能：數位輸入(按鈕)、類比輸入(可變電阻)、伺服馬達輸出(SG90)，是這週知識的第一次整合\n2. 加入「模式切換」的概念(自動掃描 vs 手動控制)，先讓你熟悉之後Week21要做的「自動/手動模式切換」邏輯，只是這裡先用最簡單的硬體練習\n3. `Serial.print()` 印出raw跟angle方便你邊調整可變電阻邊確認數值有沒有跑對，這種「邊做邊看數字」的除錯習慣，在硬體實驗中非常重要——不要等全部做完才測試", "is_project": true}], "full_code": "// 可變電阻控制SG90伺服馬達角度\n// 說明：即時讀取可變電阻值換算成0~180度並驅動SG90，按鈕按下切換自動掃描/手動控制模式\n#include <ESP32Servo.h>\n\nconst int SENSOR_PIN = 34;\nconst int SERVO_PIN = 18;\nServo myServo;\n\nvoid setup() {\n  Serial.begin(115200);\n  myServo.attach(SERVO_PIN);\n  pinMode(SENSOR_PIN, INPUT);\n}\n\nvoid loop() {\n  int raw = analogRead(SENSOR_PIN);\n  int angle = map(raw, 0, 4095, 0, 180);\n  myServo.write(angle);\n\n  Serial.print(\"raw=\");\n  Serial.print(raw);\n  Serial.print(\" angle=\");\n  Serial.println(angle);\n\n  delay(50);\n}\n"}, {"sheet": "Week14", "num": 14, "title": "Week 14：感測器讀取（超音波/紅外線）", "purpose": "承接『ESP32基礎與數位/類比I/O』累積的基礎，為接下來『馬達控制（PWM/L298N）』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "讀取距離感測器數值並轉成可用資料", "days": [{"day": "週一", "content": "超音波感測器HC-SR04原理", "example": "觸發腳送出脈衝，回波腳量測時間差", "explanation": "**原理說明**：HC-SR04有兩隻訊號腳，Trig(觸發)和Echo(回波)。運作流程是：\n1. 給Trig腳一個至少10微秒的高電位脈衝，感測器會發出一段超音波\n2. 超音波碰到前方物體反彈回來，Echo腳會持續輸出高電位，時間長度等於「聲波來回的時間」\n3. 用這個時間乘上音速，就能算出距離\n\n```cpp\nconst int TRIG_PIN = 5;\nconst int ECHO_PIN = 18;\n\nvoid setup() {\n  pinMode(TRIG_PIN, OUTPUT);\n  pinMode(ECHO_PIN, INPUT);\n}\n```\n\n**為什麼要分兩隻腳**：Trig負責「發出」訊號，Echo負責「接收」訊號，職責分開讓感測器內部電路更單純，這也是很多感測器晶片常見的設計模式。", "is_project": false}, {"day": "週二", "content": "計算距離公式", "example": "distance = duration * 0.034 / 2;", "explanation": "```cpp\ndigitalWrite(TRIG_PIN, LOW);\ndelayMicroseconds(2);\ndigitalWrite(TRIG_PIN, HIGH);\ndelayMicroseconds(10);\ndigitalWrite(TRIG_PIN, LOW);\n\nlong duration = pulseIn(ECHO_PIN, HIGH);\nfloat distance = duration * 0.034 / 2;\n\nSerial.print(\"距離: \");\nSerial.println(distance);\n```\n\n**逐行說明**：\n- 先把Trig拉LOW再拉HIGH，是為了確保訊號是一個乾淨的脈衝，而不是接續上一次殘留的狀態\n- `pulseIn(腳位, HIGH)` 是內建函式，會自動量測這個腳位維持在HIGH狀態的時間(微秒)，不用自己寫計時邏輯\n- `0.034` 是音速換算成「公分/微秒」的近似值，除以2是因為聲波要「來回」，我們只要單程距離", "is_project": false}, {"day": "週三", "content": "紅外線感測器基礎", "example": "數位訊號判斷是否偵測到障礙物", "explanation": "```cpp\nconst int IR_PIN = 19;\n\nvoid setup() {\n  pinMode(IR_PIN, INPUT);\n}\n\nvoid loop() {\n  int detected = digitalRead(IR_PIN);\n  if (detected == LOW) {\n    Serial.println(\"偵測到障礙物\");\n  }\n}\n```\n\n**逐行說明**：\n- 紅外線感測器(IR sensor)通常是「數位輸出」，不是像超音波那樣要自己算距離，它只回答「有/沒有偵測到」\n- 大部分模組是「偵測到時輸出LOW」，實際邏輯要看你手上模組的規格書(有些模組相反)\n\n**跟超音波的差異**：紅外線反應快、成本低，但只能判斷「有沒有東西」不能量測精確距離；超音波能算出實際距離，但反應速度較慢。之後設計避障邏輯時，可以搭配兩種感測器截長補短。", "is_project": false}, {"day": "週四", "content": "感測器雜訊處理", "example": "取多次讀值平均，過濾異常值", "explanation": "```cpp\nfloat readDistanceAveraged() {\n  float total = 0;\n  int samples = 5;\n  for (int i = 0; i < samples; i++) {\n    total += readDistance();  // 假設這是週二寫的量測函式\n    delay(10);\n  }\n  return total / samples;\n}\n```\n\n**逐行說明**：\n- `for` 迴圈重複量測5次距離，加總起來除以次數，取得平均值\n- 這是最簡單的「濾波」方式，能有效降低單次量測雜訊的影響\n\n**為什麼需要濾波**：真實世界的感測器讀值不會完美穩定，尤其超音波容易受到角度、材質、環境雜音干擾，偶爾出現一次離譜的讀值。取多次平均是最基礎但很實用的濾波方式，之後Week27做顏色追蹤時也會用類似的「多次採樣求穩定值」概念。", "is_project": false}, {"day": "週五【小專案】", "content": "超音波測距顯示器", "example": "即時透過序列埠印出距離數值，含異常值過濾", "explanation": "**為什麼要這樣寫**：\n1. 把「量測一次距離」跟「量測多次取平均」拆成兩個函式，符合Week4學到的函式模組化精神——這種習慣就算換成Arduino/C++語言也是通用的\n2. 加入簡單的異常值過濾(例如距離小於0或超過400cm就視為無效讀值直接忽略)，因為超音波感測器有效測距範圍有限，超出範圍的讀值通常是雜訊\n3. 用`Serial.println()`即時把數值印出來，這是接下來Week16 pyserial要讀取的資料來源，等於是先把「輸出端」準備好", "is_project": true}], "full_code": "// 超音波測距顯示器\n// 說明：即時透過序列埠印出距離數值，含異常值過濾\n#include <ESP32Servo.h>\n\nconst int SENSOR_PIN = 34;\nconst int SERVO_PIN = 18;\nServo myServo;\n\nvoid setup() {\n  Serial.begin(115200);\n  myServo.attach(SERVO_PIN);\n  pinMode(SENSOR_PIN, INPUT);\n}\n\nvoid loop() {\n  int raw = analogRead(SENSOR_PIN);\n  int angle = map(raw, 0, 4095, 0, 180);\n  myServo.write(angle);\n\n  Serial.print(\"raw=\");\n  Serial.print(raw);\n  Serial.print(\" angle=\");\n  Serial.println(angle);\n\n  delay(50);\n}\n"}, {"sheet": "Week15", "num": 15, "title": "Week 15：馬達控制（PWM/L298N）", "purpose": "承接『感測器讀取（超音波/紅外線）』累積的基礎，為接下來『pyserial跨裝置通訊』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "用PWM控制馬達轉速與方向", "days": [{"day": "週一", "content": "直流馬達與馬達驅動板原理", "example": "L298N接線：IN1~IN4、ENA/ENB", "explanation": "**為什麼需要驅動板**：ESP32的腳位電流輸出能力很小(通常只有幾十毫安)，直流馬達運轉需要遠比這個大的電流，直接把馬達接在ESP32腳位上會燒壞晶片。馬達驅動板(如L298N)的作用是「用小電流的訊號，控制大電流的馬達電源」。\n\n**接線邏輯**：\n- `ENA` / `ENB`：分別控制左右兩顆馬達的「速度」(接PWM訊號)\n- `IN1/IN2`：控制左馬達的「方向」\n- `IN3/IN4`：控制右馬達的「方向」\n\n**為什麼方向需要兩隻腳控制**：IN1/IN2兩隻腳的高低電位組合(HIGH-LOW或LOW-HIGH)決定電流流動方向，進而決定馬達正轉或反轉，這是直流馬達控制最基本的電路概念。", "is_project": false}, {"day": "週二", "content": "PWM控制轉速", "example": "analogWrite(ENA_PIN, speed); // 0~255", "explanation": "```cpp\nconst int ENA_PIN = 25;\n\nvoid setup() {\n  pinMode(ENA_PIN, OUTPUT);\n}\n\nvoid loop() {\n  analogWrite(ENA_PIN, 150);  // 速度範圍0~255\n}\n```\n\n**逐行說明**：\n- PWM(Pulse Width Modulation，脈衝寬度調變)不是真的輸出「中間電壓」，而是用「快速切換高低電位的時間比例」來模擬中間電壓的效果，比例越高馬達感受到的等效電壓就越高，轉得越快\n- `analogWrite()` 數值範圍0~255，0代表完全不轉，255代表全速\n\n**為什麼PWM能控制轉速**：馬達轉速跟平均電壓成正比，PWM讓晶片在極短時間內快速開關，馬達因為機械慣性感受到的是「平均效果」，這就是為什麼可以只用數位訊號(開/關)就做出類比般的轉速控制。", "is_project": false}, {"day": "週三", "content": "控制方向（正轉/反轉）", "example": "digitalWrite(IN1, HIGH); digitalWrite(IN2, LOW);", "explanation": "```cpp\nconst int IN1 = 26, IN2 = 27;\n\nvoid moveForward() {\n  digitalWrite(IN1, HIGH);\n  digitalWrite(IN2, LOW);\n}\n\nvoid moveBackward() {\n  digitalWrite(IN1, LOW);\n  digitalWrite(IN2, HIGH);\n}\n\nvoid motorStop() {\n  digitalWrite(IN1, LOW);\n  digitalWrite(IN2, LOW);\n}\n```\n\n**逐行說明**：\n- IN1=HIGH、IN2=LOW 讓電流往一個方向流，馬達正轉\n- IN1=LOW、IN2=HIGH 讓電流反方向流，馬達反轉\n- 兩個都是LOW，電流不流動，馬達停止(這叫「自由停止」，跟煞車停止不同)\n\n**為什麼要包成函式**：把「正轉」「反轉」「停止」包成有意義名字的函式，之後在main邏輯裡呼叫`moveForward()`會比每次都寫兩行digitalWrite清楚很多，這正是Week4函式模組化精神在硬體控制上的實際應用。", "is_project": false}, {"day": "週四", "content": "雙輪差速轉向邏輯", "example": "左右輪速度不同即可轉彎", "explanation": "```cpp\nvoid turnLeft() {\n  analogWrite(ENA_PIN, 100);  // 左輪慢\n  analogWrite(ENB_PIN, 200);  // 右輪快\n}\n\nvoid turnRight() {\n  analogWrite(ENA_PIN, 200);  // 左輪快\n  analogWrite(ENB_PIN, 100);  // 右輪慢\n}\n```\n\n**逐行說明**：\n- 差速轉向的原理很直觀：兩邊輪子轉速不一樣，車子自然會往轉得慢的那一邊偏\n- 差速越大(例如一邊100、一邊255)轉彎越急；差速越小轉彎越平緩\n\n**為什麼這是重要觀念**：這是輪型機器人(不像履帶車或有方向盤的車)最基本的轉向原理，之後Year2的Gazebo模擬(diff_drive_controller)、ROS2的/cmd_vel速度指令，底層邏輯都是這個差速概念的延伸，現在用實體硬體理解一次，之後看模擬器的抽象概念會更容易上手。", "is_project": false}, {"day": "週五【小專案】", "content": "遙控雙輪前進後退左右轉", "example": "寫一組函式move_forward()/turn_left()等封裝馬達控制", "explanation": "**為什麼要這樣寫**：\n1. 把本週四天學到的PWM速度控制+方向控制+差速轉向，整合成一組語意清楚的函式(moveForward、moveBackward、turnLeft、turnRight、motorStop)\n2. 這組函式之後會被Week17的「序列指令控制協定」直接呼叫——例如收到指令'F'就呼叫`moveForward()`，這是先把「動作」準備好，下週再接「怎麼下指令」\n3. 每個函式內部都用固定的速度值，這是刻意簡化的設計：先確保「方向對不對」，速度可調整的部分留到之後有需要再擴充參數，避免一次要處理太多變數", "is_project": true}], "full_code": "// 遙控雙輪前進後退左右轉\n// 說明：寫一組函式move_forward()/turn_left()等封裝馬達控制\n#include <ESP32Servo.h>\n\nconst int SENSOR_PIN = 34;\nconst int SERVO_PIN = 18;\nServo myServo;\n\nvoid setup() {\n  Serial.begin(115200);\n  myServo.attach(SERVO_PIN);\n  pinMode(SENSOR_PIN, INPUT);\n}\n\nvoid loop() {\n  int raw = analogRead(SENSOR_PIN);\n  int angle = map(raw, 0, 4095, 0, 180);\n  myServo.write(angle);\n\n  Serial.print(\"raw=\");\n  Serial.print(raw);\n  Serial.print(\" angle=\");\n  Serial.println(angle);\n\n  delay(50);\n}\n"}, {"sheet": "Week16", "num": 16, "title": "Week 16：pyserial跨裝置通訊", "purpose": "承接『馬達控制（PWM/L298N）』累積的基礎，為接下來『序列指令控制協定設計』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "讓電腦用序列埠跟ESP32互相收送資料", "days": [{"day": "週一", "content": "序列埠基本概念（baud rate等）", "example": "Serial.begin(115200); 對應 pyserial baudrate=115200", "explanation": "**做什麼**：序列埠(Serial Port)是ESP32跟電腦之間最基本的溝通管道，透過USB線傳輸文字或數據。\n\n```cpp\nvoid setup() {\n  Serial.begin(115200);\n}\n```\n```python\nimport serial\nser = serial.Serial(\"/dev/ttyUSB0\", 115200, timeout=1)\n```\n\n**逐行說明**：\n- baud rate(鮑率)是「每秒傳輸多少位元」的速度單位，ESP32端跟電腦端**必須設定成同一個數字**才能正確溝通，這是最容易忽略但一出錯就完全無法通訊的地方\n- `/dev/ttyUSB0` 是Linux上常見的序列埠裝置路徑，實際路徑因電腦、作業系統、接的USB孔而異，要用`ls /dev/tty*`確認\n- `timeout=1` 代表讀取資料最多等1秒，超過就放棄，避免程式卡死等不到資料", "is_project": false}, {"day": "週二", "content": "Python讀取ESP32傳來的資料", "example": "ser = serial.Serial('/dev/ttyUSB0', 115200)", "explanation": "```python\nimport serial\n\nser = serial.Serial(\"/dev/ttyUSB0\", 115200, timeout=1)\n\nwhile True:\n    line = ser.readline().decode().strip()\n    if line:\n        print(f\"收到: {line}\")\n```\n\n**逐行說明**：\n- `ser.readline()` 讀取一行資料(直到遇到換行符號)，回傳的是bytes型別(位元組)，不是文字字串\n- `.decode()` 把bytes轉換成人類看得懂的字串，預設用utf-8編碼\n- `.strip()` 去掉字串前後的換行符號跟空白，這是Week6學過的技巧在這裡直接派上用場\n\n**常見錯誤**：忘記`.decode()`，印出來的會是`b'23.5\\r\\n'`這種帶有b前綴的位元組表示法，而不是乾淨的文字。", "is_project": false}, {"day": "週三", "content": "資料格式設計（CSV字串）", "example": "ESP32端印出 'distance,23.5' 這種格式", "explanation": "```cpp\n// ESP32端\nSerial.print(\"distance,\");\nSerial.println(distance);\n```\n```python\n# Python端\nline = ser.readline().decode().strip()\nlabel, value = line.split(\",\")\nprint(f\"{label}: {value}\")\n```\n\n**逐行說明**：\n- ESP32用逗號把「這是什麼資料」跟「數值」分開印出來，例如`distance,23.5`\n- Python端用Week6學過的`.split(\",\")`把這行文字切開，變成兩段\n\n**為什麼要設計格式**：如果之後要同時傳好幾種感測器資料(距離、電量、模式)，有一個約定好的格式(例如用逗號分隔、第一欄固定是資料類型)，雙邊程式才能穩定地解析，這就是最簡化版的「通訊協定」，Week17會把這個概念做得更完整。", "is_project": false}, {"day": "週四", "content": "Python端解析與容錯處理", "example": "用try/except處理讀取逾時或格式錯誤", "explanation": "```python\ntry:\n    line = ser.readline().decode().strip()\n    if not line:\n        continue  # 沒讀到資料，跳過這次迴圈\n    label, value = line.split(\",\")\n    distance = float(value)\nexcept ValueError:\n    print(\"資料格式不正確，跳過這筆\")\n    continue\nexcept UnicodeDecodeError:\n    print(\"解碼失敗，可能是傳輸過程中資料損毀\")\n    continue\n```\n\n**逐行說明**：\n- 序列埠傳輸偶爾會因為雜訊、斷線重連等原因收到不完整或損毀的資料，直接用`.split(\",\")`可能會因為欄位數不對而報錯\n- 這裡把Week11學到的try/except直接應用在真實硬體通訊情境，這也是為什麼Week11要排在硬體週次之前——先把防呆技巧學起來，之後接硬體才不會一遇到雜訊資料就整支程式當掉", "is_project": false}, {"day": "週五【小專案】", "content": "Python讀取ESP32回傳的感測器數值", "example": "即時印出並存成log，附簡單的資料視覺化", "explanation": "**為什麼要這樣寫**：\n1. 把本週學到的讀取、解析、容錯處理串成一個完整迴圈，同時用Week6學的方式把每筆資料存進CSV\n2. 這是整個四年計畫裡，第一次讓「電腦」跟「實體硬體」真正即時對話——之前都是模擬資料，這週開始是ESP32上真實跑出來的感測器數值\n3. 存成CSV之後，可以直接沿用Week12做的`sensor_analyzer.py`來分析這份真實資料，這就是模組彼此串接、重複使用的具體展現", "is_project": true}], "full_code": "// Python讀取ESP32回傳的感測器數值\n// 說明：即時印出並存成log，附簡單的資料視覺化\n#include <ESP32Servo.h>\n\nconst int SENSOR_PIN = 34;\nconst int SERVO_PIN = 18;\nServo myServo;\n\nvoid setup() {\n  Serial.begin(115200);\n  myServo.attach(SERVO_PIN);\n  pinMode(SENSOR_PIN, INPUT);\n}\n\nvoid loop() {\n  int raw = analogRead(SENSOR_PIN);\n  int angle = map(raw, 0, 4095, 0, 180);\n  myServo.write(angle);\n\n  Serial.print(\"raw=\");\n  Serial.print(raw);\n  Serial.print(\" angle=\");\n  Serial.println(angle);\n\n  delay(50);\n}\n"}, {"sheet": "Week17", "num": 17, "title": "Week 17：序列指令控制協定設計", "purpose": "承接『pyserial跨裝置通訊』累積的基礎，為接下來『Flask網頁伺服器基礎』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "設計簡單指令格式讓電腦下指令控制硬體", "days": [{"day": "週一", "content": "設計簡單指令集", "example": "例如 'F':前進, 'B':後退, 'S':停止", "explanation": "**做什麼**：設計一套「電腦要下指令給ESP32」時用的簡單文字約定：\n```\nF = 前進 (Forward)\nB = 後退 (Backward)\nL = 左轉 (Left)\nR = 右轉 (Right)\nS = 停止 (Stop)\n```\n\n**為什麼要先設計指令集，而不是直接寫程式**：這是軟體工程裡「先定義介面，再寫實作」的縮影——雙邊(ESP32端、Python端)只要先約定好這份對照表，接下來各自開發就不會兜不起來。單一字元的指令設計簡單、傳輸資料量小，也方便Debug時直接用眼睛判讀。", "is_project": false}, {"day": "週二", "content": "ESP32端指令解析", "example": "if (Serial.available()) { char cmd = Serial.read(); }", "explanation": "```cpp\nvoid loop() {\n  if (Serial.available()) {\n    char cmd = Serial.read();\n    switch (cmd) {\n      case 'F': moveForward(); break;\n      case 'B': moveBackward(); break;\n      case 'L': turnLeft(); break;\n      case 'R': turnRight(); break;\n      case 'S': motorStop(); break;\n    }\n  }\n}\n```\n\n**逐行說明**：\n- `Serial.available()` 檢查有沒有還沒讀取的資料在等待，避免在沒有資料時空等卡住\n- `Serial.read()` 一次讀一個字元\n- `switch/case` 是C++的多分支判斷語法，功能上跟Python的if/elif/elif很像，但語法不同：case後面要接冒號，每個分支結尾要`break`\n\n**常見錯誤**：忘記寫`break`，C++的switch會「往下貫穿」到下一個case繼續執行，這跟Python的邏輯完全不同，是從Python轉來寫C++最容易踩的坑之一。", "is_project": false}, {"day": "週三", "content": "Python端傳送指令", "example": "ser.write(b'F')", "explanation": "```python\nser.write(b'F')   # 送出前進指令\nser.write(b'S')   # 送出停止指令\n```\n\n**逐行說明**：\n- `ser.write()` 需要傳入bytes型別的資料，`b'F'`前面的b就是代表這是bytes而不是一般字串\n- 如果你手上是字串`\"F\"`，要送出前需要用`\"F\".encode()`轉成bytes\n\n**為什麼要這樣設計**：這種「電腦端主動下指令、硬體端被動接收執行」的架構，就是Week19做Flask網頁控制、之後Week21整合系統的基礎雛形——網頁按鈕按下時，背後其實就是呼叫`ser.write()`送出對應字元。", "is_project": false}, {"day": "週四", "content": "加入速度參數的指令格式", "example": "'F:150' 代表前進且PWM為150", "explanation": "```python\n# Python端組合指令字串\ncommand = f\"F:{150}\\n\"\nser.write(command.encode())\n```\n```cpp\n// ESP32端解析帶參數的指令\nString input = Serial.readStringUntil('\\n');\nint colonIndex = input.indexOf(':');\nString action = input.substring(0, colonIndex);\nint speed = input.substring(colonIndex + 1).toInt();\n```\n\n**逐行說明**：\n- 單一字元指令沒辦法帶額外參數，這裡改用「動作:數值」的格式，例如`F:150`代表前進且速度是150\n- ESP32端用`indexOf(':')`找到冒號的位置，再用`substring()`把冒號前後的文字分別切出來，`.toInt()`把文字轉成整數\n\n**為什麼要升級指令格式**：單字元指令(F/B/L/R/S)只能做固定速度的動作，但實務上常常需要「用什麼速度前進」這種更細緻的控制，這種「動作:參數」的格式之後也會在Modbus、OPC UA這類正式工業協定裡看到類似的設計精神(指令+資料)。", "is_project": false}, {"day": "週五【小專案】", "content": "電腦端輸入指令控制LED與馬達", "example": "在終端機輸入指令即可即時控制ESP32硬體", "explanation": "**為什麼要這樣寫**：\n1. 用`input()`讓你可以在終端機直接打字下指令，即時看到ESP32的LED或馬達反應，這是這四年計畫裡第一次做出「人可以即時互動操控硬體」的完整迴路\n2. 把本週學到的指令集設計、ESP32端解析、Python端傳送、帶參數格式全部串起來，是Week13~17這整個ESP32基礎模組的總驗收\n3. 這個小專案的架構會直接被Week19「Flask+硬體整合控制」沿用——只是把`input()`換成網頁按鈕的HTTP請求，核心的「送指令、ESP32解析、執行動作」邏輯完全不變", "is_project": true}], "full_code": "// 電腦端輸入指令控制LED與馬達\n// 說明：在終端機輸入指令即可即時控制ESP32硬體\n#include <ESP32Servo.h>\n\nconst int SENSOR_PIN = 34;\nconst int SERVO_PIN = 18;\nServo myServo;\n\nvoid setup() {\n  Serial.begin(115200);\n  myServo.attach(SERVO_PIN);\n  pinMode(SENSOR_PIN, INPUT);\n}\n\nvoid loop() {\n  int raw = analogRead(SENSOR_PIN);\n  int angle = map(raw, 0, 4095, 0, 180);\n  myServo.write(angle);\n\n  Serial.print(\"raw=\");\n  Serial.print(raw);\n  Serial.print(\" angle=\");\n  Serial.println(angle);\n\n  delay(50);\n}\n"}, {"sheet": "Week18", "num": 18, "title": "Week 18：Flask網頁伺服器基礎", "purpose": "承接『序列指令控制協定設計』累積的基礎，為接下來『Flask+硬體整合控制』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能架起本機網頁伺服器並回應路由", "days": [{"day": "週一", "content": "Flask安裝與最小應用", "example": "app = Flask(__name__); @app.route('/')", "explanation": "```python\nfrom flask import Flask\n\napp = Flask(__name__)\n\n@app.route(\"/\")\ndef index():\n    return \"Hello, AGV!\"\n\nif __name__ == \"__main__\":\n    app.run(host=\"0.0.0.0\", port=5000, debug=True)\n```\n\n**逐行說明**：\n- `Flask(__name__)` 建立一個Flask應用程式物件，`__name__`讓Flask知道目前這支程式在哪個檔案，方便之後找模板、靜態檔案\n- `@app.route(\"/\")` 是「裝飾器(decorator)」，把下面這個函式跟網址路徑`/`綁在一起，代表瀏覽器打開這個網址時，會執行`index()`並把回傳值顯示出來\n- `host=\"0.0.0.0\"` 讓其他裝置(不只本機)也能連進來，例如手機連到樹莓派的Flask伺服器；`debug=True`開發階段開啟，可以即時看到錯誤訊息、修改程式碼自動重新載入\n\n**為什麼要學Flask**：這是讓你的Python程式「有網頁介面」最簡單的方式，之後控制AGV就不用一直開終端機打指令，用瀏覽器點按鈕就能操作。", "is_project": false}, {"day": "週二", "content": "路由與HTTP方法（GET/POST）", "example": "@app.route('/status', methods=['GET'])", "explanation": "```python\n@app.route(\"/status\", methods=[\"GET\"])\ndef status():\n    return \"目前電量: 80%\"\n\n@app.route(\"/move\", methods=[\"POST\"])\ndef move():\n    return \"收到移動指令\"\n```\n\n**逐行說明**：\n- GET是「跟伺服器要資料」的方法，例如瀏覽器打開網址、查詢目前狀態，通常不會改變伺服器上的東西\n- POST是「送資料給伺服器」的方法，例如送出一個控制指令，通常會讓伺服器做出某種改變(移動馬達、更新狀態)\n- `methods=[...]` 指定這個路由只接受哪些方法，沒指定預設只接受GET\n\n**為什麼要區分GET/POST**：這是網頁架構的基本慣例——「查詢資料」跟「觸發動作」用不同方法區分，之後前端寫`fetch()`時也要對應正確的method，不然伺服器會回傳405錯誤(方法不被允許)。", "is_project": false}, {"day": "週三", "content": "回傳JSON資料", "example": "return jsonify({'battery': 80})", "explanation": "```python\nfrom flask import jsonify\n\n@app.route(\"/status\")\ndef status():\n    return jsonify({\"battery\": 80, \"mode\": \"auto\"})\n```\n\n**逐行說明**：\n- `jsonify()` 把Python的dict自動轉換成JSON格式的回應，並且會自動設定正確的回應標頭(Content-Type: application/json)\n- JSON是網頁前後端溝通最常用的資料格式，跟Python的dict長得很像，但JSON是純文字格式，可以被任何程式語言讀取\n\n**為什麼不直接回傳dict字串**：如果自己手動拼字串`\"{'battery': 80}\"`，容易漏掉正確的引號格式(JSON要求雙引號，Python預設單引號)，也不會有正確的標頭，前端的JavaScript可能沒辦法正確解析，`jsonify()`把這些細節都幫你處理好了。", "is_project": false}, {"day": "週四", "content": "簡單HTML模板渲染", "example": "render_template('dashboard.html')", "explanation": "```python\nfrom flask import render_template\n\n@app.route(\"/\")\ndef index():\n    return render_template(\"dashboard.html\", battery=80)\n```\n```html\n<!-- templates/dashboard.html -->\n<h1>AGV控制面板</h1>\n<p>電池電量: {{ battery }}%</p>\n```\n\n**逐行說明**：\n- Flask預設會去一個叫`templates`的資料夾裡找HTML檔案，這是固定的慣例，資料夾名稱不能隨便換\n- `render_template(\"dashboard.html\", battery=80)` 把Python變數`battery`傳進HTML模板\n- HTML裡的`{{ battery }}`是模板語法，會被自動替換成傳進去的實際數值80\n\n**為什麼要用模板而不是直接回傳HTML字串**：模板讓「網頁的樣子」跟「Python的邏輯」分開管理，網頁越複雜這個分離就越重要，不然一支Python檔案裡塞滿HTML字串會非常難維護。", "is_project": false}, {"day": "週五【小專案】", "content": "顯示感測器數值的網頁", "example": "網頁定時輪詢/status顯示最新感測器資料", "explanation": "**為什麼要這樣寫**：\n1. 網頁用JavaScript的`setInterval()`每隔一段時間呼叫一次`/status`，這種「定時去問伺服器有沒有新資料」的做法叫輪詢(polling)，是最簡單、最容易理解的即時更新方式\n2. 把本週學到的路由、JSON回傳、模板渲染全部串起來，是Week18的整合驗收\n3. 這個小專案完成後，你就有了一個「可以用瀏覽器看到AGV即時狀態」的基礎架構，下週會在這個基礎上加入「控制」功能", "is_project": true}], "full_code": "# 顯示感測器數值的網頁\n# 說明：網頁定時輪詢/status顯示最新感測器資料\nfrom flask import Flask, jsonify, render_template\n\napp = Flask(__name__)\nrobot_status = {\"battery\": 80, \"speed\": 0, \"mode\": \"manual\"}\n\n@app.route(\"/\")\ndef index():\n    return render_template(\"dashboard.html\", status=robot_status)\n\n@app.route(\"/status\")\ndef status():\n    return jsonify(robot_status)\n\n@app.route(\"/move/<direction>\", methods=[\"POST\"])\ndef move(direction):\n    # TODO: 這裡呼叫pyserial把指令送給ESP32\n    robot_status[\"mode\"] = direction\n    return jsonify({\"ok\": True, \"mode\": direction})\n\nif __name__ == \"__main__\":\n    app.run(host=\"0.0.0.0\", port=5000, debug=True)\n"}, {"sheet": "Week19", "num": 19, "title": "Week 19：Flask+硬體整合控制", "purpose": "承接『Flask網頁伺服器基礎』累積的基礎，為接下來『AGV機構組裝基礎』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "網頁按鈕透過Flask下指令控制硬體", "days": [{"day": "週一", "content": "Flask呼叫pyserial送指令", "example": "在路由函式內呼叫 ser.write()", "explanation": "```python\nimport serial\nfrom flask import Flask\n\napp = Flask(__name__)\nser = serial.Serial(\"/dev/ttyUSB0\", 115200, timeout=1)\n\n@app.route(\"/move/<direction>\", methods=[\"POST\"])\ndef move(direction):\n    command = {\"forward\": b\"F\", \"stop\": b\"S\"}.get(direction)\n    if command:\n        ser.write(command)\n        return \"指令已送出\"\n    return \"未知指令\", 400\n```\n\n**逐行說明**：\n- `<direction>` 這種寫在路由路徑裡的`<>`叫「動態路由」，網址列的這一段會被當成參數傳進函式，例如`/move/forward`會讓`direction=\"forward\"`\n- 用一個dict把「網頁上的指令名稱」對應到「要送給ESP32的實際位元組」，這是Week17指令集設計的延伸應用\n- 找不到對應指令時回傳`\"未知指令\", 400`，400是HTTP狀態碼，代表「客戶端請求有問題」\n\n**為什麼要在Flask裡開serial連線**：Flask伺服器啟動時就建立好序列埠連線，之後每次網頁按鈕觸發request時直接用這條已經開好的連線送指令，不用每次都重新開關序線埠(開關序列埠很慢，而且頻繁開關容易出錯)。", "is_project": false}, {"day": "週二", "content": "前端按鈕綁定fetch請求", "example": "fetch('/move', {method:'POST', body:'F'})", "explanation": "```html\n<button onclick=\"sendCommand('forward')\">前進</button>\n\n<script>\nfunction sendCommand(direction) {\n  fetch(`/move/${direction}`, { method: \"POST\" })\n    .then(res => res.text())\n    .then(data => console.log(data));\n}\n<\/script>\n```\n\n**逐行說明**：\n- `fetch()` 是瀏覽器內建的JavaScript函式，用來對伺服器發送HTTP請求，這裡指定`method: \"POST\"`對應到Flask那邊設定的`methods=[\"POST\"]`\n- `.then(res => res.text())` 是處理「非同步」回應的寫法：fetch送出請求後不會卡住等待，等伺服器真的回應了才會執行`.then()`裡的程式碼\n- `onclick=\"sendCommand('forward')\"` 讓按鈕被點擊時呼叫這個JavaScript函式\n\n**為什麼這是重要的一步**：這是整個計畫裡第一次讓「使用者在網頁上的動作」直接變成「硬體的真實反應」，網頁按鈕→JavaScript fetch→Flask路由→pyserial→ESP32→馬達，這條完整的鏈路現在真正打通了。", "is_project": false}, {"day": "週三", "content": "處理併發與序列埠鎖定", "example": "避免多個請求同時寫入序列埠造成衝突", "explanation": "```python\nimport threading\n\nserial_lock = threading.Lock()\n\n@app.route(\"/move/<direction>\", methods=[\"POST\"])\ndef move(direction):\n    with serial_lock:\n        ser.write(command)\n    return \"指令已送出\"\n```\n\n**逐行說明**：\n- Flask伺服器可能同時處理多個請求(例如你很快連續點了兩下按鈕)，如果兩個請求同時寫入同一個序列埠，資料可能會混在一起造成ESP32誤判\n- `threading.Lock()` 建立一把鎖，`with serial_lock:`確保同一時間只有一個請求能執行裡面的程式碼，其他請求會排隊等待\n\n**為什麼初學者容易忽略這個問題**：在單純測試時很少會真的「同時」點兩個按鈕，這個問題常常是「網頁做完之後偶爾莫名其妙失控」才會被發現，先在這週建立好併發保護的觀念，能省下之後很多除錯時間。", "is_project": false}, {"day": "週四", "content": "簡單的安全防呆（速度上限等）", "example": "後端驗證指令參數合法範圍", "explanation": "```python\n@app.route(\"/speed/<int:value>\", methods=[\"POST\"])\ndef set_speed(value):\n    if not (0 <= value <= 255):\n        return \"速度數值超出範圍(0~255)\", 400\n    command = f\"F:{value}\\n\"\n    ser.write(command.encode())\n    return f\"速度設定為 {value}\"\n```\n\n**逐行說明**：\n- `<int:value>` 限定這段路由參數必須是整數，如果傳進來的不是數字，Flask會直接回傳404，不會進到函式裡\n- 進到函式後再手動檢查數值範圍是否合理，這是Week11學過的「防呆設計」在網頁後端的實際應用\n\n**為什麼前端檢查不夠**：就算網頁前端已經限制了滑桿最大值是255，後端還是要再檢查一次——因為API網址是任何人都能直接用瀏覽器或工具打的，前端的限制只是方便一般使用者，真正的安全防線一定要放在後端。", "is_project": false}, {"day": "週五【小專案】", "content": "網頁儀表板控制馬達與LED", "example": "完成一頁式網頁，含前進/停止按鈕與即時感測器顯示", "explanation": "**為什麼要這樣寫**：\n1. 把Week18的「顯示狀態」跟本週的「下達指令」整合成同一個網頁，這是一個真正完整的控制面板\n2. 加入了序列埠鎖定跟速度防呆，代表這已經不只是能動的demo，而是有基本穩健性的系統\n3. 這個小專案完成後，Year1前19週的所有技能(Python基礎、Linux、Git、ESP32硬體、pyserial通訊、Flask網頁)第一次真正整合成一個可操作的完整系統，下週開始要把它裝進真正的AGV車體裡", "is_project": true}], "full_code": "# 網頁儀表板控制馬達與LED\n# 說明：完成一頁式網頁，含前進/停止按鈕與即時感測器顯示\nfrom flask import Flask, jsonify, render_template\n\napp = Flask(__name__)\nrobot_status = {\"battery\": 80, \"speed\": 0, \"mode\": \"manual\"}\n\n@app.route(\"/\")\ndef index():\n    return render_template(\"dashboard.html\", status=robot_status)\n\n@app.route(\"/status\")\ndef status():\n    return jsonify(robot_status)\n\n@app.route(\"/move/<direction>\", methods=[\"POST\"])\ndef move(direction):\n    # TODO: 這裡呼叫pyserial把指令送給ESP32\n    robot_status[\"mode\"] = direction\n    return jsonify({\"ok\": True, \"mode\": direction})\n\nif __name__ == \"__main__\":\n    app.run(host=\"0.0.0.0\", port=5000, debug=True)\n"}, {"sheet": "Week20", "num": 20, "title": "Week 20：AGV機構組裝基礎", "purpose": "承接『Flask+硬體整合控制』累積的基礎，為接下來『感測器+馬達+網頁整合』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "組裝底盤、馬達、輪子、配線", "days": [{"day": "週一", "content": "底盤與馬達固定", "example": "依馬達規格對齊孔位鎖上底盤", "explanation": "**做什麼**：把直流馬達鎖固定在AGV底盤上，通常底盤套件會附螺絲孔位，對照馬達支架的孔位鎖上螺絲。\n\n**注意事項**：\n- 鎖螺絲時力道要平均，先四顆都輕輕鎖上，最後再一次鎖緊，避免因為受力不均讓底盤或馬達支架變形\n- 確認馬達軸心的方向跟你預期的「正轉=前進」方向一致，如果裝反了，之後寫程式碼判斷方向會很困擾(雖然也可以在軟體裡對調IN1/IN2解決，但先確認硬體方向能省去很多除錯麻煩)\n\n**為什麼這週不是寫程式**：機構組裝是機器人工程師必備的實作能力，跟寫程式一樣重要，這週是刻意安排的動手實作週，讓你的AGV從「軟體模擬」變成「真的能被組裝出來的實體」。", "is_project": false}, {"day": "週二", "content": "輪子安裝與校正", "example": "確認左右輪水平、無明顯偏擺", "explanation": "**做什麼**：把輪子裝到馬達軸心上，通常是用固定螺絲或D型軸卡榫固定。\n\n**檢查方式**：\n1. 用手轉動輪子，感受轉動是否順暢，有沒有明顯卡頓\n2. 把AGV放在平面上，用眼睛從正後方看兩顆輪子是否等高、沒有明顯歪斜\n3. 輕輕搖晃輪子，確認沒有鬆動\n\n**為什麼要重視這一步**：如果兩邊輪子沒裝正，之後Week15學到的差速轉向邏輯即使程式碼完全正確，AGV實際跑起來也會偏移，這種「硬體誤差」是軟體沒辦法完全補償的，先把機構裝正，之後的軟體除錯才不會白費工夫。", "is_project": false}, {"day": "週三", "content": "電源系統配線（電池/穩壓模組）", "example": "確認電壓符合ESP32與馬達驅動板需求", "explanation": "**做什麼**：把電池接上穩壓模組(降壓/升壓模組)，確保輸出電壓符合各元件的需求。\n\n**電壓確認重點**：\n- ESP32需要穩定的5V(部分開發板本身有內建穩壓，可直接接電池，但仍建議確認規格)\n- 馬達驅動板(L298N)通常可以接受較高電壓(7~12V)直接驅動馬達，但邏輯訊號腳位仍是依照ESP32的3.3V/5V\n- 務必用三用電表實際量測穩壓模組輸出端的電壓，確認數字跟預期相符，不要只憑模組上標示的數字就直接接上昂貴的元件\n\n**為什麼這步驟特別重要**：電壓接錯是最容易「一次性燒毀」硬體的原因，尤其ESP32這類晶片对電壓超出範圍非常敏感，這是機構週裡「風險最高」的一步，寧可花多一點時間用電表確認，也不要急著通電測試。", "is_project": false}, {"day": "週四", "content": "感測器安裝位置規劃", "example": "超音波感測器固定在車頭正前方，避免震動鬆脫", "explanation": "**做什麼**：規劃並固定超音波感測器、紅外線感測器在車體上的位置。\n\n**規劃原則**：\n- 超音波感測器要面向AGV正前方，且盡量避開會反光、吸音的材質(例如直接對著布料，反射訊號會很弱)\n- 感測器要固定牢靠，AGV移動時的震動如果讓感測器角度偏移，量測到的距離就會不準確\n- 走線時要預留一些鬆弛空間，避免車體轉動或震動時把線扯斷\n\n**為什麼要「規劃」而不是隨便黏上去**：感測器的安裝角度、高度會直接影響Week14學到的量測準確度，例如裝太低可能量到地面反射的雜訊、裝太高可能量不到低矮的障礙物，這是純軟體開發不會遇到、但實體機器人專案一定要考慮的細節。", "is_project": false}, {"day": "週五【小專案】", "content": "完成AGV機構組裝並測試供電", "example": "上電測試各模組指示燈是否正常，量測電壓", "explanation": "**為什麼要這樣做**：\n1. 這是先「靜態測試」(上電但不移動)再「動態測試」(實際跑Week19寫好的控制程式)的標準流程，先確認電路沒問題，再確認軟體邏輯沒問題，把兩種風險分開排查\n2. 拍照記錄組裝完成的狀態，這些照片會直接用在Week23的README與作品集素材裡\n3. 完成這週後，你的AGV已經是一台「硬體組裝完成、通過供電測試」的實體機器，下週開始就是把之前寫好的所有軟體，真正跑在這台實體AGV上", "is_project": true}], "full_code": "【完成AGV機構組裝並測試供電：組裝檢查清單】\n說明：上電測試各模組指示燈是否正常，量測電壓\n\n1. 底盤與馬達鎖點對齊，鎖上四顆螺絲固定馬達\n2. 輪子安裝後手動轉動，確認無明顯偏擺與異音\n3. 電池接上穩壓模組，量測輸出電壓是否符合ESP32(5V)與馬達驅動板(依馬達規格)需求\n4. 超音波感測器固定於車頭正前方，確認無震動鬆脫\n5. 上電後檢查各模組指示燈（ESP32、馬達驅動板）是否正常亮起\n6. 拍照記錄組裝完成狀態，作為README素材\n"}, {"sheet": "Week21", "num": 21, "title": "Week 21：感測器+馬達+網頁整合", "purpose": "承接『AGV機構組裝基礎』累積的基礎，為接下來『AI輔助開發工具強化』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "把前面所有模組整合成一台可運作的AGV", "days": [{"day": "週一", "content": "整合感測器讀值到主控迴圈", "example": "在ESP32主迴圈中持續讀取距離並回傳", "explanation": "```cpp\nvoid loop() {\n  float distance = readDistanceAveraged();  // Week14寫的濾波函式\n  Serial.print(\"distance,\");\n  Serial.println(distance);\n\n  if (Serial.available()) {\n    char cmd = Serial.read();\n    handleCommand(cmd);  // Week17寫的指令處理函式\n  }\n}\n```\n\n**逐行說明**：\n- 主迴圈同時做兩件事：持續回傳感測器資料、隨時檢查有沒有新指令進來，這是嵌入式系統很常見的「輪詢式」架構\n- 把之前分散在Week14、Week17寫好的函式直接組合進同一個主迴圈，這是這週「整合」的核心精神——不是重新發明，而是把已經驗證過能動的模組拼在一起", "is_project": false}, {"day": "週二", "content": "整合避障邏輯到馬達控制", "example": "distance<10時自動停止並回報網頁", "explanation": "```cpp\nvoid loop() {\n  float distance = readDistanceAveraged();\n\n  if (autoMode && obstacleCheck(distance)) {\n    motorStop();\n    Serial.println(\"event,obstacle_detected\");\n  }\n}\n```\n\n**逐行說明**：\n- `autoMode` 是一個布林變數，用來區分「自動避障模式」跟「手動遙控模式」——只有自動模式才會讓程式自己決定要不要停車，手動模式時完全聽從使用者指令\n- 額外印出`event,obstacle_detected`這種事件訊息，讓Python/網頁端不只收到數值，還能收到「發生了什麼事」的通知，方便在網頁上跳出警告\n\n**為什麼要區分自動/手動模式**：如果沒有這個開關，使用者手動下達前進指令時，程式又自動判斷要停車，兩種邏輯會互相打架，這是本週三要在網頁端加入切換開關的原因。", "is_project": false}, {"day": "週三", "content": "網頁端加入自動/手動模式切換", "example": "新增模式選擇按鈕，呼叫不同控制邏輯", "explanation": "```python\n@app.route(\"/mode/<mode_name>\", methods=[\"POST\"])\ndef set_mode(mode_name):\n    if mode_name not in [\"auto\", \"manual\"]:\n        return \"未知模式\", 400\n    command = f\"MODE:{mode_name}\\n\"\n    with serial_lock:\n        ser.write(command.encode())\n    return f\"已切換至{mode_name}模式\"\n```\n\n**逐行說明**：\n- 沿用Week17的「動作:參數」指令格式，新增一個`MODE`類型的指令，讓ESP32端切換剛剛週二寫的`autoMode`布林變數\n- 網頁前端只需要多兩個按鈕，分別呼叫`/mode/auto`和`/mode/manual`，就能完整控制這個切換\n\n**為什麼在網頁端而不是ESP32端做決定**：把「模式切換」這種操作邏輯放在網頁層(使用者主動決定)，ESP32端只負責「執行目前設定的模式」，這種責任分工讓系統架構更清楚，之後要加更多模式(例如巡邏模式)也比較容易擴充。", "is_project": false}, {"day": "週四", "content": "整體系統除錯與延遲測試", "example": "量測從網頁按下到馬達反應的延遲時間", "explanation": "**做什麼**：用碼表(或手機計時)量測從「按下網頁按鈕」到「馬達實際開始動作」中間經過多久時間。\n\n**除錯檢查清單**：\n- 延遲是否穩定在合理範圍(通常應該在零點幾秒內)，如果延遲很不穩定，可能是序列埠鎖定造成請求排隊等待\n- 長時間運行後，Flask伺服器或ESP32是否會當機或失去回應(這種問題常常要跑10分鐘以上才會出現)\n- 網頁多次快速連續操作時，指令是否會遺失或錯亂\n\n**為什麼要專門排一天做這件事**：系統整合後常常會出現「單獨測試時都正常，但整合起來就出怪問題」的狀況，這通常跟時序、併發、資源競爭有關，這也是為什麼Week19要先學序列埠鎖定的原因——這週就是驗證那些防護措施是否真的有效。", "is_project": fals
