型大小取捨\n- 沒有使用GPU加速：確認PyTorch有正確偵測到CUDA(GPU)，而不是意外掉回CPU運算模式\n\n**為什麼要「分段」計時而不是只看整體FPS**：只知道整體慢，沒辦法知道該優化哪個環節，分段計時能明確告訴你「時間到底花在哪裡」，才能對症下藥地做優化，而不是憑感覺亂猜。", "is_project": false}, {"day": "週五【小專案】", "content": "即時攝影機物件偵測+FPS優化", "example": "達到可接受的即時偵測流暢度", "explanation": "**為什麼要這樣寫**：\n1. 把本週學到的即時串流、模型選擇、參數調整、效能排查全部應用在同一個小專案上，做出一個真正「可用」的即時偵測系統，而不只是能動但很卡的demo\n2. 設定一個具體的效能目標(例如至少15 FPS)，並實際透過調整找到能達成這個目標的參數組合，這種「有明確目標、反覆調整驗證」的優化流程，是工程實務中很重要的方法論\n3. 這個優化過的即時偵測系統，會是下週Week46包裝成ROS2節點時的直接基礎，確保接下來的整合是建立在一個效能可接受的系統上", "is_project": true}], "full_code": "# 即時攝影機物件偵測+FPS優化\n# 說明：達到可接受的即時偵測流暢度\nfrom ultralytics import YOLO\nimport cv2\n\nmodel = YOLO(\"yolov8n.pt\")\ncap = cv2.VideoCapture(0)\n\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n    results = model.predict(frame, conf=0.5, verbose=False)\n    annotated = results[0].plot()\n    cv2.imshow(\"YOLOv8 detection\", annotated)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n\ncap.release()\ncv2.destroyAllWindows()\n"}, {"sheet": "Week46", "num": 46, "title": "Week 46：YOLOv8整合ROS2小專案", "purpose": "承接『模型優化與即時偵測』累積的基礎，為接下來『全系統整合週(上)』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "把偵測結果發布成ROS2 topic", "days": [{"day": "週一", "content": "設計偵測節點架構", "example": "規劃YOLO推論如何包裝成ROS2 Node", "explanation": "**架構規劃**：\n```\n攝影機 --Image topic--> detection_node(內部跑YOLOv8推論) --DetectionArray topic--> 其他節點\n```\n\n**設計考量**：\n- 這個節點要訂閱攝影機影像的topic(輸入)，內部呼叫YOLOv8做推論，再把偵測結果(座標、類別、信心度)發布成topic(輸出)\n- 参考Week32學過的自訂訊息型別技巧，需要設計一個能承載「多個物件偵測結果」的訊息格式，因為一張畫面可能同時偵測到好幾個物件\n\n**為什麼要先設計架構再寫程式碼**：這是Week34設計序列埠橋接節點時就強調過的原則——先想清楚資料怎麼流動、輸入輸出是什麼格式，再開始寫程式碼，能避免寫到一半才發現架構設計有問題需要大幅修改。", "is_project": false}, {"day": "週二", "content": "撰寫detection_node發布偵測結果", "example": "自訂DetectionArray.msg傳遞座標與類別", "explanation": "```\n# msg/Detection.msg\nstring class_name\nfloat32 confidence\nfloat32 center_x\nfloat32 center_y\n\n# msg/DetectionArray.msg\nDetection[] detections\n```\n```python\nclass DetectionNode(Node):\n    def __init__(self):\n        super().__init__(\"detection_node\")\n        self.model = YOLO(\"best.pt\")  # 你Week44訓練出來的自訂模型\n        self.publisher_ = self.create_publisher(DetectionArray, \"detections\", 10)\n```\n\n**逐行說明**：\n- `Detection[]` 這種寫法代表訊息裡包含一個「陣列」，每個元素都是一筆`Detection`資料，這是ROS2訊息型別支援巢狀陣列的用法，跟Week32學過的單一數值訊息不同\n- 這裡直接載入你Week44訓練出來的自訂模型`best.pt`，而不是通用的預訓練模型，讓這個ROS2節點真正能辨識你客製化的特定零件\n\n**為什麼要設計成陣列格式**：真實畫面常常同時有多個物件，如果訊息格式只能承載單一物件的資訊，遇到多物件場景就沒辦法完整表達，陣列格式讓這個節點能處理任意數量的偵測結果。", "is_project": false}, {"day": "週三", "content": "訂閱攝影機影像topic做推論", "example": "self.create_subscription(Image, '/camera/image', ...)", "explanation": "```python\nfrom sensor_msgs.msg import Image\nfrom cv_bridge import CvBridge\n\nself.bridge = CvBridge()\nself.create_subscription(Image, \"/camera/image_raw\", self.image_callback, 10)\n\ndef image_callback(self, msg):\n    frame = self.bridge.imgmsg_to_cv2(msg, \"bgr8\")\n    results = self.model(frame)\n    # ...組成DetectionArray並發布...\n```\n\n**逐行說明**：\n- ROS2傳輸影像用`sensor_msgs/Image`這種標準訊息格式，但OpenCV處理的是NumPy陣列，`CvBridge`就是負責在這兩種格式之間轉換的工具\n- `imgmsg_to_cv2(msg, \"bgr8\")` 把ROS2的Image訊息轉成OpenCV能直接處理的格式，之後就能沿用Week25~28學過的所有OpenCV跟YOLOv8操作\n\n**為什麼影像要包成ROS2訊息傳輸，而不是節點自己開攝影機**：把「取得影像」跟「做推論」拆成不同節點的職責(攝影機節點只負責發布影像，推論節點負責訂閱處理)，讓系統更有彈性——例如同一份影像資料流，可以同時被偵測節點、錄影節點、顯示節點分別訂閱使用，不用每個節點各自重複開啟攝影機。", "is_project": false}, {"day": "週四", "content": "整合測試與可視化", "example": "用rqt_image_view確認標記畫面正確", "explanation": "```bash\nros2 run rqt_image_view rqt_image_view\n```\n\n**做什麼**：`rqt_image_view`是ROS2內建的影像檢視工具，可以直接訂閱任何`Image`型別的topic，在視窗裡即時顯示畫面，適合用來驗證影像相關的topic是否正常傳輸。\n\n**驗證流程**：\n1. 先用`rqt_image_view`確認攝影機節點有正確發布原始影像\n2. 用`ros2 topic echo /detections`確認偵測節點有正確發布結果\n3. 如果額外做了一個發布「標記後畫面」的topic，也可以用`rqt_image_view`直接看到框出偵測物件的即時畫面\n\n**為什麼要多重驗證**：ROS2系統節點一多，任何一個環節斷掉都可能讓最終結果看起來「沒有作用」，逐一驗證每個topic是否正常，能快速定位問題出在哪個環節，而不是對著整個系統一籌莫展。", "is_project": false}, {"day": "週五【小專案】", "content": "偵測節點發布物件座標供其他節點使用", "example": "其他節點能訂閱到即時偵測結果", "explanation": "**為什麼要這樣做**：\n1. 這是Year2電腦視覺(Week25~28)、YOLOv8(Week43~45)、ROS2(Week29~34)三條技術線的正式匯流點——你自訂訓練的模型，現在能透過標準的ROS2 Topic機制，把偵測結果分享給系統裡的任何其他節點使用\n2. 驗證方式是額外寫一個簡單的訂閱節點，確認能收到並正確解析`DetectionArray`訊息，這是Week30學過的Publisher/Subscriber模式的進階應用\n3. 完成這週後，你的AGV系統理論上已經具備「看到特定物件就能知道它在哪」的能力，下週開始的全系統整合週，就是要把這個能力接到實際的機器人反應邏輯上(靠近、避開、或觸發某個動作)", "is_project": true}], "full_code": "# 偵測節點發布物件座標供其他節點使用\n# 說明：其他節點能訂閱到即時偵測結果\nfrom ultralytics import YOLO\nimport cv2\n\nmodel = YOLO(\"yolov8n.pt\")\ncap = cv2.VideoCapture(0)\n\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n    results = model.predict(frame, conf=0.5, verbose=False)\n    annotated = results[0].plot()\n    cv2.imshow(\"YOLOv8 detection\", annotated)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n\ncap.release()\ncv2.destroyAllWindows()\n"}, {"sheet": "Week47", "num": 47, "title": "Week 47：全系統整合週(上)", "purpose": "承接『YOLOv8整合ROS2小專案』累積的基礎，為接下來『M3里程碑：Year2整合展示週』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "把OpenCV/YOLO/ROS2/Gazebo串接成一套流程", "days": [{"day": "週一", "content": "盤點所有子系統介面", "example": "OpenCV/YOLO/ROS2/Gazebo各自輸出入整理", "explanation": "**盤點清單範例**：\n| 子系統 | 輸入 | 輸出 |\n|---|---|---|\n| 攝影機節點 | 硬體攝影機 | `/camera/image_raw` |\n| YOLOv8偵測節點 | `/camera/image_raw` | `/detections` |\n| 避障節點 | `/distance` | `/cmd_vel` |\n| Gazebo模擬 | `/cmd_vel` | 模擬環境中的AGV移動 |\n\n**為什麼要用表格整理而不是直接開始寫整合程式碼**：Year2累積了非常多獨立開發、各自驗證過的模組(OpenCV處理、YOLOv8偵測、ROS2節點、Gazebo模擬)，在真正整合之前，先用表格清楚列出每個模組「吃什麼資料、吐什麼資料」，能提前發現介面不相容的問題(例如兩個模組對同一種資料的座標格式定義不同)，比邊整合邊除錯有效率得多。", "is_project": false}, {"day": "週二", "content": "設計整合後的資料流架構", "example": "畫出topic/node關係圖", "explanation": "**做什麼**：基於週一的盤點結果，畫一張完整的節點/topic關係圖(可以先手繪或用簡單工具畫)，呈現資料從「感知」(攝影機、感測器)到「決策」(偵測結果判讀、避障邏輯)到「執行」(馬達控制)的完整流向。\n\n**設計時要思考的問題**：\n- 有沒有兩個節點需要同一份資料，但目前分別重複取得(例如兩個節點各自訂閱攝影機，浪費運算資源)\n- 決策邏輯應該放在哪個節點：是新增一個專門的「決策節點」整合視覺偵測跟距離感測的資訊，還是分散在各自的節點裡各自反應\n\n**為什麼要「畫圖」而不是直接動手整合**：複雜系統的架構設計最好先用視覺化方式想清楚，再落實成程式碼，這跟蓋房子要先有藍圖是一樣的道理，能大幅降低整合過程中「越改越亂」的風險。", "is_project": false}, {"day": "週三", "content": "串接視覺辨識結果到避障/導航邏輯", "example": "偵測到特定物件時觸發對應行為", "explanation": "```python\nclass DecisionNode(Node):\n    def __init__(self):\n        super().__init__(\"decision_node\")\n        self.create_subscription(DetectionArray, \"detections\", self.detection_callback, 10)\n        self.create_subscription(Float32, \"distance\", self.distance_callback, 10)\n        self.publisher_ = self.create_publisher(Twist, \"/cmd_vel\", 10)\n\n    def detection_callback(self, msg):\n        for det in msg.detections:\n            if det.class_name == \"target_object\" and det.confidence > 0.6:\n                self.get_logger().info(\"偵測到目標物件，準備接近\")\n                # 觸發對應行為，例如朝目標方向移動\n```\n\n**逐行說明**：\n- 這個決策節點同時訂閱視覺偵測結果跟距離感測資料，把Week38單純依賴距離感測器的避障邏輯，升級成能同時考慮「看到了什麼」跟「有多近」的複合決策\n- 這是Week38的`ObstacleAvoidance`節點跟Week46的偵測節點，第一次真正在同一個決策邏輯裡協同運作\n\n**為什麼要把兩種感知資訊放在同一個節點決策**：單純的距離感測器只能告訴你「前面有東西」，但不知道是什麼；加入視覺辨識後，系統能做出更細緻的判斷(例如「是目標物件就靠近，是障礙物就避開」)，這種多感測器融合是機器人系統邁向更智慧化的關鍵一步。", "is_project": false}, {"day": "週四", "content": "整合測試與除錯", "example": "在模擬環境中跑通整條流程", "explanation": "**測試流程**：在Gazebo模擬場景中放置目標物件跟障礙物，啟動完整系統(launch file一次啟動所有節點)，觀察AGV是否能：\n1. 正確偵測到目標物件並靠近\n2. 遇到障礙物時正確避開\n3. 兩種行為不會互相干擾或矛盾\n\n**除錯技巧**：善用Week34學過的`rqt_graph`確認所有節點跟topic連接正確，用`ros2 topic echo`個別檢查每個環節的資料是否符合預期，逐一排查而不是對著整個系統一次抓所有問題。\n\n**為什麼要先在模擬環境整合測試**：這是Year2累積的所有技術第一次要同時協同運作，複雜系統整合初期一定會有各種預期外的互動問題，在模擬環境測試能反覆快速調整，不用擔心撞壞實體硬體，等模擬環境穩定後，才考慮部署到實體AGV。", "is_project": false}, {"day": "週五【小專案】", "content": "視覺辨識結果驅動模擬中的AGV反應", "example": "AGV能依辨識到的物件做出對應動作", "explanation": "**為什麼要這樣做**：\n1. 這是Year2全部20週(Week25~47的前4天)技術的第一次完整協同運作展示——OpenCV/YOLOv8的視覺能力、ROS2的節點通訊架構、Gazebo的模擬環境、加上決策邏輯，全部整合成一個會「看、想、動」的完整系統\n2. 驗證了本週設計的資料流架構是否合理，任何整合過程中發現的問題，都是下週準備M3展示前最後修正的機會\n3. 完成這週後，你已經有一個功能完整的模擬機器人系統，下週的M3里程碑就是要把這個系統做最後的打磨跟正式展示準備", "is_project": true}], "full_code": "# 視覺辨識結果驅動模擬中的AGV反應\n# 說明：AGV能依辨識到的物件做出對應動作\n# 概念串接：YOLOv8偵測結果 -> 判斷目標物件 -> 發布ROS2速度指令\nfrom ultralytics import YOLO\nimport cv2\n\nmodel = YOLO(\"yolov8n.pt\")\n\ndef decide_action(results):\n    boxes = results[0].boxes\n    if len(boxes) == 0:\n        return \"search\"\n    # 若偵測到目標且置中，則靠近；否則轉向對準\n    x_center = boxes.xywh[0][0].item()\n    frame_center = 320\n    if abs(x_center - frame_center) < 30:\n        return \"approach\"\n    return \"turn_left\" if x_center < frame_center else \"turn_right\"\n\nif __name__ == \"__main__\":\n    cap = cv2.VideoCapture(0)\n    ret, frame = cap.read()\n    results = model.predict(frame, verbose=False)\n    action = decide_action(results)\n    print(f\"決策動作: {action}  # 之後可透過ROS2 topic或serial送出對應指令\")\n"}, {"sheet": "Week48", "num": 48, "title": "Week 48：M3里程碑：Year2整合展示週", "purpose": "承接『全系統整合週(上)』累積的基礎，為接下來『RealSense SDK安裝與基本串流』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "完成具備視覺辨識能力的AGV模擬展示", "days": [{"day": "週一", "content": "系統最終測試與穩定性確認", "example": "多次重複測試各模組穩定運作", "explanation": "**測試重點**：延續Week24的測試方法論(連續多次執行、記錄成功率)，這次測試範圍擴大到整個Year2的視覺+ROS2+模擬整合系統。特別要注意YOLOv8推論這種運算量較大的模組，長時間運行是否會有記憶體持續增加(記憶體洩漏)的狀況。\n\n**為什麼視覺相關系統要特別注意穩定性**：深度學習模型的推論通常比傳統邏輯運算更耗費資源，長時間運行更容易暴露資源管理不當的問題，展示前的穩定性測試比Year1的系統更需要留意這一點。", "is_project": false}, {"day": "週二", "content": "修正整合過程中發現的問題", "example": "針對bug逐一排查修復", "explanation": "**做什麼**：把週一測試中發現的問題，依照Week24學過的方式排出優先順序，優先處理會讓展示直接失敗的問題。\n\n**這階段常見的Year2特有問題**：\n- 偵測結果不穩定(同一個物件時而偵測到、時而偵測不到)：可能需要調整Week45學過的信心閾值，或是訓練資料不夠多樣化\n- 系統反應延遲：檢查是否YOLOv8推論成為整條pipeline的瓶頸，參考Week45的效能排查方法\n\n**為什麼要對照Week24的方法論**：這種「先測試找問題、再依優先度修復」的流程，在Year1已經練習過一次，這週是同樣方法論在更複雜系統上的重複應用，展現的是可遷移的工程能力，而不是每次都要重新摸索流程。", "is_project": false}, {"day": "週三", "content": "準備展示腳本與說明文件", "example": "整理架構圖與3分鐘demo流程", "explanation": "**展示腳本建議結構**：\n1. 簡述Year2學到的技術範疇(電腦視覺、ROS2、模擬)\n2. 展示視覺辨識能力：對著攝影機展示能正確辨識你訓練的自訂零件\n3. 展示Gazebo模擬中的完整反應：AGV依視覺結果做出對應行為\n4. 簡短說明技術架構圖(週二畫的node/topic關係圖正好可以拿來用)\n\n**為什麼要準備架構圖而不只是操作展示**：Year2的系統複雜度比Year1高出不少，單純看操作demo不容易讓觀眾理解背後的技術深度，一張清楚的架構圖能在短時間內傳達「這個系統做了多少事」，這對之後跟客戶或雇主展示技術實力特別有幫助。", "is_project": false}, {"day": "週四", "content": "彩排完整展示流程", "example": "模擬正式展示情境跑一次", "explanation": "**做什麼**：完整走一次週三準備的展示腳本，計時確認流程順暢，特別注意「啟動整套系統」這個動作本身需要多久時間(launch file啟動多個節點加上YOLOv8模型載入，可能需要一些時間)，展示時要把這個等待時間也規劃進整體流程裡，避免觀眾在旁邊乾等。\n\n**為什麼系統啟動時間也要納入考量**：Year2系統比Year1複雜，啟動時間可能明顯變長，這是展示規劃時容易被忽略、但實際上很影響觀感的細節，提早發現並想好因應方式(例如展示前就先啟動好系統)，能讓正式展示更流暢。", "is_project": false}, {"day": "週五【M3交付】", "content": "展示AGV辨識物件並規劃路徑避開/接近目標", "example": "完成Year2最終整合展示，作品集重要里程碑", "explanation": "**為什麼這是Year2的重要里程碑**：\n1. 這是四年計畫的第二個完整里程碑，累積了Year2共24週(Week25~48)學到的電腦視覺、ROS2機器人作業系統、Gazebo模擬三大技術領域，整合成一個具備「視覺辨識+自主決策」能力的機器人系統\n2. 跟Year1的M2里程碑(單純避障+網頁控制)相比，這次的系統展現了明顯更高階的智慧行為——能辨識特定物件、能在模擬環境驗證複雜行為，這是作品集裡很有說服力的能力升級證明\n3. 完成這個里程碑後，你已經具備電腦視覺、ROS2、模擬環境三項機器人工程師的核心技能，下週開始邁入Year3的3D深度視覺，會在這個基礎上加入「空間深度」這個新維度", "is_project": true}], "full_code": "# 展示AGV辨識物件並規劃路徑避開/接近目標\n# 說明：完成Year2最終整合展示，作品集重要里程碑\n# 概念串接：YOLOv8偵測結果 -> 判斷目標物件 -> 發布ROS2速度指令\nfrom ultralytics import YOLO\nimport cv2\n\nmodel = YOLO(\"yolov8n.pt\")\n\ndef decide_action(results):\n    boxes = results[0].boxes\n    if len(boxes) == 0:\n        return \"search\"\n    # 若偵測到目標且置中，則靠近；否則轉向對準\n    x_center = boxes.xywh[0][0].item()\n    frame_center = 320\n    if abs(x_center - frame_center) < 30:\n        return \"approach\"\n    return \"turn_left\" if x_center < frame_center else \"turn_right\"\n\nif __name__ == \"__main__\":\n    cap = cv2.VideoCapture(0)\n    ret, frame = cap.read()\n    results = model.predict(frame, verbose=False)\n    action = decide_action(results)\n    print(f\"決策動作: {action}  # 之後可透過ROS2 topic或serial送出對應指令\")\n"}, {"sheet": "Week49", "num": 49, "title": "Week 49：RealSense SDK安裝與基本串流", "purpose": "承接『M3里程碑：Year2整合展示週』累積的基礎，為接下來『深度資訊處理與座標轉換』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能取得彩色與深度雙串流畫面", "days": [{"day": "週一", "content": "安裝pyrealsense2與驅動", "example": "pip install pyrealsense2", "explanation": "```bash\npip install pyrealsense2\n```\n```python\nimport pyrealsense2 as rs\nctx = rs.context()\ndevices = ctx.query_devices()\nprint(f\"偵測到 {len(devices)} 台RealSense裝置\")\n```\n\n**逐行說明**：\n- `pyrealsense2` 是Intel官方提供的Python SDK，把底層複雜的相機驅動、資料流控制都包裝成易用的API\n- `rs.context()` 建立一個管理所有連接裝置的環境物件，`query_devices()`列出目前偵測到的RealSense相機，這是接上硬體後第一個該跑的健檢腳本\n\n**常見安裝陷阱**：RealSense的Python套件版本要跟系統驅動版本相容，樹莓派上安裝常常比一般電腦麻煩，建議先查詢官方文件確認你的系統(樹莓派OS版本、Python版本)有沒有已知的相容性問題，這是Year3開始接觸新硬體時，第一步「先確認能不能被系統認得到」的健檢習慣。", "is_project": false}, {"day": "週二", "content": "建立pipeline取得彩色串流", "example": "pipeline.start(config); frames = pipeline.wait_for_frames()", "explanation": "```python\nimport pyrealsense2 as rs\n\npipeline = rs.pipeline()\nconfig = rs.config()\nconfig.enable_stream(rs.stream.color, 640, 480, rs.format.bgr8, 30)\npipeline.start(config)\n\nframes = pipeline.wait_for_frames()\ncolor_frame = frames.get_color_frame()\n```\n\n**逐行說明**：\n- `pipeline` 是RealSense資料流的管理核心，概念上類似Week28學過的`cv2.VideoCapture`，但功能更完整(能同時管理彩色、深度等多種資料流)\n- `config.enable_stream()` 指定要開啟哪種資料流、解析度、格式、幀率，這裡開啟的是跟一般攝影機一樣的彩色串流(BGR格式，呼應Week25學過的OpenCV色彩慣例)\n- `wait_for_frames()` 是阻塞式(blocking)呼叫，會等到有新的一組畫面資料才回傳，這是即時串流常見的資料取得模式\n\n**為什麼RealSense的API比一般攝影機複雜**：因為RealSense同時提供彩色、深度、甚至紅外線等多種資料流，pipeline的設計是為了讓你能彈性組合開啟需要的資料流，而不是被綁死只能用單一種輸出。", "is_project": false}, {"day": "週三", "content": "取得深度串流", "example": "depth_frame = frames.get_depth_frame()", "explanation": "```python\nconfig.enable_stream(rs.stream.depth, 640, 480, rs.format.z16, 30)\npipeline.start(config)\n\nframes = pipeline.wait_for_frames()\ndepth_frame = frames.get_depth_frame()\n\ndistance = depth_frame.get_distance(320, 240)  # 取得畫面正中央的深度值(公尺)\nprint(f\"畫面中心距離: {distance:.2f} 公尺\")\n```\n\n**逐行說明**：\n- `rs.format.z16` 是深度資料的標準格式，每個像素用16位元整數儲存深度值(單位通常是毫米)\n- `depth_frame.get_distance(x, y)` 直接取得指定像素座標的實際距離(單位公尺)，這是D435i硬體內部已經幫你做好距離換算，不用像Week14的超音波感測器那樣自己計算\n\n**這是四年計畫裡第一次真正取得「深度」資訊**：之前Week14的超音波感測器只能量測「正前方一個點」的距離，RealSense能同時取得整個畫面每個像素各自的深度，這是從「一維距離感測」進化到「二維深度地圖」的關鍵轉折點，也是Year3整個模組的核心價值所在。", "is_project": false}, {"day": "週四", "content": "深度影像上色顯示(colormap)", "example": "cv2.applyColorMap(depth_image, cv2.COLORMAP_JET)", "explanation": "```python\nimport numpy as np\nimport cv2\n\ndepth_image = np.asanyarray(depth_frame.get_data())\ndepth_colormap = cv2.applyColorMap(\n    cv2.convertScaleAbs(depth_image, alpha=0.03), cv2.COLORMAP_JET\n)\n```\n\n**逐行說明**：\n- `np.asanyarray(depth_frame.get_data())` 把RealSense的深度資料轉換成NumPy陣列，這樣才能用Week25學過的OpenCV函式處理\n- 原始深度值範圍很大(以毫米為單位，可能到幾千)，直接顯示會是一片全黑或全白，`convertScaleAbs(alpha=0.03)`把數值壓縮到0~255的可顯示範圍\n- `COLORMAP_JET` 是常用的偽色彩對應表，會把數值大小轉換成藍(近)到紅(遠)或反過來的漸層色彩，讓深度分布能被人眼直觀理解\n\n**為什麼原始深度資料不能直接看**：深度值本質上是數字矩陣，人眼沒辦法直接從一堆數字判讀空間結構，上色是把「數字」轉換成「視覺直覺」的必要步驟，這也是資料視覺化的核心價值——原始數字對人類不友善，圖像化後才能快速理解。", "is_project": false}, {"day": "週五【小專案】", "content": "同時顯示RGB與深度影像視窗", "example": "左右並排顯示彩色畫面與上色後的深度畫面", "explanation": "**為什麼要這樣寫**：\n1. 用`np.hstack()`把彩色畫面跟上色後的深度畫面水平拼接，同時顯示在同一個視窗，方便直接比對「這個顏色代表的物體，深度大概是多少」\n2. 這是Year3第一週的整合驗收，確認RealSense硬體、SDK安裝、彩色/深度雙串流都正確運作，為接下來Week50~52更進階的座標轉換、對齊技巧打好基礎\n3. 這個小專案完成後，你已經擁有一套能同時「看到顏色」跟「看到距離」的視覺系統，這是Year1~Year2的純彩色視覺系統做不到的全新能力，也是之後Open3D點雲處理的原始資料來源", "is_project": true}], "full_code": "# 同時顯示RGB與深度影像視窗\n# 說明：左右並排顯示彩色畫面與上色後的深度畫面\nimport pyrealsense2 as rs\nimport numpy as np\nimport cv2\n\npipeline = rs.pipeline()\nconfig = rs.config()\nconfig.enable_stream(rs.stream.depth, 640, 480, rs.format.z16, 30)\nconfig.enable_stream(rs.stream.color, 640, 480, rs.format.bgr8, 30)\npipeline.start(config)\n\ntry:\n    while True:\n        frames = pipeline.wait_for_frames()\n        depth_frame = frames.get_depth_frame()\n        color_frame = frames.get_color_frame()\n        if not depth_frame or not color_frame:\n            continue\n\n        depth_image = np.asanyarray(depth_frame.get_data())\n        color_image = np.asanyarray(color_frame.get_data())\n        depth_colormap = cv2.applyColorMap(\n            cv2.convertScaleAbs(depth_image, alpha=0.03), cv2.COLORMAP_JET\n        )\n\n        combined = np.hstack((color_image, depth_colormap))\n        cv2.imshow(\"RGB-D\", combined)\n        if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n            break\nfinally:\n    pipeline.stop()\n"}, {"sheet": "Week50", "num": 50, "title": "Week 50：深度資訊處理與座標轉換", "purpose": "承接『RealSense SDK安裝與基本串流』累積的基礎，為接下來『RealSense與OpenCV整合(RGB-D對齊)』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "理解intrinsics並把深度轉成3D座標", "days": [{"day": "週一", "content": "相機內部參數 intrinsics概念", "example": "理解焦距、主點對座標轉換的影響", "explanation": "**概念說明**：相機內部參數(intrinsics)描述鏡頭本身的光學特性，主要包含：\n- **焦距(fx, fy)**：決定畫面的視野範圍跟縮放比例\n- **主點(cx, cy)**：光軸中心對應到畫面上的像素座標，理論上接近畫面正中央，但實際會因為鏡頭組裝誤差而有些微偏移\n\n```python\nprofile = pipeline.get_active_profile()\ndepth_stream = profile.get_stream(rs.stream.depth)\nintrinsics = depth_stream.as_video_stream_profile().get_intrinsics()\nprint(f\"焦距: fx={intrinsics.fx}, fy={intrinsics.fy}\")\nprint(f\"主點: cx={intrinsics.ppx}, cy={intrinsics.ppy}\")\n```\n\n**為什麼需要這些參數**：要把「畫面上的2D像素座標」轉換成「真實世界的3D座標」，必須知道鏡頭的這些光學特性，這就像Week28提到的「攝影機校正」概念，這週會正式用上——RealSense已經幫你校正好並內建這些參數，不用像一般攝影機那樣自己拍棋盤格校正。", "is_project": false}, {"day": "週二", "content": "取得單一像素的深度值", "example": "depth = depth_frame.get_distance(x, y)", "explanation": "```python\nx, y = 320, 240  # 畫面中心點\ndepth = depth_frame.get_distance(x, y)\nprint(f\"像素({x},{y})的深度: {depth:.3f} 公尺\")\n```\n\n**逐行說明**：\n- 這是Week49週三就用過的函式，這週要更深入理解它背後的意義：這個回傳的深度值，只是「距離」這一個數字，還不是完整的3D座標(還缺x、y方向的實際位置)\n- 深度值為0通常代表「這個像素沒有有效的深度資料」，可能是距離太近/太遠超出感測範圍，或是材質吸收紅外線(RealSense是主動紅外線深度感測，深色或透明材質常常量不到)\n\n**常見誤區**：新手容易誤以為`get_distance()`回傳的就是完整3D座標，但它只是「這個像素點到相機的直線距離」，週三會學到如何把這個深度值，結合週一的intrinsics，真正換算成x、y、z三個維度的3D座標。", "is_project": false}, {"day": "週三", "content": "深度轉3D座標(deproject)", "example": "rs.rs2_deproject_pixel_to_point(intrin, [x,y], depth)", "explanation": "```python\npoint_3d = rs.rs2_deproject_pixel_to_point(\n    intrinsics, [x, y], depth\n)\nprint(f\"3D座標: X={point_3d[0]:.3f}, Y={point_3d[1]:.3f}, Z={point_3d[2]:.3f}\")\n```\n\n**逐行說明**：\n- `rs2_deproject_pixel_to_point()` 是RealSense SDK提供的公式化函式，內部用週一學到的intrinsics(焦距、主點)，把「2D像素座標 + 深度值」正式換算成「3D空間座標(X, Y, Z)」\n- 這個函式名稱裡的`deproject`(反投影)，是相對於「projection(投影)」的反向操作——投影是把3D世界投影到2D畫面(一般攝影機拍照的過程)，反投影是反過來從2D+深度算回3D位置\n\n**為什麼這是Year3的核心技術**：這個轉換是所有後續3D視覺應用(點雲、物件3D定位、手眼校正)的數學基礎，Week53開始學的Open3D點雲，本質上就是對畫面裡「每一個像素」都做一次這樣的deproject運算，組合成整片3D點雲。", "is_project": false}, {"day": "週四", "content": "座標單位與誤差來源說明", "example": "了解RealSense在不同距離下的量測誤差範圍", "explanation": "**單位確認**：`rs2_deproject_pixel_to_point()`回傳的座標單位是**公尺**，這是RealSense SDK的慣例，如果你的其他系統(例如MoveIt2、URDF)用的也是公尺，可以直接對接，不需要額外換算。\n\n**誤差來源**：\n- D435i的官方規格通常標示在特定距離範圍內(例如0.3~3米)誤差最小，太近或太遠誤差會明顯增加\n- 環境光線強烈(尤其戶外陽光)會干擾紅外線深度感測，造成雜訊增加\n- 物體表面材質(反光、透明、深黑色)也會影響深度量測的準確度\n\n**為什麼要提前認識這些限制**：了解硬體的物理限制，才能在系統設計時做出合理預期——例如你不會期待RealSense在強烈日照下的戶外環境有跟室內一樣好的表現，這種對硬體限制的認知，是機器人工程師避免「明明是硬體物理限制卻誤以為是程式碼bug」的重要基礎。", "is_project": false}, {"day": "週五【小專案】", "content": "點擊畫面顯示該點實際距離(公尺)", "example": "滑鼠點擊畫面座標，即時印出對應3D座標", "explanation": "**為什麼要這樣寫**：\n1. 用OpenCV的滑鼠回呼函式(`cv2.setMouseCallback`)，讓使用者可以直接在畫面上點擊任意位置，即時看到該點的深度值跟完整3D座標，這是驗證本週學到的座標轉換是否正確的最直覺方式\n2. 互動式的驗證工具，比單純寫死座標測試更有價值——你可以點擊不同距離的物體，實際感受深度數值隨距離變化的規律，建立起對這套系統的直覺\n3. 這個小工具本身也很實用，之後開發任何跟RealSense互動的功能時，都能重複使用這個「點擊看座標」的除錯工具，快速確認某個畫面位置對應的真實3D座標是否合理", "is_project": true}], "full_code": "# 點擊畫面顯示該點實際距離(公尺)\n# 說明：滑鼠點擊畫面座標，即時印出對應3D座標\nimport pyrealsense2 as rs\nimport numpy as np\nimport cv2\n\npipeline = rs.pipeline()\nconfig = rs.config()\nconfig.enable_stream(rs.stream.depth, 640, 480, rs.format.z16, 30)\nconfig.enable_stream(rs.stream.color, 640, 480, rs.format.bgr8, 30)\npipeline.start(config)\n\ntry:\n    while True:\n        frames = pipeline.wait_for_frames()\n        depth_frame = frames.get_depth_frame()\n        color_frame = frames.get_color_frame()\n        if not depth_frame or not color_frame:\n            continue\n\n        depth_image = np.asanyarray(depth_frame.get_data())\n        color_image = np.asanyarray(color_frame.get_data())\n        depth_colormap = cv2.applyColorMap(\n            cv2.convertScaleAbs(depth_image, alpha=0.03), cv2.COLORMAP_JET\n        )\n\n        combined = np.hstack((color_image, depth_colormap))\n        cv2.imshow(\"RGB-D\", combined)\n        if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n            break\nfinally:\n    pipeline.stop()\n"}, {"sheet": "Week51", "num": 51, "title": "Week 51：RealSense與OpenCV整合(RGB-D對齊)", "purpose": "承接『深度資訊處理與座標轉換』累積的基礎，為接下來『即時RGB-D整合小專案』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "對齊彩色與深度畫面像素座標", "days": [{"day": "週一", "content": "align物件說明", "example": "align = rs.align(rs.stream.color)", "explanation": "**問題背景**：RealSense的彩色相機跟深度相機是兩顆實體上分開安裝的鏡頭(有一定的物理間距)，這代表同一個像素座標，在彩色畫面跟深度畫面裡，實際對應到的不完全是空間中同一個點，會有些微的視角差異。\n\n```python\nalign = rs.align(rs.stream.color)\n```\n\n**逐行說明**：\n- `rs.align(rs.stream.color)` 建立一個「對齊器」，指定要以彩色畫面的視角為基準，把深度畫面重新運算對齊過去\n- 這個過程需要用到Week50學到的intrinsics跟兩顆鏡頭之間的相對位置關係(這部分RealSense SDK已經內建校正好，不用自己計算)\n\n**為什麼一定要對齊**：如果沒有對齊，你在彩色畫面上看到「這裡有一個箱子」，去查同一個像素座標的深度值，實際上可能量到的是箱子旁邊背景的深度，這種「顏色跟深度對不上」的問題，會讓後續所有依賴RGB-D對應關係的應用(例如標記物體距離)產生錯誤結果。", "is_project": false}, {"day": "週二", "content": "對齊後取得對應畫面", "example": "aligned_frames = align.process(frames)", "explanation": "```python\naligned_frames = align.process(frames)\naligned_depth_frame = aligned_frames.get_depth_frame()\ncolor_frame = aligned_frames.get_color_frame()\n```\n\n**逐行說明**：\n- `align.process(frames)` 對這一組原始畫面資料執行對齊運算，回傳的`aligned_frames`裡的深度畫面，已經被重新運算成跟彩色畫面「同一個像素座標，代表同一個空間點」\n- 之後查詢`aligned_depth_frame.get_distance(x, y)`，這個座標會跟`color_frame`上同樣座標位置看到的物體完全對應\n\n**為什麼要獨立一個步驟做對齊**：對齊運算本身需要額外的計算資源，RealSense SDK把它設計成一個明確的步驟，讓你可以選擇「需要精確對齊時才做」，如果應用不需要RGB-D精確對應(例如只是想看整體深度分布)，可以跳過這步驟節省運算資源，這是效能與精確度之間的取捨設計。", "is_project": false}, {"day": "週三", "content": "疊加深度資訊到彩色畫面", "example": "在偵測到的物件上標註距離文字", "explanation": "```python\n# 假設用Week43學過的YOLOv8偵測到一個物件，中心點是(cx, cy)\ndistance = aligned_depth_frame.get_distance(cx, cy)\ncv2.putText(\n    color_image, f\"{distance:.2f}m\", (cx, cy),\n    cv2.FONT_HERSHEY_SIMPLEX, 0.6, (0, 255, 0), 2\n)\n```\n\n**逐行說明**：\n- 這是把Week28學過的`cv2.putText()`疊加文字技巧，跟本週的RGB-D對齊結合——在YOLOv8偵測到的物件旁邊，直接標註這個物件距離相機多遠\n- 因為畫面已經對齊，`(cx, cy)`這個從彩色畫面偵測出來的座標，可以直接拿去查對齊後的深度畫面，不會有偏差\n\n**為什麼這是Year2跟Year3技術的第一次真正融合**：Week46做的YOLOv8偵測只能告訴你「畫面上哪裡有物件」，加上這週的深度資訊後，你能進一步知道「這個物件離我多遠」，這是從「2D辨識」進化到「有空間感知的辨識」的關鍵一步，也是之後Year3~Year4視覺抓取任務不可或缺的資訊。", "is_project": false}, {"day": "週四", "content": "效能優化(降低解析度/幀率)", "example": "config.enable_stream(..., 640, 480, ..., 30)", "explanation": "**優化選項**：\n- 降低解析度：例如從1280x720降到640x480，能大幅減少對齊運算跟後續處理的資源消耗\n- 降低幀率：例如從30fps降到15fps，如果應用不需要極高即時性(例如靜態物件辨識)，較低幀率也夠用\n\n**為什麼對齊運算特別需要考慮效能**：`align.process()`每一幀都要重新計算對齊，是RGB-D pipeline裡相對耗費運算資源的步驟，在樹莓派這類資源有限的裝置上，如果沒有適當降低解析度/幀率，很容易出現Week45學過的FPS過低問題。\n\n**判斷原則**：跟Week45學到的模型大小選擇邏輯一致——沒有絕對正確的設定，要依實際應用場景(需要多即時、多精確)做取捨，先用預設高解析度測試效能，如果不夠用再逐步降低直到找到可接受的平衡點。", "is_project": false}, {"day": "週五【小專案】", "content": "疊加深度資訊在彩色畫面上的視覺化工具", "example": "彩色畫面上每個偵測框旁顯示該物件距離", "explanation": "**為什麼要這樣寫**：\n1. 把本週學到的align對齊機制，跟Week46已經做好的YOLOv8偵測節點結合，做出一個「畫面上每個偵測到的物件，都標註實際距離」的完整視覺化工具\n2. 這個工具直接示範了RGB-D視覺系統的核心價值——不只知道「有什麼」，還知道「在哪裡、多遠」，這正是之後Year3~Year4做視覺抓取、路徑規劃時，AGV/手臂系統需要的關鍵資訊\n3. 完成這週後，你已經具備完整的即時RGB-D對齊處理能力，下週的整合小專案會把這個能力包裝成一個更完整、更穩健的工具", "is_project": true}], "full_code": "# 疊加深度資訊在彩色畫面上的視覺化工具\n# 說明：彩色畫面上每個偵測框旁顯示該物件距離\nimport pyrealsense2 as rs\nimport numpy as np\nimport cv2\n\npipeline = rs.pipeline()\nconfig = rs.config()\nconfig.enable_stream(rs.stream.depth, 640, 480, rs.format.z16, 30)\nconfig.enable_stream(rs.stream.color, 640, 480, rs.format.bgr8, 30)\npipeline.start(config)\n\ntry:\n    while True:\n        frames = pipeline.wait_for_frames()\n        depth_frame = frames.get_depth_frame()\n        color_frame = frames.get_color_frame()\n        if not depth_frame or not color_frame:\n            continue\n\n        depth_image = np.asanyarray(depth_frame.get_data())\n        color_image = np.asanyarray(color_frame.get_data())\n        depth_colormap = cv2.applyColorMap(\n            cv2.convertScaleAbs(depth_image, alpha=0.03), cv2.COLORMAP_JET\n        )\n\n        combined = np.hstack((color_image, depth_colormap))\n        cv2.imshow(\"RGB-D\", combined)\n        if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n            break\nfinally:\n    pipeline.stop()\n"}, {"sheet": "Week52", "num": 52, "title": "Week 52：即時RGB-D整合小專案", "purpose": "承接『RealSense與OpenCV整合(RGB-D對齊)』累積的基礎，為接下來『Open3D基礎：點雲讀取與顯示』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "整合前三週成一個完整工具", "days": [{"day": "週一", "content": "整合前三週程式架構", "example": "把串流、座標轉換、對齊功能封裝成class", "explanation": "```python\nclass RealSenseCamera:\n    def __init__(self, width=640, height=480, fps=30):\n        self.pipeline = rs.pipeline()\n        config = rs.config()\n        config.enable_stream(rs.stream.color, width, height, rs.format.bgr8, fps)\n        config.enable_stream(rs.stream.depth, width, height, rs.format.z16, fps)\n        self.pipeline.start(config)\n        self.align = rs.align(rs.stream.color)\n\n    def get_frames(self):\n        frames = self.pipeline.wait_for_frames()\n        aligned = self.align.process(frames)\n        return aligned.get_color_frame(), aligned.get_depth_frame()\n\n    def stop(self):\n        self.pipeline.stop()\n```\n\n**逐行說明**：\n- 把Week49~51學到的串流開啟、align設定，全部包在`__init__`裡一次做好，這是Week7~8學過的物件導向封裝精神，在硬體驅動程式上的實際應用\n- `get_frames()` 把「取得畫面+對齊」這個常常要重複做的動作，包成一個簡單的方法呼叫，之後任何需要用到RealSense的程式，都能直接`camera = RealSenseCamera()`然後呼叫`camera.get_frames()`，不用每次重寫這一大串設定\n\n**為什麼現在才要封裝成class**：先花三週熟悉每個環節的細節(串流、座標轉換、對齊)是必要的學習過程，等你真正理解每一步在做什麼之後，才適合把它們封裝起來變成「黑盒子」方便重複使用——如果一開始就用封裝好的class，你會知道怎麼用但不知道為什麼這樣設計，之後遇到問題也不知道從何除錯起。", "is_project": false}, {"day": "週二", "content": "加入簡易UI控制(顯示模式切換)", "example": "按鍵切換顯示彩色/深度/疊加模式", "explanation": "```python\ndisplay_mode = \"color\"  # color / depth / overlay\n\nkey = cv2.waitKey(1) & 0xFF\nif key == ord(\"1\"):\n    display_mode = \"color\"\nelif key == ord(\"2\"):\n    display_mode = \"depth\"\nelif key == ord(\"3\"):\n    display_mode = \"overlay\"\n```\n\n**逐行說明**：\n- 用簡單的按鍵數字(1/2/3)切換顯示模式，這是Week17學過的「指令集設計」概念在使用者介面上的應用——用最簡單的輸入(單一按鍵)觸發不同的行為\n- 這種輕量級的互動設計，在開發階段的除錯工具中很實用，不需要像Week18~19的Flask網頁那樣複雜，鍵盤快捷鍵就足夠應付開發時的快速切換需求\n\n**為什麼開發工具值得花時間做這個**：一個能快速切換視角的除錯工具，能讓你在調整參數(例如深度濾波門檻)時立即看到不同模式下的效果，這種「快速回饋循環」對開發效率的提升，往往比多寫幾個功能更有價值。", "is_project": false}, {"day": "週三", "content": "加入資料紀錄功能", "example": "可儲存目前畫面的RGB與深度raw資料", "explanation": "```python\nimport numpy as np\n\ndef save_frame(color_frame, depth_frame, filename_prefix):\n    color_image = np.asanyarray(color_frame.get_data())\n    depth_image = np.asanyarray(depth_frame.get_data())\n    cv2.imwrite(f\"{filename_prefix}_color.png\", color_image)\n    np.save(f\"{filename_prefix}_depth.npy\", depth_image)\n```\n\n**逐行說明**：\n- 彩色畫面用`cv2.imwrite()`存成一般看得懂的圖片檔；深度資料因為是精確的數值矩陣(不是一般圖片格式)，用`np.save()`存成NumPy專用的`.npy`格式，才能完整保留原始數值不失真\n- 這種「彩色存圖片、深度存數值陣列」的分別處理方式，是RGB-D資料常見的儲存慣例\n\n**為什麼需要儲存原始資料**：Week53開始要學Open3D點雲處理，需要用到完整的深度數值資料做運算，如果只存了上色後的深度圖片(像Week49學的colormap)，原始精確數值就遺失了，這週存下的`.npy`檔案，就是之後Open3D練習時可以重複使用的測試資料。", "is_project": false}, {"day": "週四", "content": "整體測試與效能檢查", "example": "確認長時間執行不會記憶體洩漏", "explanation": "**測試方式**：讓程式連續執行30分鐘以上，觀察：\n- 記憶體使用量是否隨時間持續增加(這通常代表某處資源沒有被正確釋放)\n- FPS是否隨時間逐漸下降\n- 長時間運行後，切換顯示模式的按鍵功能是否依然正常回應\n\n**常見記憶體洩漏原因**：如果每一幀都建立新的物件卻沒有釋放，或是儲存的frame清單無限增長沒有清理，都可能導致記憶體持續累積。這種問題往往在短時間測試時不會發現，是Week24、Week48都強調過的「長時間穩定性測試」在硬體驅動程式上的具體應用。", "is_project": false}, {"day": "週五【小專案】", "content": "即時RGB-D視覺化工具", "example": "完成可操作、可儲存資料的完整RGB-D工具", "explanation": "**為什麼這是Year3前半的重要里程碑**：\n1. 這是Week49~52整個RealSense基礎模組的總驗收，把封裝好的相機class、多模式顯示、資料儲存功能整合成一個真正好用的開發工具，而不只是零散的程式片段\n2. 這個工具之後會在Week53~60的Open3D點雲練習中被重複使用——每次需要新的測試資料，都能用這個工具即時擷取，不用每次重新設定RealSense\n3. 完成這週後，你已經具備完整的深度視覺資料擷取能力，下週開始正式進入Open3D，把這些深度資料轉換成更進階的3D點雲，做分割、辨識、姿態估測等更複雜的3D視覺任務", "is_project": true}], "full_code": "# 即時RGB-D視覺化工具\n# 說明：完成可操作、可儲存資料的完整RGB-D工具\nimport pyrealsense2 as rs\nimport numpy as np\nimport cv2\n\npipeline = rs.pipeline()\nconfig = rs.config()\nconfig.enable_stream(rs.stream.depth, 640, 480, rs.format.z16, 30)\nconfig.enable_stream(rs.stream.color, 640, 480, rs.format.bgr8, 30)\npipeline.start(config)\n\ntry:\n    while True:\n        frames = pipeline.wait_for_frames()\n        depth_frame = frames.get_depth_frame()\n        color_frame = frames.get_color_frame()\n        if not depth_frame or not color_frame:\n            continue\n\n        depth_image = np.asanyarray(depth_frame.get_data())\n        color_image = np.asanyarray(color_frame.get_data())\n        depth_colormap = cv2.applyColorMap(\n            cv2.convertScaleAbs(depth_image, alpha=0.03), cv2.COLORMAP_JET\n        )\n\n        combined = np.hstack((color_image, depth_colormap))\n        cv2.imshow(\"RGB-D\", combined)\n        if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n            break\nfinally:\n    pipeline.stop()\n"}, {"sheet": "Week53", "num": 53, "title": "Week 53：Open3D基礎：點雲讀取與顯示", "purpose": "承接『即時RGB-D整合小專案』累積的基礎，為接下來『點雲濾波與降噪』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能讀取/顯示點雲檔案與即時點雲", "days": [{"day": "週一", "content": "安裝Open3D與基本概念", "example": "pip install open3d", "explanation": "```bash\npip install open3d\n```\n```python\nimport open3d as o3d\nprint(o3d.__version__)\n```\n\n**核心概念**：點雲(Point Cloud)是用一堆帶有3D座標(x, y, z)的點，來表示空間中物體形狀的資料結構，你可以把它想成是Week50學到的「單一像素反投影成3D座標」這個動作，重複對整張深度畫面的每個像素都做一次，全部點組合起來就是一片點雲。\n\n**為什麼要用Open3D而不是自己寫**：點雲處理牽涉到大量的幾何運算(濾波、分割、配準等)，Open3D是專門為點雲/3D資料設計的函式庫，把這些複雜演算法都包裝成簡單的API呼叫，效能也經過優化，跟Week25用OpenCV處理2D影像是類似的思維——不重新發明輪子，站在成熟工具的基礎上開發。", "is_project": false}, {"day": "週二", "content": "讀取/顯示.ply點雲檔", "example": "pcd = o3d.io.read_point_cloud('file.ply')", "explanation": "```python\npcd = o3d.io.read_point_cloud(\"scene.ply\")\nprint(pcd)\nprint(f\"點的數量: {len(pcd.points)}\")\n\no3d.visualization.draw_geometries([pcd])\n```\n\n**逐行說明**：\n- `.ply`是點雲資料的常見標準檔案格式，`read_point_cloud()`能自動判斷格式讀取(也支援`.pcd`等其他格式)\n- `pcd.points` 是這片點雲所有座標點的集合，`len()`能知道總共有多少個點\n- `draw_geometries()` 開啟一個互動式3D檢視視窗，可以用滑鼠旋轉、縮放來自由觀察點雲的3D結構，這是點雲處理最基本也最重要的視覺化工具\n\n**互動操作技巧**：滑鼠左鍵拖曳旋轉視角、滾輪縮放、右鍵拖曳平移，這些操作在Open3D的視覺化視窗裡幾乎是通用標準，熟悉這些操作能讓你更有效率地檢查點雲品質。", "is_project": false}, {"day": "週三", "content": "從RealSense深度影像產生點雲", "example": "o3d.geometry.PointCloud.create_from_depth_image(...)", "explanation": "```python\nintrinsic = o3d.camera.PinholeCameraIntrinsic(\n    640, 480, intrinsics.fx, intrinsics.fy, intrinsics.ppx, intrinsics.ppy\n)\ndepth_o3d = o3d.geometry.Image(depth_image)\npcd = o3d.geometry.PointCloud.create_from_depth_image(depth_o3d, intrinsic)\n```\n\n**逐行說明**：\n- `PinholeCameraIntrinsic` 把Week50學到的相機內部參數(fx, fy, ppx, ppy)打包成Open3D認得的格式\n- `create_from_depth_image()` 內部自動對整張深度圖的每個像素執行Week50學過的deproject運算，一次產生出完整的3D點雲，不用自己寫迴圈逐點計算\n\n**為什麼這步驟印證了前面幾週的學習價值**：Week50手動學過單一像素的座標轉換公式，這裡Open3D把同樣的數學原理自動化、向量化處理整張圖，理解底層原理讓你知道這個「一鍵產生點雲」的功能背後到底在做什麼，而不是把它當成完全的黑盒子使用。", "is_project": false}, {"day": "週四", "content": "點雲視覺化互動操作", "example": "o3d.visualization.draw_geometries([pcd])", "explanation": "```python\no3d.visualization.draw_geometries(\n    [pcd],\n    zoom=0.5,\n    front=[0, 0, -1],\n    lookat=[0, 0, 0],\n    up=[0, -1, 0]\n)\n```\n\n**逐行說明**：\n- 可以額外指定初始視角參數(`zoom`縮放、`front`觀察方向、`lookat`看向的目標點、`up`上方向)，讓每次開啟視窗時都用固定的角度呈現，方便比較不同處理階段的點雲結果\n- 也可以同時傳入多個幾何物件的列表(例如`[pcd, coordinate_frame]`)，一起顯示在同一個視窗，方便比對\n\n**為什麼要固定視角參數**：如果每次開啟視窗視角都是隨機的，很難客觀比較「濾波前」跟「濾波後」的點雲差異，固定視角是做點雲處理效果比較時的重要習慣，這個概念跟Week26做影像處理pipeline時前後對比的邏輯是一致的。", "is_project": false}, {"day": "週五【小專案】", "content": "把RealSense畫面轉成點雲並顯示", "example": "即時把攝影機畫面轉換成點雲並開窗顯示", "explanation": "**為什麼要這樣寫**：\n1. 把Week52做好的RealSenseCamera工具，跟本週學到的點雲產生技巧結合，做出「即時擷取深度畫面→轉成點雲→視覺化顯示」的完整流程\n2. 這是Year3從「深度影像(2D，帶有距離資訊的圖片)」正式進化到「點雲(真正的3D資料結構)」的關鍵轉折點，之後Week54~60的濾波、分割、姿態估測，都是建立在點雲這個資料型態上進行\n3. 完成這週後，你已經能把手邊任何場景轉換成3D點雲並互動檢視，這是理解Year3~Year4所有3D視覺應用的共同基礎", "is_project": true}], "full_code": "# 把RealSense畫面轉成點雲並顯示\n# 說明：即時把攝影機畫面轉換成點雲並開窗顯示\nimport open3d as o3d\n\npcd = o3d.io.read_point_cloud(\"scene.ply\")\npcd = pcd.voxel_down_sample(voxel_size=0.01)\npcd, _ = pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=2.0)\n\nplane_model, inliers = pcd.segment_plane(\n    distance_threshold=0.01, ransac_n=3, num_iterations=1000\n)\nplane_cloud = pcd.select_by_index(inliers)\nobject_cloud = pcd.select_by_index(inliers, invert=True)\n\nplane_cloud.paint_uniform_color([1, 0, 0])\nobject_cloud.paint_uniform_color([0, 1, 0])\n\no3d.visualization.draw_geometries([plane_cloud, object_cloud])\n"}, {"sheet": "Week54", "num": 54, "title": "Week 54：點雲濾波與降噪", "purpose": "承接『Open3D基礎：點雲讀取與顯示』累積的基礎，為接下來『點雲分割(平面分割/RANSAC)』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "voxel降取樣、離群點移除", "days": [{"day": "週一", "content": "voxel降取樣原理", "example": "pcd.voxel_down_sample(voxel_size=0.01)", "explanation": "```python\ndownsampled = pcd.voxel_down_sample(voxel_size=0.01)\nprint(f\"原始點數: {len(pcd.points)}, 降取樣後: {len(downsampled.points)}\")\n```\n\n**逐行說明**：\n- Voxel(體素)可以想成是3D版的像素——把整個空間切成一格一格邊長`voxel_size`(這裡是0.01米=1公分)的立方格子\n- `voxel_down_sample()` 每個格子裡不管原本有多少個點，都只保留一個代表點(通常是格子內所有點的平均位置)，這樣能大幅減少點的數量，同時保留整體形狀輪廓\n\n**為什麼需要降取樣**：RealSense一次擷取的深度畫面可能有幾十萬個點，直接拿去做後續運算(分割、配準)會非常耗費計算資源且緩慢，降取樣是點雲處理pipeline幾乎必備的第一步，這個概念跟Week25學過的影像resize降解析度異曲同工，都是「用可接受的細節損失換取運算效率」的取捨。", "is_project": false}, {"day": "週二", "content": "統計離群點移除", "example": "pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=2.0)", "explanation": "```python\ncleaned, inlier_indices = pcd.remove_statistical_outlier(\n    nb_neighbors=20, std_ratio=2.0\n)\n```\n\n**逐行說明**：\n- 對每個點，計算它跟最近的`nb_neighbors`(這裡是20)個鄰居點的平均距離，如果這個距離明顯超出整體平均值的`std_ratio`(2倍標準差)，就判定為離群雜訊點並移除\n- 回傳兩個值：清理後的點雲，跟被保留下來的點在原始點雲中的索引位置\n\n**為什麼點雲會有離群雜訊**：RealSense在物體邊緣、反光表面、或超出有效測距範圍時，常常會產生一些孤立、明顯偏離主體形狀的錯誤點，這種統計式的濾波方法，是Week14學過「多次讀值取平均」濾波概念在3D點雲上更精密的延伸版本——都是用統計方法濾掉不合理的離群數值。", "is_project": false}, {"day": "週三", "content": "半徑離群點移除", "example": "pcd.remove_radius_outlier(nb_points=16, radius=0.05)", "explanation": "```python\ncleaned, inlier_indices = pcd.remove_radius_outlier(\n    nb_points=16, radius=0.05\n)\n```\n\n**逐行說明**：\n- 跟統計離群點移除概念類似，但判斷方式不同：以每個點為中心，畫一個半徑`radius`(0.05米=5公分)的球，如果球內的點數量少於`nb_points`(16個)，就視為孤立雜訊移除\n- 這種方法對「稀疏但集中的雜訊區域」處理效果通常比統計法更直接\n\n**兩種濾波方法如何選擇**：統計離群點移除考慮的是「整體分布的相對距離」，半徑離群點移除考慮的是「局部區域的點密度」，實務上常常兩種搭配使用，或依場景特性選擇更適合的一種，這種「同一個問題有多種工具可用、要依情境判斷」的思維，貫穿整個電腦視覺與點雲處理領域。", "is_project": false}, {"day": "週四", "content": "法向量估計(為後續分割做準備)", "example": "pcd.estimate_normals()", "explanation": "```python\npcd.estimate_normals(\n    search_param=o3d.geometry.KDTreeSearchParamHybrid(radius=0.1, max_nn=30)\n)\n```\n\n**逐行說明**：\n- 法向量(normal)是描述表面「朝向哪個方向」的向量，例如一張水平桌面的法向量會指向正上方\n- `estimate_normals()` 透過分析每個點周圍鄰近點的分布狀況，估算出這個點所在表面大概的朝向\n- `KDTreeSearchParamHybrid` 是搜尋鄰近點時使用的加速資料結構參數，`radius`跟`max_nn`控制搜尋範圍大小\n\n**為什麼要為「分割」做準備**：下週要學的平面分割(RANSAC)演算法，需要知道表面的法向量方向才能準確判斷「哪些點屬於同一個平面」——桌面上的點法向量都朝上，如果有一群點法向量方向差異很大，代表它們不屬於同一個平坦表面，這是法向量在3D幾何分析中的核心用途。", "is_project": false}, {"day": "週五【小專案】", "content": "清理雜訊點雲並比較前後點數", "example": "印出降噪前後的點數量與視覺化差異", "explanation": "**為什麼要這樣寫**：\n1. 把本週學到的降取樣、兩種離群點移除、法向量估計，串成一條完整的點雲前處理pipeline，這是點雲版本的Week26 OpenCV影像處理pipeline(模糊降噪→二值化→輪廓偵測)\n2. 印出前後點數量的量化比較，而不只是憑肉眼判斷「看起來比較乾淨」，養成用數字驗證處理效果的習慣\n3. 這條前處理pipeline會是接下來Week55~60所有點雲進階應用(分割、配準、姿態估測)的共同起手式——任何點雲處理任務，通常都是先降噪清理，才能得到穩定可靠的後續分析結果", "is_project": true}], "full_code": "# 清理雜訊點雲並比較前後點數\n# 說明：印出降噪前後的點數量與視覺化差異\nimport open3d as o3d\n\npcd = o3d.io.read_point_cloud(\"scene.ply\")\npcd = pcd.voxel_down_sample(voxel_size=0.01)\npcd, _ = pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=2.0)\n\nplane_model, inliers = pcd.segment_plane(\n    distance_threshold=0.01, ransac_n=3, num_iterations=1000\n)\nplane_cloud = pcd.select_by_index(inliers)\nobject_cloud = pcd.select_by_index(inliers, invert=True)\n\nplane_cloud.paint_uniform_color([1, 0, 0])\nobject_cloud.paint_uniform_color([0, 1, 0])\n\no3d.visualization.draw_geometries([plane_cloud, object_cloud])\n"}, {"sheet": "Week55", "num": 55, "title": "Week 55：點雲分割(平面分割/RANSAC)", "purpose": "承接『點雲濾波與降噪』累積的基礎，為接下來『物件分割小專案』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "從場景中分離出地板/桌面等平面", "days": [{"day": "週一", "content": "RANSAC平面分割原理", "example": "理解隨機抽樣一致性演算法概念", "explanation": "**演算法概念**：RANSAC(Random Sample Consensus，隨機抽樣一致性)是一種很巧妙的演算法，用來在充滿雜訊的資料中，找出符合某個數學模型(這裡是「平面」)的主要資料群。運作步驟大致是：\n1. 隨機抽取3個點(定義一個平面需要3點)\n2. 算出這3點組成的平面方程式\n3. 檢查所有其他點，有多少點「幾乎落在」這個平面上(在容許誤差內)\n4. 重複很多次隨機抽樣，最後選出「支持者最多」的那個平面當作結果\n\n**為什麼要用隨機抽樣而不是直接數學計算**：真實點雲資料充滿雜訊跟不屬於平面的點(例如桌上的物體)，如果直接用所有點做最小平方法擬合，會被雜訊嚴重干擾；RANSAC透過「多次隨機嘗試、投票選出最多人支持的答案」的方式，對雜訊跟異常值有很強的容忍度，這是它在點雲處理領域被廣泛使用的原因。", "is_project": false}, {"day": "週二", "content": "用Open3D進行平面分割", "example": "plane_model, inliers = pcd.segment_plane(0.01, 3, 1000)", "explanation": "```python\nplane_model, inliers = pcd.segment_plane(\n    distance_threshold=0.01, ransac_n=3, num_iterations=1000\n)\na, b, c, d = plane_model\nprint(f\"平面方程式: {a:.2f}x + {b:.2f}y + {c:.2f}z + {d:.2f} = 0\")\n```\n\n**逐行說明**：\n- `distance_threshold=0.01` 容許誤差範圍(1公分)，點到平面的距離在這範圍內都算「屬於這個平面」\n- `ransac_n=3` 每次隨機抽樣3個點(對應週一說明的最小平面定義點數)\n- `num_iterations=1000` 總共嘗試1000次隨機抽樣，次數越多找到正確平面的機率越高，但運算時間也越長\n- 回傳的`plane_model`是平面方程式的四個係數(a,b,c,d)，`inliers`是屬於這個平面的點的索引列表", "is_project": false}, {"day": "週三", "content": "分離平面內外點雲", "example": "inlier_cloud = pcd.select_by_index(inliers)", "explanation": "```python\nplane_cloud = pcd.select_by_index(inliers)\nobject_cloud = pcd.select_by_index(inliers, invert=True)\n\nplane_cloud.paint_uniform_color([1, 0, 0])   # 平面上色成紅色\nobject_cloud.paint_uniform_color([0, 1, 0])  # 其餘上色成綠色\n\no3d.visualization.draw_geometries([plane_cloud, object_cloud])\n```\n\n**逐行說明**：\n- `select_by_index(inliers)` 依照索引挑出屬於平面的點；加上`invert=True`則是挑出「不屬於」平面的所有其他點\n- `paint_uniform_color()` 給整片點雲統一上色，這是Week26畫輪廓框類似的視覺化除錯技巧——用顏色區分不同處理結果，方便肉眼驗證分割是否合理\n\n**為什麼要分離出「非平面」的點**：桌面(平面)通常不是你真正關心的目標，桌上的物體才是——把平面點雲濾除掉之後，剩下的`object_cloud`才是Week56要進一步分割出個別物件的關鍵資料，這也是為什麼這週分割平面是下週工作的必要前置步驟。", "is_project": false}, {"day": "週四", "content": "調整參數以適應不同場景", "example": "測試不同distance_threshold的分割效果", "explanation": "**調整經驗**：\n- `distance_threshold`太小：平面上稍有雜訊的點會被排除在inliers之外，導致平面分割不完整\n- `distance_threshold`太大：可能會把物體底部貼近桌面的部分也誤判成平面的一部分\n- `num_iterations`太少：可能因為運氣不好，1000次隨機抽樣都沒抽到真正代表主要平面的3個點，導致分割結果不理想\n\n**測試方法**：固定一份點雲測試資料，分別用不同的`distance_threshold`值(例如0.005、0.01、0.02)跑分割，比較inliers數量跟視覺化結果，找出最適合你實際場景(桌面平整度、RealSense雜訊程度)的參數值\n\n**為什麼要親自測試而非直接抄預設值**：不同場景的桌面材質、RealSense安裝角度、環境光線都會影響雜訊程度，網路上範例的預設參數不一定適合你的實際情境，這種「先用預設值起步，再依實際資料微調」的態度，是所有電腦視覺/點雲參數調整的共通心法。", "is_project": false}, {"day": "週五【小專案】", "content": "從點雲中分割出桌面平面", "example": "成功把桌面/地板從場景點雲中分離出來", "explanation": "**為什麼要這樣做**：\n1. 把本週學到的RANSAC平面分割技巧，實際套用在你自己拍攝的真實場景點雲上(例如桌面加幾個物件)，驗證演算法在真實雜訊資料下的表現，而不只是用乾淨的範例資料測試\n2. 這是Week56~60整個「物件分割、特徵提取、3D姿態估測」系列小專案的第一塊拼圖——沒有先把平面(通常是背景)濾除，很難準確找出真正的目標物件\n3. 完成這週後，你已經掌握點雲版本的「背景/前景分離」技術，這是3D視覺場景理解的基礎能力，跟Week26的2D輪廓偵測、Week55的3D平面分割，本質上都是「把感興趣的目標，從背景雜訊中分離出來」這個核心思路的不同維度應用", "is_project": true}], "full_code": "# 從點雲中分割出桌面平面\n# 說明：成功把桌面/地板從場景點雲中分離出來\nimport open3d as o3d\n\npcd = o3d.io.read_point_cloud(\"scene.ply\")\npcd = pcd.voxel_down_sample(voxel_size=0.01)\npcd, _ = pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=2.0)\n\nplane_model, inliers = pcd.segment_plane(\n    distance_threshold=0.01, ransac_n=3, num_iterations=1000\n)\nplane_cloud = pcd.select_by_index(inliers)\nobject_cloud = pcd.select_by_index(inliers, invert=True)\n\nplane_cloud.paint_uniform_color([1, 0, 0])\nobject_cloud.paint_uniform_color([0, 1, 0])\n\no3d.visualization.draw_geometries([plane_cloud, object_cloud])\n"}, {"sheet": "Week56", "num": 56, "title": "Week 56：物件分割小專案", "purpose": "承接『點雲分割(平面分割/RANSAC)』累積的基礎，為接下來『點雲配準 Registration(ICP)』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "在移除平面後找出物件群集", "days": [{"day": "週一", "content": "移除平面後的剩餘點雲群集", "example": "在分割出平面後保留outlier點雲", "explanation": "**承接上週**：Week55已經學會把平面(桌面)分離出去，這週要處理的是`object_cloud`(桌面以外的所有點)——這些點可能同時包含好幾個不同的物件，全部混在一起，還沒有被區分成「這是物件A」「這是物件B」。\n\n```python\n# 延續Week55的object_cloud\nprint(f\"待分割的物件點雲共有 {len(object_cloud.points)} 個點\")\n```\n\n**這週要解決的問題**：如何把這一整片包含多個物件的點雲，自動切分成各自獨立的群集(cluster)，每個群集代表一個物件，這是「分割」概念從「平面vs非平面」的二元分類，進化到「多個獨立物件」的多元分類。", "is_project": false}, {"day": "週二", "content": "DBSCAN群集分群", "example": "labels = pcd.cluster_dbscan(eps=0.02, min_points=10)", "explanation": "```python\nimport numpy as np\n\nlabels = np.array(\n    object_cloud.cluster_dbscan(eps=0.02, min_points=10)\n)\nmax_label = labels.max()\nprint(f\"共分出 {max_label + 1} 個群集\")\n```\n\n**逐行說明**：\n- DBSCAN是一種依「點的密度」自動分群的演算法：`eps`定義「多近算是鄰居」(2公分內)，`min_points`定義「至少要幾個鄰居才算是一個有效群集的核心」(10個點)\n- 演算法會自動把彼此靠近、密度足夠的點歸為同一群，並給每個群一個編號(label)，噪聲點(不屬於任何密集群的離群點)會被標記為-1\n- DBSCAN不需要事先指定要分成幾群(這是它跟K-means等演算法的重要差異)，很適合用在「不知道場景裡到底有幾個物件」的情境\n\n**為什麼DBSCAN適合物件分割**：真實場景裡物件數量常常是未知或動態變化的，DBSCAN能自動判斷「有幾群」而不用你事先指定，這種彈性對機器人視覺應用非常實用。", "is_project": false}, {"day": "週三", "content": "為不同群集上色視覺化", "example": "依label號碼給每個群集不同顏色", "explanation": "```python\nimport matplotlib.pyplot as plt\n\ncolors = plt.get_cmap(\"tab20\")(labels / (max_label + 1))\ncolors[labels < 0] = 0  # 噪聲點塗黑\nobject_cloud.colors = o3d.utility.Vector3dVector(colors[:, :3])\n\no3d.visualization.draw_geometries([object_cloud])\n```\n\n**逐行說明**：\n- 用Week12學過的matplotlib提供的色彩表(`tab20`)，依每個點的label編號自動分配不同顏色，讓不同群集在視覺化時能一眼區分\n- `labels < 0` 找出被標記為噪聲(-1)的點，統一塗成黑色，跟真正的物件群集區分開來\n\n**為什麼視覺化群集結果很重要**：DBSCAN的兩個參數(`eps`、`min_points`)如果設定不當，可能會把本來是同一個物件的點雲分成好幾群，或是把緊鄰的兩個不同物件誤判成同一群，用顏色視覺化能讓你快速判斷分群結果是否合理，比看數字報表直觀得多。", "is_project": false}, {"day": "週四", "content": "過濾過小雜訊群集", "example": "只保留點數超過門檻的群集視為有效物件", "explanation": "```python\nvalid_clusters = []\nfor cluster_id in range(max_label + 1):\n    cluster_points = np.where(labels == cluster_id)[0]\n    if len(cluster_points) > 50:  # 點數門檻，過濾雜訊小群集\n        valid_clusters.append(cluster_id)\n\nprint(f\"有效物件群集: {len(valid_clusters)} 個\")\n```\n\n**逐行說明**：\n- 即使DBSCAN已經是相對穩健的分群演算法，還是可能因為雜訊產生一些只有十幾個點的小群集，這通常不是真正的物件，而是殘留雜訊\n- 用點數門檻(這裡是50)過濾掉這些太小的群集，這是Week26學過「用面積過濾雜訊輪廓」概念，在3D點雲上的直接延伸\n\n**為什麼要設定門檻而不是全部保留**：如果不過濾，你的「物件清單」裡會混雜大量假物件(其實只是雜訊)，之後Week59要對每個群集計算bounding box、Week60要估計抓取姿態時，這些假物件會產生沒有意義的計算結果，提早過濾能讓後續流程更聚焦在真正有效的資料上。", "is_project": false}, {"day": "週五【小專案】", "content": "從場景點雲中分割出物件", "example": "成功把桌面上多個物件各自分離成獨立群集", "explanation": "**為什麼要這樣做**：\n1. 把Week55的平面分割，跟本週的DBSCAN群集分割串成一條完整pipeline：**原始點雲 → 濾波降噪(Week54) → 分離平面(Week55) → 群集分割(Week56)**，這是一條完整、可重複使用的3D場景理解流程\n2. 實際拿桌上放2~3個不同物件的真實場景測試，驗證這套pipeline能不能正確把每個物件都分割成獨立的群集，而不會誤判或漏判\n3. 完成這週後，你的系統已經能自動回答「這個場景裡有幾個物件、各自在哪裡」，這是Week59~60計算3D bounding box跟姿態估測的直接前置基礎，也是Year3~Year4視覺抓取任務中「先找出目標物件」這個關鍵步驟的具體實現", "is_project": true}], "full_code": "# 從場景點雲中分割出物件\n# 說明：成功把桌面上多個物件各自分離成獨立群集\nimport open3d as o3d\n\npcd = o3d.io.read_point_cloud(\"scene.ply\")\npcd = pcd.voxel_down_sample(voxel_size=0.01)\npcd, _ = pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=2.0)\n\nplane_model, inliers = pcd.segment_plane(\n    distance_threshold=0.01, ransac_n=3, num_iterations=1000\n)\nplane_cloud = pcd.select_by_index(inliers)\nobject_cloud = pcd.select_by_index(inliers, invert=True)\n\nplane_cloud.paint_uniform_color([1, 0, 0])\nobject_cloud.paint_uniform_color([0, 1, 0])\n\no3d.visualization.draw_geometries([plane_cloud, object_cloud])\n"}, {"sheet": "Week57", "num": 57, "title": "Week 57：點雲配準 Registration(ICP)", "purpose": "承接『物件分割小專案』累積的基礎，為接下來『點雲特徵提取與物件辨識基礎』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "理解如何對齊兩份點雲", "days": [{"day": "週一", "content": "點雲配準的應用場景", "example": "多角度掃描合併成完整3D模型的需求", "explanation": "**應用場景說明**：RealSense從單一角度拍攝，只能取得物體「朝向相機那一面」的點雲，背面完全是空白的。如果想得到一個物體完整的3D模型，需要從不同角度多拍幾次，再把這些各自獨立的點雲「拼接」成一份完整資料，這個拼接過程就叫「配準(Registration)」。\n\n**跟Week51的align有什麼不同**：Week51的align是同一個時刻、同一台相機的彩色跟深度資料對齊；這週的配準是不同時刻、可能不同視角拍攝的兩份獨立點雲，要透過運算找出它們之間正確的空間對應關係，才能疊合在一起，是完全不同層次的問題。\n\n**實務應用**：例如想幫AGV要抓取的物件建立完整3D模型、或想重建一個房間的完整地圖，都需要用到多角度點雲配準技術。", "is_project": false}, {"day": "週二", "content": "初始對齊(Global Registration)概念", "example": "了解為何ICP需要一個不錯的初始位置", "explanation": "**概念說明**：ICP(下面會學)是一種「局部優化」演算法，意思是它會從目前的位置開始，逐步微調找到更好的對齊結果，但如果一開始兩份點雲的相對位置差異太大(例如整整轉了180度)，ICP很容易卡在錯誤的局部最佳解，永遠對不準。\n\n**解決方式**：在跑ICP之前，先做一次「粗略」的初始對齊(Global Registration)，常見方法是比對兩份點雲的特徵點(下週Week58會學到特徵這個概念)，找出一個大致合理的起始位置，再交給ICP做精細微調。\n\n**用比喻理解**：這就像拼拼圖時，你會先粗略看形狀把幾片可能相關的拼圖湊在附近(粗對齊)，再仔細微調讓邊緣完全吻合(精細對齊)，如果一開始就隨便硬湊，很難拼出正確結果。", "is_project": false}, {"day": "週三", "content": "ICP演算法實作", "example": "o3d.pipelines.registration.registration_icp(...)", "explanation": "```python\nimport open3d as o3d\nimport numpy as np\n\nthreshold = 0.02\ntrans_init = np.identity(4)  # 假設初始對齊是單位矩陣(沒有偏移)\n\nresult_icp = o3d.pipelines.registration.registration_icp(\n    source_pcd, target_pcd, threshold, trans_init,\n    o3d.pipelines.registration.TransformationEstimationPointToPoint()\n)\n\nsource_pcd.transform(result_icp.transformation)\n```\n\n**逐行說明**：\n- `threshold` 是判斷兩個點是否算「對應」的距離門檻，跟Week55學過的`distance_threshold`概念類似\n- `trans_init` 是週二學到的「初始對齊」猜測，用4x4的變換矩陣表示(包含旋轉跟平移)，這裡先用單位矩陣(代表不做任何調整)當作最簡單的起始點\n- `registration_icp()` 執行實際的ICP演算法，回傳的`result_icp.transformation`就是算出來、能讓兩份點雲對齊的最佳變換矩陣\n- `source_pcd.transform(...)` 把算出的變換套用到來源點雲，讓它真正移動到跟目標點雲對齊的位置\n\n**4x4變換矩陣是什麼**：這是電腦圖學跟機器人學裡描述「旋轉+平移」的標準數學表示法，之後Year3~Year4處理座標系轉換時會經常遇到，現在只需要理解它代表「怎麼移動一組點雲」即可，不需要深入矩陣數學細節。", "is_project": false}, {"day": "週四", "content": "評估配準品質(fitness/RMSE)", "example": "檢視registration結果的評估指標", "explanation": "```python\nprint(f\"Fitness: {result_icp.fitness:.4f}\")\nprint(f\"RMSE: {result_icp.inlier_rmse:.4f}\")\n```\n\n**逐行說明**：\n- `fitness` 代表兩份點雲中，成功對應上的點所佔的比例，範圍0~1，越接近1代表對齊得越好\n- `inlier_rmse`(均方根誤差)代表成功對應的點之間，平均還存在多少誤差距離，數字越小代表對齊越精確\n\n**為什麼要看這兩個數字而不是只看視覺化結果**：肉眼判斷「看起來對齊了」有主觀誤差，尤其在複雜場景中細微的錯位不容易用眼睛發現，這兩個量化指標讓你能客觀比較不同參數設定、不同初始對齊方式的配準效果，這是Week28學過的「用數字量測而非憑感覺判斷」原則的延續。", "is_project": false}, {"day": "週五【小專案】", "content": "用ICP對齊兩次不同角度拍攝的點雲", "example": "成功把兩份點雲對齊合併成一份", "explanation": "**為什麼要這樣做**：\n1. 實際用RealSense從兩個不同角度拍攝同一個物體(例如正面跟側面各拍一次)，親手體驗「初始對齊沒做好，ICP很難收斂」的問題，這比單純讀理論更有感\n2. 用週四學到的fitness、RMSE指標，量化評估配準結果的好壞，並嘗試調整threshold參數觀察對結果的影響\n3. 完成這週後，你已經具備把多角度點雲資料合併成更完整3D資訊的能力，這個技巧在之後需要更完整物體模型的應用場景(例如精確計算物體體積、建立場景地圖)會派上用場", "is_project": true}], "full_code": "# 用ICP對齊兩次不同角度拍攝的點雲\n# 說明：成功把兩份點雲對齊合併成一份\nimport open3d as o3d\n\npcd = o3d.io.read_point_cloud(\"scene.ply\")\npcd = pcd.voxel_down_sample(voxel_size=0.01)\npcd, _ = pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=2.0)\n\nplane_model, inliers = pcd.segment_plane(\n    distance_threshold=0.01, ransac_n=3, num_iterations=1000\n)\nplane_cloud = pcd.select_by_index(inliers)\nobject_cloud = pcd.select_by_index(inliers, invert=True)\n\nplane_cloud.paint_uniform_color([1, 0, 0])\nobject_cloud.paint_uniform_color([0, 1, 0])\n\no3d.visualization.draw_geometries([plane_cloud, object_cloud])\n"}, {"sheet": "Week58", "num": 58, "title": "Week 58：點雲特徵提取與物件辨識基礎", "purpose": "承接『點雲配準 Registration(ICP)』累積的基礎，為接下來『3D Bounding Box估測』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "提取幾何特徵作為簡易辨識依據", "days": [{"day": "週一", "content": "常見幾何特徵(體積/尺寸/形狀比例)", "example": "從bounding box計算基本幾何特徵", "explanation": "```python\nbbox = cluster.get_axis_aligned_bounding_box()\nextent = bbox.get_extent()   # (長, 寬, 高)\nvolume = extent[0] * extent[1] * extent[2]\naspect_ratio = max(extent) / min(extent)\n\nprint(f\"尺寸: {extent}, 體積: {volume:.4f}, 長寬比: {aspect_ratio:.2f}\")\n```\n\n**逐行說明**：\n- `get_extent()` 回傳這個物件在x、y、z三個方向上的尺寸範圍，是Week59會更深入的bounding box(外接框)技巧的初步應用\n- 體積、長寬比這些簡單的幾何特徵，可以用來做最基礎的物件分類，例如「細長型物件」(長寬比很大)可能是螺絲或棒狀零件，「接近正方體」的可能是箱子\n\n**為什麼從最簡單的特徵開始**：在深度學習模型(像YOLOv8)之外，這種基於簡單幾何特徵的規則式判斷，運算成本極低、容易理解debug，在物件種類固定且形狀差異明顯的場景(例如工廠特定零件分類)依然很實用，不是每個問題都需要動用複雜的AI模型。", "is_project": false}, {"day": "週二", "content": "FPFH特徵描述子概念", "example": "了解點雲特徵匹配的進階方法(概念性)", "explanation": "**概念說明**：FPFH(Fast Point Feature Histogram)是一種更進階的點雲特徵描述方法，它不像週一的簡單幾何特徵只看整體尺寸，而是分析每個點「局部周圍的表面形狀」，把這個局部特徵編碼成一組數值(直方圖)。\n\n**為什麼需要這種特徵**：Week57學到的Global Registration(粗略初始對齊)，實務上常常就是透過比對兩份點雲裡FPFH特徵相似的點，來猜測可能的對應關係，這是比「隨機嘗試位置」更聰明的初始對齊方法。\n\n**為什麼這週先不深入實作**：FPFH牽涉到的數學相對複雜，這裡的目的是讓你知道「點雲配準除了ICP，還有更完整的特徵比對方法可以研究」，如果之後接的案子需要處理形狀複雜、初始位置差異很大的配準問題，可以再回頭深入學習這個主題，這是提前埋下概念種子的教學設計，跟Week28提到攝影機校正的邏輯一樣。", "is_project": false}, {"day": "週三", "content": "簡易規則式分類邏輯", "example": "依尺寸範圍判斷物件類型(例如螺絲/零件盒)", "explanation": "```python\ndef classify_by_shape(extent):\n    length, width, height = sorted(extent, reverse=True)\n    aspect_ratio = length / width if width > 0 else 0\n\n    if aspect_ratio > 3:\n        return \"細長型(可能是螺絲/棒材)\"\n    elif abs(length - width) < 0.02 and abs(width - height) < 0.02:\n        return \"接近正方體(可能是箱子)\"\n    else:\n        return \"不規則形狀\"\n```\n\n**逐行說明**：\n- `sorted(extent, reverse=True)` 把三個維度數值由大到小排序，這樣不管物件實際朝向如何(可能被隨意放置)，都能一致地判斷「最長邊」、「最短邊」\n- 用簡單的if/elif規則(Week3學過的條件判斷)，依長寬比、邊長是否接近相等，做出粗略分類\n\n**為什麼要用sorted而不是直接用x/y/z**：物件在桌上擺放的方向是隨機的，直接比較x軸尺寸沒有意義(同一個物件橫放跟直放，x軸尺寸會不同)，排序後比較「最長邊、最短邊」才能得到跟擺放方向無關、真正反映物件形狀的特徵，這是處理真實世界資料時常見的「找出方向無關特徵」的思路。", "is_project": false}, {"day": "週四", "content": "結合Week46的YOLO 2D辨識結果", "example": "討論2D辨識+3D定位的互補應用", "explanation": "**互補應用討論**：\n- **YOLOv8(2D)的優勢**：能辨識物件的「類別語意」(這是螺絲、這是箱子)，這是純幾何特徵很難做到的，畢竟形狀相似的物件可能是完全不同的東西\n- **點雲幾何特徵(3D)的優勢**：能提供精確的空間尺寸、體積、姿態資訊，這是2D影像做不到的\n\n**實務整合策略**：常見做法是先用YOLOv8在2D畫面辨識出「這是什麼物件、大概在畫面哪裡」，再用這個2D位置對應到點雲裡的3D區域，取出這個物件的點雲做進一步的精確定位、姿態估測，這是「用2D做語意分類，用3D做精確定位」的分工合作策略，比單獨用任何一種方法都更完整。\n\n**為什麼要在這週特別討論這個整合**：這正是下週Week59~60會實作的內容，先建立整合的概念架構，理解「為什麼要這樣分工」，再動手做會更清楚每一步驟的目的。", "is_project": false}, {"day": "週五【小專案】", "content": "依尺寸/形狀特徵分類簡單物件", "example": "對場景中2-3種不同物件做簡易分類", "explanation": "**為什麼要這樣做**：\n1. 把本週學到的bounding box尺寸計算、規則式分類邏輯，實際套用在Week56分割出來的獨立物件點雲上，做出一個能自動判斷「這堆點雲大概是什麼形狀類別」的小工具\n2. 用手邊2~3種形狀明顯不同的物件(例如一支筆、一個方形零件盒)實際測試，驗證分類邏輯的準確度，並觀察哪些情況容易誤判\n3. 這是Week59~60正式做3D Bounding Box估測跟姿態估測前的暖身練習，讓你先熟悉從點雲提取幾何特徵的基本操作，下週會在這個基礎上做更精確、更完整的框選與姿態計算", "is_project": true}], "full_code": "# 依尺寸/形狀特徵分類簡單物件\n# 說明：對場景中2-3種不同物件做簡易分類\nimport open3d as o3d\n\npcd = o3d.io.read_point_cloud(\"scene.ply\")\npcd = pcd.voxel_down_sample(voxel_size=0.01)\npcd, _ = pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=2.0)\n\nplane_model, inliers = pcd.segment_plane(\n    distance_threshold=0.01, ransac_n=3, num_iterations=1000\n)\nplane_cloud = pcd.select_by_index(inliers)\nobject_cloud = pcd.select_by_index(inliers, invert=True)\n\nplane_cloud.paint_uniform_color([1, 0, 0])\nobject_cloud.paint_uniform_color([0, 1, 0])\n\no3d.visualization.draw_geometries([plane_cloud, object_cloud])\n"}, {"sheet": "Week59", "num": 59, "title": "Week 59：3D Bounding Box估測", "purpose": "承接『點雲特徵提取與物件辨識基礎』累積的基礎，為接下來『物件3D姿態估測小專案』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "計算物件的3D外接框與中心點", "days": [{"day": "週一", "content": "AABB(軸對齊)外接框計算", "example": "pcd.get_axis_aligned_bounding_box()", "explanation": "```python\naabb = cluster.get_axis_aligned_bounding_box()\naabb.color = (1, 0, 0)   # 紅色顯示外接框\n\no3d.visualization.draw_geometries([cluster, aabb])\n```\n\n**逐行說明**：\n- AABB(Axis-Aligned Bounding Box，軸對齊外接框)是能包住整組點雲、且邊緣都平行於座標軸(x、y、z軸)的最小長方體\n- 計算方式很單純：分別找出點雲在x、y、z三個方向上的最大值跟最小值，這六個數字就定義出了這個框\n\n**AABB的限制**：因為邊緣強制平行座標軸，如果物件本身是斜放的，AABB算出來的框會比實際物件大很多(想像一支斜放的筆，AABB會是一個很大的方塊，而不是貼合筆的細長形狀)，這是為什麼週二要學另一種更精確的外接框方式。", "is_project": false}, {"day": "週二", "content": "OBB(方向性)外接框計算", "example": "pcd.get_oriented_bounding_box()", "explanation": "```python\nobb = cluster.get_oriented_bounding_box()\nobb.color = (0, 1, 0)   # 綠色顯示OBB\n\no3d.visualization.draw_geometries([cluster, obb])\n```\n\n**逐行說明**：\n- OBB(Oriented Bounding Box，方向性外接框)不強制邊緣平行座標軸，而是會依點雲本身的主要分布方向，算出一個「貼合度更好」的長方體，內部運算通常基於主成分分析(PCA)找出點雲分布的主軸方向\n- 對於斜放的物件，OBB會比AABB更精確地貼合物件實際形狀，也因此OBB的方向資訊本身就隱含了物件的姿態(朝向)線索\n\n**為什麼機械手臂抓取更適合用OBB**：如果要讓Week42學過的手臂抓取一個斜放的物件，用AABB算出的抓取點可能完全對不準物件實際位置，OBB提供的方向資訊能幫助規劃更合理的抓取角度，這是下週Week60要用到的關鍵資訊。", "is_project": false}, {"day": "週三", "content": "計算物件中心點與尺寸", "example": "從bounding box取得center、extent資訊", "explanation": "```python\ncenter = obb.get_center()\nextent = obb.extent\nrotation = obb.R   # 3x3旋轉矩陣，代表物件的朝向\n\nprint(f\"中心點: {center}\")\nprint(f\"尺寸: {extent}\")\n```\n\n**逐行說明**：\n- `get_center()` 直接取得外接框的中心點座標，這個點常常被當作「物件所在位置」的代表座標，用於Week42學過的手臂移動目標\n- `obb.R` 是一個3x3的旋轉矩陣，描述這個外接框(以及物件本身)相對於標準座標系的朝向角度，這是姿態估測需要的核心資訊\n\n**為什麼要同時記錄中心點跟旋轉矩陣**：單純知道「物件在哪裡」(中心點)還不夠讓手臂做出合理的抓取動作，還需要知道「物件是怎麼擺放的」(旋轉矩陣)，才能規劃出跟物件方向吻合的抓取角度，這兩項資訊合起來才是完整的「物件姿態(pose)」。", "is_project": false}, {"day": "週四", "content": "視覺化bounding box疊加點雲", "example": "在Open3D視窗同時顯示點雲與外接框", "explanation": "```python\nfor i, cluster in enumerate(valid_objects):\n    obb = cluster.get_oriented_bounding_box()\n    obb.color = (1, 0, 0)\n    o3d.visualization.draw_geometries([cluster, obb])\n    print(f\"物件{i}: 中心{obb.get_center()}, 尺寸{obb.extent}\")\n```\n\n**逐行說明**：\n- 對Week56分割出來的每個獨立物件，各自計算並顯示OBB，同時印出關鍵數值資訊，這是把本週所有技巧串起來的整合練習\n- 用迴圈逐一處理多個物件，是Week3學過的迴圈邏輯在3D點雲批次處理上的應用\n\n**為什麼要一個一個檢視而不是一次全部疊在同一個視窗**：分開檢視能讓你更仔細確認「每一個物件的OBB是否合理貼合」，一次全部疊加雖然能看到整體場景，但細節容易被忽略，開發階段通常會兩種檢視方式交替使用。", "is_project": false}, {"day": "週五【小專案】", "content": "輸出物件的3D座標與尺寸資訊", "example": "對分割出的物件計算並印出中心座標與長寬高", "explanation": "**為什麼要這樣做**：\n1. 把本週學到的AABB、OBB計算方式整合，對Week56分割出的每個物件，產出結構化的3D資訊報告(中心座標、尺寸、朝向)\n2. 這份結構化輸出格式，會是下週Week60物件姿態估測的直接基礎，也是之後Year4要把偵測結果傳給MoveIt2規劃手臂路徑時的標準資料格式\n3. 完成這週後，你已經能把「一堆3D座標點」轉換成「結構化的物件資訊(在哪裡、多大、怎麼擺放)」，這是點雲處理從「原始資料」進化到「有意義資訊」的關鍵一步", "is_project": true}], "full_code": "# 輸出物件的3D座標與尺寸資訊\n# 說明：對分割出的物件計算並印出中心座標與長寬高\nimport open3d as o3d\n\npcd = o3d.io.read_point_cloud(\"scene.ply\")\npcd = pcd.voxel_down_sample(voxel_size=0.01)\npcd, _ = pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=2.0)\n\nplane_model, inliers = pcd.segment_plane(\n    distance_threshold=0.01, ransac_n=3, num_iterations=1000\n)\nplane_cloud = pcd.select_by_index(inliers)\nobject_cloud = pcd.select_by_index(inliers, invert=True)\n\nplane_cloud.paint_uniform_color([1, 0, 0])\nobject_cloud.paint_uniform_color([0, 1, 0])\n\no3d.visualization.draw_geometries([plane_cloud, object_cloud])\n"}, {"sheet": "Week60", "num": 60, "title": "Week 60：物件3D姿態估測小專案", "purpose": "承接『3D Bounding Box估測』累積的基礎，為接下來『RealSense + ROS2整合』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "整合分割+特徵+bounding box", "days": [{"day": "週一", "content": "整合分割+特徵+bounding box流程", "example": "把Week55~59功能串成一條pipeline", "explanation": "```python\ndef process_scene(pcd):\n    # 1. 平面分割(Week55)\n    plane_model, inliers = pcd.segment_plane(0.01, 3, 1000)\n    object_cloud = pcd.select_by_index(inliers, invert=True)\n\n    # 2. 群集分割(Week56)\n    labels = np.array(object_cloud.cluster_dbscan(eps=0.02, min_points=10))\n\n    # 3. 逐一計算每個物件的OBB(Week59)\n    results = []\n    for label_id in range(labels.max() + 1):\n        indices = np.where(labels == label_id)[0]\n        if len(indices) < 50:\n            continue\n        cluster = object_cloud.select_by_index(indices)\n        obb = cluster.get_oriented_bounding_box()\n        results.append({\"center\": obb.get_center(), \"extent\": obb.extent, \"rotation\": obb.R})\n    return results\n```\n\n**逐行說明**：\n- 這個函式把Week55~59分散學習的每個步驟，整合成一條完整的處理鏈路，輸入原始場景點雲，輸出結構化的物件姿態列表\n- 這是Week4函式模組化精神的大型應用——把好幾週學到的技巧，包裝成一個「呼叫一次就能得到完整結果」的高階函式，之後使用時不需要重複展開所有細節步驟\n\n**為什麼要在這時候做這個整合**：這是Year3點雲模組(Week53~60)整整8週學習內容的匯流點，把分散的知識點串成一條可重複使用的pipeline，是學習歷程中很重要的「內化」步驟——不只是會個別技巧，更要理解怎麼把它們組合解決完整問題。", "is_project": false}, {"day": "週二", "content": "計算物件抓取姿態(位置+方向)", "example": "用OBB方向估計合理的抓取角度", "explanation": "```python\nimport numpy as np\n\ndef estimate_grasp_pose(obb):\n    center = obb.get_center()\n    rotation = obb.R\n\n    # 簡化策略：取物件最短邊的方向作為夾爪閉合方向\n    extent = obb.extent\n    shortest_axis = np.argmin(extent)\n    grasp_direction = rotation[:, shortest_axis]\n\n    return center, grasp_direction\n```\n\n**逐行說明**：\n- 一個簡化但實用的抓取策略：夾爪通常適合沿著物件「最短邊」的方向閉合(想像用手指夾一支筆，會沿著筆的直徑方向夾，而不是沿著長度方向)\n- `np.argmin(extent)` 找出三個維度中最短的那一軸，`rotation[:, shortest_axis]` 從旋轉矩陣中取出對應這個軸的方向向量\n\n**為什麼這只是「簡化」策略**：真實世界的抓取規劃要考慮的因素遠比這複雜(物件重心、夾爪開合範圍、周遭是否有其他物件阻擋)，這裡的簡化版本足以應付規則形狀的物件，是建立概念的起點，之後如果要處理更複雜的抓取場景，業界會用更精密的抓取姿態估測演算法或深度學習模型。", "is_project": false}, {"day": "週三", "content": "結果視覺化與座標輸出格式設計", "example": "設計統一的輸出格式(位置+方向+尺寸)", "explanation": "```python\nimport json\n\ndef export_results(results):\n    output = []\n    for i, r in enumerate(results):\n        output.append({\n            \"object_id\": i,\n            \"center\": r[\"center\"].tolist(),\n            \"extent\": r[\"extent\"].tolist(),\n            \"rotation\": r[\"rotation\"].tolist(),\n        })\n    with open(\"detected_objects.json\", \"w\") as f:\n        json.dump(output, f, indent=2)\n```\n\n**逐行說明**：\n- 用Week6學過的檔案寫入技巧，把物件姿態資訊輸出成JSON格式，`.tolist()`是因為NumPy陣列不能直接被json模組序列化，需要先轉換成一般Python列表\n- 設計統一的輸出格式，讓這份資料未來可以被其他程式(例如ROS2節點、MoveIt2規劃程式)方便地讀取使用，不用每次重新定義資料結構\n\n**為什麼要特別設計輸出格式而不隨意輸出**：這是軟體工程中「介面設計」的概念——這份姿態估測pipeline未來會被其他系統模組呼叫使用(下週Week61~62要接ROS2跟MoveIt2)，一個清楚、穩定的輸出格式，能讓不同模組之間的整合更順暢，減少之後修改資料格式造成的連鎖影響。", "is_project": false}, {"day": "週四", "content": "多物件情境測試", "example": "場景中有多個物件時逐一處理", "explanation": "**測試方式**：在桌上同時放置3~5個不同形狀、不同朝向(有些正放、有些斜放)的物件，執行完整pipeline，逐一檢查每個物件輸出的中心座標、尺寸、抓取方向是否合理。\n\n**觀察重點**：\n- 物件之間距離太近時，DBSCAN是否會誤判成同一個群集(可能需要調整Week56學過的`eps`參數)\n- 形狀不規則的物件，OBB估計出的抓取方向是否合理(對於明顯不對稱的物件，簡化策略可能表現不佳)\n\n**為什麼要用多物件情境而不是只測單一物件**：真實應用場景幾乎不會只有單一物件孤立存在，多物件情境下的邊界情況(物件靠太近、部分遮擋)才是實際部署時真正會遇到的挑戰，提早在這週用多物件測試，能及早發現pipeline的弱點。", "is_project": false}, {"day": "週五【小專案】", "content": "物件3D姿態估測", "example": "完整跑通一次從點雲到物件姿態輸出的流程", "explanation": "**為什麼這是Year3點雲模組的重要總驗收**：\n1. 這是Week53~60整整8週學習內容的完整整合：從RealSense取得點雲、清理雜訊、分割平面、群集物件、計算bounding box、估計抓取姿態、輸出結構化結果，一條完整的鏈路全部打通\n2. 產出的`detected_objects.json`格式化資料，是下週Week61~62要串接ROS2、MoveIt2的直接輸入，這週的成果不是終點，而是通往「視覺抓取系統」的必經橋樑\n3. 完成這週後，你已經具備從真實3D場景中，自動辨識並定位多個物件姿態的完整能力，這是機器人視覺領域相當核心、也很有實務價值的技術能力，之後接客戶案子時，這是很多自動化應用(分揀、抓取、品檢)的基礎需求", "is_project": true}], "full_code": "# 物件3D姿態估測\n# 說明：完整跑通一次從點雲到物件姿態輸出的流程\nimport open3d as o3d\n\npcd = o3d.io.read_point_cloud(\"scene.ply\")\npcd = pcd.voxel_down_sample(voxel_size=0.01)\npcd, _ = pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=2.0)\n\nplane_model, inliers = pcd.segment_plane(\n    distance_threshold=0.01, ransac_n=3, num_iterations=1000\n)\nplane_cloud = pcd.select_by_index(inliers)\nobject_cloud = pcd.select_by_index(inliers, invert=True)\n\nplane_cloud.paint_uniform_color([1, 0, 0])\nobject_cloud.paint_uniform_color([0, 1, 0])\n\no3d.visualization.draw_geometries([plane_cloud, object_cloud])\n"}, {"sheet": "Week61", "num": 61, "title": "Week 61：RealSense + ROS2整合", "purpose": "承接『物件3D姿態估測小專案』累積的基礎，為接下來『3D視覺與MoveIt2整合』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "用realsense-ros套件發布點雲topic", "days": [{"day": "週一", "content": "安裝realsense-ros套件", "example": "設定官方ROS2 wrapper節點", "explanation": "```bash\nsudo apt install ros-humble-realsense2-camera\nros2 launch realsense2_camera rs_launch.py\n```\n\n**逐行說明**：\n- `realsense2_camera` 是Intel官方維護的ROS2套件，把Week49~52自己寫的pipeline/config設定，包裝成標準的ROS2節點跟launch file，直接啟動就能把RealSense資料發布成topic\n- 這個launch file預設就會發布彩色影像、深度影像、以及對齊後的點雲等多種topic，不需要自己重新實作Week49~52學過的底層邏輯\n\n**為什麼前面要自己手刻pipeline，這裡卻直接用現成套件**：這是很重要的學習節奏——先自己動手理解底層原理(Week49~52)，之後使用官方封裝好的工具時，才能真正理解它在背後做了什麼、遇到問題時知道怎麼排查，而不是只會用黑盒子工具卻不懂原理。", "is_project": false}, {"day": "週二", "content": "啟動並檢視發布的topic", "example": "ros2 topic list 確認/camera/depth等topic", "explanation": "```bash\nros2 topic list\n# 常見會看到：\n# /camera/color/image_raw\n# /camera/depth/image_rect_raw\n# /camera/depth/color/points\n```\n\n**逐行說明**：\n- `image_raw` 是原始彩色影像topic，`depth/image_rect_raw`是校正過的深度影像\n- `/camera/depth/color/points` 是已經對齊、直接以`PointCloud2`格式發布的點雲topic，這代表Week51學過的對齊工作，官方套件已經幫你處理好並直接發布結果\n\n**為什麼topic名稱有階層結構(用斜線分隔)**：這是ROS2的命名慣例，用類似檔案路徑的方式組織相關topic，`/camera/`前綴讓你一眼看出這些topic都來自同一台相機，如果之後有多台相機，可以用Week33學過的namespace技巧區分(例如`/camera1/`、`/camera2/`)。", "is_project": false}, {"day": "週三", "content": "訂閱點雲topic並處理", "example": "self.create_subscription(PointCloud2, '/camera/points', ...)", "explanation": "```python\nfrom sensor_msgs.msg import PointCloud2\n\nself.create_subscription(\n    PointCloud2, \"/camera/depth/color/points\", self.pointcloud_callback, 10\n)\n\ndef pointcloud_callback(self, msg):\n    self.get_logger().info(f\"收到點雲，寬度:{msg.width} 高度:{msg.height}\")\n```\n\n**逐行說明**：\n- 這是Week30學過的標準Subscriber寫法，只是這次訂閱的是`PointCloud2`這種ROS2專門用來傳輸點雲資料的訊息型別\n- `msg.width`、`msg.height` 描述這份點雲的資料維度，實際的點座標資料被編碼在`msg.data`裡，格式較為底層複雜\n\n**為什麼點雲資料格式比較複雜**：`PointCloud2`為了支援各種不同的點雲屬性組合(只有座標、座標+顏色、座標+法向量等)，用了較為通用但底層的二進位編碼方式，這也是為什麼下一步需要額外的轉換函式，把這種通用格式轉換成Week53開始熟悉的Open3D格式。", "is_project": false}, {"day": "週四", "content": "sensor_msgs與Open3D格式轉換", "example": "把ROS2 PointCloud2轉成Open3D點雲物件", "explanation": "```python\nimport numpy as np\nimport open3d as o3d\nfrom sensor_msgs_py import point_cloud2\n\ndef ros_pointcloud_to_open3d(msg):\n    points = list(point_cloud2.read_points(msg, field_names=(\"x\", \"y\", \"z\"), skip_nans=True))\n    points_array = np.array(points)\n\n    pcd = o3d.geometry.PointCloud()\n    pcd.points = o3d.utility.Vector3dVector(points_array)\n    return pcd\n```\n\n**逐行說明**：\n- `sensor_msgs_py.point_cloud2` 是ROS2官方提供的輔助工具，能把複雜的`PointCloud2`二進位資料，解析成一般Python能理解的座標列表\n- `skip_nans=True` 跳過無效的點(對應Week50學過的RealSense在某些條件下量測失敗，回傳無效值的情況)\n- 轉換完成後，就能直接把Week54~60學到的所有Open3D處理技巧(降噪、分割、姿態估測)套用在這份即時從ROS2 topic拿到的點雲上\n\n**為什麼這個轉換函式很關鍵**：它是連接「ROS2生態系」跟「你已經熟練的Open3D工具箱」的橋樑，有了這個函式，Week57~60寫的整條pipeline，都能無縫套用在即時的ROS2資料流上，不需要重新實作任何點雲處理邏輯。", "is_project": false}, {"day": "週五【小專案】", "content": "在ROS2中訂閱並視覺化點雲資料", "example": "用RViz2或自訂節點顯示即時點雲", "explanation": "**為什麼要這樣做**：\n1. 把本週學到的realsense-ros套件、topic訂閱、格式轉換整合，確認即時的ROS2點雲資料流能被正確接收並轉換成Open3D能處理的格式\n2. 可以直接用RViz2內建的PointCloud2顯示功能驗證資料是否正確，也可以寫一個簡單節點呼叫Week60整合好的`process_scene()`函式，即時輸出物件姿態資訊\n3. 完成這週後，Week53~60辛苦建立的整套點雲處理pipeline，正式跟ROS2生態系接軌，下週Week62會進一步把這些偵測結果，跟Week39~42學過的MoveIt2手臂規劃連接起來，離「視覺抓取」的目標又更近一步", "is_project": true}], "full_code": "# 在ROS2中訂閱並視覺化點雲資料\n# 說明：用RViz2或自訂節點顯示即時點雲\nimport rclpy\nfrom rclpy.node import Node\nfrom sensor_msgs.msg import PointCloud2\n\nclass PointCloudSubscriber(Node):\n    def __init__(self):\n        super().__init__(\"pointcloud_subscriber\")\n        self.create_subscription(\n            PointCloud2, \"/camera/depth/color/points\", self.callback, 10\n        )\n\n    def callback(self, msg):\n        self.get_logger().info(f\"收到點雲，寬度:{msg.width} 高度:{msg.height}\")\n        # TODO: 轉換成Open3D格式後進行分割、姿態估測，再交給MoveIt2規劃\n\ndef main():\n    rclpy.init()\n    node = PointCloudSubscriber()\n    rclpy.spin(node)\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week62", "num": 62, "title": "Week 62：3D視覺與MoveIt2整合", "purpose": "承接『RealSense + ROS2整合』累積的基礎，為接下來『校正與多感測器對齊』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "用點雲資訊輔助機械手臂抓取規劃", "days": [{"day": "週一", "content": "規劃視覺定位到抓取的資料流", "example": "物件3D座標如何傳給MoveIt2作為目標", "explanation": "**資料流規劃**：\n```\nRealSense點雲 --> Week60姿態估測 --> 物件座標(相機座標系)\n  --> 座標轉換(轉到手臂座標系) --> MoveIt2規劃目標 --> Week42橋接 --> SG90手臂執行\n```\n\n**為什麼需要「座標轉換」這個中間步驟**：Week60算出來的物件座標，是相對於「相機鏡頭」的座標系；但Week39~42的MoveIt2規劃，是相對於「手臂底座」的座標系，這兩個座標系原點不同、可能連方向都不同，必須做正確的座標轉換，才能讓視覺系統偵測到的位置，正確對應到手臂該移動的目標，這正是下週Week63要學的「校正」主題存在的原因。\n\n**為什麼要先規劃資料流再動手寫程式**：這是Week47學過的「先盤點介面、再整合」原則的延續，複雜系統整合前先把資料怎麼流動想清楚，能大幅降低整合過程中的除錯難度。", "is_project": false}, {"day": "週二", "content": "座標系轉換(camera frame到base frame)", "example": "tf2的基本概念與座標轉換", "explanation": "**概念說明**：`tf2`是ROS2專門管理「座標系之間關係」的系統，你可以把相機、手臂底座、每個手臂關節都定義成一個獨立的座標系(frame)，並告訴tf2它們之間的相對位置關係，之後tf2就能自動幫你計算「某個座標系裡的一個點，換算到另一個座標系會是什麼座標」。\n\n```python\nfrom tf2_ros import Buffer, TransformListener\n\ntf_buffer = Buffer()\nlistener = TransformListener(tf_buffer, self)\n\ntransform = tf_buffer.lookup_transform(\n    \"base_link\", \"camera_link\", rclpy.time.Time()\n)\n```\n\n**逐行說明**：\n- `lookup_transform(\"base_link\", \"camera_link\", ...)` 查詢從camera_link座標系轉換到base_link座標系需要的變換，這個變換關係需要你事先設定好(下週Week63會學到如何校正這個關係)\n- 一旦有了這個transform，就能用Week57學過的變換矩陣概念，把相機座標系下的物件座標，轉換成手臂底座座標系下的座標\n\n**為什麼要用tf2而不是自己手動計算**：手臂關節一多，座標系之間的關係會變得複雜(手臂本身在移動，相機可能裝在手臂上或固定在旁邊)，tf2提供一套標準化、經過驗證的機制管理這些關係，比自己維護一堆手動計算的座標轉換公式可靠得多。", "is_project": false}, {"day": "週三", "content": "把偵測到的物件加入planning scene", "example": "scene.add_box(name, pose, size)", "explanation": "```python\nfor i, obj in enumerate(detected_objects):\n    pose = build_pose_stamped(obj[\"center_in_base_frame\"])\n    scene.add_box(f\"detected_object_{i}\", pose, size=obj[\"extent\"])\n```\n\n**逐行說明**：\n- 這是Week41學過的`add_box()`技巧，差別在於這次的座標不是手動輸入的固定值，而是本週學到的座標轉換後、真實視覺偵測出來的物件位置\n- 用迴圈把Week60偵測到的所有物件都加入場景，讓MoveIt2規劃路徑時，能自動避開這些真實存在的物體(除了目標抓取物之外的其他物件)\n\n**為什麼這是整個Year3的關鍵整合時刻**：Week41學這個功能時，障礙物座標是你手動輸入的假資料；這裡終於用上真實視覺系統偵測到的座標，這是「模擬/假資料驗證架構」正式進化成「真實資料驅動系統」的關鍵一步，也是整個四年計畫反覆出現的教學模式——先用簡化/模擬資料驗證架構可行，再接上真實資料來源。", "is_project": false}, {"day": "週四", "content": "依視覺結果動態設定抓取目標", "example": "move_group.set_pose_target(detected_pose)", "explanation": "```python\ntarget_object = detected_objects[0]  # 假設抓取第一個偵測到的物件\ntarget_pose = build_pose_stamped(target_object[\"center_in_base_frame\"])\n\nmove_group.set_pose_target(target_pose)\nsuccess = move_group.go(wait=True)\n```\n\n**逐行說明**：\n- 跟Week40學過的`set_pose_target()`語法完全相同，唯一差別是目標座標來源從「程式裡手動指定的固定數字」，換成「即時視覺偵測算出來的座標」\n- 這正驗證了Week40強調的「程式化規劃」的價值——因為程式碼的呼叫方式完全一樣，不管座標從哪裡來，只要格式正確，MoveIt2都能正常規劃執行\n\n**為什麼要選擇「第一個」物件而不是更複雜的選擇邏輯**：這週的重點是先驗證「視覺→規劃→執行」整條鏈路能正常運作，選擇邏輯先用最簡單的方式(例如永遠選第一個或離手臂最近的)，之後如果需要更複雜的任務邏輯(例如依優先順序抓取)，可以在這個基礎上擴充，不需要重新設計整條鏈路。", "is_project": false}, {"day": "週五【小專案】", "content": "依偵測到的物件座標規劃抓取路徑", "example": "手臂能依視覺定位結果自動規劃抓取動作", "explanation": "**為什麼這是四年計畫裡意義重大的里程碑**：\n1. 這是整個計畫第一次真正實現「機器人自己看、自己想、自己動」的完整閉環——不需要人工輸入座標，AGV/手臂自己用RealSense看到物件、算出3D位置、規劃路徑、驅動SG90完成動作\n2. 整合了Week39~42的MoveIt2手臂控制、Week49~60的3D視覺處理、本週的tf2座標轉換，是四年計畫技術含量最高的整合成果之一\n3. 完成這週後，下週Week63會處理讓這套系統在真實世界更精確可靠的校正工作，Week64就是Year3的正式總驗收展示", "is_project": true}], "full_code": "# 依偵測到的物件座標規劃抓取路徑\n# 說明：手臂能依視覺定位結果自動規劃抓取動作\nimport rclpy\nfrom rclpy.node import Node\nfrom sensor_msgs.msg import PointCloud2\n\nclass PointCloudSubscriber(Node):\n    def __init__(self):\n        super().__init__(\"pointcloud_subscriber\")\n        self.create_subscription(\n            PointCloud2, \"/camera/depth/color/points\", self.callback, 10\n        )\n\n    def callback(self, msg):\n        self.get_logger().info(f\"收到點雲，寬度:{msg.width} 高度:{msg.height}\")\n        # TODO: 轉換成Open3D格式後進行分割、姿態估測，再交給MoveIt2規劃\n\ndef main():\n    rclpy.init()\n    node = PointCloudSubscriber()\n    rclpy.spin(node)\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week63", "num": 63, "title": "Week 63：校正與多感測器對齊", "purpose": "承接『3D視覺與MoveIt2整合』累積的基礎，為接下來『M4里程碑：3D視覺抓取系統展示週』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "相機外部校正(extrinsics)概念與實作", "days": [{"day": "週一", "content": "相機外部校正(extrinsics)概念", "example": "理解相機座標系與機械手臂基座座標系的關係", "explanation": "**概念說明**：Week50學過的intrinsics是描述「相機鏡頭本身的光學特性」；這週的extrinsics(外部參數)描述的是「相機安裝在哪裡、朝向哪個方向」，也就是相機座標系相對於手臂底座座標系的位置跟旋轉關係，正是Week62的`tf2`需要用到的核心資訊。\n\n**為什麼需要精確校正**：如果extrinsics設定不準確(例如相機實際位置跟程式裡設定的差了幾公分)，Week62算出來的「物件在手臂座標系下的位置」就會系統性地偏移，可能導致手臂伸手去抓的位置，跟物件實際位置對不上，這是視覺抓取系統精準度的關鍵瓶頸來源之一。", "is_project": false}, {"day": "週二", "content": "手眼校正(hand-eye calibration)簡介", "example": "eye-to-hand vs eye-in-hand的差異", "explanation": "**兩種安裝方式**：\n- **eye-to-hand(眼在手外)**：相機固定裝在場景中某個固定位置，不會隨手臂移動，適合你目前的AGV+固定式手臂配置\n- **eye-in-hand(眼在手上)**：相機直接裝在手臂末端隨著手臂一起移動，這種配置在近距離精密操作時能提供更好的視角，但校正跟座標轉換會更複雜(因為相機位置一直在變)\n\n**手眼校正是什麼**：這是專門用來精確計算相機座標系跟手臂座標系之間關係的標準化流程，通常會用一個已知圖案(例如ArUco marker或棋盤格)，讓手臂移動到多個不同位置，同時記錄相機看到的圖案位置跟手臂當下的姿態，透過數學方法反推出兩者精確的相對關係。\n\n**為什麼要了解這兩種配置的差異**：這會直接影響之後接案時，你要幫客戶設計系統架構時的選型判斷——固定場域的分揀應用用eye-to-hand較簡單，需要近距離精密操作的應用可能適合eye-in-hand，這是實務上很重要的系統設計決策。", "is_project": false}, {"day": "週三", "content": "用已知標記物進行校正實驗", "example": "透過ArUco marker量測轉換矩陣", "explanation": "```python\nimport cv2\nimport numpy as np\n\naruco_dict = cv2.aruco.getPredefinedDictionary(cv2.aruco.DICT_4X4_50)\nparameters = cv2.aruco.DetectorParameters()\ndetector = cv2.aruco.ArucoDetector(aruco_dict, parameters)\n\ncorners, ids, _ = detector.detectMarkers(color_image)\nif ids is not None:\n    print(f\"偵測到標記: {ids}\")\n```\n\n**逐行說明**：\n- ArUco marker是一種容易被電腦視覺演算法精確辨識、且能提供明確方向資訊的黑白棋盤圖案，常用於機器人校正場景\n- `detectMarkers()` 在畫面中偵測所有ArUco標記，回傳每個標記的四個角點座標跟編號\n\n**實驗流程**：把ArUco marker固定貼在已知的位置(例如手臂底座正前方某個精確測量過的座標)，用RealSense拍攝，比對「相機看到的標記位置」跟「已知的實際位置」，就能反推出相機的extrinsics，這是週一、週二學到概念的具體實踐方式。", "is_project": false}, {"day": "週四", "content": "驗證校正後的定位準確度", "example": "比較校正前後的定位誤差", "explanation": "**驗證方式**：把一個物體放在已知的精確位置(用尺量測)，跑完整的視覺定位pipeline(Week49~62)，比較程式算出來的座標，跟實際量測的座標之間差多少誤差。\n\n**測試建議**：在不同距離(近、中、遠)、不同位置(畫面中央、邊緣)都做測試，因為Week50學過RealSense的誤差會隨距離增加，你可能會發現近距離校正得很準，但遠距離誤差明顯變大，這種「有系統性了解誤差分布」的態度，能幫助你在之後跟客戶溝通系統能力時，給出誠實、有根據的精度說明，而不是憑感覺宣稱「很準」。\n\n**為什麼校正驗證要專門排一天**：這是機器人系統從「demo能動」進化到「工程等級可信賴」的關鍵差異，業界正式的機器人系統交付前，都會有這種系統性的精度驗證流程，這是專業度的展現。", "is_project": false}, {"day": "週五【小專案】", "content": "校正相機座標與機械手臂座標系", "example": "產出可用的座標轉換矩陣並驗證準確度", "explanation": "**為什麼要這樣做**：\n1. 把本週學到的extrinsics概念、ArUco標記校正方法、精度驗證流程整合，產出一份真正可靠、有數據支持的座標轉換關係，取代Week62暫時使用的估計值\n2. 這是讓整個視覺抓取系統從「概念上能動」提升到「精度可被信賴」的關鍵一步，之後Week64的正式展示會更有底氣\n3. 完成這週後，你的系統已經具備完整、經過驗證的視覺定位精度，下週就是把整個Year3的所有學習成果，正式整合成一個完整demo對外展示", "is_project": true}], "full_code": "# 校正相機座標與機械手臂座標系\n# 說明：產出可用的座標轉換矩陣並驗證準確度\nimport rclpy\nfrom rclpy.node import Node\nfrom sensor_msgs.msg import PointCloud2\n\nclass PointCloudSubscriber(Node):\n    def __init__(self):\n        super().__init__(\"pointcloud_subscriber\")\n        self.create_subscription(\n            PointCloud2, \"/camera/depth/color/points\", self.callback, 10\n        )\n\n    def callback(self, msg):\n        self.get_logger().info(f\"收到點雲，寬度:{msg.width} 高度:{msg.height}\")\n        # TODO: 轉換成Open3D格式後進行分割、姿態估測，再交給MoveIt2規劃\n\ndef main():\n    rclpy.init()\n    node = PointCloudSubscriber()\n    rclpy.spin(node)\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week64", "num": 64, "title": "Week 64：M4里程碑：3D視覺抓取系統展示週", "purpose": "承接『校正與多感測器對齊』累積的基礎，為接下來『Modbus TCP基礎與Master/Slave概念』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "完成視覺辨識+3D定位+抓取規劃整合", "days": [{"day": "週一", "content": "系統最終測試與穩定性確認", "example": "多次重複測試視覺定位+抓取流程", "explanation": "**測試重點**：這是目前為止整合度最高的系統，涵蓋RealSense點雲處理、ROS2多節點架構、MoveIt2規劃、tf2座標轉換、SG90實體驅動，重複測試時特別注意：\n- 不同物件擺放位置、角度時，視覺定位的準確度是否穩定在Week63驗證過的誤差範圍內\n- 整條「感知→規劃→執行」鏈路從頭到尾跑一次需要多久時間，是否在可接受範圍\n- 長時間重複抓取測試，SG90會不會因為持續運作而過熱或角度累積誤差\n\n**為什麼這次測試複雜度又提升了一個層次**：這是Week24(純避障)、Week48(視覺辨識決策)之後，第三個層次的系統整合，複雜度持續提升，這種漸進式的複雜度增加，正是四年計畫刻意的教學節奏設計。", "is_project": false}, {"day": "週二", "content": "修正整合過程中發現的問題", "example": "針對定位誤差或抓取失敗案例逐一排查", "explanation": "**排查方法**：善用整個Year3累積的除錯工具箱——`rqt_graph`看節點關係、Week63的校正驗證方法排查定位誤差、Week22學過的AI輔助除錯技巧處理程式邏輯問題。\n\n**常見問題類型**：\n- 定位誤差過大：回頭檢查Week63的校正是否需要重新執行(尤其相機或手臂位置有沒有被意外移動過)\n- 抓取失敗：可能是Week60的抓取姿態估計策略對某些物件形狀不適用，或Week42的角度轉換橋接需要微調\n- 系統回應延遲：用Week45學過的分段效能量測方式，找出點雲處理、YOLOv8推論等環節中最耗時的部分", "is_project": false}, {"day": "週三", "content": "準備展示腳本與說明文件", "example": "整理架構圖與3分鐘demo流程", "explanation": "**展示重點**：這次的架構圖應該呈現完整的資料流：RealSense → 點雲處理 → 物件姿態估測 → tf2座標轉換 → MoveIt2規劃 → SG90實體執行，這是四年計畫至今最完整的技術架構圖，能充分展現你四個月(Year3為期16週)累積的整合能力。\n\n**文件準備建議**：除了架構圖，也整理一份簡短的「精度說明」，附上Week63驗證得到的實際誤差數據，這種基於實測數據的誠實說明，比空泛宣稱「系統很精準」更有專業說服力，之後對客戶提案時，這種務實的態度往往更容易建立信任。", "is_project": false}, {"day": "週四", "content": "彩排完整展示流程", "example": "模擬正式展示情境完整跑一次", "explanation": "**做什麼**：完整走一次展示腳本，這次系統啟動涉及更多節點(相機驅動、點雲處理、決策、MoveIt2)，啟動順序可能有相依性(例如相機節點要先啟動，視覺處理節點才能拿到資料)，務必確認用Week33學過的launch file能正確、依序地一次啟動整套系統。\n\n**備用方案準備**：這次系統複雜度高，出狀況的環節也更多，建議準備2~3個不同的物件擺放情境，如果某個情境剛好定位失準，可以從容切換到另一個情境展示，而不是讓單一次失敗影響整場展示的流暢度。", "is_project": false}, {"day": "週五【M4交付】", "content": "展示AGV/手臂依3D視覺定位並抓取目標物", "example": "完成Year3最終整合展示，作品集重要里程碑", "explanation": "**為什麼這是Year3、也是整個四年計畫至今最重要的里程碑**：\n1. 這套系統具備完整的自主視覺抓取能力——不需要人工告知物件位置，機器人自己用RealSense看、自己用點雲演算法分析、自己規劃手臂路徑、自己完成抓取，這是機器人工程領域相當有代表性的核心能力展示\n2. 從Week1的Python環境安裝，到這裡整整64週的技術累積(Python基礎→Linux/Git→ESP32硬體→ROS2→Gazebo→MoveIt2→OpenCV→YOLOv8→RealSense→Open3D)，全部匯流整合成這一套系統，這是紮實累積、而非速成的具體證明\n3. 完成M4里程碑後，你已經具備台灣製造業AGV系統整合案子最核心的技術能力，下週開始進入Year4的工業通訊協定，會讓這套系統具備跟真實工廠設備(PLC、SCADA)溝通的能力，是邁向接案/創業目標的最後一塊拼圖", "is_project": true}], "full_code": "# 展示AGV/手臂依3D視覺定位並抓取目標物\n# 說明：完成Year3最終整合展示，作品集重要里程碑\nimport rclpy\nfrom rclpy.node import Node\nfrom sensor_msgs.msg import PointCloud2\n\nclass PointCloudSubscriber(Node):\n    def __init__(self):\n        super().__init__(\"pointcloud_subscriber\")\n        self.create_subscription(\n            PointCloud2, \"/camera/depth/color/points\", self.callback, 10\n        )\n\n    def callback(self, msg):\n        self.get_logger().info(f\"收到點雲，寬度:{msg.width} 高度:{msg.height}\")\n        # TODO: 轉換成Open3D格式後進行分割、姿態估測，再交給MoveIt2規劃\n\ndef main():\n    rclpy.init()\n    node = PointCloudSubscriber()\n    rclpy.spin(node)\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week65", "num": 65, "title": "Week 65：Modbus TCP基礎與Master/Slave概念", "purpose": "承接『M4里程碑：3D視覺抓取系統展示週』累積的基礎，為接下來『Modbus TCP實作(pymodbus)』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "理解暫存器類型與通訊架構", "days": [{"day": "週一", "content": "Modbus協定歷史與應用場景", "example": "了解為何工廠設備至今仍廣泛使用Modbus", "explanation": "**背景說明**：Modbus是1979年由Modicon公司(現在的施耐德電機)發明的通訊協定，設計初衷是給PLC(可程式邏輯控制器)之間簡單、可靠地交換資料使用。雖然已經是超過40年歷史的老協定，但至今仍是工業自動化領域最廣泛使用的通訊協定之一。\n\n**為什麼這麼老的協定還在用**：工業設備的汰換週期非常長(一台PLC可能運作十幾二十年)，而且Modbus協定本身簡單、開放(不用付權利金)、幾乎所有PLC/感測器廠牌都支援，這種「簡單但普及」的特性，讓它在講究穩定性遠勝過新穎技術的工業領域屹立不搖。\n\n**對你接案的意義**：Year4開始學的這幾種協定，都是你之後要幫工廠做AGV系統整合時，實際會遇到、需要跟既有設備溝通的真實技術，不是純學術上的知識。", "is_project": false}, {"day": "週二", "content": "Master/Slave通訊架構", "example": "理解誰主動發出請求、誰被動回應", "explanation": "**概念說明**：Modbus採用主從式架構——Master(主站)主動發出請求，Slave(從站)被動回應，Slave永遠不會主動傳資料給Master，必須等Master來問。\n\n**跟你之前學過的架構比較**：\n- 這跟Week31學過的ROS2 Service模式很像(Client請求、Server回應)，但Modbus是更早期、更陽春的版本，沒有Service那麼豐富的功能\n- 這也跟Week19的Flask架構類似——瀏覽器(相當於Master)發出請求，Flask伺服器(相當於Slave)才會回應，被動接受請求的一方永遠不會主動推播\n\n**為什麼要設計成主從式而不是雙向對等**：這種簡單的單向詢問架構，讓Slave端(通常是資源有限的感測器或簡易控制器)的實作變得非常簡單，不需要處理複雜的並發或主動通知邏輯，這是早期工業通訊協定為了降低設備成本的常見設計取捨。", "is_project": false}, {"day": "週三", "content": "暫存器類型(Coil/Discrete/Holding/Input)", "example": "區分讀寫布林值與數值暫存器的差異", "explanation": "**四種暫存器類型**：\n| 類型 | 資料型別 | 讀寫 | 常見用途 |\n|---|---|---|---|\n| Coil | 布林值 | 可讀可寫 | 控制開關(例如馬達啟停) |\n| Discrete Input | 布林值 | 唯讀 | 感測器狀態(例如門是否開啟) |\n| Holding Register | 16位元整數 | 可讀可寫 | 設定值(例如目標速度) |\n| Input Register | 16位元整數 | 唯讀 | 量測數值(例如目前溫度) |\n\n**為什麼要分這麼多種**：這種分類反映了工業現場資料的兩個維度——「布林值 vs 數值」、「可控制 vs 只能讀取」，選對暫存器類型能讓資料的用途一目了然，例如看到程式在讀Input Register，就知道這是「唯讀的量測值」，不會誤以為可以寫入控制。\n\n**實務上最常用的是哪種**：Holding Register因為可讀可寫、能存放數值，是實務上使用頻率最高的類型，接下來Week66~68的範例也會以它為主。", "is_project": false}, {"day": "週四", "content": "安裝Modbus模擬器", "example": "用ModbusPal或diagslave建立虛擬裝置", "explanation": "**做什麼**：安裝一套Modbus模擬器軟體(例如diagslave、ModbusPal)，在自己電腦上模擬出一台虛擬的Modbus裝置，設定裡面有幾個暫存器跟對應的數值。\n\n**為什麼要用模擬器而不是直接找真實PLC**：真實PLC設備昂貴且不容易取得，用模擬器能讓你在完全不花錢添購硬體的情況下，練習Modbus的讀寫操作，這是Week35學過的Gazebo模擬器精神在工業通訊領域的延伸——先在模擬環境驗證邏輯，之後有機會接觸真實PLC時能快速上手。\n\n**為什麼這是必要的入門步驟**：如果沒有一台可以連線測試的裝置(不管虛擬或真實)，接下來學的pymodbus程式碼完全無法驗證是否正確，這週先把「有東西可以連」的環境建立起來。", "is_project": false}, {"day": "週五【小專案】", "content": "用模擬器建立一台虛擬Modbus裝置", "example": "設定幾個暫存器並確認能被外部工具連線讀取", "explanation": "**為什麼要這樣做**：\n1. 走過一次完整的「架設Modbus裝置→設定暫存器→用外部工具驗證連線」流程，這是接下來整個Modbus模組(Week65~68)的基礎環境\n2. 用官方或第三方工具(而不是自己寫的程式)先驗證連線正常，能排除「到底是我的程式有問題、還是環境設定有問題」的疑慮，這是循序漸進除錯的好習慣\n3. 完成這週後，你已經有一個可以持續拿來練習的虛擬Modbus環境，下週開始要用Python的pymodbus套件，寫程式跟這台虛擬裝置對話", "is_project": true}], "full_code": "# 用模擬器建立一台虛擬Modbus裝置\n# 說明：設定幾個暫存器並確認能被外部工具連線讀取\nfrom pymodbus.client import ModbusTcpClient\n\nclient = ModbusTcpClient(\"127.0.0.1\", port=502)\nclient.connect()\n\n# 寫入電池電量到暫存器0\nclient.write_register(0, 80)\n\n# 讀取暫存器0~1 (電池電量、速度)\nresult = client.read_holding_registers(0, 2)\nprint(\"電池電量:\", result.registers[0])\nprint(\"目前速度:\", result.registers[1])\n\nclient.close()\n"}, {"sheet": "Week66", "num": 66, "title": "Week 66：Modbus TCP實作(pymodbus)", "purpose": "承接『Modbus TCP基礎與Master/Slave概念』累積的基礎，為接下來『Modbus整合感測器/PLC模擬』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能寫Python程式讀寫Modbus暫存器", "days": [{"day": "週一", "content": "安裝pymodbus套件", "example": "pip install pymodbus", "explanation": "```bash\npip install pymodbus\n```\n\n**做什麼**：`pymodbus`是Python最常用的Modbus通訊套件，同時支援當Master(Client)去讀寫其他裝置、以及當Slave(Server)讓別人來讀寫自己，這週先學Client端的用法。\n\n**為什麼選pymodbus而不是自己刻通訊協定**：Modbus協定本身雖然簡單，但封包格式、CRC校驗、逾時重試等細節如果自己從零實作容易出錯，pymodbus把這些底層細節都封裝好了，這是Week43學YOLOv8時就強調過的「善用成熟工具、專注應用邏輯」原則的延續。", "is_project": false}, {"day": "週二", "content": "建立Modbus Client連線", "example": "client = ModbusTcpClient('127.0.0.1', port=502)", "explanation": "```python\nfrom pymodbus.client import ModbusTcpClient\n\nclient = ModbusTcpClient(\"127.0.0.1\", port=502)\nconnected = client.connect()\nprint(f\"連線狀態: {connected}\")\n```\n\n**逐行說明**：\n- `ModbusTcpClient(IP位址, port=502)` 建立一個Client物件，502是Modbus TCP的標準通訊埠號，通常不需要更改\n- `connect()` 回傳布林值代表連線是否成功，這是Week11防呆設計的習慣——連線這種可能失敗的操作，一定要檢查結果，不要預設一定成功\n\n**為什麼IP位址是127.0.0.1**：這是Week65用模擬器架設在自己電腦上的虛擬裝置，`127.0.0.1`(localhost)代表連到自己電腦本身，之後真的要連工廠現場的PLC時，就要換成那台PLC實際的IP位址，這是Week16學過的pyserial換成真實ESP32路徑同樣的道理，只是這裡從序列埠換成網路IP。", "is_project": false}, {"day": "週三", "content": "讀取Holding Register", "example": "result = client.read_holding_registers(0, 10)", "explanation": "```python\nresult = client.read_holding_registers(address=0, count=10)\n\nif not result.isError():\n    print(result.registers)   # 印出讀到的10個暫存器數值\nelse:\n    print(\"讀取失敗\")\n```\n\n**逐行說明**：\n- `address=0` 指定從第0號暫存器開始讀，`count=10` 代表連續讀取10個暫存器\n- `result.isError()` 檢查這次通訊是否發生錯誤(例如裝置沒回應、位址不存在)，這又是Week11防呆習慣的延續——網路通訊比本機函式呼叫更容易失敗，任何I/O操作都要檢查結果\n\n**為什麼要一次讀多個而不是一個一個讀**：每一次Modbus通訊都有網路延遲成本，一次讀取多個連續暫存器比逐一讀取效率高很多，這是網路通訊程式設計常見的優化原則——減少來回次數(round trip)。", "is_project": false}, {"day": "週四", "content": "寫入暫存器數值", "example": "client.write_register(0, 123)", "explanation": "```python\nresult = client.write_register(address=0, value=123)\n\nif result.isError():\n    print(\"寫入失敗\")\nelse:\n    print(\"寫入成功\")\n```\n\n**逐行說明**：\n- `write_register(address, value)` 把指定數值寫入某個暫存器位址，這對應到Week65學過的Holding Register(可讀可寫)類型\n- 如果嘗試寫入唯讀的Input Register，會直接收到錯誤回應，這是硬體/協定層面的保護機制\n\n**為什麼寫入操作要更謹慎**：讀取操作最多只是拿到錯誤的資料，但寫入操作可能真的改變了另一端裝置的行為(例如改變PLC控制的馬達轉速)，在真實工業場域操作寫入指令前，務必再三確認位址跟數值正確，這是Year4開始接觸真實工業設備時，比之前純軟體練習更需要謹慎的地方。", "is_project": false}, {"day": "週五【小專案】", "content": "讀取/寫入虛擬裝置的暫存器數值", "example": "寫一個腳本定期讀取並印出模擬裝置的暫存器值", "explanation": "**為什麼要這樣做**：\n1. 把本週學到的連線、讀取、寫入整合成一個完整的定期監控腳本(用Week3學過的while迴圈搭配Week9學過的sleep概念)，這是最基本但最實用的Modbus應用形式\n2. 加入Week11學過的try/except，處理連線中斷、逾時等真實網路環境常見的異常狀況\n3. 完成這週後，你已經掌握Modbus Client最核心的讀寫操作，下週會把這個技巧應用在真正把AGV感測器資料整合進Modbus架構的實務場景", "is_project": true}], "full_code": "# 讀取/寫入虛擬裝置的暫存器數值\n# 說明：寫一個腳本定期讀取並印出模擬裝置的暫存器值\nfrom pymodbus.client import ModbusTcpClient\n\nclient = ModbusTcpClient(\"127.0.0.1\", port=502)\nclient.connect()\n\n# 寫入電池電量到暫存器0\nclient.write_register(0, 80)\n\n# 讀取暫存器0~1 (電池電量、速度)\nresult = client.read_holding_registers(0, 2)\nprint(\"電池電量:\", result.registers[0])\nprint(\"目前速度:\", result.registers[1])\n\nclient.close()\n"}, {"sheet": "Week67", "num": 67, "title": "Week 67：Modbus整合感測器/PLC模擬", "purpose": "承接『Modbus TCP實作(pymodbus)』累積的基礎，為接下來『Modbus小專案：PLC暫存器工具』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "把AGV感測器資料映射成Modbus暫存器", "days": [{"day": "週一", "content": "設計資料映射表(暫存器對應意義)", "example": "例如暫存器0=電池電量，1=目前速度", "explanation": "**做什麼**：設計一份對照表，明確定義每個暫存器位址代表的意義：\n```\n位址0: 電池電量 (0~100)\n位址1: 目前速度 (0~255)\n位址2: 運作模式 (0=手動, 1=自動)\n位址3: 距離感測器讀值 (公分)\n```\n\n**為什麼要先設計映射表再寫程式**：這是Week17設計序列指令集時同樣的原則——先定義好雙方都認同的「資料格式約定」，再開始各自開發，Modbus本身只是傳輸「數字」，位址代表什麼意義完全要靠你自己文件化並讓雙方遵守，沒有這份文件，光看程式碼很難理解「位址3」到底是什麼意思。\n\n**這份文件的重要性**：之後如果要接案，這種映射表就是你跟客戶溝通系統介面的正式技術文件，清楚的映射表能大幅降低雙方認知落差造成的整合問題。", "is_project": false}, {"day": "週二", "content": "用pymodbus建立自己的Modbus Server", "example": "ModbusTcpServer搭配自訂DataBlock", "explanation": "```python\nfrom pymodbus.server import StartTcpServer\nfrom pymodbus.datastore import ModbusSequentialDataBlock, ModbusSlaveContext, ModbusServerContext\n\nblock = ModbusSequentialDataBlock(0, [80, 0, 0, 100])  # 初始值：電量80,速度0,模式0,距離100\nstore = ModbusSlaveContext(hr=block)\ncontext = ModbusServerContext(slaves=store, single=True)\n\nStartTcpServer(context=context, address=(\"0.0.0.0\", 502))\n```\n\n**逐行說明**：\n- 之前Week66你的程式一直是Client(去讀別人的裝置)，這裡改成寫Server(讓別人來讀你的裝置)，這是Week65學過的Master/Slave架構中，你的AGV系統扮演Slave角色的實作方式\n- `ModbusSequentialDataBlock(0, [80, 0, 0, 100])` 初始化從位址0開始的4個暫存器，數值對應週一設計的映射表\n- `address=(\"0.0.0.0\", 502)` 讓Server監聽所有網路介面的502埠，外部裝置(包含外部監控系統)才能連進來讀取\n\n**為什麼AGV系統要扮演Server角色**：這樣工廠既有的SCADA監控系統(Week79會學到)才能主動來讀取你的AGV狀態，這是把你的機器人系統，正式接入客戶既有工業通訊架構的關鍵一步。", "is_project": false}, {"day": "週三", "content": "把ESP32/AGV資料寫入Modbus Server", "example": "串接pyserial資料來源更新暫存器", "explanation": "```python\nimport threading\n\ndef update_from_sensor():\n    while True:\n        distance = read_from_serial()  # Week16學過的pyserial讀取\n        context[0x00].setValues(3, 3, [int(distance)])  # 更新位址3的Holding Register\n        time.sleep(0.5)\n\nthreading.Thread(target
