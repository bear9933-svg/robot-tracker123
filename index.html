e}, {"day": "週五【小專案】", "content": "AGV能透過網頁下指令避障移動", "example": "手動模式可遙控，自動模式能自行避障前進", "explanation": "**為什麼這是重要的整合點**：\n1. 這是Year1前21週所有技能第一次在「實體硬體」上完整跑通：Python基礎→Linux/Git→ESP32控制→感測器讀取→馬達控制→pyserial通訊→Flask網頁→機構組裝，全部串成一條完整的系統\n2. 手動/自動雙模式的設計，展現的不只是「能動」，而是「系統架構考慮周全」，這種設計思維在之後接AGV案子跟客戶談需求時會直接派上用場\n3. 完成這週後，你已經有一台「真正能展示」的AGV，下週開始會用AI工具強化開發效率、把系統整理成正式作品集", "is_project": true}], "full_code": "# AGV能透過網頁下指令避障移動\n# 說明：手動模式可遙控，自動模式能自行避障前進\nimport serial\nimport time\n\nser = serial.Serial(\"/dev/ttyUSB0\", 115200, timeout=1)\n\ndef read_distance():\n    ser.write(b\"D\\n\")\n    line = ser.readline().decode().strip()\n    return float(line) if line else None\n\ndef obstacle_check(distance, threshold=10):\n    return distance is not None and distance < threshold\n\nif __name__ == \"__main__\":\n    while True:\n        d = read_distance()\n        if d is not None:\n            print(f\"目前距離: {d} cm\")\n            if obstacle_check(d):\n                ser.write(b\"S\\n\")  # 送出停止指令\n                print(\"偵測到障礙物，已送出停止指令\")\n        time.sleep(0.5)\n"}, {"sheet": "Week22", "num": 22, "title": "Week 22：AI輔助開發工具強化", "purpose": "承接『感測器+馬達+網頁整合』累積的基礎，為接下來『測試、文件化與作品集整理』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "用Cursor有效率地除錯與重構程式", "days": [{"day": "週一", "content": "Cursor的Chat/Composer模式差異", "example": "練習用Composer一次修改多個檔案", "explanation": "**做什麼**：Cursor這類AI輔助編輯器通常有兩種主要互動模式：\n- **Chat模式**：像跟AI聊天問問題，適合「這段程式碼為什麼會這樣」這類理解性的問題\n- **Composer模式**：AI可以直接跨多個檔案做修改，適合「幫我把這個功能加到agv.py和main.py裡」這類需要動到多個檔案的任務\n\n**練習方式**：試著用Composer要求AI同時修改`agv.py`(新增一個方法)跟`main.py`(呼叫這個新方法)，觀察AI怎麼分別在兩個檔案裡做出對應的修改。\n\n**為什麼要區分使用時機**：問問題用Chat比較快、上下文更聚焦；真的要動手改程式碼用Composer比較有效率，選對工具能讓AI輔助開發真正提升效率，而不是每次都用同一種方式導致溝通成本增加。", "is_project": false}, {"day": "週二", "content": "用AI協助除錯", "example": "貼上錯誤訊息，練習有效提問方式", "explanation": "**有效提問的關鍵要素**：\n1. 完整貼上錯誤訊息(traceback)，不要只描述「程式壞了」\n2. 附上發生錯誤的那段程式碼，而不是整支檔案(除非真的需要更多上下文)\n3. 說明「你預期應該發生什麼」跟「實際發生了什麼」的差異\n\n**範例對比**：\n- 不好的提問：「我的程式壞了，幫我修」\n- 好的提問：「執行這段程式碼時出現`TypeError: unsupported operand type(s)`，我預期battery應該是數字，但錯誤訊息顯示它變成了字串，這是我的read_sensor()函式：[貼上程式碼]」\n\n**為什麼提問方式很重要**：AI給出的答案品質高度依賴你提供的資訊完整度，模糊的提問容易得到模糊或不相關的答案，這個技能本身就是一種值得刻意練習的軟實力。", "is_project": false}, {"day": "週三", "content": "用AI協助重構程式結構", "example": "把AGV控制邏輯拆分成更清楚的模組", "explanation": "**做什麼**：把你目前累積的AGV程式碼(可能已經有點雜亂)，請AI協助重新組織成更清楚的模組結構。\n\n**練習提問範例**：\n「這是我目前的agv控制程式，功能都能正常運作，但檔案越來越長。請幫我分析可以拆分成哪些獨立模組(例如感測器、馬達控制、通訊)，並說明理由，但先不要直接改程式碼，讓我先確認你的拆分邏輯合理再動手。」\n\n**為什麼要先確認邏輯再動手**：這是使用AI重構時很重要的習慣——先讓AI說明「打算怎麼改」，你確認方向正確後再讓它實際執行，避免AI一次做出大幅度但不符合你需求的改動，之後難以回頭檢查。", "is_project": false}, {"day": "週四", "content": "AI輔助撰寫測試與文件", "example": "請AI幫忙產生docstring與基本測試案例", "explanation": "**做什麼**：請AI幫你的函式補上docstring(函式說明文件)，以及對應的pytest測試案例。\n\n```python\ndef obstacle_check(distance, threshold=10):\n    \"\"\"\n    判斷是否偵測到障礙物。\n\n    參數:\n        distance (float): 感測器量測到的距離(公分)\n        threshold (float): 判定為障礙物的距離門檻，預設10cm\n\n    回傳:\n        bool: True代表偵測到障礙物需要停止\n    \"\"\"\n    return distance < threshold\n```\n\n**逐行說明**：\n- docstring是寫在函式定義下方、用三個引號包起來的說明文字，讓其他人(或未來的你)不用讀程式碼細節就知道這個函式的用途\n- 請AI根據docstring內容自動生成對應的pytest測試案例，可以快速補齊Week11學到的測試覆蓋率\n\n**為什麼要善用AI做這件事**：撰寫文件跟測試案例是「重要但容易被跳過」的工作，AI能大幅降低這件事的時間成本，讓你更願意持續維持良好的文件與測試習慣。", "is_project": false}, {"day": "週五【小專案】", "content": "用AI輔助重構AGV控制程式", "example": "整理出更乾淨的專案結構並確認功能不變", "explanation": "**為什麼要這樣做**：\n1. 綜合本週學到的四個技巧(Composer跨檔案修改、有效除錯提問、確認重構邏輯、補齊文件測試)，實際對你的AGV專案做一次完整整理\n2. 重構前後都要跑一次Week11寫的pytest測試，確保「重構」真的只是改善程式碼結構，而不是不小心改壞了原本能動的功能——這叫「行為保持不變的重構」，是軟體工程很核心的概念\n3. 這週學到的AI協作方式，會在後面Year2~Year4更複雜的ROS2、Gazebo、工業協定程式碼中持續派上用場，越早建立好的AI協作習慣，後面學習效率提升越明顯", "is_project": true}], "full_code": "【用AI輔助重構AGV控制程式：AI輔助開發提問範例】\n說明：整理出更乾淨的專案結構並確認功能不變\n\n範例提問（貼給Cursor / Claude）：\n\"這是我的AGV避障函式 obstacle_check()，目前偶爾會誤判。\n請幫我檢查邏輯是否有邊界條件遺漏，並提出至少一個改善建議，\n但不要更動函式名稱與參數，方便我對照修改前後的差異。\"\n\n使用重點：\n1. 提供完整的錯誤訊息或程式碼片段，而非只描述現象\n2. 明確說明「不要更動」的範圍，避免AI做過大幅度重構\n3. 要求AI先解釋問題再給修改建議，確保自己真的理解原因\n"}, {"sheet": "Week23", "num": 23, "title": "Week 23：測試、文件化與作品集整理", "purpose": "承接『AI輔助開發工具強化』累積的基礎，為接下來『M2里程碑：AGV展示週』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "補齊README、註解、demo影片", "days": [{"day": "週一", "content": "撰寫完整README.md", "example": "含專案介紹、架構圖、安裝與使用說明", "explanation": "**README應該包含的區塊**：\n1. 專案簡介：一兩句話說明這是什麼、解決什麼問題\n2. 硬體需求：列出用到的元件清單(ESP32、感測器、馬達驅動板等)\n3. 安裝方式：從`git clone`到能執行的完整步驟\n4. 使用方式：怎麼啟動系統、網頁介面在哪個網址\n5. 專案結構：資料夾/檔案的簡短說明\n\n**為什麼README是作品集最重要的一份文件**：招募方或客戶通常沒時間細看你的每一行程式碼，README是他們第一個(甚至唯一一個)會仔細讀的文件，一份清楚的README能大幅提升別人對你專案的第一印象與信任感。", "is_project": false}, {"day": "週二", "content": "程式碼註解與命名整理", "example": "統一函式命名風格，補齊關鍵邏輯註解", "explanation": "**整理重點**：\n- 統一命名風格：Python慣例用`snake_case`(底線分隔)，不要一下`moveForward`一下`move_forward`混用\n- 補齊「為什麼」而不只是「做什麼」的註解，例如`# 除以2是因為聲波要來回`比`# 計算距離`更有價值，因為後者從程式碼本身就看得出來\n- 刪除已經沒用的註解掉的程式碼(commented-out code)，這些殘留反而會讓人搞不清楚哪段才是現行邏輯\n\n**為什麼要專門排一天做這件事**：邊做功能邊維持完美的程式碼品質很難，定期回頭整理是務實的做法，這也是業界常見的「技術債清理」概念，先求功能做出來，再定期投入時間償還技術債。", "is_project": false}, {"day": "週三", "content": "錄製demo影片/拍照", "example": "記錄AGV實際運作畫面，用於作品集展示", "explanation": "**拍攝重點**：\n1. 拍攝AGV自動避障的完整過程，讓觀眾看到「感測到障礙物→自動停止」的因果關係\n2. 拍攝網頁操作介面搭配硬體反應的畫面(例如手機畫面跟AGV同框，或分割畫面)，讓人一眼看懂是「透過網頁控制」\n3. 影片不用長，1~2分鐘的demo影片比10分鐘的完整敘述更容易被看完\n\n**為什麼影片比文字描述更有說服力**：機器人專案的核心價值就是「它真的能動」，文字或截圖很難傳達這種「即時反應」的真實感，一段流暢的demo影片能大幅提升作品集的說服力，尤其對非技術背景的潛在客戶更是如此。", "is_project": false}, {"day": "週四", "content": "GitHub repo結構整理", "example": "資料夾分類：firmware/、server/、docs/", "explanation": "**建議的資料夾結構**：\n```\nagv-project/\n├── firmware/      # ESP32韌體程式(.ino或.cpp)\n├── server/        # Flask伺服器與網頁模板\n├── docs/          # 說明文件、demo截圖、影片連結\n├── tests/         # pytest測試檔案\n├── requirements.txt\n└── README.md\n```\n\n**為什麼要用這種分類方式**：這種依「功能領域」分資料夾的方式，讓瀏覽repo的人一眼就能找到自己關心的部分(硬體工程師看firmware、網頁開發者看server)，這也是中大型專案通用的組織原則，提早養成習慣，之後接觸更大規模的專案時會更快上手。", "is_project": false}, {"day": "週五【小專案】", "content": "GitHub repo整理成作品集等級", "example": "確認外部人也能照README獨立重現此專案", "explanation": "**驗收標準**：找一位完全不了解這個專案的人(或假想自己完全忘記這個專案)，只靠README從頭到尾照做一遍，看能不能成功跑起來。\n\n**為什麼這是最終的驗收方式**：這是判斷README跟repo結構品質最直接的方法——「別人能不能獨立重現」是作品集的關鍵指標，遠比「程式碼寫得多厲害」更容易被外部評估者感受到，因為對方通常不會花時間細讀程式碼，但很可能會嘗試照著README操作看看。", "is_project": true}], "full_code": "# AGV專案 README範本\n說明：確認外部人也能照README獨立重現此專案\n\n## 專案簡介\n一台具備避障與遠端控制能力的自走AGV，使用ESP32控制硬體、Flask提供網頁介面。\n\n## 硬體需求\n- ESP32-S3 N16R8 x1\n- 超音波感測器 HC-SR04 x1\n- L298N馬達驅動板 x1\n- 直流馬達+輪子 x2\n\n## 安裝方式\n\\`\\`\\`bash\npython3 -m venv venv\nsource venv/bin/activate\npip install -r requirements.txt\npython3 app.py\n\\`\\`\\`\n\n## 使用方式\n瀏覽器開啟 http://<樹莓派IP>:5000 即可看到控制面板\n\n## 專案結構\n\\`\\`\\`\nagv-project/\n├── firmware/      # ESP32韌體程式\n├── server/        # Flask伺服器\n└── docs/          # 說明文件與demo截圖\n\\`\\`\\`\n"}, {"sheet": "Week24", "num": 24, "title": "Week 24：M2里程碑：AGV展示週", "purpose": "承接『測試、文件化與作品集整理』累積的基礎，為接下來『OpenCV影像讀取與基本操作』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "完成第一台可展示的自走AGV原型", "days": [{"day": "週一", "content": "整體系統最終測試", "example": "多次重複測試避障與網頁控制穩定性", "explanation": "**測試重點**：連續執行至少10次完整的操作流程(啟動→手動控制→切換自動模式→遇到障礙物停止→回到手動)，記錄每次是否都正常運作。\n\n**為什麼要「重複」測試**：單次測試成功不代表系統穩定，機器人系統常常在「長時間運行」或「重複操作」後才會暴露出記憶體洩漏、序列埠斷線、感測器偶發雜訊等問題，展示前的重複測試是專業機器人工程師的基本職業素養。", "is_project": false}, {"day": "週二", "content": "修正發現的問題", "example": "針對測試中發現的bug逐一修復", "explanation": "**做什麼**：把週一測試中發現的所有問題列成清單，依「影響展示效果的嚴重程度」排序，優先修復會直接讓demo失敗的問題(例如偶爾整個系統當機)，次要問題(例如網頁樣式小瑕疵)可以視時間決定要不要修。\n\n**為什麼要排優先順序**：展示前的時間有限，不是每個問題都要修，把心力放在「會不會讓展示直接失敗」的問題上，是專案管理中很實際的取捨判斷。", "is_project": false}, {"day": "週三", "content": "準備展示腳本與簡報", "example": "整理3分鐘demo流程與重點說明", "explanation": "**展示腳本建議結構**(3分鐘)：\n1. (30秒) 一句話說明這個專案是什麼、解決什麼問題\n2. (90秒) 現場操作demo：手動控制→切換自動模式→展示避障\n3. (60秒) 簡短說明技術架構(用到哪些技術)跟這22週學到的重點\n\n**為什麼要寫腳本而不是臨場發揮**：即使是很熟悉的專案，臨場展示時也容易因為緊張漏講重點或忘記操作順序，簡短的腳本能確保有限的展示時間用在刀口上，這也是之後對客戶提案簡報的基本功。", "is_project": false}, {"day": "週四", "content": "彩排展示流程", "example": "模擬正式展示情境完整跑一次", "explanation": "**做什麼**：找家人、朋友，或直接對著鏡頭錄影，完整走一次週三寫的展示腳本，計時確認是否在預定時間內完成。\n\n**觀察重點**：\n- 操作AGV時手忙腳亂的地方，通常是流程需要簡化的訊號\n- 講解技術時容易卡住不知道怎麼表達的地方，代表這部分的理解可能還不夠扎實，值得展示前再複習一次\n\n**為什麼彩排很重要**：這是把「腦中知道要做什麼」跟「實際流暢做出來」之間的落差找出來的最後機會，正式展示(不管是對自己、對未來雇主、或對客戶)通常沒有重來的機會。", "is_project": false}, {"day": "週五【M2交付】", "content": "現場展示AGV自動避障+網頁控制demo", "example": "完成Year1後半最終里程碑，可對外展示", "explanation": "**為什麼這是Year1的重要里程碑**：\n1. 這是四年計畫的第一個「完整硬體+軟體整合系統」的正式交付，從Week1的環境安裝到這裡，剛好是24週、半年的累積成果\n2. 這台AGV具備自動避障、網頁遠端控制兩項核心能力，是後續Year2~Year4所有進階功能(視覺辨識、3D定位、工業通訊)的基礎平台，不是重新打掉重練，而是在這個基礎上持續擴充\n3. 完成這個里程碑後，你已經有足夠的作品集素材可以開始展示給潛在雇主或客戶看，這是「學習」跟「能拿出去展示的實力」第一次真正重疊的時間點", "is_project": true}], "full_code": "# 現場展示AGV自動避障+網頁控制demo\n# 說明：完成Year1後半最終里程碑，可對外展示\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.read_csv(\"sensor_log.csv\")\nprint(df.describe())\n\nplt.plot(df[\"time\"], df[\"distance\"])\nplt.xlabel(\"時間 (s)\")\nplt.ylabel(\"距離 (cm)\")\nplt.title(\"AGV感測器距離紀錄\")\nplt.savefig(\"distance_chart.png\")\nprint(\"圖表已輸出：distance_chart.png\")\n"}, {"sheet": "Week25", "num": 25, "title": "Week 25：OpenCV影像讀取與基本操作", "purpose": "承接『M2里程碑：AGV展示週』累積的基礎，為接下來『OpenCV影像處理技巧』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能讀取影像、調整大小、裁切、轉換色彩空間", "days": [{"day": "週一", "content": "OpenCV安裝與影像讀取", "example": "img = cv2.imread('photo.jpg')", "explanation": "```python\nimport cv2\n\nimg = cv2.imread(\"photo.jpg\")\nprint(img.shape)   # (高度, 寬度, 色彩通道數)\nprint(type(img))   # <class 'numpy.ndarray'>\n```\n\n**逐行說明**：\n- `pip install opencv-python-headless` 是樹莓派等無桌面環境建議安裝的版本，比完整版`opencv-python`少了GUI相依套件\n- `cv2.imread()` 讀進來的圖片本質上是一個NumPy陣列，`.shape`會印出(高, 寬, 3)，3代表B、G、R三個色彩通道\n- 如果路徑錯誤或檔案不存在，`imread()`**不會報錯**，而是安靜地回傳`None`，這是OpenCV新手最容易忽略、後續才在別的地方莫名其妙出錯的地雷\n\n**常見錯誤**：讀完圖片沒有檢查`if img is None:`就直接往下處理，等到後面呼叫`img.shape`才報錯，錯誤訊息卻讓人搞不清楚問題出在讀檔案這步。", "is_project": false}, {"day": "週二", "content": "顯示、儲存影像", "example": "cv2.imshow('win', img); cv2.imwrite('out.jpg', img)", "explanation": "```python\ncv2.imshow(\"window_name\", img)\ncv2.waitKey(0)          # 等待任意按鍵才繼續\ncv2.destroyAllWindows()\n\ncv2.imwrite(\"out.jpg\", img)\n```\n\n**逐行說明**：\n- `cv2.imshow()` 開一個視窗顯示圖片，**必須搭配**`cv2.waitKey()`才會真的顯示出來，否則視窗會一閃而過或根本不顯示\n- `waitKey(0)` 代表無限等待直到按下任意鍵；`waitKey(1)` 則是只等1毫秒，常用在即時影像處理迴圈中\n- `cv2.imwrite()` 依副檔名自動判斷儲存格式(.jpg、.png等)\n\n**在樹莓派上的重要提醒**：如果透過純SSH連線(沒有轉發圖形介面)，`cv2.imshow()`會直接報錯或沒有反應，這種headless環境要改用`cv2.imwrite()`把結果存成圖片，再傳回電腦查看。", "is_project": false}, {"day": "週三", "content": "resize/crop基本操作", "example": "img_small = cv2.resize(img, (320,240))", "explanation": "```python\nimg_small = cv2.resize(img, (320, 240))   # 縮放到指定寬高\ncropped = img[50:200, 100:300]            # 裁切：[y1:y2, x1:x2]\n```\n\n**逐行說明**：\n- `cv2.resize(img, (寬, 高))` 注意參數順序是(寬, 高)，跟`.shape`印出的(高, 寬)順序相反，這是新手很容易搞混的地方\n- 裁切用的是NumPy的切片語法，而且順序是`[y方向, x方向]`(先高後寬)，跟resize的參數順序又不一樣，務必留意這個不一致\n\n**為什麼要學resize**：即時影像處理時，畫面解析度越高運算量越大，適度縮小畫面(例如640x480降到320x240)能大幅提升處理速度，這在樹莓派這種運算資源有限的裝置上特別重要。", "is_project": false}, {"day": "週四", "content": "色彩空間轉換（BGR/HSV/GRAY）", "example": "hsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV)", "explanation": "```python\nhsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV)\ngray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n```\n\n**逐行說明**：\n- OpenCV預設讀進來的彩色圖片是**BGR**順序(藍綠紅)，不是一般常見的RGB(紅綠藍)，這是OpenCV著名的「歷史包袱」，直接拿去跟其他函式庫(matplotlib等預設RGB)混用時顏色會跑掉\n- HSV(色相/飽和度/明度)色彩空間對「顏色本身」的描述比BGR更直觀，這是為什麼做顏色追蹤時要先轉HSV\n- 灰階(GRAY)只有一個通道，資料量少，很多邊緣偵測、二值化的前處理都會先轉灰階\n\n**為什麼重要**：這是你之前在樹莓派上做ColorTracker時已經用過的技巧，這週會更完整地理解「為什麼要轉HSV」背後的原理，而不只是複製貼上程式碼。", "is_project": false}, {"day": "週五【小專案】", "content": "影像批次前處理小工具", "example": "寫一個腳本批次把資料夾內圖片resize並轉灰階", "explanation": "**為什麼要這樣寫**：\n1. 用`os.listdir()`或`glob`列出資料夾內所有圖片，搭配`for`迴圈逐一處理，這是Week3學過的迴圈邏輯在影像處理上的實際應用\n2. 統一resize到固定尺寸，是之後Week44訓練YOLOv8自訂模型前，資料前處理的標準流程之一\n3. 批次處理的思維(寫一次程式碼、處理任意數量的檔案)是資料科學與電腦視覺工作中非常核心的習慣，比手動一張一張處理有效率得多", "is_project": true}], "full_code": "# 影像批次前處理小工具\n# 說明：寫一個腳本批次把資料夾內圖片resize並轉灰階\nimport cv2\nimport numpy as np\n\nlower = np.array([35, 80, 80])\nupper = np.array([85, 255, 255])\n\ncap = cv2.VideoCapture(0)\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)\n    mask = cv2.inRange(hsv, lower, upper)\n    contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n\n    if contours:\n        c = max(contours, key=cv2.contourArea)\n        x, y, w, h = cv2.boundingRect(c)\n        cv2.rectangle(frame, (x, y), (x + w, y + h), (0, 255, 0), 2)\n\n    cv2.imshow(\"tracking\", frame)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n\ncap.release()\ncv2.destroyAllWindows()\n"}, {"sheet": "Week26", "num": 26, "title": "Week 26：OpenCV影像處理技巧", "purpose": "承接『OpenCV影像讀取與基本操作』累積的基礎，為接下來『顏色追蹤與物件追蹤基礎』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "二值化、模糊、邊緣偵測、輪廓偵測", "days": [{"day": "週一", "content": "二值化 threshold", "example": "_, th = cv2.threshold(gray, 127, 255, cv2.THRESH_BINARY)", "explanation": "```python\ngray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n_, th = cv2.threshold(gray, 127, 255, cv2.THRESH_BINARY)\n```\n\n**逐行說明**：\n- `cv2.threshold(來源, 門檻值, 最大值, 方法)` 把灰階圖片轉成只有黑白兩色的二值圖：像素值超過127就變成255(白)，否則變成0(黑)\n- 函式回傳兩個值，第一個是實際使用的門檻值(通常用不到)，第二個才是處理後的圖片，這是為什麼要寫`_, th = ...`用底線接住不需要的回傳值\n- `THRESH_BINARY`是最基本的二值化模式，OpenCV還有`THRESH_OTSU`等能自動計算最佳門檻值的進階模式\n\n**為什麼要二值化**：把畫面簡化成純黑白後，後續的輪廓偵測、面積計算會單純很多，這是很多影像處理pipeline的標準前處理步驟。", "is_project": false}, {"day": "週二", "content": "模糊處理（降噪）", "example": "blur = cv2.GaussianBlur(img, (5,5), 0)", "explanation": "```python\nblur = cv2.GaussianBlur(img, (5, 5), 0)\n```\n\n**逐行說明**：\n- `(5, 5)` 是高斯核(kernel)的大小，數字越大模糊效果越強，但也會讓細節損失越多，這個數字必須是奇數(3,5,7...)\n- 最後的`0`是標準差，設為0時OpenCV會依核大小自動計算合理的值\n- 高斯模糊會讓畫面中的隨機雜訊被「抹平」，讓後續的邊緣偵測、輪廓偵測不會被雜訊干擾出一堆假輪廓\n\n**為什麼要先模糊再做其他處理**：這是電腦視覺pipeline的常見順序——先降噪，再做邊緣/輪廓偵測，如果跳過這步直接對原始雜訊很多的畫面做偵測，容易得到大量破碎、不連續的假輪廓。", "is_project": false}, {"day": "週三", "content": "邊緣偵測 Canny", "example": "edges = cv2.Canny(img, 100, 200)", "explanation": "```python\nedges = cv2.Canny(img, 100, 200)\n```\n\n**逐行說明**：\n- Canny邊緣偵測是業界標準的邊緣偵測演算法，兩個數字(100, 200)分別是「低門檻」跟「高門檻」\n- 高於高門檻的像素一定被視為邊緣；低於低門檻的一定不是邊緣；介於兩者之間的，要看它是否連接到已確定的邊緣才會被納入，這種機制叫「雙門檻遲滯處理」，能有效減少斷斷續續的邊緣線\n\n**參數調整經驗法則**：如果偵測到太多雜訊邊緣，提高兩個門檻值；如果邊緣偵測不夠完整(該有的邊緣沒出現)，降低門檻值，實務上常常要依實際畫面反覆調整這兩個數字。", "is_project": false}, {"day": "週四", "content": "輪廓偵測 findContours", "example": "contours, _ = cv2.findContours(th, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)", "explanation": "```python\ncontours, _ = cv2.findContours(th, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\nprint(f\"找到 {len(contours)} 個輪廓\")\n\nfor c in contours:\n    area = cv2.contourArea(c)\n    if area > 100:  # 過濾太小的雜訊輪廓\n        x, y, w, h = cv2.boundingRect(c)\n        cv2.rectangle(img, (x, y), (x+w, y+h), (0, 255, 0), 2)\n```\n\n**逐行說明**：\n- `findContours()` 需要輸入二值圖(通常是Week一學到的threshold結果)，回傳所有偵測到的輪廓，每個輪廓是一串座標點\n- `RETR_EXTERNAL` 只找最外層的輪廓，忽略內部的洞；`CHAIN_APPROX_SIMPLE` 只保留輪廓的關鍵轉折點，省下記憶體\n- `cv2.contourArea()` 計算輪廓包圍的面積，用來過濾掉太小、可能是雜訊的假輪廓\n- `cv2.boundingRect()` 算出能包住這個輪廓的最小正矩形，回傳左上角座標跟寬高\n\n**為什麼要過濾面積**：真實畫面中即使做了模糊降噪，還是可能有零星雜訊被誤判成輪廓，用面積門檻濾掉這些雜訊輪廓，是很實用的後處理技巧。", "is_project": false}, {"day": "週五【小專案】", "content": "邊緣偵測+輪廓標記小工具", "example": "偵測圖片中物件輪廓並畫出外框與面積", "explanation": "**為什麼要這樣寫**：\n1. 把本週學到的四個技巧(二值化、模糊、Canny、輪廓偵測)串成一條完整的pipeline，這是電腦視覺處理的標準流程順序：**模糊降噪 → 二值化/邊緣偵測 → 輪廓偵測 → 後處理過濾**\n2. 在畫面上直接標出外框跟面積數字，讓你能「用眼睛驗證」演算法有沒有正確運作，這種視覺化除錯方式在電腦視覺開發中非常重要\n3. 這條pipeline會是之後Week44訓練YOLOv8之前，理解「傳統電腦視覺方法」跟「深度學習方法」差異的重要基礎——YOLOv8做的事情本質上更強大，但傳統方法運算成本低、在簡單場景下依然實用", "is_project": true}], "full_code": "# 邊緣偵測+輪廓標記小工具\n# 說明：偵測圖片中物件輪廓並畫出外框與面積\nimport cv2\nimport numpy as np\n\nlower = np.array([35, 80, 80])\nupper = np.array([85, 255, 255])\n\ncap = cv2.VideoCapture(0)\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)\n    mask = cv2.inRange(hsv, lower, upper)\n    contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n\n    if contours:\n        c = max(contours, key=cv2.contourArea)\n        x, y, w, h = cv2.boundingRect(c)\n        cv2.rectangle(frame, (x, y), (x + w, y + h), (0, 255, 0), 2)\n\n    cv2.imshow(\"tracking\", frame)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n\ncap.release()\ncv2.destroyAllWindows()\n"}, {"sheet": "Week27", "num": 27, "title": "Week 27：顏色追蹤與物件追蹤基礎", "purpose": "承接『OpenCV影像處理技巧』累積的基礎，為接下來『攝影機即時串流整合』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "用HSV色彩空間做顏色追蹤", "days": [{"day": "週一", "content": "HSV色彩空間追蹤原理", "example": "回顧樹莓派ColorTracker的HSV邏輯", "explanation": "**原理回顧**：HSV把顏色拆成三個維度——H(色相，決定是紅/黃/綠/藍等哪種顏色)、S(飽和度，決定顏色鮮豔還是灰暗)、V(明度，決定亮還是暗)。\n\n**為什麼HSV比BGR更適合顏色追蹤**：在BGR空間裡，「紅色」在不同光線亮度下，B、G、R三個數值會大幅變動，很難設定一個固定範圍去框住「所有情況下的紅色」。但在HSV空間裡，光線變化主要影響V(明度)，H(色相)相對穩定，所以只要針對H設定一個範圍，就能比較穩定地在不同光線下追蹤同一種顏色。\n\n**為什麼要「回顧」**：你在樹莓派Phase1課程已經實作過ColorTracker，這裡的目的不是重新學一次，而是搞懂背後的原理，讓你之後遇到追蹤不穩定的問題時，知道該從HSV範圍設定去調整，而不是複製別人的數字卡死不知道為什麼。", "is_project": false}, {"day": "週二", "content": "cv2.inRange建立色彩遮罩", "example": "mask = cv2.inRange(hsv, lower, upper)", "explanation": "```python\nimport numpy as np\n\nlower = np.array([35, 80, 80])   # HSV下限\nupper = np.array([85, 255, 255]) # HSV上限\nmask = cv2.inRange(hsv, lower, upper)\n```\n\n**逐行說明**：\n- `lower`、`upper` 各是一組三個數字的NumPy陣列，分別代表H、S、V三個維度的範圍下限跟上限\n- `cv2.inRange()` 會產生一張「遮罩(mask)」圖，範圍內的像素變成白色(255)，範圍外變成黑色(0)\n- OpenCV的H值範圍是0~179(不是常見的0~360，這是OpenCV特有的縮放，除以2省下一個位元組)，這是新手容易搞錯的地方\n\n**調整技巧**：想抓綠色物體大概在H=35~85之間，S跟V的下限設高一點(例如80)可以避免抓到太暗或太不飽和(接近灰色)的雜訊像素。", "is_project": false}, {"day": "週三", "content": "找出追蹤目標的中心點", "example": "moments = cv2.moments(mask); cx = moments['m10']/moments['m00']", "explanation": "```python\nmoments = cv2.moments(mask)\nif moments[\"m00\"] > 0:\n    cx = int(moments[\"m10\"] / moments[\"m00\"])\n    cy = int(moments[\"m01\"] / moments[\"m00\"])\n    cv2.circle(img, (cx, cy), 5, (0, 0, 255), -1)\n```\n\n**逐行說明**：\n- `cv2.moments()` 計算圖形的「矩」，這是一種數學上描述形狀分佈的方式，`m00`代表遮罩中白色像素的總數(面積)\n- `m10/m00` 跟 `m01/m00` 分別算出白色區域在x軸、y軸方向的「重心」，也就是追蹤目標的中心點座標\n- 檢查`m00 > 0`很重要，因為如果整張遮罩都是黑的(完全沒偵測到目標)，`m00`會是0，直接除以0會讓程式崩潰\n\n**為什麼用重心而不是bounding box中心**：重心考慮了整個區域內每個像素的分布，比單純用外接矩形的中心更能準確反映不規則形狀物體的真正中心位置。", "is_project": false}, {"day": "週四", "content": "追蹤穩定性處理（形態學運算）", "example": "cv2.erode / cv2.dilate 去除雜訊", "explanation": "```python\nkernel = np.ones((5, 5), np.uint8)\nmask = cv2.erode(mask, kernel, iterations=1)   # 侵蝕：去除小雜點\nmask = cv2.dilate(mask, kernel, iterations=1)  # 膨脹：補回主體大小\n```\n\n**逐行說明**：\n- `erode`(侵蝕)會讓白色區域「縮小」，效果是把散落的小白點雜訊直接吃掉，因為雜訊點通常很小，侵蝕幾次就整個消失了\n- `dilate`(膨脹)會讓白色區域「擴張」，通常接在erode後面用，把因為侵蝕而縮小的主體目標區域補回接近原本的大小\n- 這種「先侵蝕再膨脹」的組合技巧有個專有名詞叫「開運算(opening)」，OpenCV也有`cv2.morphologyEx()`可以一次做完\n\n**為什麼需要這道手續**：純用`inRange()`產生的遮罩常常會有零星雜訊白點(例如背景中剛好有相近顏色的反光)，形態學運算是清理這些雜訊、讓追蹤結果更穩定的關鍵步驟。", "is_project": false}, {"day": "週五【小專案】", "content": "強化ColorTracker並加上追蹤軌跡", "example": "在畫面上畫出物件移動的歷史軌跡線", "explanation": "**為什麼要這樣寫**：\n1. 用一個list持續記錄每一幀算出的中心點座標，這是Week5學過的list資料結構在即時影像追蹤上的實際應用\n2. 用`cv2.line()`把list裡連續的座標點依序連起來，就能在畫面上畫出物體移動過的路徑，這種視覺化能幫助你直觀判斷追蹤是否穩定(路徑平滑代表追蹤穩定，路徑亂跳代表有雜訊干擾)\n3. 這是樹莓派ColorTracker的正式升級版，加入了本週學到的形態學運算降噪，追蹤穩定度會比之前的版本明顯提升", "is_project": true}], "full_code": "# 強化ColorTracker並加上追蹤軌跡\n# 說明：在畫面上畫出物件移動的歷史軌跡線\nimport cv2\nimport numpy as np\n\nlower = np.array([35, 80, 80])\nupper = np.array([85, 255, 255])\n\ncap = cv2.VideoCapture(0)\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)\n    mask = cv2.inRange(hsv, lower, upper)\n    contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n\n    if contours:\n        c = max(contours, key=cv2.contourArea)\n        x, y, w, h = cv2.boundingRect(c)\n        cv2.rectangle(frame, (x, y), (x + w, y + h), (0, 255, 0), 2)\n\n    cv2.imshow(\"tracking\", frame)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n\ncap.release()\ncv2.destroyAllWindows()\n"}, {"sheet": "Week28", "num": 28, "title": "Week 28：攝影機即時串流整合", "purpose": "承接『顏色追蹤與物件追蹤基礎』累積的基礎，為接下來『ROS2基本概念與安裝』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "即時處理攝影機畫面並疊加標記", "days": [{"day": "週一", "content": "VideoCapture即時讀取攝影機", "example": "cap = cv2.VideoCapture(0)", "explanation": "```python\ncap = cv2.VideoCapture(0)   # 0代表第一個攝影機裝置\n\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n    cv2.imshow(\"camera\", frame)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n\ncap.release()\ncv2.destroyAllWindows()\n```\n\n**逐行說明**：\n- `cv2.VideoCapture(0)` 開啟編號0的攝影機，如果電腦有多個攝影機，可能要改成1、2嘗試\n- `cap.read()` 回傳兩個值：`ret`(布林值，代表這次讀取是否成功)、`frame`(讀到的畫面)，務必檢查`ret`避免處理到空畫面\n- `waitKey(1) & 0xFF == ord(\"q\")` 是很常見的「按q離開」寫法，`& 0xFF`是為了處理不同作業系統下waitKey回傳值的相容性問題\n- `cap.release()` 用完攝影機一定要釋放，否則其他程式(或重新執行同一支程式)可能會拿不到攝影機的使用權", "is_project": false}, {"day": "週二", "content": "即時迴圈處理與FPS計算", "example": "計算每秒處理張數，評估效能瓶頸", "explanation": "```python\nimport time\n\nprev_time = time.time()\nwhile True:\n    ret, frame = cap.read()\n    # ... 影像處理 ...\n\n    curr_time = time.time()\n    fps = 1 / (curr_time - prev_time)\n    prev_time = curr_time\n    print(f\"FPS: {fps:.1f}\")\n```\n\n**逐行說明**：\n- 用`time.time()`紀錄每一幀處理前後的時間差，取倒數就是「每秒能處理幾幀」(FPS)\n- 這個數字能反映出你的影像處理pipeline是否夠快，如果FPS太低(例如低於10)，代表處理邏輯太重，需要優化(例如降低解析度、減少不必要的運算)\n\n**為什麼要量測而不是憑感覺**：肉眼很難精確判斷「畫面順不順」，尤其在樹莓派這種效能有限的裝置上，實際數字化的FPS量測能幫助你客觀比較不同優化方式的效果。", "is_project": false}, {"day": "週三", "content": "疊加文字與標記到畫面", "example": "cv2.putText(frame, f'FPS:{fps}', (10,30), ...)", "explanation": "```python\ncv2.putText(\n    frame, f\"FPS: {fps:.1f}\", (10, 30),\n    cv2.FONT_HERSHEY_SIMPLEX, 1, (0, 255, 0), 2\n)\n```\n\n**逐行說明**：\n- `cv2.putText(圖片, 文字, 座標, 字型, 字體大小, 顏色, 粗細)` 是在畫面上疊加文字的固定寫法\n- 座標`(10, 30)`是文字左下角的位置，不是正中心，這跟大部分UI框架的座標習慣不太一樣\n- 顏色是BGR順序，`(0, 255, 0)`是綠色不是紅色，這又是OpenCV BGR慣例造成的常見誤用\n\n**為什麼要疊加資訊到畫面上**：把FPS、追蹤狀態等除錯資訊直接畫在畫面上，比印在終端機更直覺，尤其是要錄demo影片時，畫面上的即時數字能讓觀眾清楚看到系統運作狀態。", "is_project": false}, {"day": "週四", "content": "簡易攝影機校正概念", "example": "了解畸變校正對後續3D視覺的重要性（先概念不深入）", "explanation": "**概念說明**：一般攝影機鏡頭因為物理特性，拍出來的畫面邊緣常常會有輕微的「桶狀畸變」(邊緣看起來像被往外推)，尤其廣角鏡頭更明顯。攝影機校正就是透過拍攝已知圖案(通常是棋盤格)，計算出鏡頭的畸變參數，之後就能把畫面「拉直」修正回來。\n\n**為什麼這週先不深入實作**：這個技巧會在Year3使用RealSense D435i做3D點雲處理時變得非常重要——因為畸變誤差會直接影響3D座標的準確度，但這週的重點是先建立概念，讓你知道「以後有一天會需要這個」，避免完全沒有心理準備就在Year3遇到陌生名詞。\n\n**先備知識價值**：提早埋下概念種子，之後正式學習時吸收速度會快很多，這也是整個四年計畫刻意的教學設計。", "is_project": false}, {"day": "週五【小專案】", "content": "即時物件追蹤系統", "example": "整合Week27追蹤邏輯，做出即時顏色追蹤+畫面標記的完整程式", "explanation": "**為什麼要這樣寫**：\n1. 把Week27的顏色追蹤邏輯，接到本週學會的即時攝影機串流架構裡，從「處理靜態圖片」正式進化成「處理即時影像」\n2. 加上FPS顯示跟追蹤軌跡疊加，讓這支程式不只是能動，還是一個「資訊完整、方便除錯」的正式工具\n3. 這個小專案是Week25~28整個OpenCV基礎模組的總驗收，也是下週開始學ROS2時，之後要把這個追蹤功能包裝成ROS2節點的直接基礎——程式邏輯不變，只是外層包裝方式會改變", "is_project": true}], "full_code": "# 即時物件追蹤系統\n# 說明：整合Week27追蹤邏輯，做出即時顏色追蹤+畫面標記的完整程式\nimport cv2\nimport numpy as np\n\nlower = np.array([35, 80, 80])\nupper = np.array([85, 255, 255])\n\ncap = cv2.VideoCapture(0)\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)\n    mask = cv2.inRange(hsv, lower, upper)\n    contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n\n    if contours:\n        c = max(contours, key=cv2.contourArea)\n        x, y, w, h = cv2.boundingRect(c)\n        cv2.rectangle(frame, (x, y), (x + w, y + h), (0, 255, 0), 2)\n\n    cv2.imshow(\"tracking\", frame)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n\ncap.release()\ncv2.destroyAllWindows()\n"}, {"sheet": "Week29", "num": 29, "title": "Week 29：ROS2基本概念與安裝", "purpose": "承接『攝影機即時串流整合』累積的基礎，為接下來『Node與Topic（Publisher/Subscriber）』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "建立workspace、理解colcon build流程", "days": [{"day": "週一", "content": "ROS2 Humble安裝與環境設定", "example": "source /opt/ros/humble/setup.bash", "explanation": "**做什麼**：在筆電(建議先在效能較好的筆電上熟悉ROS2，樹莓派之後透過主軸二課程另外處理編譯安裝)安裝ROS2 Humble，並每次開新終端機都要執行環境設定指令：\n```bash\nsource /opt/ros/humble/setup.bash\n```\n\n**逐行說明**：\n- `source` 指令會執行這個腳本，並把裡面設定的環境變數套用到目前的終端機session\n- ROS2的所有指令(`ros2 run`、`ros2 topic`等)都依賴這些環境變數才能運作，忘記source是ROS2新手最常遇到「指令找不到」的原因\n- 可以把這行加進`~/.bashrc`，讓每次開終端機自動設定好，不用每次手動打\n\n**為什麼要重新學一套系統**：ROS2不是一個程式庫，而是一整套「機器人作業系統」，提供節點間通訊、套件管理、模擬整合等完整生態系，是Year2~Year4所有進階功能的共同基礎建設。", "is_project": false}, {"day": "週二", "content": "workspace與colcon build", "example": "mkdir -p ~/ros2_ws/src && colcon build", "explanation": "```bash\nmkdir -p ~/ros2_ws/src\ncd ~/ros2_ws\ncolcon build\nsource install/setup.bash\n```\n\n**逐行說明**：\n- ROS2的專案要放在一個叫「workspace」的資料夾裡，`src/`資料夾放你所有的套件原始碼\n- `colcon build` 是ROS2的建置工具，會把`src/`裡的套件編譯/打包成可以執行的形式，產生`build/`、`install/`、`log/`資料夾\n- 每次build完，都要`source install/setup.bash`才能讓系統認得你剛剛build出來的套件\n\n**為什麼結構要這樣設計**：這種「src放原始碼、install放建置產物」的分離設計，讓你可以隨時刪除build/install資料夾重新建置，而不會弄丟原始碼，這是大型軟體專案常見的建置系統設計哲學。", "is_project": false}, {"day": "週三", "content": "ros2 run/ros2 pkg基本指令", "example": "ros2 pkg create --build-type ament_python my_pkg", "explanation": "```bash\ncd ~/ros2_ws/src\nros2 pkg create --build-type ament_python my_pkg\ncd ~/ros2_ws\ncolcon build --packages-select my_pkg\nsource install/setup.bash\nros2 run my_pkg some_node\n```\n\n**逐行說明**：\n- `ros2 pkg create` 自動產生一個新套件的標準目錄結構跟設定檔，`--build-type ament_python`指定這是Python套件(還有C++版的`ament_cmake`)\n- `colcon build --packages-select my_pkg` 只建置指定的套件，比每次都全部重build快很多，套件數量變多後這個技巧很實用\n- `ros2 run 套件名 節點名` 是執行ROS2節點的標準方式\n\n**為什麼重要**：這是你之後每次開發新功能都會用到的標準流程，熟悉這套指令跟資料夾結構，是能順暢使用ROS2的基本功。", "is_project": false}, {"day": "週四", "content": "節點（Node）核心概念", "example": "理解Node是ROS2最小執行單位", "explanation": "**概念說明**：Node(節點)是ROS2裡最基本的執行單位，可以想成是「一支獨立執行的小程式」，負責做一件特定的事情，例如一個節點專門讀取感測器、另一個節點專門控制馬達、再一個節點專門做路徑規劃。\n\n**跟你之前寫的Python程式有什麼不同**：以前你可能把所有邏輯寫在同一支程式的同一個檔案裡；ROS2鼓勵你把不同職責拆成不同的Node，各自獨立執行，Node之間再透過Topic、Service等機制互相溝通，這是「分散式系統」的設計思維。\n\n**為什麼要這樣設計**：這種架構讓系統更容易維護跟除錯——如果避障邏輯有bug，你只需要重啟避障節點，不會影響到還在正常運作的馬達控制節點；也更容易分散運算資源，例如把運算量大的視覺辨識節點放在筆電上跑，把即時控制節點放在樹莓派上跑。", "is_project": false}, {"day": "週五【小專案】", "content": "跑通第一個ROS2範例節點", "example": "建立最簡單的Node並成功執行、印出log", "explanation": "**為什麼要這樣寫**：\n1. 從無到有走過一次完整流程：建立workspace → 建立套件 → 寫節點程式碼 → build → source → run，這條路徑你之後幾乎每週都會重複走一次，這週就是要把肌肉記憶建立起來\n2. 用`self.get_logger().info()`印出log而不是Python內建的`print()`，這是ROS2的標準做法，log會自動帶上時間戳記跟節點名稱，方便之後除錯多節點系統時分辨訊息來源\n3. 這是ROS2生態系的第一個里程碑，雖然功能很簡單，但這條「安裝→建置→執行」的完整鏈路打通後，後面Week30~34的內容都是在這個基礎上疊加", "is_project": true}], "full_code": "# 跑通第一個ROS2範例節點\n# 說明：建立最簡單的Node並成功執行、印出log\nimport rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float32\n\nclass SensorPublisher(Node):\n    def __init__(self):\n        super().__init__(\"sensor_publisher\")\n        self.publisher_ = self.create_publisher(Float32, \"distance\", 10)\n        self.timer = self.create_timer(0.5, self.timer_callback)\n        self.value = 100.0\n\n    def timer_callback(self):\n        msg = Float32()\n        msg.data = self.value\n        self.publisher_.publish(msg)\n        self.get_logger().info(f\"發布距離: {self.value}\")\n        self.value -= 5.0\n\ndef main():\n    rclpy.init()\n    node = SensorPublisher()\n    rclpy.spin(node)\n    node.destroy_node()\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week30", "num": 30, "title": "Week 30：Node與Topic（Publisher/Subscriber）", "purpose": "承接『ROS2基本概念與安裝』累積的基礎，為接下來『Service與Action』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能寫出互相通訊的發布/訂閱節點", "days": [{"day": "週一", "content": "Publisher節點撰寫", "example": "self.publisher_ = self.create_publisher(String, 'topic', 10)", "explanation": "```python\nfrom std_msgs.msg import String\n\nself.publisher_ = self.create_publisher(String, \"my_topic\", 10)\n\nmsg = String()\nmsg.data = \"Hello ROS2\"\nself.publisher_.publish(msg)\n```\n\n**逐行說明**：\n- `create_publisher(訊息型別, topic名稱, 佇列大小)` 建立一個發布者，`10`是佇列大小，代表如果訂閱者處理速度跟不上，最多緩存10筆待處理訊息\n- Topic就像一個「廣播頻道」，Publisher往頻道發送訊息，不需要知道有誰在收聽\n- `msg.data = \"...\"` 要把資料包在對應的訊息物件裡才能發布，不能直接發送裸的字串\n\n**為什麼用「廣播」而不是「點對點」**：這種架構讓系統很有彈性——你可以隨時加入新的訂閱者去監聽同一個topic，而不需要修改Publisher的程式碼，這是分散式系統設計的重要優勢。", "is_project": false}, {"day": "週二", "content": "Subscriber節點撰寫", "example": "self.create_subscription(String, 'topic', self.callback, 10)", "explanation": "```python\nself.create_subscription(String, \"my_topic\", self.listener_callback, 10)\n\ndef listener_callback(self, msg):\n    self.get_logger().info(f\"收到: {msg.data}\")\n```\n\n**逐行說明**：\n- `create_subscription(訊息型別, topic名稱, callback函式, 佇列大小)` 建立訂閱者，每次topic上有新訊息，`callback函式`就會被自動呼叫一次\n- 這種「事件驅動」的寫法，跟你之前寫的`while True`主動輪詢迴圈不同——你不用自己寫迴圈去檢查有沒有新資料，ROS2的機制會在有新資料時自動通知你\n\n**為什麼是Callback而不是輪詢**：這種設計更有效率，因為節點不需要浪費資源持續檢查「有沒有新資料」，可以把運算資源用在真正需要處理的時刻，這是事件驅動架構的核心優勢。", "is_project": false}, {"day": "週三", "content": "timer週期性發布資料", "example": "self.create_timer(0.5, self.timer_callback)", "explanation": "```python\nself.timer = self.create_timer(0.5, self.timer_callback)\n\ndef timer_callback(self):\n    msg = String()\n    msg.data = \"periodic message\"\n    self.publisher_.publish(msg)\n```\n\n**逐行說明**：\n- `create_timer(週期秒數, callback函式)` 每隔指定的秒數，就自動呼叫一次callback函式，很適合用在「模擬感測器每隔固定時間發布一次資料」這種情境\n- 這個模式你之前在Week21的ESP32主迴圈裡看過類似的邏輯(定期讀取感測器)，只是在ROS2裡不用自己寫`while`迴圈跟`delay`，改用timer機制\n\n**為什麼要用timer而不是while+sleep**：ROS2有自己的事件迴圈(spin)在背後運作，如果你自己另外寫一個`while True`迴圈，會跟ROS2的事件迴圈互相打架，用`create_timer()`才是跟ROS2框架正確協作的方式。", "is_project": false}, {"day": "週四", "content": "用ros2 topic echo除錯", "example": "ros2 topic echo /sensor_data", "explanation": "```bash\nros2 topic list              # 列出目前所有活躍的topic\nros2 topic echo /sensor_data # 即時印出這個topic上的所有訊息\nros2 topic hz /sensor_data   # 量測這個topic的實際發布頻率\n```\n\n**逐行說明**：\n- `ros2 topic echo` 是除錯時最常用的指令之一，不用自己寫訂閱節點就能直接在終端機看到topic上流動的資料\n- `ros2 topic hz` 能驗證你的timer週期設定是否真的如預期般運作，例如設定0.5秒發布一次，量測結果應該接近2Hz\n\n**為什麼這些工具很重要**：ROS2系統一旦節點變多，光靠看程式碼很難確認「資料到底有沒有正確流動」，這些命令列工具讓你能直接觀察系統的實際運作狀況，是排查ROS2系統問題的第一線工具。", "is_project": false}, {"day": "週五【小專案】", "content": "感測器模擬節點發布資料，另一節點訂閱印出", "example": "模擬距離感測器每0.5秒發布一次數值", "explanation": "**為什麼要這樣寫**：\n1. 這是ROS2裡最基礎、也最核心的通訊模式——一個節點發布、一個節點訂閱，之後Year2~Year4所有複雜的多節點系統，本質上都是這個模式的擴充組合\n2. 用timer模擬感測器數值遞減，是為了在還沒接上真實硬體前，先驗證整套Publisher/Subscriber機制運作正常，這種「先用假資料驗證架構，再接真實資料」的開發順序，能有效降低除錯的複雜度\n3. 用`ros2 topic echo`驗證資料確實有在流動，養成「寫完就用工具驗證」的習慣，而不是憑感覺覺得應該有動", "is_project": true}], "full_code": "# 感測器模擬節點發布資料，另一節點訂閱印出\n# 說明：模擬距離感測器每0.5秒發布一次數值\nimport rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float32\n\nclass SensorPublisher(Node):\n    def __init__(self):\n        super().__init__(\"sensor_publisher\")\n        self.publisher_ = self.create_publisher(Float32, \"distance\", 10)\n        self.timer = self.create_timer(0.5, self.timer_callback)\n        self.value = 100.0\n\n    def timer_callback(self):\n        msg = Float32()\n        msg.data = self.value\n        self.publisher_.publish(msg)\n        self.get_logger().info(f\"發布距離: {self.value}\")\n        self.value -= 5.0\n\ndef main():\n    rclpy.init()\n    node = SensorPublisher()\n    rclpy.spin(node)\n    node.destroy_node()\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week31", "num": 31, "title": "Week 31：Service與Action", "purpose": "承接『Node與Topic（Publisher/Subscriber）』累積的基礎，為接下來『自訂訊息與套件結構』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "理解請求/回應與長時間任務的差異", "days": [{"day": "週一", "content": "Service請求/回應概念", "example": "適合一次性、快速回應的操作", "explanation": "**概念說明**：Topic是「廣播」——發布者不知道誰在聽、也不等待任何回應；Service則是「請求/回應」模式，更像是一般程式設計中呼叫函式的感覺：Client發送一個請求，Server處理完後回傳一個結果，Client會等待這個結果。\n\n**適用時機**：像「查詢目前電池電量」這種一次性、能快速得到答案的操作，很適合用Service；而「持續回報感測器數值」這種源源不絕的資料流，適合用Topic，選對通訊模式是ROS2系統設計的重要判斷。\n\n**跟一般函式呼叫的差異**：Service是跨「節點」的請求/回應，Client節點跟Server節點可以是完全獨立、甚至跑在不同電腦上的程式，這是分散式系統跟單純函式呼叫最大的不同。", "is_project": false}, {"day": "週二", "content": "撰寫Service Server/Client", "example": "self.create_service(AddTwoInts, 'add', self.callback)", "explanation": "```python\nfrom example_interfaces.srv import AddTwoInts\n\n# Server端\nself.srv = self.create_service(AddTwoInts, \"add_two_ints\", self.add_callback)\n\ndef add_callback(self, request, response):\n    response.sum = request.a + request.b\n    return response\n```\n```python\n# Client端\nclient = self.create_client(AddTwoInts, \"add_two_ints\")\nrequest = AddTwoInts.Request()\nrequest.a = 3\nrequest.b = 5\nfuture = client.call_async(request)\n```\n\n**逐行說明**：\n- Service需要定義好`.srv`格式(這裡用ROS2內建的範例`AddTwoInts`)，包含request跟response兩部分的資料結構\n- Server端的callback函式收到request，處理完後把結果填進response回傳\n- Client端用`call_async()`發送非同步請求，回傳一個`future`物件，之後可以檢查這個future是否已經有結果", "is_project": false}, {"day": "週三", "content": "Action概念與適用場景", "example": "適合長時間任務且需要進度回報", "explanation": "**概念說明**：Action是比Service更進階的通訊模式，專門設計給「需要長時間執行、而且過程中要回報進度」的任務使用，例如「移動到某個座標」這種任務可能要花好幾秒甚至幾分鐘，過程中你會想知道「現在走到哪了」，也可能中途想取消。\n\n**Action的三個階段**：\n1. **Goal(目標)**：Client告訴Server要做什麼(例如移動到座標X,Y)\n2. **Feedback(回饋)**：任務執行過程中，Server持續回報進度(例如目前走到一半)\n3. **Result(結果)**：任務完成後，Server回傳最終結果\n\n**為什麼Service不夠用**：如果用Service做「移動到座標」這種長任務，Client會被卡住乾等，也完全不知道進度，而且沒辦法中途取消，這就是為什麼需要Action這種更完整的通訊模式。", "is_project": false}, {"day": "週四", "content": "撰寫簡單Action Server", "example": "理解goal/feedback/result三階段", "explanation": "```python\nfrom rclpy.action import ActionServer\nfrom example_interfaces.action import Fibonacci\n\nself._action_server = ActionServer(\n    self, Fibonacci, \"fibonacci\", self.execute_callback\n)\n\ndef execute_callback(self, goal_handle):\n    feedback_msg = Fibonacci.Feedback()\n    feedback_msg.partial_sequence = [0, 1]\n\n    for i in range(1, goal_handle.request.order):\n        feedback_msg.partial_sequence.append(\n            feedback_msg.partial_sequence[i] + feedback_msg.partial_sequence[i-1]\n        )\n        goal_handle.publish_feedback(feedback_msg)  # 回報進度\n\n    goal_handle.succeed()\n    result = Fibonacci.Result()\n    result.sequence = feedback_msg.partial_sequence\n    return result\n```\n\n**逐行說明**：\n- 這個範例用經典的費氏數列計算示範Action的三階段：接收goal(要算到第幾項)、過程中持續`publish_feedback()`回報目前算到哪、最後回傳完整結果\n- `goal_handle.succeed()` 標記這個任務執行成功，之後才能回傳result\n\n**為什麼先用這個抽象範例而不是直接接AGV移動**：先理解Action機制本身的三階段架構，之後Year3~Year4真的要做「AGV移動到指定座標」這種Action應用時，你已經熟悉整個溝通模式，只需要替換成實際的移動邏輯。", "is_project": false}, {"day": "週五【小專案】", "content": "寫一個Service讓節點互相查詢電池電量", "example": "Client發送查詢請求，Server回傳目前電量", "explanation": "**為什麼要這樣寫**：\n1. 用「查詢電池電量」這個具體的機器人情境，取代抽象的加法範例，讓你更直觀理解Service適合用在什麼場景——查詢電量是一次性、能快速回應的操作，正是Service的典型應用\n2. 這個小專案完成後，你已經掌握ROS2三種主要通訊模式(Topic持續資料流、Service一次性查詢、Action長任務)，可以依實際需求正確選擇要用哪一種，這是設計ROS2系統架構的核心能力\n3. 之後Year2~Year4的專案裡，你會頻繁需要在這三種模式之間做選擇，這週建立的判斷能力會持續派上用場", "is_project": true}], "full_code": "# 寫一個Service讓節點互相查詢電池電量\n# 說明：Client發送查詢請求，Server回傳目前電量\nimport rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float32\n\nclass SensorPublisher(Node):\n    def __init__(self):\n        super().__init__(\"sensor_publisher\")\n        self.publisher_ = self.create_publisher(Float32, \"distance\", 10)\n        self.timer = self.create_timer(0.5, self.timer_callback)\n        self.value = 100.0\n\n    def timer_callback(self):\n        msg = Float32()\n        msg.data = self.value\n        self.publisher_.publish(msg)\n        self.get_logger().info(f\"發布距離: {self.value}\")\n        self.value -= 5.0\n\ndef main():\n    rclpy.init()\n    node = SensorPublisher()\n    rclpy.spin(node)\n    node.destroy_node()\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week32", "num": 32, "title": "Week 32：自訂訊息與套件結構", "purpose": "承接『Service與Action』累積的基礎，為接下來『Launch files與參數管理』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "自訂msg型別、規範package結構", "days": [{"day": "週一", "content": "自訂msg檔案撰寫", "example": "在msg/SensorData.msg定義float32 distance", "explanation": "```\n# msg/SensorData.msg\nfloat32 distance\nfloat32 battery\nstring mode\n```\n\n**逐行說明**：\n- `.msg`檔案定義訊息的資料結構，每一行是「型別 欄位名稱」，這裡定義了一個包含距離、電量、模式三個欄位的自訂訊息型別\n- ROS2內建型別(如`std_msgs/String`)只能傳單一種資料，當你需要同時傳遞好幾個相關數值時(例如AGV的完整狀態)，自訂訊息型別能讓資料結構更清楚、更符合語意\n\n**為什麼不乾脆傳三個獨立的Topic**：把相關的資料包在同一個訊息裡，能確保這幾個數值是「同一時刻」量測到的一組資料，如果拆成三個獨立topic分別發布，接收端要自己想辦法對齊時間戳記，複雜度反而更高。", "is_project": false}, {"day": "週二", "content": "package.xml與CMakeLists設定", "example": "加入訊息產生所需的依賴設定", "explanation": "```xml\n<!-- package.xml -->\n<depend>rosidl_default_generators</depend>\n<member_of_group>rosidl_interface_packages</member_of_group>\n```\n```cmake\n# CMakeLists.txt\nfind_package(rosidl_default_generators REQUIRED)\nrosidl_generate_interfaces(${PROJECT_NAME}\n  \"msg/SensorData.msg\"\n)\n```\n\n**逐行說明**：\n- `package.xml` 宣告這個套件依賴哪些其他套件，`rosidl_default_generators`是產生自訂訊息型別程式碼所需的工具\n- `CMakeLists.txt` 即使是Python套件，自訂訊息的產生過程仍然需要用到CMake建置系統，這是ROS2訊息系統底層的固定機制\n- `rosidl_generate_interfaces()` 指定要把哪些`.msg`檔案編譯成可用的程式碼\n\n**為什麼設定看起來很繁瑣**：自訂訊息型別背後其實會自動產生C++和Python兩種語言都能使用的程式碼，讓不同語言寫的節點都能用同一套訊息格式溝通，這些設定檔就是在告訴建置系統怎麼做這件事。", "is_project": false}, {"day": "週三", "content": "在Python節點中使用自訂訊息", "example": "from my_pkg.msg import SensorData", "explanation": "```python\nfrom my_pkg.msg import SensorData\n\nmsg = SensorData()\nmsg.distance = 23.5\nmsg.battery = 80.0\nmsg.mode = \"auto\"\n\nself.publisher_.publish(msg)\n```\n\n**逐行說明**：\n- build完成後，自訂的`SensorData`型別就可以像內建型別一樣直接import使用\n- 建立訊息物件、填入各欄位值、發布，整套流程跟使用內建`String`型別完全一樣，這是ROS2訊息系統設計的一致性優點\n\n**為什麼要先build才能import**：`.msg`檔案本身只是定義檔，實際的Python類別是colcon build時才會自動產生出來，這也是為什麼修改`.msg`檔案後，一定要重新`colcon build`才會生效，忘記重新build是新手常見的困惑點。", "is_project": false}, {"day": "週四", "content": "套件目錄結構規範", "example": "整理成符合ROS2慣例的資料夾結構", "explanation": "**標準結構**：\n```\nmy_pkg/\n├── msg/\n│   └── SensorData.msg\n├── my_pkg/\n│   ├── __init__.py\n│   └── sensor_publisher.py\n├── package.xml\n├── setup.py\n└── CMakeLists.txt\n```\n\n**為什麼要遵循這個結構**：ROS2的建置系統(colcon)依賴特定的檔案跟資料夾命名慣例才能正確找到並建置你的套件，隨意更動結構容易造成build失敗或找不到訊息型別。這種「約定優於設定」的設計哲學，讓所有ROS2套件都有一致的結構，也是為什麼你能快速看懂別人寫的ROS2套件——因為大家都遵守同一套慣例。", "is_project": false}, {"day": "週五【小專案】", "content": "自訂SensorData.msg並在節點間傳遞", "example": "包含distance、battery兩個欄位並成功傳遞", "explanation": "**為什麼要這樣寫**：\n1. 把本週學到的自訂訊息定義、建置設定、套件結構規範全部串起來，做出一組真正能在Publisher/Subscriber節點間傳遞的自訂資料格式\n2. 這是Week30學到的Topic機制，搭配自訂訊息型別的正式升級版——之前傳的是內建`String`或`Float32`，現在能一次傳遞一組結構化的AGV狀態資料\n3. 這個技巧會直接用在下週(Week33)的launch file整合，以及之後Week46把YOLOv8偵測結果包裝成自訂訊息發布給其他節點使用，是ROS2系統開發中非常核心的能力", "is_project": true}], "full_code": "# 自訂SensorData.msg並在節點間傳遞\n# 說明：包含distance、battery兩個欄位並成功傳遞\nimport rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float32\n\nclass SensorPublisher(Node):\n    def __init__(self):\n        super().__init__(\"sensor_publisher\")\n        self.publisher_ = self.create_publisher(Float32, \"distance\", 10)\n        self.timer = self.create_timer(0.5, self.timer_callback)\n        self.value = 100.0\n\n    def timer_callback(self):\n        msg = Float32()\n        msg.data = self.value\n        self.publisher_.publish(msg)\n        self.get_logger().info(f\"發布距離: {self.value}\")\n        self.value -= 5.0\n\ndef main():\n    rclpy.init()\n    node = SensorPublisher()\n    rclpy.spin(node)\n    node.destroy_node()\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week33", "num": 33, "title": "Week 33：Launch files與參數管理", "purpose": "承接『自訂訊息與套件結構』累積的基礎，為接下來『ROS2整合小專案』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "用launch file一次啟動多個節點", "days": [{"day": "週一", "content": "Python launch file基礎", "example": "撰寫launch.py同時描述多個節點", "explanation": "```python\n# launch/my_launch.py\nfrom launch import LaunchDescription\nfrom launch_ros.actions import Node\n\ndef generate_launch_description():\n    return LaunchDescription([\n        Node(package=\"my_pkg\", executable=\"sensor_publisher\", name=\"sensor_pub\"),\n        Node(package=\"my_pkg\", executable=\"controller\", name=\"controller\"),\n    ])\n```\n```bash\nros2 launch my_pkg my_launch.py\n```\n\n**逐行說明**：\n- `LaunchDescription` 是一份啟動清單，裡面列出這次要一起啟動的所有節點\n- 每個`Node()`指定要啟動哪個套件、哪個可執行檔、給它取什麼名字\n- 執行`ros2 launch`時，會依照清單裡的內容一次啟動所有節點，不用像之前那樣開好幾個終端機分別`ros2 run`\n\n**為什麼需要launch file**：隨著系統越來越複雜，一個完整的AGV系統可能需要同時啟動感測器節點、控制節點、視覺節點等好幾個Node，launch file讓你一行指令就能啟動整套系統。", "is_project": false}, {"day": "週二", "content": "節點參數（parameters）設定", "example": "self.declare_parameter('speed', 50)", "explanation": "```python\nself.declare_parameter(\"speed\", 50)\nspeed = self.get_parameter(\"speed\").value\n```\n```python\nNode(\n    package=\"my_pkg\", executable=\"controller\",\n    parameters=[{\"speed\": 80}]\n)\n```\n\n**逐行說明**：\n- `declare_parameter(名稱, 預設值)` 讓節點內部的某個數值可以從外部設定，而不是寫死在程式碼裡\n- 在launch file裡透過`parameters=[{...}]`可以在啟動節點時就指定不同的參數值，不需要修改節點原始碼\n\n**為什麼要用parameter**：假設AGV有兩種型號，速度上限不同，同一份程式碼只要在launch file裡給不同的參數值，就能適用不同型號，不用維護兩份幾乎一樣的程式碼。", "is_project": false}, {"day": "週三", "content": "從yaml檔載入參數", "example": "用config.yaml管理不同環境的參數設定", "explanation": "```yaml\ncontroller:\n  ros__parameters:\n    speed: 80\n    max_speed: 150\n```\n```python\nNode(\n    package=\"my_pkg\", executable=\"controller\",\n    parameters=[\"config/controller_params.yaml\"]\n)\n```\n\n**逐行說明**：\n- yaml檔案把所有參數集中管理在一個檔案裡，而不是散落在launch file的程式碼中\n- `ros__parameters`是ROS2規定的固定寫法\n\n**為什麼要用yaml**：當要在模擬環境跟實體AGV之間切換不同的參數組合時，yaml檔案讓你只要換一個設定檔就能切換整套配置，不需要修改任何程式碼。", "is_project": false}, {"day": "週四", "content": "launch中設定namespace", "example": "避免多台機器人節點名稱衝突", "explanation": "```python\nNode(\n    package=\"my_pkg\", executable=\"controller\",\n    namespace=\"agv_01\"\n)\n```\n\n**逐行說明**：\n- `namespace` 會在節點名稱、topic名稱前面加上前綴，例如`/status`會變成`/agv_01/status`\n- 多台AGV同時運作時各自用不同的namespace，就能避免名稱互相衝突\n\n**為什麼要提前學這個**：這是之後想做車隊管理(多台AGV協同工作，呼應接案目標)時一定會需要的基礎機制，提前熟悉能讓你在真正需要時直接上手。", "is_project": false}, {"day": "週五【小專案】", "content": "寫一個launch file同時啟動感測器與控制節點", "example": "一行指令啟動整套系統", "explanation": "**為什麼要這樣寫**：\n1. 把Week30寫的感測器發布節點跟訂閱節點，改用一個launch file一次啟動，體驗效率差異\n2. 搭配parameter跟yaml設定，讓launch file具備彈性，之後調整參數只需要改yaml不用碰程式碼\n3. 完成後，開發流程正式從「單一節點測試」進化成「多節點系統啟動」，是Week34整合小專案的直接前置準備", "is_project": true}], "full_code": "# 寫一個launch file同時啟動感測器與控制節點\n# 說明：一行指令啟動整套系統\nimport rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float32\n\nclass SensorPublisher(Node):\n    def __init__(self):\n        super().__init__(\"sensor_publisher\")\n        self.publisher_ = self.create_publisher(Float32, \"distance\", 10)\n        self.timer = self.create_timer(0.5, self.timer_callback)\n        self.value = 100.0\n\n    def timer_callback(self):\n        msg = Float32()\n        msg.data = self.value\n        self.publisher_.publish(msg)\n        self.get_logger().info(f\"發布距離: {self.value}\")\n        self.value -= 5.0\n\ndef main():\n    rclpy.init()\n    node = SensorPublisher()\n    rclpy.spin(node)\n    node.destroy_node()\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week34", "num": 34, "title": "Week 34：ROS2整合小專案", "purpose": "承接『Launch files與參數管理』累積的基礎，為接下來『Gazebo基礎與世界建置』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "整合ESP32/pyserial資料進ROS2生態系", "days": [{"day": "週一", "content": "設計序列埠橋接節點架構", "example": "規劃ESP32資料如何進入ROS2生態系", "explanation": "**架構規劃**：ESP32透過pyserial已經能跟Python溝通，但ESP32本身不會直接說ROS2的語言，這週要設計一個「橋接節點(bridge node)」——一邊用pyserial讀ESP32的資料，一邊把讀到的資料轉發成ROS2 topic。\n\n**資料流向**：\n```\nESP32(感測器) --pyserial--> serial_bridge節點 --ROS2 topic--> 其他訂閱節點\n```\n\n**為什麼要多一層橋接**：ESP32的運算資源有限，跑完整的ROS2堆疊不切實際，業界常見做法就是用一個橋接節點在有完整運算資源的裝置上，負責把非ROS2裝置的資料轉譯進ROS2生態系。", "is_project": false}, {"day": "週二", "content": "撰寫serial_bridge節點", "example": "用pyserial讀取ESP32資料並發布成topic", "explanation": "```python\nimport serial\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float32\n\nclass SerialBridge(Node):\n    def __init__(self):\n        super().__init__(\"serial_bridge\")\n        self.ser = serial.Serial(\"/dev/ttyUSB0\", 115200, timeout=1)\n        self.publisher_ = self.create_publisher(Float32, \"distance\", 10)\n        self.timer = self.create_timer(0.1, self.read_and_publish)\n\n    def read_and_publish(self):\n        line = self.ser.readline().decode().strip()\n        if line:\n            try:\n                value = float(line)\n                msg = Float32()\n                msg.data = value\n                self.publisher_.publish(msg)\n            except ValueError:\n                pass\n```\n\n**逐行說明**：\n- 結合了pyserial讀取、例外處理、Publisher機制，是本週整合精神的具體體現\n- 用`create_timer()`定期檢查序列埠，而不是無窮迴圈，避免跟ROS2事件迴圈衝突", "is_project": false}, {"day": "週三", "content": "用rqt_graph視覺化節點關係", "example": "檢查topic連接是否符合預期", "explanation": "```bash\nrqt_graph\n```\n\n**做什麼**：`rqt_graph`會畫出目前所有節點跟topic之間的連接關係圖，橢圓形代表節點、方框代表topic，箭頭代表資料流向。\n\n**為什麼要用視覺化工具**：系統節點數量變多時，光憑閱讀程式碼很難拼湊出完整資料流向，`rqt_graph`能一眼看出「這個topic有誰在發布、有誰在訂閱」，是排查ROS2系統架構問題的高效率工具。", "is_project": false}, {"day": "週四", "content": "整合測試與除錯", "example": "確認資料延遲與遺失狀況", "explanation": "**測試重點**：\n1. 用`ros2 topic hz /distance`確認發布頻率是否穩定\n2. 用`ros2 topic echo /distance`長時間觀察，確認數值有無異常跳動\n3. 拔插ESP32的USB線模擬斷線情境，確認節點是否能優雅處理錯誤\n\n**為什麼要故意測試斷線情境**：真實環境中USB接觸不良很常見，如果橋接節點一遇到斷線就crash，會讓整個ROS2系統失去這個關鍵資料來源。", "is_project": false}, {"day": "週五【小專案】", "content": "序列埠資料橋接成ROS2 topic並可視化", "example": "ESP32感測器資料即時顯示在rqt或終端機", "explanation": "**為什麼這是重要的整合點**：\n1. 這是第一次讓Year1的ESP32硬體跟Year2的ROS2生態系正式接軌\n2. 完成後，ESP32感測器資料可以被任何ROS2節點訂閱使用，包括之後Week38的Gazebo避障邏輯\n3. 這種漸進式整合而非打掉重練的開發方式，是實務上大型系統演進的常見模式", "is_project": true}], "full_code": "# 序列埠資料橋接成ROS2 topic並可視化\n# 說明：ESP32感測器資料即時顯示在rqt或終端機\nimport rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float32\n\nclass SensorPublisher(Node):\n    def __init__(self):\n        super().__init__(\"sensor_publisher\")\n        self.publisher_ = self.create_publisher(Float32, \"distance\", 10)\n        self.timer = self.create_timer(0.5, self.timer_callback)\n        self.value = 100.0\n\n    def timer_callback(self):\n        msg = Float32()\n        msg.data = self.value\n        self.publisher_.publish(msg)\n        self.get_logger().info(f\"發布距離: {self.value}\")\n        self.value -= 5.0\n\ndef main():\n    rclpy.init()\n    node = SensorPublisher()\n    rclpy.spin(node)\n    node.destroy_node()\n    rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week35", "num": 35, "title": "Week 35：Gazebo基礎與世界建置", "purpose": "承接『ROS2整合小專案』累積的基礎，為接下來『URDF/SDF建立機器人模型』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "建立simulation world、擺放模型", "days": [{"day": "週一", "content": "Gazebo安裝與基本操作介面", "example": "了解world、model、plugin的關係", "explanation": "**概念關係**：\n- **World(世界)**：整個模擬場景，包含地板、光源、重力設定\n- **Model(模型)**：放在world裡的物體，靜態箱子或你的AGV機器人\n- **Plugin(外掛)**：讓模型具備行為的程式碼，例如讓馬達模型真的能回應速度指令\n\n**為什麼要學模擬器**：實體AGV測試需要真的組裝硬體、找場地、有摔壞風險；Gazebo讓你能在電腦裡先驗證邏輯是否正確，大幅降低開發成本與風險，這是機器人開發流程「先模擬、後上實體」的核心價值。", "is_project": false}, {"day": "週二", "content": "建立簡單的world檔案", "example": "用SDF定義地板、牆壁、光源", "explanation": "```xml\n<?xml version=\"1.0\"?>\n<sdf version=\"1.7\">\n  <world name=\"my_world\">\n    <include><uri>model://ground_plane</uri></include>\n    <include><uri>model://sun</uri></include>\n  </world>\n</sdf>\n```\n\n**逐行說明**：\n- SDF是Gazebo用來描述模擬世界的XML格式\n- 直接引用內建的`ground_plane`地板模型，不用自己從零建立\n- `model://sun`加入太陽光源，不然畫面會全黑\n\n**為什麼用XML描述場景**：這種宣告式描述讓場景設定跟渲染邏輯分離，也方便重複使用、修改既有場景。", "is_project": false}, {"day": "週三", "content": "放置現成模型到場景", "example": "從model庫中拖入桌子、箱子等物件", "explanation": "```xml\n<model name=\"obstacle_box\">\n  <pose>1 0 0.25 0 0 0</pose>\n  <link name=\"link\">\n    <collision name=\"collision\">\n      <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n    </collision>\n    <visual name=\"visual\">\n      <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n    </visual>\n  </link>\n</model>\n```\n\n**逐行說明**：\n- `<pose>`前三個數字是x/y/z座標，後三個是roll/pitch/yaw旋轉角度\n- `<collision>`定義碰撞範圍，`<visual>`定義視覺外觀，兩者可以不同\n\n**為什麼要分開定義**：複雜視覺模型直接拿來做碰撞運算會很耗費效能，分開定義讓你能用簡單方框做碰撞偵測，同時保留精細視覺呈現。", "is_project": false}, {"day": "週四", "content": "camera視角與模擬時間控制", "example": "調整視角、暫停/加速模擬", "explanation": "**操作重點**：滑鼠左鍵拖曳旋轉視角、滾輪縮放、右鍵拖曳平移。模擬時間可以暫停、單步執行、或加速播放。\n\n**為什麼要熟悉這些操作**：之後要觀察AGV為什麼在某瞬間做出奇怪行為，暫停跟單步功能能精確定位問題發生的那一刻，比全速跑完再回頭猜測有效率得多。", "is_project": false}, {"day": "週五【小專案】", "content": "自訂一個簡單的模擬場地", "example": "建立一個含障礙物的小型測試場地", "explanation": "**為什麼要這樣寫**：\n1. 從空白world開始，加入地板、光源、幾個障礙物方塊，這是打造AGV測試場的第一步\n2. 障礙物擺放最好模擬真實場景(走廊、桌腳)，讓避障測試更貼近實際使用情境\n3. 這個場地檔案會被重複使用到Year2剩下所有模擬週次，當作持續累積的資產來對待", "is_project": true}], "full_code": "<!-- 自訂一個簡單的模擬場地 -->\n<!-- 說明：建立一個含障礙物的小型測試場地 -->\n<?xml version=\"1.0\"?>\n<sdf version=\"1.7\">\n  <world name=\"agv_test_world\">\n    <include><uri>model://ground_plane</uri></include>\n    <include><uri>model://sun</uri></include>\n    <model name=\"obstacle_box\">\n      <pose>1 0 0.25 0 0 0</pose>\n      <link name=\"link\">\n        <collision name=\"collision\">\n          <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n        </collision>\n        <visual name=\"visual\">\n          <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n        </visual>\n      </link>\n    </model>\n  </world>\n</sdf>\n"}, {"sheet": "Week36", "num": 36, "title": "Week 36：URDF/SDF建立機器人模型", "purpose": "承接『Gazebo基礎與世界建置』累積的基礎，為接下來『Gazebo與ROS2整合』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "定義link、joint描述機器人結構", "days": [{"day": "週一", "content": "URDF基本語法（link/joint）", "example": "<link name='base_link'>...</link>", "explanation": "```xml\n<robot name=\"simple_agv\">\n  <link name=\"base_link\">\n    <visual>\n      <geometry><box size=\"0.3 0.2 0.1\"/></geometry>\n    </visual>\n  </link>\n</robot>\n```\n\n**逐行說明**：\n- URDF是描述機器人結構的標準格式，跟SDF很像但專門用來描述機器人本身\n- `<link>`代表機器人的一個剛體部件，底盤、輪子都是獨立的link\n\n**為什麼要學另一種格式**：URDF被MoveIt2、RViz等大量ROS2工具直接支援，這是描述機器人本身要用URDF而不是SDF的原因。", "is_project": false}, {"day": "週二", "content": "定義輪子與底盤的joint關係", "example": "<joint type='continuous'>用於輪子旋轉", "explanation": "```xml\n<joint name=\"left_wheel_joint\" type=\"continuous\">\n  <parent link=\"base_link\"/>\n  <child link=\"left_wheel\"/>\n  <origin xyz=\"0 0.15 0\" rpy=\"1.5708 0 0\"/>\n  <axis xyz=\"0 0 1\"/>\n</joint>\n```\n\n**逐行說明**：\n- `<joint>`定義兩個link如何連接、如何相對運動，`continuous`代表可無限旋轉(適合輪子)\n- `<parent>`跟`<child>`形成一個樹狀的機器人結構\n\n**為什麼是樹狀結構**：每個部件相對於前一個部件都有固定連接關係，天然適合用樹狀結構描述，也是運動學計算的基礎。", "is_project": false}, {"day": "週三", "content": "加入碰撞與視覺屬性", "example": "<collision>與<visual>分開定義", "explanation": "```xml\n<link name=\"left_wheel\">\n  <visual>\n    <geometry><cylinder radius=\"0.05\" length=\"0.02\"/></geometry>\n  </visual>\n  <collision>\n    <geometry><cylinder radius=\"0.05\" length=\"0.02\"/></geometry>\n  </collision>\n  <inertial>\n    <mass value=\"0.1\"/>\n    <inertia ixx=\"0.0001\" iyy=\"0.0001\" izz=\"0.0001\" ixy=\"0\" ixz=\"0\" iyz=\"0\"/>\n  </inertial>\n</link>\n```\n\n**逐行說明**：\n- `<inertial>`定義質量與慣性張量，物理引擎需要這些數值才能正確模擬運動時的加速度\n\n**為什麼慣性參數重要**：質量設定不合理，模擬出的AGV可能被輕輕一碰就飛出去，或轉向反應不符合物理直覺。", "is_project": false}, {"day": "週四", "content": "用xacro簡化重複定義", "example": "用巨集減少URDF重複程式碼", "explanation": "```xml\n<xacro:macro name=\"wheel\" params=\"prefix y_offset\">\n  <link name=\"${prefix}_wheel\">\n    <visual>\n      <geometry><cylinder radius=\"0.05\" length=\"0.02\"/></geometry>\n    </visual>\n  </link>\n  <joint name=\"${prefix}_wheel_joint\" type=\"continuous\">\n    <parent link=\"base_link\"/>\n    <child link=\"${prefix}_wheel\"/>\n    <origin xyz=\"0 ${y_offset} 0\"/>\n  </joint>\n</xacro:macro>\n\n<xacro:wheel prefix=\"left\" y_offset=\"0.15\"/>\n<xacro:wheel prefix=\"right\" y_offset=\"-0.15\"/>\n```\n\n**逐行說明**：\n- xacro讓你定義可重複使用的巨集，把重複的XML結構參數化，避免複製貼上造成不一致\n\n**為什麼這對AGV很實用**：之後做四輪或六輪AGV，或機械手臂有多個結構相似關節時，xacro能大幅減少重複程式碼。", "is_project": false}, {"day": "週五【小專案】", "content": "建立簡易AGV的URDF模型", "example": "含底盤、雙輪、感測器的基本模型", "explanation": "**為什麼要這樣寫**：\n1. 把link/joint定義、慣性參數、xacro巨集全部用上，建立結構完整、符合物理邏輯的AGV模型\n2. 模型結構最好貼近實際AGV硬體的尺寸比例，讓模擬結果更有參考價值\n3. 這個URDF檔案是Week37 spawn進Gazebo、以及Year2後段MoveIt2規劃的共同基礎", "is_project": true}], "full_code": "<!-- 建立簡易AGV的URDF模型 -->\n<!-- 說明：含底盤、雙輪、感測器的基本模型 -->\n<?xml version=\"1.0\"?>\n<sdf version=\"1.7\">\n  <world name=\"agv_test_world\">\n    <include><uri>model://ground_plane</uri></include>\n    <include><uri>model://sun</uri></include>\n    <model name=\"obstacle_box\">\n      <pose>1 0 0.25 0 0 0</pose>\n      <link name=\"link\">\n        <collision name=\"collision\">\n          <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n        </collision>\n        <visual name=\"visual\">\n          <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n        </visual>\n      </link>\n    </model>\n  </world>\n</sdf>\n"}, {"sheet": "Week37", "num": 37, "title": "Week 37：Gazebo與ROS2整合", "purpose": "承接『URDF/SDF建立機器人模型』累積的基礎，為接下來『模擬中的感測器與馬達控制』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "透過ros2_control/plugin控制模擬機器人", "days": [{"day": "週一", "content": "ros2_control基本概念", "example": "理解controller_manager的角色", "explanation": "**概念說明**：`ros2_control`是ROS2裡統一管理「怎麼控制機器人硬體(或模擬硬體)」的框架，`controller_manager`負責載入不同controller，把ROS2指令轉換成實際驅動硬體或模擬器的訊號。\n\n**為什麼需要這層抽象**：沒有這個框架，在Gazebo模擬跟實體AGV上控制馬達的程式碼可能完全不同。`ros2_control`讓上層控制邏輯完全一樣，只需更換底層controller設定，就能在模擬跟實體之間切換，這是Sim-to-Real開發流程的關鍵基礎建設。", "is_project": false}, {"day": "週二", "content": "diff_drive_controller設定", "example": "設定差速輪控制器參數", "explanation": "```yaml\ndiff_drive_controller:\n  ros__parameters:\n    left_wheel_names: [\"left_wheel_joint\"]\n    right_wheel_names: [\"right_wheel_joint\"]\n    wheel_separation: 0.3\n    wheel_radius: 0.05\n```\n\n**逐行說明**：\n- `diff_drive_controller`是`ros2_control`裡專門處理雙輪差速機器人的內建控制器\n- `wheel_separation`跟`wheel_radius`必須跟URDF模型裡的實際尺寸一致\n\n**為什麼不用自己算差速邏輯**：Week15在ESP32上手動寫過差速轉向邏輯，`diff_drive_controller`把這個數學轉換標準化了，之後只需給前進速度+轉向角速度指令。", "is_project": false}, {"day": "週三", "content": "把URDF模型spawn進Gazebo", "example": "ros2 launch gazebo_ros spawn_entity.py", "explanation": "```bash\nros2 launch gazebo_ros gazebo.launch.py\nros2 run gazebo_ros spawn_entity.py -entity my_agv -topic robot_description\n```\n\n**逐行說明**：\n- 第一行先啟動Gazebo模擬器本身\n- `spawn_entity.py`把URDF模型生成進正在執行的Gazebo世界裡\n- `robot_description`是ROS2生態系機器人描述的標準topic名稱慣例\n\n**為什麼透過topic而不是直接讀檔案**：讓多個工具(Gazebo、RViz、MoveIt2)都能訂閱同一份機器人描述，避免各自讀檔造成版本不一致。", "is_project": false}, {"day": "週四", "content": "用ROS2 topic控制模擬機器人移動", "example": "發布/cmd_vel控制模擬AGV", "explanation": "```bash\nros2 topic pub /cmd_vel geometry_msgs/msg/Twist \\\n  \"{linear: {x: 0.5}, angular: {z: 0.2}}\"\n```\n\n**逐行說明**：\n- `/cmd_vel`是ROS2生態系控制機器人移動的標準topic，訊息型別`Twist`包含線速度跟角速度\n- `diff_drive_controller`會自動把這個抽象速度指令換算成左右輪各自的實際轉速\n\n**為什麼這個介面設計重要**：`/cmd_vel`是整個ROS2導航生態系(包括Year3的Nav2)共同的標準介面，之後接上任何導航演算法都能直接控制AGV。", "is_project": false}, {"day": "週五【小專案】", "content": "用ROS2 topic控制模擬中的AGV移動", "example": "終端機輸入指令，模擬AGV即時反應移動", "explanation": "**為什麼這是重要的里程碑**：\n1. AGV第一次在完整的ROS2+Gazebo生態系中動起來，是Year2前半段的重要成果整合\n2. 使用標準介面(`/cmd_vel`)代表模擬已經能跟整個ROS2生態系的其他工具相容\n3. 這個架構會直接成為Week38加入感測器與自動避障邏輯的載體", "is_project": true}], "full_code": "<!-- 用ROS2 topic控制模擬中的AGV移動 -->\n<!-- 說明：終端機輸入指令，模擬AGV即時反應移動 -->\n<?xml version=\"1.0\"?>\n<sdf version=\"1.7\">\n  <world name=\"agv_test_world\">\n    <include><uri>model://ground_plane</uri></include>\n    <include><uri>model://sun</uri></include>\n    <model name=\"obstacle_box\">\n      <pose>1 0 0.25 0 0 0</pose>\n      <link name=\"link\">\n        <collision name=\"collision\">\n          <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n        </collision>\n        <visual name=\"visual\">\n          <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n        </visual>\n      </link>\n    </model>\n  </world>\n</sdf>\n"}, {"sheet": "Week38", "num": 38, "title": "Week 38：模擬中的感測器與馬達控制", "purpose": "承接『Gazebo與ROS2整合』累積的基礎，為接下來『MoveIt2基礎概念』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "模擬超音波/光達感測器數值", "days": [{"day": "週一", "content": "模擬光達/超音波sensor plugin", "example": "在URDF中加入sensor plugin設定", "explanation": "```xml\n<gazebo reference=\"laser_link\">\n  <sensor type=\"ray\" name=\"laser_sensor\">\n    <ray>\n      <scan><horizontal><samples>360</samples></horizontal></scan>\n      <range><min>0.1</min><max>10.0</max></range>\n    </ray>\n    <plugin name=\"laser_plugin\" filename=\"libgazebo_ros_ray_sensor.so\">\n      <ros><remapping>~/out:=scan</remapping></ros>\n    </plugin>\n  </sensor>\n</gazebo>\n```\n\n**逐行說明**：\n- Gazebo的sensor plugin讓模擬中的模型模擬出感測器該有的行為，這裡示範模擬光達\n- plugin會自動把模擬感測資料發布成ROS2 topic\n\n**為什麼要模擬感測器**：讓你能在還沒有實體光達硬體時，先驗證整套避障邏輯是否正確，是模擬先行策略的核心價值。", "is_project": false}, {"day": "週二", "content": "訂閱模擬感測器資料", "example": "ros2 topic echo /scan", "explanation": "```python\nfrom sensor_msgs.msg import LaserScan\n\nself.create_subscription(LaserScan, \"/scan\", self.scan_callback, 10)\n\ndef scan_callback(self, msg):\n    min_distance = min(msg.ranges)\n    self.get_logger().info(f\"最近距離: {min_distance:.2f}m\")\n```\n\n**逐行說明**：\n- `LaserScan`是ROS2標準的光達訊息型別，`ranges`是每個角度量測到的距離陣列\n\n**跟超音波感測器的差異**：超音波只能量測單一方向，光達能一次掃描360度得到完整環境輪廓，這週先用「找最近距離」入門，Year3學SLAM時才會用完整掃描資料建圖。", "is_project": false}, {"day": "週三", "content": "撰寫簡易避障邏輯節點", "example": "訂閱sensor資料，計算安全距離", "explanation": "```python\nclass ObstacleAvoider(Node):\n    def __init__(self):\n        super().__init__(\"obstacle_avoider\")\n        self.create_subscription(LaserScan, \"/scan\", self.scan_callback, 10)\n        self.publisher_ = self.create_publisher(Twist, \"/cmd_vel\", 10)\n\n    def scan_callback(self, msg):\n        min_distance = min(msg.ranges)\n        twist = Twist()\n        if min_distance < 0.5:\n            twist.linear.x = 0.0\n        else:\n            twist.linear.x = 0.3\n        self.publisher_.publish(twist)\n```\n\n**逐行說明**：\n- 這個節點同時訂閱`/scan`跟發布`/cmd_vel`，是典型的「感知→決策→動作」控制節點\n\n**為什麼要強調概念一致性**：避障判斷邏輯從Week3就沒變過，變的只是資料來源跟指令送出的介面，理解這個模式能幫助更快掌握之後更複雜的系統。", "is_project": false}, {"day": "週四", "content": "發布速度指令實現自動避障", "example": "偵測到障礙物時發布減速/轉向指令", "explanation": "```python\ndef scan_callback(self, msg):\n    front = min(msg.ranges[0:30] + msg.ranges[-30:])\n    twist = Twist()\n    if front < 0.5:\n        twist.linear.x = 0.0\n        twist.angular.z = 0.5\n    else:\n        twist.linear.x = 0.3\n        twist.angular.z = 0.0\n    self.publisher_.publish(twist)\n```\n\n**逐行說明**：\n- 只看正前方角度範圍內的最近距離，比全部360度更符合實際避障需求\n- 偵測到過近時除了停止，還加入轉向動作主動尋找新路徑\n\n**為什麼要限定角度範圍**：如果用全部360度的最近距離判斷，側邊或後方有障礙物也會讓AGV停下，不合理。", "is_project": false}, {"day": "週五【小專案】", "content": "在Gazebo中模擬AGV自動避障", "example": "模擬AGV在場地中自動偵測並避開障礙物", "explanation": "**為什麼這是重要的里程碑**：\n1. 這是Year1 Week21(實體AGV網頁避障)在ROS2+Gazebo生態系裡的完整重現\n2. 代表你已具備在純軟體模擬環境開發、測試、驗證機器人行為邏輯的能力，這是機器人工程師核心且高價值的技能\n3. 也是Year2後段MoveIt2規劃的重要先修經驗——同樣是先在模擬驗證、再考慮接上實體硬體的開發哲學", "is_project": true}], "full_code": "<!-- 在Gazebo中模擬AGV自動避障 -->\n<!-- 說明：模擬AGV在場地中自動偵測並避開障礙物 -->\n<?xml version=\"1.0\"?>\n<sdf version=\"1.7\">\n  <world name=\"agv_test_world\">\n    <include><uri>model://ground_plane</uri></include>\n    <include><uri>model://sun</uri></include>\n    <model name=\"obstacle_box\">\n      <pose>1 0 0.25 0 0 0</pose>\n      <link name=\"link\">\n        <collision name=\"collision\">\n          <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n        </collision>\n        <visual name=\"visual\">\n          <geometry><box><size>0.5 0.5 0.5</size></box></geometry>\n        </visual>\n      </link>\n    </model>\n  </world>\n</sdf>\n"}, {"sheet": "Week39", "num": 39, "title": "Week 39：MoveIt2基礎概念", "purpose": "承接『模擬中的感測器與馬達控制』累積的基礎，為接下來『運動規劃與RViz視覺化』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "理解planning group設定，並依實體玩具手臂規格建立對應config", "days": [{"day": "週一", "content": "MoveIt2整體架構介紹", "example": "理解planning scene、planning group概念", "explanation": "**概念說明**：MoveIt2是ROS2裡處理機械手臂運動規劃的框架。兩個核心概念：\n- **Planning Scene**：手臂所處環境描述，包含手臂本身、周遭障礙物\n- **Planning Group**：定義手臂上哪些關節要一起被規劃控制\n\n**為什麼需要這麼多抽象層**：手臂運動規劃要同時考慮「怎麼移動到目標位置」跟「移動過程中不要撞到任何東西」，這比Week37的AGV平面移動複雜得多，MoveIt2把複雜問題拆解成模組化概念處理。", "is_project": false}, {"day": "週二", "content": "用MoveIt Setup Assistant產生config", "example": "依照手邊玩具機械手臂的實際軸數(4~6軸)與SG90角度範圍(0~180度)建立對應URDF/config", "explanation": "**做什麼**：MoveIt Setup Assistant圖形化工具，引導你把手臂URDF模型設定成MoveIt2能理解的完整配置。\n\n**針對SG90玩具手臂的重點**：每一節對應URDF裡的一個joint，角度限制務必設定成SG90實際能轉動的範圍(0~180度)，這是Week13已在ESP32上驗證過的實際限制。\n\n**為什麼要先確保這個對應正確**：這是Week39~42整個模組的地基，如果角度範圍設定跟實體硬體不符，後面規劃出的所有動作都只是模擬裡看起來合理，實際做不到。", "is_project": false}, {"day": "週三", "content": "planning group與end effector設定", "example": "定義手臂可規劃的關節群組，對應實體手臂各SG90的可動範圍", "explanation": "**做什麼**：指定哪幾個joint歸類成同一個planning group(通常叫`arm`)，並指定手臂末端為end effector(末端執行器)。\n\n**為什麼要特別標記end effector**：MoveIt2的路徑規劃核心任務是「計算出關節角度組合，讓end effector到達指定目標」，沒有正確標記，規劃器不知道要優化誰的位置。\n\n**跟實體SG90的對應**：確認每個SG90對應到規劃群組的哪一個關節，會影響Week42要送給每顆SG90的指令怎麼對應。", "is_project": false}, {"day": "週四", "content": "在RViz中載入MoveIt2設定", "example": "確認模擬模型的關節限制與實體玩具手臂規格一致", "explanation": "**做什麼**：用RViz載入MoveIt2設定，手動拖曳互動標記，觀察模擬手臂的關節活動範圍。\n\n**驗證重點**：\n1. 每個關節能不能轉到0度跟180度極限，超過應該被拒絕規劃\n2. 手臂在極限角度時會不會自我碰撞\n\n**為什麼要花時間驗證**：這是唯一一次純模擬環境的驗證機會，Week42就要接上實體硬體，及早驗證能省下大量除錯時間。", "is_project": false}, {"day": "週五【小專案】", "content": "設定一組對應實體玩具手臂的MoveIt2 config", "example": "依照手邊SG90玩具手臂規格產出可用的planning設定並成功載入RViz", "explanation": "**為什麼要這樣寫**：\n1. 這是「數位分身(digital twin)」的建立——讓MoveIt2的模擬手臂在關節數量、角度限制上精確對應實體SG90手臂\n2. 花時間確保這個對應精確，比急著往下做運動規劃更重要\n3. 完成後，擁有一個「在RViz看到的每個動作，實體SG90都做得到」的可信賴模擬環境", "is_project": true}], "full_code": "# 設定一組對應實體玩具手臂的MoveIt2 config\n# 說明：依照手邊SG90玩具手臂規格產出可用的planning設定並成功載入RViz\nimport rclpy\nfrom moveit_commander import MoveGroupCommander\n\ndef main():\n    rclpy.init()\n    move_group = MoveGroupCommander(\"arm\")\n\n    target_pose = move_group.get_current_pose().pose\n    target_pose.position.z += 0.1\n\n    move_group.set_pose_target(target_pose)\n    success = move_group.go(wait=True)\n    move_group.stop()\n\n    print(\"規劃執行結果:\", \"成功\" if success else \"失敗\")\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week40", "num": 40, "title": "Week 40：運動規劃與RViz視覺化", "purpose": "承接『MoveIt2基礎概念』累積的基礎，為接下來『逆向運動學與碰撞檢測』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能規劃並在RViz顯示手臂運動路徑", "days": [{"day": "週一", "content": "用RViz互動式規劃目標姿態", "example": "拖曳互動標記設定手臂目標位置", "explanation": "**做什麼**：RViz會顯示一個可拖曳的3D互動標記(通常在end effector位置)，拖曳到目標位置，RViz即時顯示半透明的預覽姿態。\n\n**為什麼要先用互動方式**：透過滑鼠拖曳直覺地探索手臂可達範圍，能建立對這台手臂能做到什麼、做不到什麼的空間直覺，之後用程式碼設定目標座標時會很有幫助。", "is_project": false}, {"day": "週二", "content": "呼叫規劃並顯示軌跡", "example": "在RViz中按下Plan觀察預覽軌跡", "explanation": "**做什麼**：設定目標姿態後按下Plan按鈕，MoveIt2計算出一條無碰撞路徑並以動畫預覽。\n\n**觀察重點**：路徑是否流暢自然；規劃失敗時常見原因是目標超出可達範圍或被障礙物完全擋住。\n\n**為什麼規劃跟執行要分開**：先預覽確認合理性，避免不合理路徑直接驅動硬體，是機器人安全操作的重要原則。", "is_project": false}, {"day": "週三", "content": "用Python MoveGroup介面規劃", "example": "move_group.set_pose_target(pose)", "explanation": "```python\nfrom moveit_commander import MoveGroupCommander\n\nmove_group = MoveGroupCommander(\"arm\")\n\ntarget_pose = move_group.get_current_pose().pose\ntarget_pose.position.z += 0.1\n\nmove_group.set_pose_target(target_pose)\nplan = move_group.plan()\n```\n\n**逐行說明**：\n- `MoveGroupCommander(\"arm\")`連接到規劃群組\n- 以目前位置為基準相對移動，比寫死絕對座標更不容易出錯\n- `set_pose_target()`設定目標，`.plan()`執行規劃\n\n**為什麼要從GUI進化成寫程式**：實際要讓系統自動化運作，一定要能用程式碼呼叫這些功能。", "is_project": false}, {"day": "週四", "content": "執行規劃結果（Plan & Execute）", "example": "move_group.go(wait=True)", "explanation": "```python\nsuccess = move_group.go(wait=True)\nmove_group.stop()\nmove_group.clear_pose_targets()\n```\n\n**逐行說明**：\n- `go(wait=True)`同時規劃跟執行，等到動作完成才繼續\n- `stop()`確保動作結束後完全靜止\n- `clear_pose_targets()`清除目標避免下次規劃被干擾\n\n**為什麼每次都要清除目標**：容易被忽略的細節，不清除可能疊加到下次目標設定，導致規劃出乎意料的結果。", "is_project": false}, {"day": "週五【小專案】", "content": "在RViz中規劃一段抓取動作路徑", "example": "設定起始與目標姿態並成功執行動作", "explanation": "**為什麼要這樣寫**：\n1. 把互動式規劃、程式化規劃、Plan & Execute串成一次真正的抓取動作路徑，是Week41加入障礙物、Week42接上實體硬體的完整暖身\n2. 先在純模擬環境把整個流程走順，再考慮下週的障礙物複雜度，循序漸進降低單次學習難度\n3. 完成後代表已能用程式碼完整控制一次手臂從A到B的規劃與執行", "is_project": true}], "full_code": "# 在RViz中規劃一段抓取動作路徑\n# 說明：設定起始與目標姿態並成功執行動作\nimport rclpy\nfrom moveit_commander import MoveGroupCommander\n\ndef main():\n    rclpy.init()\n    move_group = MoveGroupCommander(\"arm\")\n\n    target_pose = move_group.get_current_pose().pose\n    target_pose.position.z += 0.1\n\n    move_group.set_pose_target(target_pose)\n    success = move_group.go(wait=True)\n    move_group.stop()\n\n    print(\"規劃執行結果:\", \"成功\" if success else \"失敗\")\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week41", "num": 41, "title": "Week 41：逆向運動學與碰撞檢測", "purpose": "承接『運動規劃與RViz視覺化』累積的基礎，為接下來『MoveIt2整合小專案』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "理解IK求解與碰撞檢查機制", "days": [{"day": "週一", "content": "正向運動學 vs 逆向運動學概念", "example": "理解由末端姿態反推關節角度的意義", "explanation": "**概念說明**：\n- **正向運動學(Forward Kinematics)**：已知每個關節的角度，計算末端執行器(夾爪)最終會在空間中的哪個座標——這個方向的計算相對單純，就是把每個關節的旋轉跟連桿長度依序疊加\n- **逆向運動學(Inverse Kinematics, IK)**：反過來，已知你想要夾爪到達的座標，反推每個關節該轉幾度才能達成——這個方向的計算複雜得多，因為同一個目標座標，可能有好幾組不同的關節角度組合都能到達(這叫「多解」)，甚至有些目標座標根本無法到達\n\n**為什麼IK比FK難**：正向運動學是單純的數學疊加，答案唯一；逆向運動學要「反推」，數學上通常需要用迭代逼近或解析解公式求解，且解可能不只一組，這也是為什麼Week39~40你都是直接指定末端目標姿態、讓MoveIt2幫你處理背後的IK計算，而不用自己手寫。", "is_project": false}, {"day": "週二", "content": "IK求解器設定（KDL/TRAC-IK）", "example": "了解不同求解器的差異", "explanation": "**常見IK求解器比較**：\n- **KDL(Kinematics and Dynamics Library)**：MoveIt2預設內建的求解器，基於數值迭代方法，通用但速度較慢、遇到複雜姿態容易求解失敗\n- **TRAC-IK**：業界常用的替代方案，結合了兩種演算法同時求解取較快的結果，成功率跟速度通常都優於預設的KDL\n\n**設定方式**：在Setup Assistant產生的`kinematics.yaml`檔案裡，可以指定要用哪個求解器：\n```yaml\narm:\n  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin\n  kinematics_solver_timeout: 0.05\n```\n\n**為什麼要換求解器**：如果你發現MoveIt2常常對某些目標姿態規劃失敗(尤其是手臂軸數較少、活動範圍受限的玩具手臂)，換一個更強健的IK求解器，往往能明顯改善成功率，這是遇到規劃失敗時值得優先嘗試的排查方向。", "is_project": false}, {"day": "週三", "content": "在planning scene中加入障礙物", "example": "scene.add_box('obstacle', pose, size)", "explanation": "```python\nfrom moveit_commander import PlanningSceneInterface\nfrom geometry_msgs.msg import PoseStamped\n\nscene = PlanningSceneInterface()\n\nobstacle_pose = PoseStamped()\nobstacle_pose.header.frame_id = \"base_link\"\nobstacle_pose.pose.position.x = 0.3\nobstacle_pose.pose.position.z = 0.1\n\nscene.add_box(\"obstacle\", obstacle_pose, size=(0.1, 0.1, 0.1))\n```\n\n**逐行說明**：\n- `PlanningSceneInterface` 讓你能用程式碼動態地在規劃場景裡新增、移除障礙物，不用手動在Gazebo或RViz裡放置\n- `frame_id = \"base_link\"` 代表這個障礙物的座標是相對於手臂底座的座標系，這是ROS2裡「座標系(frame)」的基本概念——同一個座標數字，在不同frame下代表的實際位置不一樣\n- `add_box()` 加入一個長方體障礙物，MoveIt2規劃路徑時會自動把這個物件納入考量\n\n**為什麼要能動態新增障礙物**：真實場景中的物體位置常常是視覺系統即時偵測出來的(這正是Year3要做的事)，能用程式碼動態新增/更新障礙物，才能讓手臂根據「當下看到的環境」即時調整規劃路徑，而不是永遠只認得寫死在設定檔裡的固定場景。", "is_project": false}, {"day": "週四", "content": "測試路徑自動避開障礙物", "example": "驗證規劃器是否會繞開新加入的障礙物", "explanation": "**測試方式**：先在障礙物加入「前」規劃一次路徑，觀察路徑會直接穿過障礙物所在位置(因為規劃場景裡還沒有這個障礙物)；加入障礙物後重新規劃同樣的目標，比較新路徑是否會繞開障礙物。\n\n**驗證重點**：\n- 規劃成功率：有些障礙物位置可能讓目標完全無法到達，這時候規劃會直接失敗，這是合理的行為，不是bug\n- 路徑合理性：繞開的路徑是否還算「自然」，如果MoveIt2規劃出很怪異、大幅度繞路的路徑，可能需要調整規劃演算法的參數(例如允許的規劃時間)\n\n**為什麼要親自對比「加入前/加入後」**：這種「控制變因」的測試方式，能明確證明是障礙物設定生效了，而不是恰好路徑本來就沒經過那個位置，這是驗證系統行為時很重要的實驗方法習慣。", "is_project": false}, {"day": "週五【小專案】", "content": "加入障礙物並測試路徑是否會自動避開", "example": "手臂規劃路徑能成功避開場景中的障礙物", "explanation": "**為什麼要這樣寫**：\n1. 把本週學到的IK求解器設定、動態障礙物新增、路徑驗證方法整合起來，做出一個「手臂會自動避開障礙物」的完整demo\n2. 這是Week38「AGV自動避障」概念在機械手臂領域的對應版本——同樣是「感知環境、自動調整行為」的核心思維，只是這裡的執行者從輪型機器人換成機械手臂\n3. 這個技巧會直接用在Year3，當視覺系統偵測到桌面上的物體位置後，即時更新planning scene，讓手臂能安全地在有障礙物的真實環境中完成抓取任務", "is_project": true}], "full_code": "# 加入障礙物並測試路徑是否會自動避開\n# 說明：手臂規劃路徑能成功避開場景中的障礙物\nimport rclpy\nfrom moveit_commander import MoveGroupCommander\n\ndef main():\n    rclpy.init()\n    move_group = MoveGroupCommander(\"arm\")\n\n    target_pose = move_group.get_current_pose().pose\n    target_pose.position.z += 0.1\n\n    move_group.set_pose_target(target_pose)\n    success = move_group.go(wait=True)\n    move_group.stop()\n\n    print(\"規劃執行結果:\", \"成功\" if success else \"失敗\")\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week42", "num": 42, "title": "Week 42：MoveIt2整合小專案", "purpose": "承接『逆向運動學與碰撞檢測』累積的基礎，為接下來『YOLOv8環境設定與推論』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "把規劃結果透過ESP32/PCA9685實際驅動SG90玩具手臂", "days": [{"day": "週一", "content": "撰寫MoveIt2到實體伺服角度的轉換橋接", "example": "將規劃出的關節角度(radian)換算成SG90對應的PWM角度指令", "explanation": "```python\nimport math\n\ndef radian_to_servo_angle(radian_value):\n    degree = math.degrees(radian_value)\n    # 依實際接線方向與零點位置做偏移校正，這裡假設中間值90度對應規劃座標的0弧度\n    servo_angle = int(90 + degree)\n    return max(0, min(180, servo_angle))  # 限制在SG90安全範圍內\n```\n\n**逐行說明**：\n- MoveIt2內部的關節角度單位是「弧度(radian)」，SG90伺服馬達的控制指令習慣用「角度(degree)」，`math.degrees()`負責這個單位轉換\n- 零點偏移(這裡假設的`90 +`)需要依照你實際安裝手臂時，SG90歸零位置跟MoveIt2規劃座標系零點是否對齊來調整，這個數字沒有標準答案，需要實際測試校正\n- `max(0, min(180, ...))` 是Week11學過的防呆設計，確保即使規劃結果換算出界外角度，也不會送出超出SG90安全範圍的指令\n\n**為什麼這個橋接函式是整個MoveIt2應用的關鍵**：這是連接「純數學規劃世界(弧度、座標)」跟「真實硬體世界(PWM角度指令)」的翻譯層，之前Week39~41學的所有規劃技巧，都要透過這個橋接函式才能真正變成實體手臂的動作。", "is_project": false}, {"day": "週二", "content": "透過pyserial/ESP32(PCA9685)驅動實體SG90玩具手臂", "example": "ser.write(f'{joint_id}:{angle}\\n'.encode())，由ESP32接收後控制PCA9685輸出對應PWM", "explanation": "```python\nimport serial\n\nser = serial.Serial(\"/dev/ttyUSB0\", 115200, timeout=1)\n\ndef send_joint_angle(joint_id, angle):\n    command = f\"{joint_id}:{angle}\\n\"\n    ser.write(command.encode())\n```\n```cpp\n// ESP32端：接收指令並透過PCA9685驅動對應的SG90\n#include <Adafruit_PWMServoDriver.h>\nAdafruit_PWMServoDriver pwm = Adafruit_PWMServoDriver();\n\nvoid loop() {\n  if (Serial.available()) {\n    String input = Serial.readStringUntil('\\n');\n    int colonIndex = input.indexOf(':');\n    int jointId = input.substring(0, colonIndex).toInt();\n    int angle = input.substring(colonIndex + 1).toInt();\n    setServoAngle(jointId, angle);  // 換算成PCA9685的PWM訊號並輸出\n  }\n}\n```\n\n**逐行說明**：\n- 這是Week17學過的「動作:參數」指令格式的直接延伸，只是這次的「動作」變成關節編號，「參數」變成目標角度\n- PCA9685是16路PWM驅動板，透過I2C跟ESP32溝通，讓ESP32能同時控制多顆SG90(超過ESP32本身PWM腳位數量限制時特別實用)\n\n**為什麼要用PCA9685而不是直接接ESP32腳位**：如果手臂軸數較多(4~6軸)，直接用ESP32腳位個別控制容易腳位不夠用、且PWM訊號品質可能不穩定，PCA9685專門負責PWM訊號產生，讓ESP32只需要透過I2C下達「第幾顆、幾度」的指令即可，職責分工更清楚。", "is_project": false}, {"day": "週三", "content": "設計一個簡單抓取任務流程", "example": "移動到物件上方→下降→夾爪動作→抬起，套用到實體手臂", "explanation": "```python\ndef pick_up_sequence(move_group, target_x, target_y, target_z):\n    # 1. 移動到物件正上方(安全高度)\n    move_to_pose(move_group, target_x, target_y, target_z + 0.1)\n    # 2. 下降到抓取高度\n    move_to_pose(move_group, target_x, target_y, target_z)\n    # 3. 夾爪閉合(呼叫對應的伺服角度指令)\n    send_joint_angle(gripper_id, CLOSE_ANGLE)\n    # 4. 抬起\n    move_to_pose(move_group, target_x, target_y, target_z + 0.15)\n```\n\n**逐行說明**：\n- 把整個抓取任務拆成四個明確的階段，每階段呼叫已經驗證過的獨立函式，這是Week4函式模組化精神在複雜任務流程上的實際應用\n- 「先到物件上方安全高度，再垂直下降」而不是直接斜線移動過去，是機械手臂抓取任務的常見安全做法，能減少手臂側向撞到物件周遭東西的風險\n\n**為什麼要設計成明確的階段而不是一次到位**：分階段執行讓你能在每個步驟之間加入檢查(例如夾爪是否真的夾到東西)，也讓除錯時能清楚知道是哪個階段出了問題，而不是一個黑盒子動作失敗了卻不知道哪裡錯。", "is_project": false}, {"day": "週四", "content": "整體測試與除錯", "example": "比對RViz模擬預覽動作與實體SG90玩具手臂實際動作是否一致", "explanation": "**測試方法**：先在RViz裡預覽規劃出的抓取動作路徑，接著在實體手臂上執行同樣的指令，錄影或直接觀察比對兩者動作是否一致。\n\n**常見落差原因排查**：\n1. **零點校正不準**：Week一提到的角度偏移設定不夠精確，導致實體角度跟規劃角度有系統性偏差\n2. **機構限制**：實體SG90可能因為機構卡榫、線材拉扯，實際可動範圍比純軟體規劃的URDF限制更小\n3. **通訊延遲**：如果每個關節指令是依序透過同一條序列埠送出，多關節同時到位的時間點可能會有些微不同步\n\n**為什麼這一天特別重要**：這是整個MoveIt2模組(Week39~42)第一次讓「規劃」跟「現實」正面對照，任何前面步驟的誤差，都會在這一天被放大檢視出來，這種「模擬/規劃 vs 實體」的落差排查能力，是機器人工程師的核心職業技能之一。", "is_project": false}, {"day": "週五【小專案】", "content": "在實體玩具手臂上執行一段完整抓取動作", "example": "手臂完整走完抓取任務，且動作與模擬預覽相符", "explanation": "**為什麼這是重要的里程碑**：\n1. 這是整個計畫裡第一次讓MoveIt2這種正式的機械手臂規劃框架，真正驅動實體硬體完成有意義的任務(抓取)，而不只是模擬展示\n2. 從Week39對齊硬體規格、Week40~41學會規劃跟避障、到本週實際橋接驅動，這是一條完整技術鏈路的正式收官\n3. 這個能力會在Year3跟視覺系統結合，讓抓取目標從「你手動指定座標」，進化成「視覺系統自動偵測物件位置後自動抓取」，是Year2跟Year3之間承先啟後的關鍵技術基礎", "is_project": true}], "full_code": "# 在實體玩具手臂上執行一段完整抓取動作\n# 說明：手臂完整走完抓取任務，且動作與模擬預覽相符\nimport rclpy\nfrom moveit_commander import MoveGroupCommander\n\ndef main():\n    rclpy.init()\n    move_group = MoveGroupCommander(\"arm\")\n\n    target_pose = move_group.get_current_pose().pose\n    target_pose.position.z += 0.1\n\n    move_group.set_pose_target(target_pose)\n    success = move_group.go(wait=True)\n    move_group.stop()\n\n    print(\"規劃執行結果:\", \"成功\" if success else \"失敗\")\n\nif __name__ == \"__main__\":\n    main()\n"}, {"sheet": "Week43", "num": 43, "title": "Week 43：YOLOv8環境設定與推論", "purpose": "承接『MoveIt2整合小專案』累積的基礎，為接下來『自訂資料集標註與訓練』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "能用預訓練模型做物件偵測推論", "days": [{"day": "週一", "content": "安裝ultralytics套件", "example": "pip install ultralytics", "explanation": "```bash\npip install ultralytics\n```\n```python\nfrom ultralytics import YOLO\nmodel = YOLO(\"yolov8n.pt\")\n```\n\n**逐行說明**：\n- `ultralytics` 是YOLOv8官方提供的Python套件，把複雜的深度學習模型載入、推論、訓練都包裝成簡單的API，不需要自己處理底層的PyTorch細節\n- `YOLO(\"yolov8n.pt\")` 會自動下載(第一次執行時)並載入預訓練模型，`n`代表nano版本，是YOLOv8系列中最小、最快，但準確度相對較低的版本\n\n**為什麼從nano版本開始**：在筆電(甚至樹莓派)上開發階段，先用最輕量的模型驗證整個流程能不能跑通，比一開始就用最大最準確的模型(可能跑很慢甚至記憶體不足)更有效率，等流程確認沒問題，之後Week45會再討論不同模型大小的取捨。", "is_project": false}, {"day": "週二", "content": "載入預訓練模型做推論", "example": "model = YOLO('yolov8n.pt'); model('img.jpg')", "explanation": "```python\nfrom ultralytics import YOLO\n\nmodel = YOLO(\"yolov8n.pt\")\nresults = model(\"img.jpg\")\n```\n\n**逐行說明**：\n- 預訓練模型是在COCO資料集(包含80種常見物件類別，如人、車、椅子等)上訓練好的模型，不用自己準備資料就能直接偵測這些常見類別\n- `model(\"img.jpg\")` 這行看起來像呼叫函式，實際上是Python的「callable物件」語法，YOLO物件本身定義了`__call__`方法，讓你可以直接把模型物件當函式用，這是比較進階的Python技巧，先知道有這種用法即可\n\n**為什麼要先用預訓練模型**：Week25~28你學的是傳統電腦視覺方法(顏色追蹤、邊緣偵測)，這週的YOLOv8代表另一種更強大的深度學習方法，先用別人訓練好的模型體驗它的能力，再決定之後Week44要不要投入時間訓練自己的客製化模型。", "is_project": false}, {"day": "週三", "content": "解析推論結果（boxes/labels/confidence）", "example": "results[0].boxes.xyxy", "explanation": "```python\nresults = model(\"img.jpg\")\nboxes = results[0].boxes\n\nfor box in boxes:\n    x1, y1, x2, y2 = box.xyxy[0]\n    confidence = box.conf[0]\n    class_id = int(box.cls[0])\n    class_name = model.names[class_id]\n    print(f\"偵測到 {class_name}，信心度 {confidence:.2f}\")\n```\n\n**逐行說明**：\n- `results` 是一個list(因為理論上可以一次傳多張圖片進去推論)，`results[0]`是第一張圖片的結果\n- `box.xyxy` 回傳偵測框的座標，格式是(左上角x, 左上角y, 右下角x, 右下角y)，這跟Week26學過的`cv2.boundingRect()`回傳(x, y, 寬, 高)的格式不同，要注意轉換\n- `box.conf` 是信心度(0~1之間)，代表模型對這個偵測結果有多確定；`box.cls` 是類別編號，要透過`model.names[編號]`轉換成人看得懂的名稱\n\n**為什麼要理解這些細節**：YOLOv8的API把很多東西封裝好了，但實務上你常常需要從這些結果裡篩選(例如只要信心度>0.5的結果)、或轉換座標格式接到其他系統(例如Week46要發布成ROS2訊息)，理解資料結構是所有後續應用的基礎。", "is_project": false}, {"day": "週四", "content": "在圖片上畫出偵測框", "example": "results[0].plot()", "explanation": "```python\nannotated_img = results[0].plot()\ncv2.imwrite(\"result.jpg\", annotated_img)\n```\n\n**逐行說明**：\n- `.plot()` 是ultralytics套件內建的方便函式，自動把偵測框、類別名稱、信心度都畫在圖片上，回傳處理好的圖片(NumPy陣列格式，可以直接用Week25學過的`cv2.imwrite()`存檔)\n- 如果想要更客製化的畫框方式(例如只想畫特定顏色、特定類別)，可以用Week26學過的`cv2.rectangle()`跟`cv2.putText()`自己動手畫，`.plot()`只是省事的預設選項\n\n**為什麼要親眼看到偵測框**：光看數字結果(座標、信心度)很難直覺判斷模型偵測得準不準，把結果畫出來用眼睛驗證，是開發電腦視覺應用時最基本、也最重要的除錯方式。", "is_project": false}, {"day": "週五【小專案】", "content": "用預訓練YOLOv8模型偵測靜態圖片物件", "example": "對一組測試圖片跑推論並輸出標記後的圖片", "explanation": "**為什麼要這樣寫**：\n1. 用Week25學過的批次處理思維(for迴圈跑過一整個資料夾)，搭配本週學到的YOLOv8推論流程，做出一個能批次處理多張圖片的偵測小工具\n2. 這是Year2電腦視覺技能的一次重要升級——從Week25~28的傳統方法(顏色追蹤只能認得「特定顏色」)，進化到能辨識「特定類別物件」(人、椅子、瓶子等)的深度學習方法\n3. 完成這週後，你已經具備使用現成AI模型的能力，下週開始會學習如何訓練「認得你自己特定零件」的客製化模型，這是接AGV系統整合案子時很有商業價值的能力", "is_project": true}], "full_code": "# 用預訓練YOLOv8模型偵測靜態圖片物件\n# 說明：對一組測試圖片跑推論並輸出標記後的圖片\nfrom ultralytics import YOLO\nimport cv2\n\nmodel = YOLO(\"yolov8n.pt\")\ncap = cv2.VideoCapture(0)\n\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n    results = model.predict(frame, conf=0.5, verbose=False)\n    annotated = results[0].plot()\n    cv2.imshow(\"YOLOv8 detection\", annotated)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n\ncap.release()\ncv2.destroyAllWindows()\n"}, {"sheet": "Week44", "num": 44, "title": "Week 44：自訂資料集標註與訓練", "purpose": "承接『YOLOv8環境設定與推論』累積的基礎，為接下來『模型優化與即時偵測』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "標註資料集並訓練自己的偵測模型", "days": [{"day": "週一", "content": "資料集蒐集規劃", "example": "拍攝或蒐集要辨識的特定零件照片", "explanation": "**規劃重點**：\n- 每個類別建議至少拍攝100~200張照片(入門練習可以先從幾十張開始體驗流程)\n- 拍攝時要涵蓋不同角度、不同光線、不同背景，讓模型學到的是「這個物件的本質特徵」而不是「這張照片的特定環境」\n- 刻意拍一些困難情境(部分遮擋、跟其他物件放在一起)，讓模型更貼近實際使用時的真實狀況\n\n**為什麼資料蒐集要花一整天規劃而不是直接開拍**：訓練資料的品質跟多樣性，直接決定了模型訓練出來的效果好壞，這是深度學習領域「garbage in, garbage out」的具體體現——花時間規劃拍攝策略，比之後模型訓練不好再回頭重新蒐集資料有效率得多。", "is_project": false}, {"day": "週二", "content": "用Roboflow/labelImg標註", "example": "標出bounding box並匯出YOLO格式", "explanation": "**做什麼**：用標註工具(網頁版Roboflow或本機安裝的labelImg)，在每張照片上手動框出物件的位置，並標上類別名稱。\n\n**YOLO格式說明**：每張圖片對應一個同名的`.txt`標註檔，內容格式是：\n```\n類別編號 中心x 中心y 寬度 高度\n```\n座標都是「相對於圖片寬高的比例值(0~1)」，而不是絕對像素座標，這樣不管圖片實際解析度是多少，標註格式都能通用。\n\n**為什麼推薦Roboflow給新手**：Roboflow提供網頁介面標註、還能自動做資料增強(旋轉、調亮度等，變相增加訓練資料量)、並直接匯出YOLO需要的格式，比純手動管理檔案格式輕鬆很多，適合第一次接觸資料標註流程的新手。", "is_project": false}, {"day": "週三", "content": "撰寫dataset.yaml設定檔", "example": "定義train/val路徑與類別名稱", "explanation": "```yaml\n# dataset.yaml\ntrain: ./dataset/images/train\nval: ./dataset/images/val\n\nnc: 2  # 類別數量\nnames: ['screw', 'gear']  # 類別名稱列表\n```\n\n**逐行說明**：\n- `train`跟`val`分別指向訓練用跟驗證用的圖片資料夾路徑，這兩組資料**必須是不同的圖片**，驗證集的作用是檢查模型有沒有「只會背訓練資料、遇到沒看過的圖片就不準」(這叫過擬合)\n- `nc`(number of classes)要跟`names`列表的長度一致，這是新手很容易對不齊的地方\n- 通常建議訓練/驗證資料比例抓80/20左右\n\n**為什麼一定要分訓練/驗證兩組資料**：如果只用同一批資料訓練又驗證，模型可能表現得很好，但那只是因為它「背下了」這些特定照片，遇到新照片(例如之後接上即時攝影機看到的畫面)可能完全認不出來，分開驗證能提早發現這個問題。", "is_project": false}, {"day": "週四", "content": "啟動模型訓練", "example": "model.train(data='dataset.yaml', epochs=50)", "explanation": "```python\nfrom ultralytics import YOLO\n\nmodel = YOLO(\"yolov8n.pt\")  # 從預訓練模型開始，而不是從零訓練\nmodel.train(data=\"dataset.yaml\", epochs=50, imgsz=640)\n```\n\n**逐行說明**：\n- 從`yolov8n.pt`(已經在COCO資料集訓練過的模型)繼續訓練，而不是從完全空白的模型開始，這叫「遷移學習(transfer learning)」，能讓你用少量的自訂資料就訓練出不錯的效果，因為模型已經學會了「什麼是邊緣、什麼是形狀」這些基礎視覺概念，只需要學習你的特定物件長什麼樣子\n- `epochs=50` 代表整個資料集會被模型看過50遍，數字越大訓練時間越長，但也可能訓練過頭(過擬合)\n- 訓練建議在有GPU的環境進行(你的RTX 4060筆電)，CPU訓練會慢非常多\n\n**為什麼要用遷移學習而不是從零開始**：從零訓練一個能看懂影像的模型，需要龐大的資料量(數萬到數百萬張圖片)跟運算資源，遷移學習讓你用手邊的RTX 4060筆電、幾百張自己拍的照片，就能訓練出實用的客製化模型，這是目前業界訓練客製化視覺模型的標準做法。", "is_project": false}, {"day": "週五【小專案】", "content": "訓練一個能辨識特定零件的自訂模型", "example": "產出自訂模型並用測試圖片驗證準確度", "explanation": "**為什麼要這樣做**：\n1. 把本週學到的資料蒐集規劃、標註、設定檔撰寫、訓練啟動全部串起來，完成你人生第一個「客製化訓練」的AI模型，而不只是使用別人訓練好的現成模型\n2. 用驗證集資料測試訓練出來的模型準確度，如果表現不理想，可以回頭檢視是資料量不夠、標註品質不佳、還是訓練參數需要調整\n3. 這是接案時很有價值的能力展示——客戶的零件、產品往往不在YOLOv8預訓練模型認得的80種COCO類別裡，能訓練客製化模型辨識客戶自己的特定物件，是AGV系統整合服務的核心技術能力之一", "is_project": true}], "full_code": "# 訓練一個能辨識特定零件的自訂模型\n# 說明：產出自訂模型並用測試圖片驗證準確度\nfrom ultralytics import YOLO\nimport cv2\n\nmodel = YOLO(\"yolov8n.pt\")\ncap = cv2.VideoCapture(0)\n\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n    results = model.predict(frame, conf=0.5, verbose=False)\n    annotated = results[0].plot()\n    cv2.imshow(\"YOLOv8 detection\", annotated)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n\ncap.release()\ncv2.destroyAllWindows()\n"}, {"sheet": "Week45", "num": 45, "title": "Week 45：模型優化與即時偵測", "purpose": "承接『自訂資料集標註與訓練』累積的基礎，為接下來『YOLOv8整合ROS2小專案』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "即時攝影機推論並優化執行速度", "days": [{"day": "週一", "content": "即時攝影機推論串接", "example": "for result in model(source=0, stream=True):", "explanation": "```python\nresults = model(source=0, stream=True)\n\nfor r in results:\n    annotated = r.plot()\n    cv2.imshow(\"YOLOv8 即時偵測\", annotated)\n    if cv2.waitKey(1) & 0xFF == ord(\"q\"):\n        break\n```\n\n**逐行說明**：\n- `source=0` 代表用編號0的攝影機當作輸入來源，跟Week28學過的`cv2.VideoCapture(0)`概念一樣\n- `stream=True` 讓推論以「串流」模式運作，也就是逐幀處理並立即回傳結果，而不是等全部處理完才一次回傳，這對即時應用(需要立即看到每一幀結果)是必要的設定\n\n**為什麼要用stream模式**：如果不用`stream=True`，YOLOv8可能會嘗試把所有幀都處理完才回傳，對於「攝影機持續拍攝」這種理論上無限長度的輸入來源，這樣的行為會讓程式看起來卡住沒反應，stream模式才符合即時應用的需求。", "is_project": false}, {"day": "週二", "content": "推論速度優化（模型大小選擇）", "example": "比較yolov8n/s/m在速度與準確度的取捨", "explanation": "**模型大小比較**：YOLOv8提供多種大小的模型：n(nano)、s(small)、m(medium)、l(large)、x(extra large)，數字越大代表模型越複雜、準確度通常越高，但推論速度越慢、需要的運算資源越多。\n\n**選擇原則**：\n- 樹莓派這類運算資源有限的裝置，通常只能負擔n或s\n- 有GPU的筆電(你的RTX 4060)可以考慮s或m，在速度跟準確度間取得更好平衡\n- 實務上建議都先用n驗證流程能跑通，再逐步嘗試更大的模型，比較實際的FPS(用Week28學過的FPS量測技巧)跟準確度變化\n\n**為什麼沒有「最好」的選擇，只有「取捨」**：這是工程決策的常態——沒有一個模型大小是萬能最佳解，你需要依照實際部署的硬體資源、應用場景對即時性的要求(避障需要極快反應，離線分析可以慢一點)，做出合理的取捨判斷。", "is_project": false}, {"day": "週三", "content": "信心閾值與NMS參數調整", "example": "model.predict(conf=0.5, iou=0.45)", "explanation": "```python\nresults = model.predict(source=0, conf=0.5, iou=0.45, stream=True)\n```\n\n**逐行說明**：\n- `conf=0.5` 是信心度門檻，低於這個數值的偵測結果會被直接濾掉不顯示，調高這個數字能減少誤判(false positive)，但也可能漏掉真正的物件(false negative)\n- `iou=0.45` 是NMS(非極大值抑制)使用的門檻，用來處理「同一個物件被重複框了好幾個框」的問題——當兩個框的重疊程度(IoU)超過這個門檻，只保留信心度最高的那一個框，其餘視為重複而刪除\n\n**為什麼要調整這兩個參數**：預設值不一定適合你的實際應用場景，例如安全相關的避障應用可能寧可信心度門檻設低一點(寧可誤判也不要漏判)，而零件辨識分類應用可能希望信心度門檻設高一點(確保判斷準確)，這是依實際需求微調系統行為的重要手段。", "is_project": false}, {"day": "週四", "content": "FPS量測與效能瓶頸排查", "example": "找出即時偵測中最耗時的環節", "explanation": "**排查方式**：用Week28學過的FPS量測技巧，分段計時找出瓶頸在哪：\n```python\nimport time\n\nt1 = time.time()\nret, frame = cap.read()\nt2 = time.time()\nresults = model(frame)\nt3 = time.time()\n\nprint(f\"讀取畫面: {t2-t1:.3f}s, 模型推論: {t3-t2:.3f}s\")\n```\n\n**常見瓶頸來源**：\n- 攝影機讀取解析度過高：可以在讀取後先resize降低解析度再送進模型\n- 模型太大：參考週二的模
