=update_from_sensor, daemon=True).start()\n```\n\n**逐行說明**：\n- 用獨立的執行緒(thread)持續從ESP32讀取感測器資料，並即時更新Modbus Server裡的暫存器數值，Server主程式則持續監聽外部連線請求，兩者並行運作\n- `context[0x00].setValues(功能碼, 位址, 數值列表)` 是pymodbus更新暫存器數值的API寫法\n\n**為什麼需要多執行緒**：Modbus Server要「隨時準備好回應外部請求」，同時又要「持續更新最新的感測器資料」，這兩件事需要同時進行，這是Week19學過的Flask併發概念在這裡的延伸應用——你的AGV系統要同時扮演「感測器資料收集者」跟「對外提供服務者」兩種角色。", "is_project": false}, {"day": "週四", "content": "用第三方工具驗證讀取(Modbus Poll等)", "example": "確認外部標準工具能正確讀取到資料", "explanation": "**做什麼**：用業界標準的Modbus除錯工具(例如Modbus Poll)連到你剛架好的Server，驗證能不能正確讀到你設定的暫存器數值。\n\n**為什麼要用「別人的工具」驗證而不是自己寫Client測試**：如果你自己寫的Server只能被自己寫的Client讀懂，很可能代表你的實作有些地方沒有完全遵循標準Modbus協定規格；用業界標準工具驗證，才能確保你的AGV系統真的能跟任何遵循Modbus標準的第三方系統(包含客戶既有的SCADA、PLC)正確溝通，這是「相容性測試」的重要性所在。", "is_project": false}, {"day": "週五【小專案】", "content": "AGV狀態可透過Modbus被外部系統讀取", "example": "外部工具能即時讀到AGV的電量與速度", "explanation": "**為什麼這是重要的整合點**：\n1. 這是你的AGV系統第一次正式對外提供「標準工業協定介面」，而不只是你自己寫的Flask網頁或ROS2 topic，這代表任何遵循Modbus標準的第三方系統都能讀取你AGV的狀態\n2. 把Week16~34學到的即時感測器資料，透過本週的橋接，變成業界通用格式對外提供，這是「讓你的作品從自己專案內部堪用，進化到能跟外部工業系統介接」的關鍵一步\n3. 完成這週後，你的AGV具備了初步的「工業可整合性」，下週會把讀寫功能整理成更完整實用的通用工具", "is_project": true}], "full_code": "# AGV狀態可透過Modbus被外部系統讀取\n# 說明：外部工具能即時讀到AGV的電量與速度\nfrom pymodbus.client import ModbusTcpClient\n\nclient = ModbusTcpClient(\"127.0.0.1\", port=502)\nclient.connect()\n\n# 寫入電池電量到暫存器0\nclient.write_register(0, 80)\n\n# 讀取暫存器0~1 (電池電量、速度)\nresult = client.read_holding_registers(0, 2)\nprint(\"電池電量:\", result.registers[0])\nprint(\"目前速度:\", result.registers[1])\n\nclient.close()\n"}, {"sheet": "Week68", "num": 68, "title": "Week 68：Modbus小專案：PLC暫存器工具", "purpose": "承接『Modbus整合感測器/PLC模擬』累積的基礎，為接下來『OPC UA基礎概念』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "整合讀寫功能成實用小工具", "days": [{"day": "週一", "content": "整理讀寫功能成class架構", "example": "封裝ModbusClient操作成好用的介面", "explanation": "```python\nclass ModbusHelper:\n    def __init__(self, ip, port=502):\n        self.client = ModbusTcpClient(ip, port=port)\n        self.client.connect()\n\n    def read(self, address, count=1):\n        result = self.client.read_holding_registers(address, count)\n        return result.registers if not result.isError() else None\n\n    def write(self, address, value):\n        result = self.client.write_register(address, value)\n        return not result.isError()\n\n    def close(self):\n        self.client.close()\n```\n\n**逐行說明**：\n- 把Week66學過的連線、讀取、寫入操作，統一包裝成一個好用的`ModbusHelper` class，這是Week52封裝`RealSenseCamera`同樣的設計思維——把繁瑣的底層細節藏起來，提供簡單好用的介面\n- 每個方法內部都做了`isError()`檢查，呼叫端不需要重複寫防呆邏輯，這種「把防呆邏輯集中在共用工具裡」的做法，能大幅降低後續使用時忘記防呆的風險", "is_project": false}, {"day": "週二", "content": "加入簡易命令列操作介面", "example": "輸入暫存器位址與數值即可讀寫", "explanation": "```python\nwhile True:\n    cmd = input(\"輸入指令 (read <位址> / write <位址> <數值> / exit): \")\n    parts = cmd.split()\n    if parts[0] == \"read\":\n        print(helper.read(int(parts[1])))\n    elif parts[0] == \"write\":\n        helper.write(int(parts[1]), int(parts[2]))\n    elif parts[0] == \"exit\":\n        break\n```\n\n**逐行說明**：\n- 這是Week17學過的「終端機輸入指令控制硬體」概念，換成Modbus讀寫的應用版本，用`input()`跟`.split()`解析使用者輸入的指令跟參數\n- 這種命令列小工具在你之後接案、到客戶現場除錯PLC通訊問題時非常實用——不用每次都寫一支新腳本，直接用這個通用工具就能快速讀寫任意位址驗證", "is_project": false}, {"day": "週三", "content": "加入錯誤處理(連線中斷重試)", "example": "斷線時自動重連並記錄log", "explanation": "```python\ndef read_with_retry(self, address, count=1, max_retries=3):\n    for attempt in range(max_retries):\n        try:\n            if not self.client.is_socket_open():\n                self.client.connect()\n            result = self.client.read_holding_registers(address, count)\n            if not result.isError():\n                return result.registers\n        except Exception as e:\n            print(f\"第{attempt+1}次嘗試失敗: {e}\")\n        time.sleep(1)\n    return None\n```\n\n**逐行說明**：\n- `is_socket_open()` 檢查連線是否還存在，斷線時自動嘗試重新`connect()`，這是Week16學過pyserial斷線處理概念的Modbus版本\n- `max_retries` 限制重試次數，避免無限重試造成程式卡死，這是設計穩健的網路通訊程式必備的防呆機制\n\n**為什麼工業現場特別需要重試機制**：工廠環境的網路品質(尤其是無線網路)常常不如辦公室穩定，可能因為電磁干擾、設備重啟等原因短暫斷線，一個沒有重試機制的程式會在第一次斷線就直接失敗中止，重試機制讓系統更能適應這種不完美的真實環境。", "is_project": false}, {"day": "週四", "content": "撰寫使用說明文件", "example": "README說明如何設定連線參數", "explanation": "**做什麼**：延續Week23學過的README撰寫技巧，為這個Modbus工具寫一份說明文件，包含：\n- 如何設定目標裝置的IP跟埠號\n- 命令列工具的指令格式範例\n- 常見錯誤訊息代表的意義跟排查方式\n\n**為什麼這個工具特別需要寫使用說明**：不像你自己開發的AGV專案主要自己使用，這種通用Modbus工具之後可能會在客戶現場、或跟其他工程師協作時被使用，一份清楚的說明文件能讓別人不用問你就能上手使用，這是把工具變成「可交付資產」的重要一步。", "is_project": false}, {"day": "週五【小專案】", "content": "Modbus讀寫PLC暫存器工具", "example": "完成一個可重複使用的通用Modbus工具", "explanation": "**為什麼要這樣做**：\n1. 這是Year4 Modbus模組(Week65~68)的整合驗收，把分散學到的連線、讀寫、封裝、錯誤處理、命令列介面、文件撰寫全部整合成一個正式、可重複使用的工具\n2. 這個工具之後不只用在你自己的AGV專案，未來接案時遇到任何用Modbus通訊的PLC或設備，都能直接拿這個工具快速驗證連線、讀寫測試，是很實用的「隨身工具箱」成員\n3. 完成這週後，你已經掌握Modbus這個最普及的工業通訊協定，下週開始學OPC UA，會發現雖然協定不同，但「先讀寫驗證、再整理封裝」的學習節奏是相通的", "is_project": true}], "full_code": "# Modbus讀寫PLC暫存器工具\n# 說明：完成一個可重複使用的通用Modbus工具\nfrom pymodbus.client import ModbusTcpClient\n\nclient = ModbusTcpClient(\"127.0.0.1\", port=502)\nclient.connect()\n\n# 寫入電池電量到暫存器0\nclient.write_register(0, 80)\n\n# 讀取暫存器0~1 (電池電量、速度)\nresult = client.read_holding_registers(0, 2)\nprint(\"電池電量:\", result.registers[0])\nprint(\"目前速度:\", result.registers[1])\n\nclient.close()\n"}, {"sheet": "Week69", "num": 69, "title": "Week 69：OPC UA基礎概念", "purpose": "承接『Modbus小專案：PLC暫存器工具』累積的基礎，為接下來『OPC UA Server/Client實作』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "理解OPC UA相較Modbus的優勢(語意化)", "days": [{"day": "週一", "content": "OPC UA是什麼、解決什麼問題", "example": "相較Modbus多了語意化資料模型與安全機制", "explanation": "**概念說明**：OPC UA(OPC Unified Architecture)是比Modbus更現代化的工業通訊協定，設計於2000年代，目標是解決Modbus的幾個限制：\n- Modbus只能傳「數字」，資料的意義完全靠人為文件約定(就像Week67你自己做的映射表)；OPC UA能直接在協定層面描述「這個數值代表什麼、單位是什麼、跟其他資料的關係」\n- Modbus沒有內建加密或身份驗證機制；OPC UA內建完整的安全性設計\n\n**跟你之前學過的東西做類比**：如果說Modbus像是Week16學的簡單CSV字串通訊(資料格式要靠雙方自己約定)，那OPC UA就更像Week32學過的ROS2自訂訊息型別(資料本身就自帶結構跟意義)，只是OPC UA是跨廠牌、跨平台的工業標準版本。", "is_project": false}, {"day": "週二", "content": "Server/Client架構", "example": "理解訂閱(subscription)機制與Modbus的差異", "explanation": "**架構比較**：OPC UA同樣是Server/Client架構，但比Modbus的Master/Slave多了一個重要功能——**訂閱(Subscription)**機制。\n\n**訂閱機制是什麼**：Client可以跟Server說「我要訂閱這個資料，只要它有變化就主動通知我」，不用像Modbus那樣一直「主動去問」，Server端資料變化時會「推播」給訂閱的Client。\n\n**為什麼這是重要的進步**：這解決了Modbus的一個效率問題——如果你想「即時」掌握資料變化，用Modbus只能不斷輪詢(跟Week30學過的ROS2 Topic模式相比，更接近Week30的Callback事件驅動概念)，OPC UA的訂閱機制讓資料傳輸更有效率，也更即時。", "is_project": false}, {"day": "週三", "content": "Address Space與Node概念", "example": "了解物件、變數、方法都是Node", "explanation": "**概念說明**：OPC UA用「Address Space(位址空間)」來組織所有資料，裡面的每一個元素都叫「Node」，Node可以是：\n- **Object(物件)**：代表一個實體，例如你的AGV\n- **Variable(變數)**：代表一個數值，例如電池電量\n- **Method(方法)**：代表可以被遠端呼叫的動作，例如「停止AGV」\n\n**跟Week7~8學過的物件導向概念類比**：這種架構直接呼應了你在Week7學到的class概念——AGV是一個Object，底下有Variable(屬性，像battery)、有Method(方法，像stop())，OPC UA把這種物件導向的思維直接搬進通訊協定的資料模型裡，這也是為什麼說OPC UA比Modbus「更語意化」的具體原因。", "is_project": false}, {"day": "週四", "content": "安全性機制簡介", "example": "認證、加密等企業應用重視的功能", "explanation": "**安全機制概觀**：OPC UA內建多層次的安全設計：\n- **認證(Authentication)**：確認連線的Client身份是誰，避免未授權裝置隨意連入\n- **加密(Encryption)**：資料傳輸過程加密，避免被竊聽或竄改\n- **授權(Authorization)**：即使身份驗證通過，也能限制這個身份能存取哪些資料、能不能寫入\n\n**為什麼Modbus沒有這些機制**：Modbus設計的年代(1979年)，工業設備通常是封閉的內部網路，資安不是主要考量；OPC UA設計時(2000年代後)已經是工廊聯網、甚至雲端整合成為趨勢的時代，資安變成必要考量，這也是Week77要更完整討論工業通訊安全性的原因。", "is_project": false}, {"day": "週五【小專案】", "content": "畫出OPC UA架構圖並說明應用場景", "example": "整理一份筆記說明何時該選OPC UA而非Modbus", "explanation": "**為什麼要這樣做**：\n1. 這週的重點是概念理解，先透過整理筆記的方式確認自己真的搞懂了OPC UA跟Modbus的差異跟各自適用場景，而不急著馬上動手寫程式\n2. 這種「先寫技術選型筆記」的能力，會在Week76直接整合成一份完整的四協定比較文件，是你之後接案時，能專業地跟客戶討論該用哪種通訊協定的重要基礎\n3. 完成這週的整理後，下週開始正式動手用asyncua套件實作OPC UA的Server跟Client", "is_project": true}], "full_code": "# 畫出OPC UA架構圖並說明應用場景\n# 說明：整理一份筆記說明何時該選OPC UA而非Modbus\nimport asyncio\nfrom asyncua import Server\n\nasync def main():\n    server = Server()\n    await server.init()\n    server.set_endpoint(\"opc.tcp://0.0.0.0:4840/agv/\")\n\n    idx = await server.register_namespace(\"agv_namespace\")\n    agv_obj = await server.nodes.objects.add_object(idx, \"AGV\")\n    battery = await agv_obj.add_variable(idx, \"Battery\", 80)\n    await battery.set_writable()\n\n    async with server:\n        while True:\n            current = await battery.get_value()\n            print(f\"目前電池電量: {current}\")\n            await asyncio.sleep(2)\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"sheet": "Week70", "num": 70, "title": "Week 70：OPC UA Server/Client實作", "purpose": "承接『OPC UA基礎概念』累積的基礎，為接下來『OPC UA資料建模(Node/Namespace)』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "用asyncua建立Server並用Client讀取", "days": [{"day": "週一", "content": "安裝asyncua套件", "example": "pip install asyncua", "explanation": "```bash\npip install asyncua\n```\n\n**做什麼**：`asyncua`是Python最常用的OPC UA套件，名稱裡的「async」代表它是用非同步(asynchronous)程式設計方式實作的，這是跟pymodbus在寫法上最大的差異。\n\n**什麼是非同步程式設計**：一般程式(像你之前寫的大部分程式碼)是「同步」的，一行做完才做下一行；非同步程式設計允許程式在等待某個操作(例如網路請求)完成的同時，去做其他事情，用`async def`定義函式、用`await`等待某個非同步操作完成，這是這週開始會頻繁看到的新語法。", "is_project": false}, {"day": "週二", "content": "建立最簡單的OPC UA Server", "example": "server = Server(); await server.init()", "explanation": "```python\nimport asyncio\nfrom asyncua import Server\n\nasync def main():\n    server = Server()\n    await server.init()\n    server.set_endpoint(\"opc.tcp://0.0.0.0:4840/agv/\")\n\n    async with server:\n        while True:\n            await asyncio.sleep(1)\n\nasyncio.run(main())\n```\n\n**逐行說明**：\n- `async def main():` 定義一個非同步函式，函式內部可以用`await`等待其他非同步操作\n- `await server.init()` 初始化Server，`await`關鍵字代表「等待這個操作完成，同時讓出控制權讓其他工作有機會執行」\n- `asyncio.run(main())` 是啟動整個非同步程式的入口點，這是Python非同步程式的固定寫法\n- OPC UA標準的通訊埠是4840(不同於Modbus的502)\n\n**為什麼OPC UA選擇非同步架構**：OPC UA支援訂閱機制(Week69學過)，Server需要同時處理多個Client的持續連線、即時推播資料變化，非同步架構天生適合處理這種「同時應付很多連線」的情境，比傳統多執行緒架構更輕量高效。", "is_project": false}, {"day": "週三", "content": "新增變數節點", "example": "var = await myobj.add_variable(idx, 'Battery', 80)", "explanation": "```python\nidx = await server.register_namespace(\"agv_namespace\")\nagv_obj = await server.nodes.objects.add_object(idx, \"AGV\")\nbattery = await agv_obj.add_variable(idx, \"Battery\", 80)\nawait battery.set_writable()\n```\n\n**逐行說明**：\n- `register_namespace()` 註冊一個專屬的命名空間，避免你自訂的Node跟OPC UA標準內建的Node或其他廠商的Node名稱衝突\n- `add_object(idx, \"AGV\")` 建立一個代表AGV的Object節點，這對應到Week69學過的Address Space概念\n- `add_variable(idx, \"Battery\", 80)` 在AGV物件底下新增一個Battery變數節點，初始值80\n- `set_writable()` 讓這個變數可以被Client端寫入修改，預設新增的變數是唯讀的\n\n**為什麼結構要這樣一層層建立**：這就是Week69提到的「物件導向資料模型」的實際操作——先有物件(AGV)，物件底下才有變數(Battery)，這種階層結構讓大型系統的資料組織更清楚，比Modbus扁平的「一堆編號暫存器」更容易理解跟維護。", "is_project": false}, {"day": "週四", "content": "撰寫Client連線並讀取", "example": "client = Client('opc.tcp://localhost:4840')", "explanation": "```python\nfrom asyncua import Client\n\nasync def main():\n    async with Client(url=\"opc.tcp://localhost:4840/agv/\") as client:\n        agv_obj = await client.nodes.objects.get_child([\"2:AGV\"])\n        battery_node = await agv_obj.get_child([\"2:Battery\"])\n        value = await battery_node.get_value()\n        print(f\"電池電量: {value}\")\n\nasyncio.run(main())\n```\n\n**逐行說明**：\n- `async with Client(...) as client:` 用非同步的方式管理連線的開啟跟關閉，效果類似Week6學過的`with open(...)`，離開這個區塊會自動處理連線關閉\n- `get_child([\"2:AGV\"])` 沿著Address Space的階層結構，一路找到你要的Node，`2:`前綴代表命名空間編號\n- `get_value()` 讀取這個變數節點目前的數值\n\n**為什麼路徑寫法比Modbus的位址數字更直觀**：Modbus讀取要記得「位址3是距離感測器」這種對照表，OPC UA可以直接用有意義的名稱`\"AGV\"`、`\"Battery\"`去存取，這正是Week69提到「語意化」的具體體現。", "is_project": false}, {"day": "週五【小專案】", "content": "建立最簡單的OPC UA Server並成功連線讀值", "example": "用UAExpert等工具驗證能正確連線與讀值", "explanation": "**為什麼要這樣做**：\n1. 走過一次完整的OPC UA Server建立、變數新增、Client連線讀取流程，這是接下來Week71~72的基礎環境\n2. 用UAExpert(業界常見的免費OPC UA除錯工具，類似Week68提到的Modbus Poll)驗證你的Server符合標準規格，能被任何第三方OPC UA工具正確讀取，這是Week67強調過的「相容性驗證」原則在OPC UA上的應用\n3. 完成這週後，你已經同時具備Modbus跟OPC UA兩種工業通訊協定的基本讀寫能力，下週會學習更完整的資料建模技巧，把AGV的完整狀態用更嚴謹的方式呈現", "is_project": true}], "full_code": "# 建立最簡單的OPC UA Server並成功連線讀值\n# 說明：用UAExpert等工具驗證能正確連線與讀值\nimport asyncio\nfrom asyncua import Server\n\nasync def main():\n    server = Server()\n    await server.init()\n    server.set_endpoint(\"opc.tcp://0.0.0.0:4840/agv/\")\n\n    idx = await server.register_namespace(\"agv_namespace\")\n    agv_obj = await server.nodes.objects.add_object(idx, \"AGV\")\n    battery = await agv_obj.add_variable(idx, \"Battery\", 80)\n    await battery.set_writable()\n\n    async with server:\n        while True:\n            current = await battery.get_value()\n            print(f\"目前電池電量: {current}\")\n            await asyncio.sleep(2)\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"sheet": "Week71", "num": 71, "title": "Week 71：OPC UA資料建模(Node/Namespace)", "purpose": "承接『OPC UA Server/Client實作』累積的基礎，為接下來『OPC UA小專案：發布AGV狀態』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "設計符合語意的資料節點結構", "days": [{"day": "週一", "content": "Namespace概念與自訂命名空間", "example": "idx = await server.register_namespace('my_agv')", "explanation": "**做什麼**：深入理解Week70已經用過的`register_namespace()`，命名空間(Namespace)是OPC UA用來避免不同來源的Node互相衝突的機制。\n\n**類比理解**：這跟Week10學過的Python模組`import`概念類似——如果兩個不同套件都定義了一個叫`Robot`的class，你要用`package_a.Robot`或`package_b.Robot`才能明確指定是哪一個，命名空間就是OPC UA版本的「這個Node屬於誰定義的」標記方式。\n\n**為什麼工業通訊特別需要這個機制**：一套完整的工廠系統可能同時有你的AGV、PLC廠商的設備、感測器廠商的裝置，各自都有自己的OPC UA Server跟Node定義，命名空間讓這些來自不同廠商、不同系統的資料，能在同一個更大的監控系統裡被明確區分，不會互相搞混。", "is_project": false}, {"day": "週二", "content": "設計AGV物件節點結構", "example": "AGV物件底下包含Battery、Speed、Position等變數", "explanation": "```python\nagv_obj = await server.nodes.objects.add_object(idx, \"AGV\")\nbattery = await agv_obj.add_variable(idx, \"Battery\", 80)\nspeed = await agv_obj.add_variable(idx, \"Speed\", 0)\nposition = await agv_obj.add_object(idx, \"Position\")\npos_x = await position.add_variable(idx, \"X\", 0.0)\npos_y = await position.add_variable(idx, \"Y\", 0.0)\n```\n\n**逐行說明**：\n- `Position`本身又是一個Object(而不是單一變數)，底下再包含X、Y兩個子變數，這種「物件裡面還有物件」的巢狀結構，能表達更複雜的資料關係\n- 這種設計直接呼應Week32學過的自訂ROS2訊息(SensorData.msg可以包含多個欄位)，只是OPC UA的結構化能力更進一步，能做到多層巢狀\n\n**為什麼要花時間設計這個結構**：好的資料模型結構，讓之後任何要接入這套系統的第三方監控軟體，都能直觀地在Address Space裡瀏覽到「AGV→Position→X, Y」這種清楚的階層，不需要額外文件解釋，這是OPC UA「自描述」特性的實際展現。", "is_project": false}, {"day": "週三", "content": "設定變數的可寫入權限", "example": "區分唯讀狀態值與可寫入控制指令", "explanation": "```python\nbattery = await agv_obj.add_variable(idx, \"Battery\", 80)\n# battery保持預設唯讀，因為這是「量測值」，外部不該直接竄改\n\ntarget_speed = await agv_obj.add_variable(idx, \"TargetSpeed\", 0)\nawait target_speed.set_writable()\n# target_speed開放寫入，因為這是「控制指令」，允許外部系統設定\n```\n\n**逐行說明**：\n- 刻意讓`battery`(電量，是AGV回報的狀態)保持唯讀，`target_speed`(目標速度，是外部下達的指令)才開放寫入，這種區分反映了Week65學過的Modbus裡Holding Register(可寫)跟Input Register(唯讀)的分類邏輯，只是OPC UA是用程式設定而非固定的暫存器類型\n\n**為什麼要嚴格區分可寫/唯讀**：如果電量這種應該由AGV自己回報的狀態值，外部系統也能任意竄改，會造成資料混亂、甚至安全疑慮(想像外部系統惡意把電量寫成100%，掩蓋真正的低電量警示)，嚴謹的權限設計是Week77工業通訊安全性的基礎實踐。", "is_project": false}, {"day": "週四", "content": "新增方法節點(Method)", "example": "讓Client可以呼叫遠端方法(如StopAGV)", "explanation": "```python\nasync def stop_agv(parent):\n    print(\"收到遠端停止指令\")\n    # 這裡實際呼叫你的AGV停止邏輯(例如Week11寫過的motor_stop)\n    return [ua.Variant(True, ua.VariantType.Boolean)]\n\nawait agv_obj.add_method(\n    idx, \"StopAGV\", stop_agv, [], [ua.VariantType.Boolean]\n)\n```\n\n**逐行說明**：\n- `add_method()` 讓Client端不只能讀寫變數，還能直接「呼叫」一個遠端方法，觸發AGV執行特定動作，這是OPC UA比Modbus更進階的能力(Modbus只能透過寫特定暫存器來間接觸發動作)\n- 這對應到Week69提到的「Method也是一種Node」概念，這裡正式實作出來\n\n**為什麼Method是重要功能**：對比寫入一個暫存器值來觸發動作(Modbus的做法)，直接呼叫一個名字叫`StopAGV`的方法，語意上清楚得多，外部系統開發者不需要猜測「寫入哪個位址什麼數值才能讓AGV停下來」，這也是Week69一直強調OPC UA「語意化」優勢的又一個具體例子。", "is_project": false}, {"day": "週五【小專案】", "content": "為AGV設計一組OPC UA資料模型", "example": "完成結構清楚、符合語意的資料節點設計", "explanation": "**為什麼要這樣做**：\n1. 把本週學到的巢狀物件結構、讀寫權限設計、方法節點，整合成一份完整、專業的AGV資料模型，這份模型的品質，直接反映你是否真正理解OPC UA「語意化資料建模」的核心精神，而不只是會寫程式碼\n2. 這種結構化思考的能力，也是很好的軟實力訓練——把一個複雜系統(AGV)拆解成清楚的物件、屬性、方法階層，這種能力在任何系統設計工作中都很有價值\n3. 完成這週後，下週會把這個資料模型跟真實的AGV即時資料串接起來，變成一個真正對外提供服務的完整OPC UA Server", "is_project": true}], "full_code": "# 為AGV設計一組OPC UA資料模型\n# 說明：完成結構清楚、符合語意的資料節點設計\nimport asyncio\nfrom asyncua import Server\n\nasync def main():\n    server = Server()\n    await server.init()\n    server.set_endpoint(\"opc.tcp://0.0.0.0:4840/agv/\")\n\n    idx = await server.register_namespace(\"agv_namespace\")\n    agv_obj = await server.nodes.objects.add_object(idx, \"AGV\")\n    battery = await agv_obj.add_variable(idx, \"Battery\", 80)\n    await battery.set_writable()\n\n    async with server:\n        while True:\n            current = await battery.get_value()\n            print(f\"目前電池電量: {current}\")\n            await asyncio.sleep(2)\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"sheet": "Week72", "num": 72, "title": "Week 72：OPC UA小專案：發布AGV狀態", "purpose": "承接『OPC UA資料建模(Node/Namespace)』累積的基礎，為接下來『Profinet基礎概念』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "整合前兩週成一個可用Server", "days": [{"day": "週一", "content": "串接AGV即時資料來源", "example": "把pyserial/ROS2資料接入OPC UA變數更新", "explanation": "```python\nasync def update_from_sensor(battery_node, distance_node):\n    while True:\n        distance = read_from_serial()  # Week16學過的pyserial讀取\n        await distance_node.write_value(distance)\n        await asyncio.sleep(0.5)\n```\n\n**逐行說明**：\n- 這是Week67「把ESP32/AGV資料寫入Modbus Server」的OPC UA版本，用`await distance_node.write_value()`更新Week71設計好的變數節點\n- 因為asyncua是非同步架構，這個更新迴圈要用`asyncio.create_task()`跟Server主邏輯一起並行執行，而不是像Week67用`threading.Thread`\n\n**為什麼寫法不同但目的相同**：Modbus用多執行緒(threading)、OPC UA用非同步(asyncio)，這是兩個套件底層架構的差異，但要解決的問題是一樣的——「持續更新資料」跟「持續服務外部連線請求」要同時進行，殊途同歸，這也是軟體工程裡「同一個問題可能有不同技術解法」的具體例子。", "is_project": false}, {"day": "週二", "content": "設定資料更新頻率", "example": "定期更新Server端變數值", "explanation": "**設計考量**：更新頻率不是越快越好，要考慮：\n- 感測器本身的實際更新速度(Week14學過超音波感測器有其物理限制)\n- 網路頻寬與Server負載(頻率太高，尤其在多個Client同時訂閱時，會造成大量資料傳輸)\n- 應用場景的實際需求(電量這種變化緩慢的數值，不需要跟距離感測器一樣頻繁更新)\n\n**為什麼可以針對不同變數設定不同頻率**：這是務實的工程判斷——距離感測器可能需要每0.1秒更新(避障需要即時反應)，電池電量可能每5秒更新一次就夠了(電量不會瞬間劇烈變化)，針對不同資料特性設計合理的更新頻率，能有效降低系統負擔，這種「按需設計」的思維，貫穿了你整個四年計畫學到的很多技術決策。", "is_project": false}, {"day": "週三", "content": "加入訂閱通知機制", "example": "Client訂閱變數變化並即時收到通知", "explanation": "```python\nclass SubHandler:\n    def datachange_notification(self, node, val, data):\n        print(f\"變數 {node} 的值變成: {val}\")\n\nhandler = SubHandler()\nsub = await client.create_subscription(500, handler)\nawait sub.subscribe_data_change(battery_node)\n```\n\n**逐行說明**：\n- `create_subscription(500, handler)` 建立一個訂閱，500代表每500毫秒檢查一次是否有變化，`handler`是負責處理通知的物件\n- `datachange_notification()` 是每次訂閱的變數有變化時，會被自動呼叫的回調函式，這是Week30學過ROS2 Callback概念的OPC UA版本\n- `subscribe_data_change(battery_node)` 明確指定要訂閱哪個變數節點的變化\n\n**為什麼這是本週最重要的功能驗證**：這是Week69提到「OPC UA比Modbus多了訂閱機制」的正式實作，驗證成功後，你的AGV狀態系統就真正具備「主動推播」能力，而不只是被動等別人來問，這是OPC UA相較Modbus的核心優勢在這裡首次被實際驗證。", "is_project": false}, {"day": "週四", "content": "整體測試與除錯", "example": "確認多個Client同時連線也能正常運作", "explanation": "**測試方式**：同時開啟兩、三個Client程式(或用UAExpert工具再加上自己寫的Client程式)一起連線到同一個Server，確認：\n- 每個Client都能各自獨立讀取/訂閱到正確的資料，不會互相干擾\n- Server在多個Client同時連線時，效能沒有明顯下降或出現錯誤\n\n**為什麼要測試多重連線**：真實的工廠場景，你的AGV系統可能同時要被SCADA監控畫面(Week79)、其他PLC系統、甚至維護人員的除錯工具同時連線讀取，一個只能應付單一連線的Server在實務上是不夠用的，這種多連線穩定性測試，是把系統從「demo堪用」提升到「生產環境可用」等級的必要驗證。", "is_project": false}, {"day": "週五【小專案】", "content": "建立OPC UA Server發布AGV狀態資料", "example": "完成可供外部系統即時訂閱的AGV狀態Server", "explanation": "**為什麼這是Year4 OPC UA模組的重要總驗收**：\n1. 把Week69~72學到的所有概念(Server/Client架構、資料建模、訂閱機制)整合成一個完整、可實際運作的AGV狀態發布系統，比Week68的Modbus工具更進一步，具備即時推播能力\n2. 驗證了多重連線的穩定性，代表這套系統已經具備接近生產環境的可靠度，而不只是單機demo\n3. 完成這週後，你的AGV系統已經同時具備Modbus(簡單相容性廣)跟OPC UA(語意化、即時性佳)兩種業界主流工業通訊能力，下週開始學習Profinet跟EtherCAT這兩種更專門的協定，補齊你的技術選型知識版圖", "is_project": true}], "full_code": "# 建立OPC UA Server發布AGV狀態資料\n# 說明：完成可供外部系統即時訂閱的AGV狀態Server\nimport asyncio\nfrom asyncua import Server\n\nasync def main():\n    server = Server()\n    await server.init()\n    server.set_endpoint(\"opc.tcp://0.0.0.0:4840/agv/\")\n\n    idx = await server.register_namespace(\"agv_namespace\")\n    agv_obj = await server.nodes.objects.add_object(idx, \"AGV\")\n    battery = await agv_obj.add_variable(idx, \"Battery\", 80)\n    await battery.set_writable()\n\n    async with server:\n        while True:\n            current = await battery.get_value()\n            print(f\"目前電池電量: {current}\")\n            await asyncio.sleep(2)\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"sheet": "Week73", "num": 73, "title": "Week 73：Profinet基礎概念", "purpose": "承接『OPC UA小專案：發布AGV狀態』累積的基礎，為接下來『Profinet實務環境與工具』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "理解即時工業乙太網路的設計理念", "days": [{"day": "週一", "content": "Profinet是什麼、由誰主導(PI組織)", "example": "了解其在歐系工業設備中的普及程度", "explanation": "**背景說明**：Profinet是由PROFIBUS & PROFINET International(PI)組織主導的工業乙太網路標準，主要推動者是德國西門子(Siemens)，在歐系PLC設備(尤其是Siemens S7系列)中非常普及。\n\n**跟前面學的協定比較**：Modbus跟OPC UA都是「廠牌中立」的開放標準，任何廠商都能實作；Profinet雖然也是開放標準，但因為西門子的強力主導與推廣，實務上你會發現「只要客戶用西門子PLC，幾乎一定會遇到Profinet」，這是台灣製造業常見的實務狀況——很多從歐洲進口的產線設備，PLC都是西門子系統。\n\n**對你接案的實務意義**：如果之後接的案子客戶剛好用西門子系統，具備Profinet相關知識能讓你更順利地跟既有產線整合，這也是為什麼即使Profinet比Modbus小眾，仍值得花時間了解。", "is_project": false}, {"day": "週二", "content": "即時工業乙太網路設計理念", "example": "為何一般TCP/IP無法滿足即時性需求", "explanation": "**問題背景**：一般TCP/IP網路通訊(包含你之前學的Modbus TCP、OPC UA)，資料傳輸的延遲是「不確定」的——可能這次0.001秒送達，下次因為網路壅塞變成0.1秒才送達，這種不確定性叫做「非即時性(non-deterministic)」。\n\n**為什麼某些工業應用無法接受這種不確定性**：想像伺服馬達的精密同步控制，如果控制訊號有時候延遲0.001秒、有時候延遲0.1秒，馬達動作就會不同步、產生震動甚至損壞精密機構，這類應用需要「保證」訊號在固定時間內一定送達，這叫「即時性(real-time)」保證。\n\n**Profinet怎麼解決這個問題**：透過特殊設計的網路架構跟傳輸機制(下一天會提到不同等級)，讓部分或全部通訊獲得比一般TCP/IP更高的時間確定性，這是Modbus/OPC UA這類「盡力而為(best effort)」協定做不到的能力。", "is_project": false}, {"day": "週三", "content": "Profinet的三種通訊等級(TCP/RT/IRT)", "example": "理解不同即時性等級的應用場景", "explanation": "**三種等級比較**：\n- **TCP(標準通訊)**：跟一般網路通訊沒兩樣，用於非即時性要求的資料(例如組態設定、診斷資訊)\n- **RT(Real-Time，即時)**：透過優化的封包處理機制，達到毫秒等級的即時性，適合一般的PLC控制迴路\n- **IRT(Isochronous Real-Time，等時即時)**：最高等級的即時性，需要專用交換機支援，用於伺服馬達同步控制等對時間精度要求極高的場合\n\n**為什麼要分這麼多等級**：不同即時性等級對應不同的硬體成本跟複雜度，IRT需要特殊網路交換機、更嚴格的網路架構設計；一般應用用RT等級就足夠，沒必要為了不需要的精度多花成本，這是Week45學過「依實際需求選擇模型大小」同樣的務實工程思維，在工業通訊協定選型上的應用。", "is_project": false}, {"day": "週四", "content": "GSD檔案與裝置描述概念", "example": "了解設備如何被上位系統識別與設定", "explanation": "**概念說明**：GSD(General Station Description)檔案是描述一個Profinet裝置能力的標準化設定檔，類似「這台裝置的規格說明書」，包含它有哪些可讀寫的資料、支援哪些功能等資訊。\n\n**跟你學過的概念類比**：這有點像Week32學過的ROS2自訂訊息定義檔(.msg)，或是Week71學過的OPC UA資料模型——都是「先定義好裝置/系統的資料結構跟能力」，讓其他系統知道怎麼跟它溝通，只是GSD是Profinet生態系統的標準格式。\n\n**為什麼要知道這個概念**：如果之後你要把自己開發的AGV系統，正式整合進使用Profinet的產線，可能需要提供GSD檔案讓客戶的西門子PLC系統能識別你的裝置，這是深度整合到Profinet生態系的必要文件，這週先建立概念，Week74會更實務地討論怎麼跟這類系統互動。", "is_project": false}, {"day": "週五【小專案】", "content": "整理Profinet與一般TCP/IP的差異筆記", "example": "產出一份可作為未來接案參考的技術筆記", "explanation": "**為什麼要這樣做**：\n1. Profinet涉及專用硬體(特殊交換機)才能發揮完整的即時性優勢，不像Modbus/OPC UA能完全用軟體練習，這週的重點合理地放在「概念理解」跟「文件整理」，而非動手實作\n2. 把即時性等級(TCP/RT/IRT)、應用場景整理成清楚的筆記，這份筆記之後會在Week76整合進完整的四協定比較文件\n3. 完成這週後，你已經能在跟客戶討論技術方案時，正確判斷「這個案子是否真的需要Profinet的即時性，還是用Modbus/OPC UA就足夠」，這種技術選型判斷力，比會不會寫程式碼更能體現資深工程師的價值", "is_project": true}], "full_code": "【整理Profinet與一般TCP/IP的差異筆記：技術筆記範本】\n說明：產出一份可作為未來接案參考的技術筆記\n\n| 協定 | 即時性 | 常見應用 | 導入難度 |\n|---|---|---|---|\n| Modbus TCP | 中 | 一般感測器/簡易PLC | 低 |\n| OPC UA | 中 | 語意化資料交換、跨廠牌整合 | 中 |\n| Profinet | 高 | 歐系PLC(如Siemens) | 中高 |\n| EtherCAT | 極高 | 多軸運動控制、伺服同步 | 高 |\n\n選型建議：\n- 若客戶設備多為Siemens系列 -> 優先考慮Profinet閘道器\n- 若需要高頻運動控制(伺服馬達同步) -> 評估EtherCAT\n- 若只需資料監控、跨系統整合 -> OPC UA最具彈性\n"}, {"sheet": "Week74", "num": 74, "title": "Week 74：Profinet實務環境與工具", "purpose": "承接『Profinet基礎概念』累積的基礎，為接下來『EtherCAT基礎概念』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "認識常見PLC廠牌與設定工具(概念層)", "days": [{"day": "週一", "content": "常見支援Profinet的PLC廠牌", "example": "Siemens S7系列等常見於台灣製造業", "explanation": "**做什麼**：搜尋整理台灣製造業常見的PLC廠牌跟型號，特別留意哪些支援Profinet(西門子S7系列是主要代表)，哪些主要用Modbus(許多台系、日系PLC)。\n\n**為什麼要做這個市場調查**：這是接案業務很實際的功課——了解你潛在客戶「產線上實際裝的是什麼設備」，能幫助你在洽談案子前，就對可能遇到的技術挑戰有心理準備，而不是等到現場勘查才發現對方系統你完全不熟悉。\n\n**這也是商業技能的一環**：純技術能力之外，了解產業設備生態、市場分佈，是你四年計畫最終目標(接案/創業)不可或缺的商業敏感度，這種市場調查習慣值得提早開始培養。", "is_project": false}, {"day": "週二", "content": "TIA Portal等組態工具概念介紹", "example": "了解設定流程大致樣貌(非強制安裝)", "explanation": "**概念介紹**：TIA Portal是西門子官方的PLC組態軟體，工程師用它來設定PLC的程式邏輯、Profinet通訊參數等。這套軟體通常需要購買授權且體積龐大，這門課不要求你安裝，但了解大致的工作流程有其價值：\n1. 在TIA Portal裡定義PLC的硬體組態\n2. 設定Profinet裝置的IP位址、GSD檔案匯入\n3. 撰寫PLC控制邏輯(常用階梯圖Ladder Logic或結構化文字ST)\n\n**為什麼了解流程但不用親自操作**：這門課程的重點是「你的Python/ROS2系統要如何跟這樣的PLC系統溝通」，而不是要你變成PLC工程師本身，了解對方的工作環境長什麼樣子，能幫助你更好地跟負責PLC那端的工程師溝通協作，這在跨團隊合作的接案專案中很常見。", "is_project": false}, {"day": "週三", "content": "Python與Profinet裝置溝通的可行方案", "example": "了解目前多透過閘道器轉Modbus/OPC UA", "explanation": "**實務做法**：直接用Python原生實作完整的Profinet通訊協定棧相當複雜(尤其IRT等級)，實務上更常見的做法是透過「協定轉換閘道器(Gateway)」——一個專門的硬體或軟體裝置，一端說Profinet(跟PLC溝通)，另一端轉換成Modbus或OPC UA(跟你的Python系統溝通)。\n\n**為什麼要繞這一圈而不是直接對接**：這正是Week78要學的「多協定閘道器設計」概念的預告——與其你的每一支程式都要懂得說「Profinet語言」，不如透過一個專門的閘道器統一做轉換，你的AGV系統只需要專心用Modbus或OPC UA跟閘道器溝通，這是務實的系統整合策略，也是業界常見的做法。\n\n**為什麼這是重要的認知**：知道「有現成的閘道器產品可以解決這個問題」，比自己硬要從零實作完整Profinet協定棧務實得多，工程師的價值往往在於「知道怎麼有效整合現有資源解決問題」，而不是每件事都要自己重新發明。", "is_project": false}, {"day": "週四", "content": "查找台灣產業實際應用案例", "example": "搜尋相關產業新聞或技術文件", "explanation": "**做什麼**：上網搜尋台灣製造業(尤其是你未來可能鎖定的目標產業，例如電子代工、機械加工)實際使用Profinet或西門子系統整合AGV/機器人的案例或新聞報導。\n\n**為什麼要做這個功課**：這能幫助你更具體地想像「未來的客戶長什麼樣子」，也可能發現一些技術整合的實務細節(例如常見的痛點、常用的解決方案)，比純粹看官方技術文件更貼近真實產業現況，這種產業研究能力，對你之後的接案/創業路線是很實用的準備工作。", "is_project": false}, {"day": "週五【小專案】", "content": "研究一款常見PLC的Profinet設定流程", "example": "整理該PLC從組態到資料交換的基本步驟", "explanation": "**為什麼要這樣做**：\n1. 選定一款市場常見的西門子PLC型號，整理它從硬體安裝、TIA Portal組態、到能跟外部系統交換資料的完整流程筆記，即使你沒有實體硬體能操作，透過官方文件跟教學影片研究整理，依然能建立紮實的概念性理解\n2. 這份筆記之後可以作為你跟客戶初次討論技術方案時的參考資料，展現你確實理解對方系統的運作方式，能提升客戶對你專業度的信任\n3. 完成這週後，你已經對Profinet生態系有足夠的概念性理解，下週開始學習EtherCAT，這是另一種主打「高速運動控制」的工業乙太網路協定", "is_project": true}], "full_code": "【研究一款常見PLC的Profinet設定流程：技術筆記範本】\n說明：整理該PLC從組態到資料交換的基本步驟\n\n| 協定 | 即時性 | 常見應用 | 導入難度 |\n|---|---|---|---|\n| Modbus TCP | 中 | 一般感測器/簡易PLC | 低 |\n| OPC UA | 中 | 語意化資料交換、跨廠牌整合 | 中 |\n| Profinet | 高 | 歐系PLC(如Siemens) | 中高 |\n| EtherCAT | 極高 | 多軸運動控制、伺服同步 | 高 |\n\n選型建議：\n- 若客戶設備多為Siemens系列 -> 優先考慮Profinet閘道器\n- 若需要高頻運動控制(伺服馬達同步) -> 評估EtherCAT\n- 若只需資料監控、跨系統整合 -> OPC UA最具彈性\n"}, {"sheet": "Week75", "num": 75, "title": "Week 75：EtherCAT基礎概念", "purpose": "承接『Profinet實務環境與工具』累積的基礎，為接下來『Profinet/EtherCAT整合小專案』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "理解EtherCAT的即時性與應用場景", "days": [{"day": "週一", "content": "EtherCAT是什麼、由Beckhoff主導", "example": "了解其在運動控制領域的高即時性優勢", "explanation": "**背景說明**：EtherCAT(Ethernet for Control Automation Technology)是由德國Beckhoff公司開發的工業乙太網路協定，主打「極高速、極低延遲」的即時通訊能力，在需要精密同步運動控制的應用領域(例如多軸機械手臂、CNC工具機)特別受歡迎。\n\n**跟Profinet的定位差異**：Profinet(Week73~74學過)涵蓋從一般通訊到高即時性的完整範圍(TCP/RT/IRT三個等級)，是相對通用的工業乙太網路標準；EtherCAT則是更專精於「極致的即時性跟同步精度」，兩者在市場上常常是競爭關係，客戶會依實際應用需求選擇。\n\n**為什麼機器人領域特別重視EtherCAT**：多軸機械手臂需要所有關節馬達「同步」精確運動(想像六軸手臂如果各軸的控制訊號有時間差，整體動作會不流暢甚至危險)，EtherCAT的高同步精度特性，讓它在專業機器人控制器領域有很高的市占率。", "is_project": false}, {"day": "週二", "content": "EtherCAT的資料傳輸機制(飛速處理)", "example": "理解為何延遲遠低於一般乙太網路", "explanation": "**技術原理概念**：一般乙太網路通訊，每個裝置收到封包後要「完整接收、處理、再轉送」給下一個裝置，這個過程有一定延遲；EtherCAT採用一種特殊機制(常被形容為「飛速處理」，on the fly processing)——封包經過每個裝置時，裝置直接在封包「飛過」的過程中讀取/寫入屬於自己的那部分資料，不需要完整接收處理完才轉送，大幅降低了整體傳輸延遲。\n\n**用生活例子理解**：這有點像一列高速通過的火車，每個月台的站務人員只需要在火車經過的瞬間，把屬於自己車站的包裹丟上去或拿下來，而不需要讓整列火車完全停下來、等每一站都處理完才繼續開，這種「不停車」的設計大幅提升了整體效率。\n\n**為什麼不用深入理解實作細節**：這是Beckhoff的專利技術，實作複雜度很高，作為系統整合工程師，理解「這個協定為什麼快、適合什麼場景」，遠比自己重新實作協定底層更實用，這也是這門課程的一貫原則——理解原理跟應用場景，而非什麼都要從零自己刻。", "is_project": false}, {"day": "週三", "content": "EtherCAT常見應用場景", "example": "多軸運動控制、伺服馬達同步等", "explanation": "**典型應用場景**：\n- 多軸機械手臂的關節同步控制(想像Week39~42你用的SG90玩具手臂，如果換成工業級多軸手臂，背後很可能用EtherCAT控制)\n- CNC工具機的精密軸向控制\n- 高速包裝機、印刷機等需要多個馬達精確同步運轉的設備\n\n**跟你的AGV專案的關聯**：如果你之後接案的客戶需要的是「精密機械手臂系統整合」而不只是「AGV載具移動」，EtherCAT很可能是繞不開的技術，提早了解能讓你在提案階段就能準確判斷這類案子的技術複雜度跟報價考量。\n\n**為什麼AGV本身通常不需要EtherCAT**：AGV的移動控制(Week15差速輪控制)對同步精度的要求，遠不如多軸機械手臂那麼嚴苛，Modbus或簡單的序列通訊通常就足夠，EtherCAT主要是在「精密同步」是核心需求時才會被選用，這也是技術選型「按需求選擇」原則的又一例證。", "is_project": false}, {"day": "週四", "content": "與ROS2的ethercat驅動整合概念", "example": "了解ros2_control可透過EtherCAT驅動硬體", "explanation": "**概念說明**：Week37學過的`ros2_control`框架，實際上支援多種底層硬體介接方式，其中就包含透過EtherCAT驅動真實的工業伺服馬達，這代表你在Week37~38學到的「上層用標準ROS2介面控制、底層可以是不同硬體」架構思維，在真實工業級應用中同樣適用。\n\n**為什麼要提到這個整合可能性**：這顯示你四年計畫累積的ROS2知識，不只適用於你自製的樹莓派+ESP32+SG90系統，未來如果客戶案子需要整合工業級EtherCAT伺服馬達系統，你已經具備的ROS2架構知識，能透過更換底層硬體介接層(而不是重新學一整套全新框架)來適應，這正是Week37強調的「ros2_control抽象層讓上層邏輯不用管底層是模擬還是真實硬體」概念的延伸——現在多了一種「底層是工業級EtherCAT硬體」的可能性。", "is_project": false}, {"day": "週五【小專案】", "content": "比較Modbus/OPC UA/Profinet/EtherCAT適用情境", "example": "產出一張技術選型比較表", "explanation": "**為什麼要這樣做**：\n1. 這是Year4前三個協定模組(Modbus、OPC UA、Profinet/EtherCAT)的整合思考練習，把四種協定的即時性、普及度、導入難度、典型應用整理成一張清楚的比較表\n2. 這張比較表不是為了考試，而是你之後接案評估技術方案時真正會用到的參考資料——客戶說「我們產線有西門子PLC，需要跟你的AGV系統整合」時，你能立刻判斷該考慮Profinet閘道器\n3. 完成這週後，下週會把四種協定的比較，實際整合進一份能直接用於提案的正式技術文件，這是把「學習筆記」轉化成「商業文件」的重要一步", "is_project": true}], "full_code": "【比較Modbus/OPC UA/Profinet/EtherCAT適用情境：技術筆記範本】\n說明：產出一張技術選型比較表\n\n| 協定 | 即時性 | 常見應用 | 導入難度 |\n|---|---|---|---|\n| Modbus TCP | 中 | 一般感測器/簡易PLC | 低 |\n| OPC UA | 中 | 語意化資料交換、跨廠牌整合 | 中 |\n| Profinet | 高 | 歐系PLC(如Siemens) | 中高 |\n| EtherCAT | 極高 | 多軸運動控制、伺服同步 | 高 |\n\n選型建議：\n- 若客戶設備多為Siemens系列 -> 優先考慮Profinet閘道器\n- 若需要高頻運動控制(伺服馬達同步) -> 評估EtherCAT\n- 若只需資料監控、跨系統整合 -> OPC UA最具彈性\n"}, {"sheet": "Week76", "num": 76, "title": "Week 76：Profinet/EtherCAT整合小專案", "purpose": "承接『EtherCAT基礎概念』累積的基礎，為接下來『工業通訊安全性與網路架構』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "整理四種協定的技術選型建議", "days": [{"day": "週一", "content": "彙整四種協定的技術筆記", "example": "整理成一份系統性文件", "explanation": "**做什麼**：把Week65~75累積的所有筆記(Modbus基礎、OPC UA資料建模、Profinet即時性等級、EtherCAT同步機制)，整合成一份結構完整的技術文件，建議包含：協定簡介、技術特性比較表、各自適用場景、導入難度與成本考量。\n\n**為什麼要「彙整」而不是分散的筆記**：分散的每週筆記適合學習階段使用，但要拿給客戶或用在正式提案時，需要的是一份「一目瞭然、邏輯連貫」的整合文件，這種把零散學習內容轉化成正式商業文件的能力，是從「學生思維」轉換到「顧問/工程師思維」的重要練習。", "is_project": false}, {"day": "週二", "content": "分析AGV系統integration場景的協定選型", "example": "以自己的AGV專案為例做技術決策練習", "explanation": "**練習方式**：假設幾個不同的客戶情境，練習做出技術選型判斷：\n- 情境A：客戶只需要AGV回報基本狀態(電量、位置)給既有監控系統 → 建議方案跟理由？\n- 情境B：客戶產線全是西門子PLC，需要AGV跟產線設備協同運作 → 建議方案跟理由？\n- 情境C：客戶需要AGV上的機械手臂做高精度同步抓取 → 建議方案跟理由？\n\n**為什麼要做情境練習**：技術選型不是背答案，而是依「客戶實際情境」做出合理判斷的能力，透過模擬不同情境反覆練習這種判斷邏輯，能讓你在真正面對客戶時，更快、更有信心地給出專業建議，而不是每次都要重新從零思考。", "is_project": false}, {"day": "週三", "content": "撰寫給客戶看的技術選型說明草稿", "example": "練習用非技術語言解釋協定差異", "explanation": "**做什麼**：把技術性的協定比較，改寫成客戶(可能是工廠老闆、產線主管，不一定是技術背景)也能看懂的說明文字，例如把「即時性等級」改寫成「這個方案能不能保證資料在固定時間內送達，避免機台動作卡頓」這種更貼近實際感受的描述方式。\n\n**為什麼這個技能特別重要**：Week24就提過「展示技巧」的重要性，這裡進一步延伸到「文件溝通」——很多技術能力很強的工程師，因為沒辦法把技術價值講清楚給非技術背景的決策者聽，反而在商業合作上吃虧，這種「翻譯」能力，是純技術背景的工程師轉型接案/創業時，特別需要刻意練習的軟實力。", "is_project": false}, {"day": "週四", "content": "同儕或AI審閱內容", "example": "請AI協助檢查邏輯是否清楚", "explanation": "**做什麼**：把週三寫好的說明文件，請AI工具(延續Week22學過的AI協作技巧)幫忙審閱，檢查：\n- 邏輯是否清楚、有沒有前後矛盾的地方\n- 是否還殘留過多技術術語沒有轉譯成白話文\n- 論述是否有說服力，能不能讓非技術背景的人做出合理決策\n\n**為什麼要請AI(或同儕)審閱而不是自己覺得寫得夠好就好**：撰寫文件時，作者自己往往因為太熟悉內容，容易忽略「讀者不一定懂」的地方，第三方(不管是AI還是真人)的視角，能有效抓出這些「你以為講清楚了，其實沒有」的盲點，這是Week22就強調過的、AI輔助開發中「有效提問+客觀審閱」的延伸應用。", "is_project": false}, {"day": "週五【小專案】", "content": "撰寫協定選型技術筆記(給未來接案用)", "example": "完成一份可直接用於提案的技術文件", "explanation": "**為什麼這是重要的階段成果**：\n1. 這是Year4前12週(Week65~76)所有工業通訊協定知識的最終整合，產出一份真正「可交付、可使用」的商業文件，而不只是留在腦中的零散知識\n2. 這份文件會直接成為你四年計畫結束後，實際開始接案時的第一份提案素材，證明你不只懂技術，還懂得怎麼把技術轉譯成客戶能理解、能做決策的語言\n3. 完成這週後，你已經具備完整的工業通訊協定知識版圖跟商業文件撰寫能力，下週開始要學習工業通訊安全性，補齊技術方案裡不可或缺的資安考量", "is_project": true}], "full_code": "【撰寫協定選型技術筆記(給未來接案用)：技術筆記範本】\n說明：完成一份可直接用於提案的技術文件\n\n| 協定 | 即時性 | 常見應用 | 導入難度 |\n|---|---|---|---|\n| Modbus TCP | 中 | 一般感測器/簡易PLC | 低 |\n| OPC UA | 中 | 語意化資料交換、跨廠牌整合 | 中 |\n| Profinet | 高 | 歐系PLC(如Siemens) | 中高 |\n| EtherCAT | 極高 | 多軸運動控制、伺服同步 | 高 |\n\n選型建議：\n- 若客戶設備多為Siemens系列 -> 優先考慮Profinet閘道器\n- 若需要高頻運動控制(伺服馬達同步) -> 評估EtherCAT\n- 若只需資料監控、跨系統整合 -> OPC UA最具彈性\n"}, {"sheet": "Week77", "num": 77, "title": "Week 77：工業通訊安全性與網路架構", "purpose": "承接『Profinet/EtherCAT整合小專案』累積的基礎，為接下來『多協定閘道器設計(Gateway)』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "了解OT網路基本資安概念", "days": [{"day": "週一", "content": "OT網路與IT網路的差異", "example": "理解工廠網路對可用性優先於機密性的特性", "explanation": "**概念說明**：IT(Information Technology)網路是你熟悉的一般辦公室/網際網路環境，安全性重點通常是CIA三要素——機密性(Confidentiality)、完整性(Integrity)、可用性(Availability)，且機密性往往被放在很高的優先順序(例如保護個資、商業機密)。\n\nOT(Operational Technology)網路是工廠現場控制設備的網路環境，安全性的優先順序常常相反——**可用性最重要**，因為產線一旦停機，每分鐘可能損失巨額成本，甚至造成安全事故，機密性反而是相對次要的考量。\n\n**為什麼這個差異對你很重要**：如果你用一般IT思維(例如要求頻繁的安全性更新、複雜的多重驗證流程)去設計AGV系統的網路架構，可能會被工廠客戶認為「這樣太麻煩、會影響產線運作」，理解OT環境的思維邏輯，能讓你設計出真正符合客戶實際需求的安全方案。", "is_project": false}, {"day": "週二", "content": "常見資安風險(未加密協定、預設密碼)", "example": "了解Modbus等傳統協定缺乏內建安全機制", "explanation": "**常見風險**：\n- Modbus協定(Week65~68學過)完全沒有內建加密或身份驗證機制，任何能接上網路的裝置理論上都能讀寫暫存器，這是設計於1979年、當時網路安全還不是主要考量的歷史包袱\n- 很多工業設備出廠時有預設帳號密碼，如果客戶從未更改，等於門戶大開\n- 舊型PLC韌體可能存在已知漏洞，但因為產線停機成本高，客戶往往不願意頻繁更新韌體\n\n**為什麼Week69學的OPC UA會特別強調安全機制**：這正是回應了Modbus這類早期協定的資安缺陷，OPC UA是在資安意識提升後設計的協定，內建認證加密機制，如果客戶案子對資安要求較高，這也是選用OPC UA而非純Modbus的一個重要理由。", "is_project": false}, {"day": "週三", "content": "網路分段與防火牆基本概念", "example": "了解如何隔離OT網路與辦公網路", "explanation": "**概念說明**：「網路分段(Network Segmentation)」是把OT網路(控制設備)跟IT網路(辦公室電腦、對外網際網路)實體或邏輯上隔離開來，即使辦公室電腦中毒或被入侵，攻擊者也很難直接跳到控制產線的OT網路造成實際的生產安全事故。\n\n**實務上常見的分段方式**：\n- 完全實體隔離(OT網路不接外部網際網路)，最安全但也最不便於遠端維護\n- 用防火牆設定嚴格的存取規則，只允許特定必要的通訊(例如只開放你的AGV系統跟SCADA之間的特定埠號)\n- DMZ(非軍事區)架構，在OT跟IT網路之間加一層緩衝區域\n\n**為什麼系統整合工程師需要懂這個概念**：即使你不是資安專家，理解基本的網路分段概念，能讓你在設計AGV系統的網路架構時，主動跟客戶的IT/OT部門討論「我的系統該接在哪個網段」，而不是天真地假設整個工廠網路都是暢通無阻的。", "is_project": false}, {"day": "週四", "content": "VPN/遠端存取安全考量", "example": "了解遠端維護AGV系統時的安全注意事項", "explanation": "**情境說明**：之後你接案的AGV系統，客戶很可能會希望你能「遠端」協助除錯或維護(不用每次都親自跑到工廠現場)，這時候就需要考慮遠端存取的安全性。\n\n**基本安全原則**：\n- 使用VPN(虛擬私人網路)建立加密通道，而不是直接把OT網路的裝置暴露在公開網際網路上\n- 遠端存取帳號要有明確的權限範圍跟時效性(例如只在維護期間開放，用完即關閉)\n- 記錄(log)所有遠端存取行為，方便事後追蹤稽核\n\n**為什麼要提早考慮這個議題**：這是你身為系統整合廠商的責任——如果因為你的AGV系統開了一個不安全的遠端存取後門，導致客戶產線被入侵，這不只是技術問題，更是商業信譽跟法律責任問題，提早建立正確的安全意識，是保護你自己接案事業的重要一環。", "is_project": false}, {"day": "週五【小專案】", "content": "畫出AGV系統的網路架構安全示意圖", "example": "標示各層級網路分段與資料流向", "explanation": "**為什麼要這樣做**：\n1. 把本週學到的OT/IT差異、網路分段、遠端存取安全，實際應用在畫出你自己AGV系統的網路架構圖，標示AGV本身、Modbus/OPC UA Server、SCADA監控畫面、你的遠端維護存取點，各自應該落在哪個網段、之間該用什麼方式通訊\n2. 這種架構圖是之後正式提案給客戶時，展現你「不只會做功能，也懂得資安考量」的重要文件，能大幅提升客戶對你專業度的信任\n3. 完成這週後，下週開始要把前面學到的多種協定，實際整合設計成一個「多協定閘道器」，把所有技術跟安全考量真正落地成一個完整的系統架構", "is_project": true}], "full_code": "【畫出AGV系統的網路架構安全示意圖：技術筆記範本】\n說明：標示各層級網路分段與資料流向\n\n| 協定 | 即時性 | 常見應用 | 導入難度 |\n|---|---|---|---|\n| Modbus TCP | 中 | 一般感測器/簡易PLC | 低 |\n| OPC UA | 中 | 語意化資料交換、跨廠牌整合 | 中 |\n| Profinet | 高 | 歐系PLC(如Siemens) | 中高 |\n| EtherCAT | 極高 | 多軸運動控制、伺服同步 | 高 |\n\n選型建議：\n- 若客戶設備多為Siemens系列 -> 優先考慮Profinet閘道器\n- 若需要高頻運動控制(伺服馬達同步) -> 評估EtherCAT\n- 若只需資料監控、跨系統整合 -> OPC UA最具彈性\n"}, {"sheet": "Week78", "num": 78, "title": "Week 78：多協定閘道器設計(Gateway)", "purpose": "承接『工業通訊安全性與網路架構』累積的基礎，為接下來『系統整合週(上)：對接SCADA/MES模擬』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "讓同一份資料同時透過多種協定對外", "days": [{"day": "週一", "content": "Gateway架構設計概念", "example": "一份資料來源、多種協定對外提供服務", "explanation": "**概念說明**：閘道器(Gateway)的核心概念，是把「同一份內部資料」，同時用多種不同協定對外提供服務——你的AGV內部只需要維護一份狀態資料(電量、速度、位置)，但外部不同系統可能習慣用不同協定來讀取：舊系統可能只支援Modbus，新的SCADA系統可能用OPC UA。\n\n**為什麼不乾脆要求所有外部系統都改用同一種協定**：在真實工業場域，你往往沒有辦法要求客戶更換既有的監控系統，閘道器架構讓你的AGV系統能「同時相容」多種既有系統，這是務實的系統整合策略，而不是奢望一個統一的理想世界。\n\n**這是Week74提過的閘道器概念，這裡由你親自實作**：Week74討論Profinet閘道器是「別人做好的商業產品」，這裡你要親自設計、實作一個簡化版的Modbus/OPC UA雙協定閘道器，理解閘道器背後的架構原理。", "is_project": false}, {"day": "週二", "content": "共用資料層設計", "example": "用一個內部資料結構同時餵給Modbus/OPC UA Server", "explanation": "```python\nshared_data = {\n    \"battery\": 80,\n    \"speed\": 0,\n}\n\n# Modbus Server讀取shared_data更新暫存器\n# OPC UA Server也讀取同一份shared_data更新變數節點\n```\n\n**逐行說明**：\n- 用一個共用的Python dict(或更嚴謹的做法是用一個有鎖保護的class)當作「單一事實來源(single source of truth)」，Modbus跟OPC UA兩個Server都從這裡讀取最新資料，而不是各自獨立維護一份可能不同步的資料\n- 這是Week5學過dict資料結構、加上Week19學過的執行緒鎖定概念，在雙協定架構下的整合應用\n\n**為什麼要「共用」而不是各自獨立更新**：如果Modbus Server跟OPC UA Server各自獨立從感測器讀取資料，可能因為讀取時間點些微差異，導致兩邊回報的電量數值不完全一致，這種「同一個系統、對外卻回報不一致資料」的狀況，會讓整合的客戶系統感到困惑，共用資料層確保「無論用哪種協定查詢，得到的都是同一份真實資料」。", "is_project": false}, {"day": "週三", "content": "撰寫Gateway整合程式", "example": "同時啟動Modbus Server與OPC UA Server", "explanation": "```python\nimport threading\nimport asyncio\n\ndef run_modbus_server():\n    # Week67學過的Modbus Server啟動邏輯\n    StartTcpServer(context=modbus_context, address=(\"0.0.0.0\", 502))\n\nasync def run_opcua_server():\n    # Week70~72學過的OPC UA Server啟動邏輯\n    async with server:\n        while True:\n            await asyncio.sleep(1)\n\nif __name__ == \"__main__\":\n    threading.Thread(target=run_modbus_server, daemon=True).start()\n    asyncio.run(run_opcua_server())\n```\n\n**逐行說明**：\n- Modbus Server(用threading架構)在背景執行緒運行，OPC UA Server(用asyncio架構)在主程式運行，兩種不同底層架構的Server在同一支程式裡並存，這是這週技術上最有挑戰性的整合點\n- 兩者都從同一份`shared_data`讀寫，確保資料一致性\n\n**為什麼這個整合有點棘手**：threading(多執行緒)跟asyncio(非同步)是Python兩種不同的並行處理模型，混用時需要特別注意資料存取的執行緒安全性(thread safety)，這是本週小專案需要細心處理的技術細節，也是為什麼要留一整週時間讓你紮實練習這個整合。", "is_project": false}, {"day": "週四", "content": "測試兩種協定資料一致性", "example": "確認同一份資料在兩邊讀到的數值一致", "explanation": "**測試方式**：同時用Week68做的Modbus工具、跟Week70做的OPC UA Client，在同一時刻分別讀取電量資料，確認兩邊讀到的數值完全一致；接著改變shared_data裡的電量數值(模擬感測器更新)，確認兩邊很快都能讀到新的數值。\n\n**為什麼一致性測試是這週最重要的驗收標準**：如果兩種協定讀到不一樣的資料，代表你的共用資料層設計有問題(可能是執行緒安全性沒處理好，導致資料寫入時機衝突)，這種「資料不一致」的bug往往不容易在單次測試中發現，需要多次重複測試、甚至故意在資料更新的瞬間去讀取，才能確保真正穩健。", "is_project": false}, {"day": "週五【小專案】", "content": "AGV狀態同時可用Modbus與OPC UA讀取", "example": "完成一個多協定並存的Gateway原型", "explanation": "**為什麼這是重要的技術整合里程碑**：\n1. 這是你四年計畫裡第一次真正把兩種不同架構(threading vs asyncio)的系統整合在同一支程式裡穩定運作，這種跨架構整合能力，是系統整合工程師的核心價值——不同廠牌、不同技術背景的系統，往往需要類似的整合思維\n2. 這個Gateway原型，正是Week74提到的「客戶產線同時有新舊系統，需要不同協定並存」這種真實情境的具體解決方案，不再只是紙上談兵的技術選型筆記\n3. 完成這週後，下週會把這個Gateway進一步跟模擬的SCADA系統對接，做出更完整、更接近真實客戶需求的整合展示", "is_project": true}], "full_code": "# AGV狀態同時可用Modbus與OPC UA讀取\n# 說明：完成一個多協定並存的Gateway原型\nimport threading\nfrom pymodbus.server import StartTcpServer\nfrom pymodbus.datastore import ModbusSequentialDataBlock, ModbusSlaveContext, ModbusServerContext\n\nshared_data = {\"battery\": 80, \"speed\": 0}\n\ndef run_modbus_server():\n    block = ModbusSequentialDataBlock(0, [shared_data[\"battery\"], shared_data[\"speed\"]])\n    store = ModbusSlaveContext(hr=block)\n    context = ModbusServerContext(slaves=store, single=True)\n    StartTcpServer(context=context, address=(\"0.0.0.0\", 502))\n\nif __name__ == \"__main__\":\n    t = threading.Thread(target=run_modbus_server, daemon=True)\n    t.start()\n    print(\"Modbus Server已啟動，OPC UA Server可在另一支程式中同時讀取shared_data\")\n    t.join()\n"}, {"sheet": "Week79", "num": 79, "title": "Week 79：系統整合週(上)：對接SCADA/MES模擬", "purpose": "承接『多協定閘道器設計(Gateway)』累積的基礎，為接下來『M5里程碑：四年計畫最終整合展示週』做準備；是整個四年路線圖中不可省略的一塊拼圖。", "goal": "把AGV資料串進上位監控系統模擬", "days": [{"day": "週一", "content": "SCADA/MES系統概念簡介", "example": "了解上位監控系統在工廠中的角色", "explanation": "**概念說明**：\n- **SCADA(Supervisory Control and Data Acquisition)**：監控與資料擷取系統，讓工廠管理人員能在一個畫面上看到整條產線各設備的即時狀態(類似Week18~19你做的AGV網頁儀表板，只是規模更大、監控對象更多)\n- **MES(Manufacturing Execution System)**：製造執行系統，管理更高層次的生產排程、品質追蹤、產能分析等\n\n**你的AGV系統在這個架構中的位置**：AGV是產線上的一個「執行單元」，透過Week65~78學到的Modbus/OPC UA協定，把自己的狀態回報給SCADA(讓管理者即時看到)，甚至接受MES系統下達的生產排程指令(例如「去載運第3號物料到第5工位」)，這是工廠自動化生態系裡典型的角色分工。", "is_project": false}, {"day": "週二", "content": "用簡易網頁模擬SCADA監控畫面", "example": "延伸Week18~19的Flask技能做監控儀表板", "explanation": "```python\nfrom flask import Flask, render_template_string\n\napp = Flask(__name__)\n\nTEMPLATE = \"\"\"\n<h1>模擬SCADA監控面板</h1>\n<p>AGV電量: {{ battery }}%</p>\n<p>AGV速度: {{ speed }}</p>\n\"\"\"\n\n@app.route(\"/\")\ndef dashboard():\n    battery = read_from_modbus_or_opcua()  # 從Week78的Gateway讀取\n    return render_template_string(TEMPLATE, battery=battery, speed=0)\n```\n\n**逐行說明**：\n- 這是Week18~19學過的Flask網頁技能的直接延伸，只是資料來源從當時直接讀ESP32序列埠，改成透過Week78做好的Gateway，用標準工業協定讀取AGV狀態\n- 這種「用網頁模擬正式SCADA系統」的做法，讓你不需要購買昂貴的商用SCADA軟體授權，也能做出概念完整的demo\n\n**為什麼要自己模擬而不是用真正的SCADA軟體**：商用SCADA系統(例如Wonderware、WinCC)通常需要付費授權，對於demo展示跟學習階段來說，自己用Flask做一個簡化版本，重點是驗證「AGV系統能被上位監控系統正確整合」這個核心概念，不需要糾結在複雜商用軟體的操作細節上。", "is_project": false}, {"day": "週三", "content": "串接Gateway資料到監控畫面", "example": "監控畫面定期讀取OPC UA/Modbus資料", "explanation": "```python\n@app.route(\"/api/status\")\ndef api_status():\n    battery = modbus_helper.read(0)\n    return jsonify({\"battery\": battery})\n```\n```javascript\nsetInterval(() => {\n  fetch(\"/api/status\")\n    .then(res => res.json())\n    .then(data => {\n      document.getElementById(\"battery\").innerText = data.battery + \"%\";\n    });\n}, 1000);\n```\n\n**逐行說明**：\n- 這是Week18學過的定時輪詢技巧，這次輪詢的資料來源是Week78的Gateway(透過Modbus或OPC UA)，而不是直接讀感測器，這代表你的監控網頁現在是透過「標準工業協定」取得資料，而不是走專屬的內部通訊管道\n- 這種架構的好處： const STORAGE_KEY = "tracker-progress";
let progress = {};
let currentMonth = 1;
let searchTerm = "";

const YEAR_COLORS = {
  Year1: {bg:"var(--p-purple-bg)", fg:"var(--p-purple-fg)"},
  Year2: {bg:"var(--p-teal-bg)",   fg:"var(--p-teal-fg)"},

  Year4: {bg:"var(--p-coral-bg)",  fg:"var(--p-coral-fg)"}
};

function yearOf(num){
  if(num<=24) return "Year1";
  if(num<=48) return "Year2";
  if(num<=64) return "Year3";
  return "Year4";
}

const MONTHS = [];
for(let i=0;i<WEEKS.length;i+=4){
  MONTHS.push(WEEKS.slice(i,i+4));
}

function ensureProgress(sheet, dayCount){
  if(!progress[sheet]){
    progress[sheet] = { checks: new Array(dayCount).fill(false), note: "" };
  }
  return progress[sheet];
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ progress = JSON.parse(raw); }
  }catch(e){ progress = {}; }
}

function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
  catch(e){ console.error("儲存進度失敗", e); }
}

function exportBackup(){
  const payload = { exportedAt: new Date().toISOString(), progress };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,"");
  a.href = url;
  a.download = `robotplan-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(file){
  if(!confirm("匯入後會覆蓋目前的勾選記錄，確定嗎？")) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      progress = data.progress || data;
      saveProgress();
      renderAll();
    }catch(err){
      alert("匯入失敗，檔案格式不正確");
    }
  };
  reader.readAsText(file);
}

function weekProgressRatio(week){
  const p = ensureProgress(week.sheet, week.days.length);
  const checked = p.checks.filter(Boolean).length;
  return {checked, total: week.days.length};
}

function overallStats(){
  let totalAll=0, checkedAll=0;
  const perYear = {Year1:[0,0], Year2:[0,0], Year3:[0,0], Year4:[0,0]};
  WEEKS.forEach(w=>{
    const {checked, total} = weekProgressRatio(w);
    totalAll += total; checkedAll += checked;
    const y = yearOf(w.num);
    perYear[y][0]+=checked; perYear[y][1]+=total;
  });
  return {checkedAll, totalAll, perYear};
}

function renderProgressRow(){
  const {checkedAll, totalAll, perYear} = overallStats();
  const overallPct = totalAll ? Math.round(checkedAll/totalAll*100) : 0;
  let html = `<div class="progress-block">
    <div class="progress-label"><span>整體進度</span><span>${checkedAll}/${totalAll} (${overallPct}%)</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${overallPct}%"></div></div>
  </div>`;
  ["Year1","Year2","Year3","Year4"].forEach(y=>{
    const [c,t] = perYear[y];
    const pct = t ? Math.round(c/t*100) : 0;
    html += `<div class="progress-block">
      <div class="progress-label"><span>${y}</span><span>${c}/${t} (${pct}%)</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  });
  document.getElementById("progressRow").innerHTML = html;
}

function renderMonthNav(){
  const nav = document.getElementById("monthNav");
  let html = "";
  MONTHS.forEach((weeksInMonth, idx)=>{
    const monthNum = idx+1;
    let c=0, t=0;
    weeksInMonth.forEach(w=>{ const r = weekProgressRatio(w); c+=r.checked; t+=r.total; });
    const pct = t? Math.round(c/t*100):0;
    const label = weeksInMonth.map(w=>"W"+w.num).join("-");
    html += `<button class="month-btn ${monthNum===currentMonth?'active':''}" data-month="${monthNum}">
      第${monthNum}個月<span class="m-progress">${label} · ${pct}%</span>
    </button>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll(".month-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      currentMonth = parseInt(btn.dataset.month);
      searchTerm = "";
      document.getElementById("searchBox").value = "";
      renderAll();
    });
  });
}

function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function mdLite(text){
  if(!text) return "";
  const blocks = [];
  let t = String(text);
  t = t.replace(/```[a-zA-Z]*\n([\s\S]*?)```/g, (m, code)=>{
    const idx = blocks.length;
    blocks.push(`<pre>${escapeHtml(code.trim())}</pre>`);
    return `@@BLOCK${idx}@@`;
  });
  t = escapeHtml(t);
  t = t.replace(/`([^`]+)`/g, (m, code)=>`<code>${code}</code>`);
  t = t.replace(/\*\*([^*]+)\*\*/g, (m, b)=>`<strong>${b}</strong>`);
  t = t.replace(/@@BLOCK(\d+)@@/g, (m, idx)=>blocks[parseInt(idx)]);
  return t;
}

function matchesSearch(week, term){
  if(!term) return true;
  const hay = [week.title, week.purpose, week.goal,
    ...week.days.map(d=>d.content+" "+d.example)].join(" ").toLowerCase();
  return hay.includes(term.toLowerCase());
}

function weekCardHtml(week, isOpen){
  const {checked, total} = weekProgressRatio(week);
  const p = ensureProgress(week.sheet, week.days.length);
  const allDone = checked===total && total>0;
  const yc = YEAR_COLORS[yearOf(week.num)];

  let daysHtml = "";
  week.days.forEach((d, i)=>{
    const explainSection = d.explanation ? `
      <details class="explain-details">
        <summary>📖 完整教學（逐行說明 / 常見錯誤）</summary>
        <div class="explain-body">${mdLite(d.explanation)}</div>
      </details>` : "";
    daysHtml += `<div class="day-item ${d.is_project?'project':''}">
      <input type="checkbox" class="chk" data-sheet="${week.sheet}" data-idx="${i}" ${p.checks[i]?'checked':''}>
      <span class="day-label">${escapeHtml(d.day)}</span>
      <div class="day-content">
        <div class="content-line">${escapeHtml(d.content)}</div>
        <div class="example-line">${escapeHtml(d.example)}</div>
        ${d.steps? `<div class="steps-line">${escapeHtml(d.steps)}</div>`:""}
        ${explainSection}
      </div>
    </div>`;
  });

  const codeSection = week.full_code ? `
    <details class="code-details">
      <summary>完整範例程式碼</summary>
      <pre class="code-block">${escapeHtml(week.full_code)}</pre>
    </details>` : "";

  return `
  <div class="week-card ${isOpen?'open':''}" data-sheet="${week.sheet}">
    <div class="week-head">
      <div class="week-node ${allDone?'done':''}" style="background:${yc.bg};color:${yc.fg};">W${week.num}</div>
      <div class="week-head-text">
        <div class="wt">${escapeHtml(week.title)}</div>
        <div class="wg">${escapeHtml(week.goal)}</div>
      </div>
      <div class="week-mini-progress">${checked}/${total}</div>
      <div class="chevron">▶</div>
    </div>
    <div class="week-body">
      <div class="section-label">本週作用</div>
      <div class="goal-box">${escapeHtml(week.purpose)}</div>
      <div class="section-label">本週目標</div>
      <div class="goal-box">${escapeHtml(week.goal)}</div>
      <div class="section-label">每日內容</div>
      ${daysHtml}
      ${codeSection}
      <label class="note-label">卡關記錄 / 心得筆記</label>
      <textarea class="note-box" data-sheet="${week.sheet}" placeholder="這週卡在哪裡？下次要注意什麼？">${escapeHtml(p.note)}</textarea>
    </div>
  </div>`;
}

let openSheets = new Set();

function renderWeekGrid(){
  const grid = document.getElementById("weekGrid");
  const term = searchTerm.trim();
  let list;
  if(term){ list = WEEKS.filter(w=>matchesSearch(w, term)); }
  else { list = MONTHS[currentMonth-1] || []; }

  if(list.length===0){
    grid.innerHTML = `<div class="empty-msg">沒有符合的週次，換個關鍵字試試</div>`;
    return;
  }

  grid.innerHTML = list.map(w=>weekCardHtml(w, openSheets.has(w.sheet))).join("");

  grid.querySelectorAll(".week-head").forEach(head=>{
    head.addEventListener("click", ()=>{
      const card = head.closest(".week-card");
      const sheet = card.dataset.sheet;
      if(openSheets.has(sheet)){ openSheets.delete(sheet); card.classList.remove("open"); }
      else { openSheets.add(sheet); card.classList.add("open"); }
    });
  });

  grid.querySelectorAll(".chk").forEach(chk=>{
    chk.addEventListener("change", async (e)=>{
      const sheet = e.target.dataset.sheet;
      const idx = parseInt(e.target.dataset.idx);
      const week = WEEKS.find(w=>w.sheet===sheet);
      const p = ensureProgress(sheet, week.days.length);
      p.checks[idx] = e.target.checked;
      await saveProgress();
      renderAll(true);
    });
  });

  grid.querySelectorAll(".note-box").forEach(box=>{
    let debounce;
    box.addEventListener("input", (e)=>{
      const sheet = e.target.dataset.sheet;
      const week = WEEKS.find(w=>w.sheet===sheet);
      const p = ensureProgress(sheet, week.days.length);
      p.note = e.target.value;
      clearTimeout(debounce);
      debounce = setTimeout(saveProgress, 500);
    });
  });
}

function renderAll(keepScroll){
  const scrollY = window.scrollY;
  renderProgressRow();
  renderMonthNav();
  renderWeekGrid();
  if(keepScroll) window.scrollTo(0, scrollY);
}

document.getElementById("searchBox").addEventListener("input", (e)=>{
  searchTerm = e.target.value;
  renderWeekGrid();
});

document.getElementById("exportBtn").addEventListener("click", exportBackup);
document.getElementById("importInput").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(file) importBackup(file);
  e.target.value = "";
});

(async function init(){
  await loadProgress();
  renderAll();
})();
</script>
</body>
</html>
