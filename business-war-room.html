<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機器人整合創業｜四年行動作戰室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7FC;
  --bg-grid: rgba(15,168,149,0.06);
  --panel:#FFFFFF;
  --panel-2:#FFFFFFcc;
  --panel-solid:#FFFFFFf2;
  --card:#FFFFFF;
  --border:#DFE6F2;
  --border-soft:#EBF0F9;
  --text:#141B27;
  --text-dim:#374357;
  --text-mute:#697A90;
  --accent:#0FA895;
  --accent-bright:#17D9BE;
  --accent-dim:#0fa8951a;
  --accent-border:#B9EFE6;
  --accent-ink:#FFFFFF;
  --amber:#E07C0E;
  --amber-bright:#FFA83D;
  --amber-dim:#e07c0e1c;
  --amber-border:#FBDDB1;
  --red:#E1435C;
  --red-bright:#FF6B7D;
  --red-dim:#e1435c1a;
  --red-border:#F9C7CE;
  --violet:#7C4FE0;
  --violet-bright:#A47CF0;
  --violet-dim:#7c4fe01c;
  --violet-border:#DDCCF7;
  --green:#20A863;
  --green-bright:#33D17E;
  --green-dim:#20a8631c;
  --green-border:#B7EDCD;
  --radius:14px;
  --radius-sm:9px;
  --font-display:'Space Grotesk', 'Noto Sans TC', sans-serif;
  --font-body:'Noto Sans TC', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --shadow-card: 0 1px 2px rgba(20,30,60,0.04), 0 6px 16px -6px rgba(20,30,60,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(180deg, rgba(15,168,149,0.07), transparent 320px),
    repeating-linear-gradient(0deg, var(--bg-grid) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--bg-grid) 0 1px, transparent 1px 40px),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-bright); color:#fff;}
a{color:inherit;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CBD5E5; border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#AFBEd6;}

#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:288px; flex:none; background:var(--panel);
  border-right:1px solid var(--border-soft);
  height:100vh; position:sticky; top:0; overflow-y:auto;
  padding:20px 14px 40px;
  z-index:20;
}
.brand{
  display:flex; align-items:flex-start; gap:10px;
  padding:4px 8px 18px;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:16px;
}
.brand .mark{
  width:38px; height:38px; border-radius:10px;
  background:linear-gradient(145deg, var(--accent-bright), var(--accent));
  display:flex; align-items:center; justify-content:center;
  font-size:19px; flex:none; box-shadow:0 0 0 1px rgba(255,255,255,0.6), 0 6px 16px -4px rgba(15,168,149,0.45);
}
.brand h1{
  font-family:var(--font-display); font-size:15px; font-weight:700;
  margin:2px 0 3px; letter-spacing:.2px; color:var(--text);
}
.brand p{margin:0; font-size:11.5px; color:var(--text-mute); font-family:var(--font-mono); letter-spacing:.3px;}

.search-wrap{position:relative; margin-bottom:18px;}
#searchInput{
  width:100%; background:var(--card); border:1px solid var(--border);
  color:var(--text); border-radius:var(--radius-sm); padding:10px 34px 10px 12px;
  font-family:var(--font-body); font-size:13.5px; outline:none;
  transition:border-color .15s;
}
#searchInput:focus{border-color:var(--accent);}
.search-wrap::after{
  content:'⌕'; position:absolute; right:11px; top:50%; transform:translateY(-50%) scaleX(1.3);
  color:var(--text-mute); font-size:16px; pointer-events:none;
}
#searchResults{
  position:absolute; top:calc(100% + 6px); left:0; right:0;
  background:#FFFFFF; border:1px solid var(--border); border-radius:var(--radius-sm);
  box-shadow:0 16px 32px -10px rgba(20,30,60,0.18); max-height:340px; overflow-y:auto;
  z-index:50; display:none;
}
#searchResults.show{display:block;}
.sr-item{
  padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--border-soft);
  display:flex; flex-direction:column; gap:2px;
}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:var(--card);}
.sr-item .sr-title{font-size:13px; font-weight:600; color:var(--text); display:flex; gap:6px; align-items:center;}
.sr-item .sr-snip{font-size:11.5px; color:var(--text-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sr-item mark{background:var(--accent-dim); color:var(--accent); border-radius:3px; padding:0 2px;}
.sr-empty{padding:14px 12px; font-size:12.5px; color:var(--text-mute); text-align:center;}

.backup-bar{display:flex; gap:6px; margin-bottom:16px;}
.backup-btn{
  flex:1; background:var(--card); border:1px solid var(--border); color:var(--text-dim);
  border-radius:var(--radius-sm); padding:8px 6px; font-family:var(--font-body); font-size:11.5px;
  cursor:pointer; transition:border-color .15s, color .15s;
}
.backup-btn:hover{border-color:var(--accent); color:var(--accent);}

.cat-group{margin-bottom:4px;}
.cat-head{
  display:flex; align-items:center; gap:8px; padding:9px 8px;
  cursor:pointer; border-radius:8px; user-select:none;
}
.cat-head:hover{background:var(--card);}
.cat-head .ci{font-size:14px;}
.cat-head .ct{
  font-family:var(--font-display); font-size:11.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:.09em; color:var(--text-dim); flex:1;
}
.cat-head .cx{font-size:10px; color:var(--text-mute); transition:transform .2s;}
.cat-group.collapsed .cx{transform:rotate(-90deg);}
.cat-group.collapsed .cat-list{display:none;}
.cat-list{padding:2px 0 10px 6px; border-left:1px solid var(--border-soft); margin-left:19px; display:flex; flex-direction:column; gap:3px;}
.nav-item{
  display:flex; align-items:flex-start; gap:8px;
  padding:7px 10px; border-radius:8px; cursor:pointer;
  font-size:13px; color:var(--text-dim);
  border:1px solid transparent;
}
.nav-item .ni{font-size:13px; flex:none; line-height:1.5;}
.nav-item .nt{white-space:normal; overflow-wrap:break-word; line-height:1.5;}
.nav-item:hover{background:var(--card); color:var(--text);}
.nav-item.active{background:var(--accent-dim); color:var(--accent); border-color:var(--accent-border); font-weight:600;}

/* ---------- Main ---------- */
#main{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden;}
#topbar{
  display:flex; align-items:flex-end; gap:8px; padding:10px 16px 0;
  background:var(--panel-solid); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border-soft); flex:none;
}
#tabbar{
  display:flex; align-items:flex-end; gap:2px;
  overflow-x:auto; flex:1; min-width:0;
  scrollbar-width:thin;
}
#tabbar::-webkit-scrollbar{height:6px;}
.tab{
  display:flex; align-items:center; gap:7px; padding:9px 12px 10px;
  background:var(--card); border:1px solid var(--border-soft); border-bottom:none;
  border-radius:10px 10px 0 0; font-size:12.5px; color:var(--text-mute);
  cursor:pointer; white-space:nowrap; flex:none; position:relative; top:1px;
}
.tab.active{background:var(--bg); color:var(--text); border-color:var(--border); font-weight:600;}
.tab .ti{font-size:13px;}
.tab .tx{
  font-size:14px; color:var(--text-mute); line-height:1; padding:1px 3px; border-radius:5px;
}
.tab .tx:hover{background:var(--red-dim); color:var(--red);}
#menuToggle{display:none;}

#content{flex:1; overflow-y:auto; padding:28px 34px 90px;}
#content::-webkit-scrollbar{width:10px;}
.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:70vh; color:var(--text-mute); text-align:center; gap:10px;
}
.empty-state .es-icon{font-size:40px; opacity:.5;}

/* ---------- Page header ---------- */
.page-head{margin-bottom:26px; padding-bottom:18px; border-bottom:1px solid var(--border-soft);}
.page-eyebrow{
  font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--accent);
  text-transform:uppercase; letter-spacing:.12em; margin-bottom:8px; display:flex; align-items:center; gap:8px;
}
.page-title{
  font-family:var(--font-display); font-size:24px; font-weight:700; margin:0 0 8px; color:var(--text);
  letter-spacing:.1px;
}
.page-sub{font-size:13.5px; color:var(--text-dim); max-width:820px; margin:0;}

/* ---------- Generic bits ---------- */
.tag{
  display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600;
  padding:3px 9px; border-radius:100px; background:var(--card); color:var(--text-dim);
  border:1px solid var(--border-soft); font-family:var(--font-body); white-space:nowrap;
}
.tag.accent{background:var(--accent-dim); color:var(--accent); border-color:var(--accent-border);}
.tag.amber{background:var(--amber-dim); color:var(--amber); border-color:var(--amber-border);}
.tag.red{background:var(--red-dim); color:var(--red); border-color:var(--red-border);}
.tag.green{background:var(--green-dim); color:var(--green); border-color:var(--green-border);}
.tag.violet{background:var(--violet-dim); color:var(--violet); border-color:var(--violet-border);}
.tag.mono{font-family:var(--font-mono);}

/* ---------- SVG icon system ---------- */
svg.icon{
  width:1em; height:1em; vertical-align:-0.16em; flex:none;
  display:inline-block;
}
.ci svg.icon, .ni svg.icon, .ti svg.icon{ width:1.05em; height:1.05em; }
.page-eyebrow svg.icon{ width:1.1em; height:1.1em; vertical-align:-0.18em; }
.mark svg.icon{ width:20px; height:20px; color:#fff; }
.es-icon svg.icon{ width:2.4em; height:2.4em; opacity:.55; }
.badge-icon{ margin-right:5px; }
.badge-icon.b-good{color:var(--green);}
.badge-icon.b-warn{color:var(--amber);}
.badge-icon.b-bad{color:var(--red);}
.badge-icon.b-mute{color:var(--text-mute);}
.icon-good{color:var(--green);}
.icon-mute{color:var(--text-mute);}
.pg-row .bought svg.icon{ width:1.15em; height:1.15em; }
.tl-fit .fi svg.icon{ width:1.05em; height:1.05em; }
.pin-group.warn .pg-group-title svg.icon{ margin-right:6px; color:var(--red); }

/* ---------- Interactive: checkboxes, progress, filters ---------- */
.chk{
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  color:var(--text-mute); transition:color .15s, transform .1s; flex:none;
}
.chk:hover{ color:var(--accent); }
.chk:active{ transform:scale(0.9); }
.chk.checked{ color:var(--green); }
.chk-inline{ margin-right:9px; }
.price-name{ display:flex; align-items:center; }
.is-done{ opacity:.6; }
.is-done .price-name span, .is-done .price-name{ text-decoration:none; }
.price-card.is-done .price-name, .pg-row.is-done .nm{ text-decoration:line-through; color:var(--text-mute); }
tr.is-done td{ text-decoration:line-through; color:var(--text-mute); }
.chk-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.chk-line{ display:flex; align-items:flex-start; gap:0; font-size:12.5px; }
.chk-line.is-done{ text-decoration:line-through; color:var(--text-mute); }
.chk-line .chk{ margin-top:1px; }

.filter-bar{ display:flex; gap:8px; margin:14px 0 20px; }
.filter-btn{
  font-family:var(--font-body); font-size:12.5px; font-weight:700; padding:6px 15px; border-radius:100px;
  border:1px solid var(--border); background:var(--card); color:var(--text-dim); cursor:pointer;
  transition:background .15s, color .15s;
}
.filter-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.filter-btn:hover:not(.active){ background:var(--border-soft); }

.progress-wrap{ margin:6px 0 22px; }
.progress-label{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); font-weight:700; margin-bottom:7px; }
.progress-track{ height:9px; border-radius:100px; background:var(--border-soft); overflow:hidden; }
.progress-fill{ height:100%; border-radius:100px; background:linear-gradient(90deg, var(--accent), var(--accent-bright)); transition:width .3s ease; }

.section-title{
  font-family:var(--font-display); font-size:12.5px; font-weight:800; text-transform:uppercase;
  letter-spacing:.09em; color:var(--text); margin:34px 0 14px; display:flex; align-items:center; gap:9px;
}
.section-title::before{content:''; width:4px; height:15px; background:var(--accent); border-radius:2px; flex:none;}
.section-title svg.icon{ width:1.05em; height:1.05em; color:var(--accent); }
.section-title::after{content:''; flex:1; height:1px; background:var(--border-soft); order:99;}
.section-title:first-child{margin-top:0;}

.note-box{
  background:var(--card); border:1px solid var(--border-soft); border-left:3px solid var(--accent);
  border-radius:var(--radius-sm); padding:12px 15px; font-size:13px; color:var(--text-dim); margin:10px 0;
}
.note-box.amber{border-left-color:var(--amber);}
.note-box.red{border-left-color:var(--red);}
.note-box.violet{border-left-color:var(--violet);}
.note-box b, .note-box strong{color:var(--text);}

/* ===================== TIMELINE ===================== */
.tl{position:relative; margin-left:6px; padding-left:26px; border-left:2px solid var(--border-soft);}
.tl-item{position:relative; padding-bottom:26px;}
.tl-item:last-child{padding-bottom:2px;}
.tl-dot{
  position:absolute; left:-33px; top:2px; width:14px; height:14px; border-radius:50%;
  background:var(--bg); border:2.5px solid var(--accent); box-shadow:0 0 0 4px rgba(84,217,198,0.12);
}
.tl-item.now .tl-dot{background:var(--accent); box-shadow:0 0 0 5px rgba(84,217,198,0.28);}
.tl-card{
  background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:16px 18px;
}
.tl-item.now .tl-card{border-color:var(--accent-border); box-shadow:0 0 0 3px var(--accent-dim);}
.tl-item.is-done .tl-topic{text-decoration:line-through; color:var(--text-mute);}
.tl-meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px; align-items:center;}
.tl-meta .chk{margin-left:auto;}
.tl-time{font-family:var(--font-mono); font-size:12px; color:var(--accent); font-weight:600;}
.tl-topic{font-family:var(--font-display); font-size:16px; font-weight:700; margin:2px 0 8px; color:var(--text);}
.tl-field{margin-top:8px; font-size:13px; color:var(--text-dim);}
.tl-field b{
  display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--text-mute); font-weight:700; margin-bottom:3px; font-family:var(--font-display);
}
.tl-fit{
  margin-top:12px; padding-top:11px; border-top:1px dashed var(--border-soft);
  font-size:12px; color:var(--violet); display:flex; gap:7px;
}
.tl-fit .fi{flex:none;}

/* ===================== PRICE LIST ===================== */
.price-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px;}
.price-card{
  background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:14px 16px; display:flex; flex-direction:column; gap:8px;
}
.price-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.price-name{font-weight:700; font-size:14px; color:var(--text); font-family:var(--font-display);}
.price-cost{
  font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--amber);
  background:var(--amber-dim); padding:3px 9px; border-radius:100px; white-space:nowrap; flex:none;
}
.price-reason{font-size:12.5px; color:var(--text-dim); line-height:1.55;}
.price-bottom{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:2px;}
.price-timing{font-size:11.5px; color:var(--text-dim); font-weight:600; font-family:var(--font-mono);}

.pg-group{margin-bottom:22px;}
.pg-group-title{
  font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--text);
  margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.pg-group-title .bar{width:4px; height:14px; background:var(--accent); border-radius:2px;}
.pg-row{
  display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:9px;
  border:1px solid var(--border-soft); margin-bottom:6px; background:var(--card); font-size:13px;
}
.pg-row .num{font-family:var(--font-mono); color:var(--text-mute); font-size:11.5px; width:18px; flex:none;}
.pg-row .nm{flex:1; min-width:120px; color:var(--text); font-weight:600;}
.pg-row .kw{color:var(--text-mute); font-size:11.5px; font-family:var(--font-mono); flex:1; min-width:130px;}
.pg-row .use{color:var(--text-dim); font-size:12px; flex:1; min-width:120px;}
.pg-row .qty{color:var(--text-mute); font-size:12px; font-family:var(--font-mono); width:40px; flex:none;}
.pg-row .price{color:var(--amber); font-weight:700; font-size:12.5px; font-family:var(--font-mono); width:70px; flex:none; text-align:right;}
.pg-row .bought{width:22px; flex:none; text-align:center; font-size:14px;}
.pg-total{
  display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
  background:var(--accent-dim); border:1px solid var(--accent-border); border-radius:var(--radius-sm);
  font-family:var(--font-display); font-weight:700; color:var(--accent); margin-top:6px;
}
.have-list{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.have-chip{
  display:flex; align-items:center; gap:6px; background:var(--green-dim); color:var(--green);
  border:1px solid var(--green-border); padding:6px 12px; border-radius:100px; font-size:12.5px;
}

/* ===================== PINS ===================== */
.pin-group{margin-bottom:20px;}
.pin-group.warn .pg-group-title{color:var(--red);}
.pin-group.warn .pg-group-title .bar{background:var(--red);}
.pin-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.pin-table th{
  text-align:left; font-family:var(--font-display); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.06em; color:var(--text-mute); padding:7px 10px; border-bottom:1px solid var(--border);
}
.pin-table td{padding:9px 10px; border-bottom:1px solid var(--border-soft); color:var(--text-dim); vertical-align:top;}
.pin-table tr:hover td{background:var(--card);}
.pin-table .pinval{font-family:var(--font-mono); color:var(--accent); font-weight:600;}
.pin-table .pinval.dim{color:var(--text-mute);}
.pin-group.warn .pin-table td{color:var(--red);}
.pin-group.warn .pinval{color:var(--red);}

/* ===================== PROFILES ===================== */
.kid-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:14px; margin-bottom:20px;}
.kid-card{
  background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:18px; display:flex; flex-direction:column; gap:9px;
}
.kid-name{font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--text); display:flex; justify-content:space-between; align-items:center;}
.kid-age{font-family:var(--font-mono); font-size:11.5px; color:var(--text-mute); font-weight:400;}
.kid-fit{font-size:12.5px; color:var(--text-dim); line-height:1.6;}
.summary-list{display:flex; flex-direction:column; gap:8px; margin:12px 0;}
.summary-item{
  display:flex; gap:10px; font-size:13px; color:var(--text-dim); padding:10px 13px;
  background:var(--card); border-radius:var(--radius-sm); border:1px solid var(--border-soft);
}
.summary-item .sb{color:var(--accent); flex:none;}

/* ===================== LIFE / FORTUNE TIMELINE ===================== */
.life-grid{display:grid; grid-template-columns:1fr; gap:8px;}
.life-row{
  display:grid; grid-template-columns:90px 110px 90px 1fr; gap:14px; align-items:center;
  padding:12px 16px; border-radius:var(--radius-sm); border:1px solid var(--border-soft); background:var(--card);
}
.life-row.current{border-color:var(--accent); background:var(--accent-dim);}
.life-age{font-family:var(--font-mono); color:var(--text-mute); font-size:12px;}
.life-stage{font-family:var(--font-display); font-weight:700; color:var(--text); font-size:14px;}
.life-gods{font-size:11.5px; color:var(--violet); font-weight:600;}
.life-year{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); font-weight:700;}
.life-theme{font-size:13px; color:var(--text-dim);}
.stars{color:var(--amber); letter-spacing:1px; font-size:13px;}

/* ===================== OVERVIEW ===================== */
.year-block{margin-bottom:26px;}
.year-tag{
  display:inline-flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700;
  font-size:13px; color:var(--accent); margin-bottom:12px;
  padding:5px 13px; border:1px solid var(--accent-border); border-radius:100px; background:var(--accent-dim);
}
.road-grid{display:flex; flex-direction:column; gap:8px;}
.road-row{
  display:grid; grid-template-columns:26px 34px 130px 1.4fr 1.6fr 1fr 90px; gap:14px; align-items:center;
  padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border-soft); background:var(--card);
  font-size:12.5px;
}
.road-num{
  width:26px; height:26px; border-radius:8px; background:var(--panel); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); color:var(--text-mute); font-size:11px;
}
.road-period{font-family:var(--font-mono); color:var(--text-dim); font-weight:600; font-size:11.5px;}
.road-months{font-family:var(--font-mono); color:var(--text-dim); font-size:11px; margin-top:2px;}
.road-topic{font-weight:700; color:var(--text); font-size:13.5px;}
.road-skill{color:var(--text-dim);}
.road-done{color:var(--text-dim);}
.road-cost{font-family:var(--font-mono); color:var(--amber); text-align:right; font-weight:600;}
.road-row.is-done .road-topic{text-decoration:line-through; color:var(--text-mute);}

.income-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}
.income-card{
  flex:none; width:170px; background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:14px; display:flex; flex-direction:column; gap:5px;
}
.income-time{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); font-weight:600;}
.income-goal{font-family:var(--font-display); font-size:19px; font-weight:700; color:var(--amber);}
.income-model{font-size:11.5px; color:var(--text-dim);}
.income-asset{font-size:11px; color:var(--accent); margin-top:4px; font-weight:700;}

/* ===================== DUAL LIST ===================== */
.dual-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
.list-card{background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 18px;}
.list-card h3{font-family:var(--font-display); font-size:13px; margin:0 0 12px; color:var(--text-dim);}
.list-card ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px;}
.list-card li{
  font-size:13.5px; color:var(--text-dim); padding-left:22px; position:relative;
}
.list-card li::before{content:'▢'; position:absolute; left:0; color:var(--accent);}
.list-card li.has-chk{padding-left:0; display:flex; align-items:flex-start; gap:0;}
.list-card li.has-chk::before{content:none;}
.list-card li.is-done{text-decoration:line-through; color:var(--text-mute);}

/* ===================== GENERIC (table/notes/dividers) ===================== */
.gen-divider{
  font-family:var(--font-display); font-weight:700; font-size:12.5px; color:var(--text);
  margin:24px 0 12px; padding:8px 0 8px 12px; border-left:3px solid var(--accent);
  background:linear-gradient(90deg, var(--card), transparent);
}
.gen-divider:first-child{margin-top:0;}
.gen-note{
  font-size:13px; color:var(--text-dim); background:var(--card); border:1px solid var(--border-soft);
  border-radius:var(--radius-sm); padding:11px 15px; margin:8px 0; line-height:1.65;
}
.gen-note.bullet{border-left:3px solid var(--violet); padding-left:14px;}
.gen-note.numbered{border-left:3px solid var(--accent);}
.gen-table-wrap{overflow-x:auto; margin:10px 0 6px; border:1px solid var(--border-soft); border-radius:var(--radius);}
table.gen-table{width:100%; border-collapse:collapse; font-size:12.8px; min-width:520px;}
table.gen-table thead th{
  position:sticky; top:0; background:#EFF7F5; text-align:left; font-family:var(--font-display);
  font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent);
  padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;
}
table.gen-table td{padding:10px 14px; border-bottom:1px solid var(--border-soft); color:var(--text-dim); vertical-align:top;}
table.gen-table tbody tr:hover td{background:var(--card);}
table.gen-table tbody tr.grp-start td{border-top:1px solid var(--border);}
table.gen-table td:first-child{color:var(--text); font-weight:600;}
.badge-icon{font-weight:700; margin-right:5px;}
.badge-icon.b-good{color:var(--green);}
.badge-icon.b-warn{color:var(--amber);}
.badge-icon.b-bad{color:var(--red);}
.badge-icon.b-mute{color:var(--text-mute);}
.pill{display:inline-block; padding:2px 9px; border-radius:100px; font-size:11px; font-weight:700;}
.pill.done{background:var(--green-dim); color:var(--green);}
.pill.doing{background:var(--amber-dim); color:var(--amber);}
.pill.todo{background:var(--panel); color:var(--text-mute); border:1px solid var(--border);}

footer.site-footer{
  margin-top:50px; padding-top:18px; border-top:1px solid var(--border-soft);
  font-size:11.5px; color:var(--text-mute); text-align:center;
}

/* ---------- Elevation for cards on light background ---------- */
.tl-card, .price-card, .kid-card, .income-card, .list-card, .note-box,
.summary-item, .pg-row, .life-row, .gen-table-wrap, .road-row, .pg-total{
  box-shadow: var(--shadow-card);
}
#sidebar{ box-shadow: 1px 0 0 var(--border-soft); }
#tabbar, #topbar{ box-shadow: 0 1px 0 var(--border-soft); }
.tab.active{ box-shadow: 0 -2px 8px -4px rgba(20,30,60,0.12); }

/* ===================== RESPONSIVE ===================== */
@media (max-width:900px){
  #sidebar{
    position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .25s;
    box-shadow:20px 0 40px rgba(20,30,60,0.15); width:82vw; max-width:320px;
  }
  #sidebar.open{transform:translateX(0);}
  #menuToggle{
    display:flex; align-items:center; justify-content:center; width:36px; height:36px;
    border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text);
    font-size:16px; cursor:pointer; flex:none; margin-right:10px;
  }
  #tabbar{padding:10px 10px 0;}
  #content{padding:20px 16px 70px;}
  .dual-grid{grid-template-columns:1fr;}
  .road-row{grid-template-columns:1fr; row-gap:6px;}
  .road-cost{text-align:left;}
  .life-row{grid-template-columns:1fr; row-gap:4px;}
  .pg-row{flex-wrap:wrap;}
  #sidebarOverlay{
    display:none; position:fixed; inset:0; background:rgba(20,30,60,0.35); z-index:19;
  }
  #sidebarOverlay.show{display:block;}
}

<div id="pwGate" style="position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;">

    <input id="pwInput" type="password" placeholder="密碼" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;margin-bottom:10px;">
    <button id="pwSubmit" type="button" style="width:100%;padding:10px 12px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600;cursor:pointer;">確認</button>
    <div id="pwError" style="display:none;color:var(--amber);font-size:12px;margin-top:10px;">密碼不對，再試一次</div>
  </div>
</div>

<div id="pwProtected" style="display:none;">

<script>
(function(){
  var PW_HASH_DEFAULT = "ee01f147ce42cef694b7a89ba8a8b46c7dca65a3d3bb708ed1200ffbb15e35e8";
  var UNLOCK_KEY = "bwr-unlocked";
  var PW_OVERRIDE_KEY = "bwr-pw-hash-override";

  function currentHash(){
    return localStorage.getItem(PW_OVERRIDE_KEY) || PW_HASH_DEFAULT;
  }

  function sha256Hex(text){
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    });
  }

  function unlock(){
    document.getElementById("pwGate").style.display = "none";
    document.getElementById("pwProtected").style.display = "";
  }

  if(sessionStorage.getItem(UNLOCK_KEY) === "1"){
    unlock();
  }

  function tryPassword(){
    var val = document.getElementById("pwInput").value;
    sha256Hex(val).then(function(hash){
      if(hash === currentHash()){
        sessionStorage.setItem(UNLOCK_KEY, "1");
        unlock();
      }else{
        document.getElementById("pwError").style.display = "block";
      }
    });
  }

  document.getElementById("pwSubmit").addEventListener("click", tryPassword);
  document.getElementById("pwInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") tryPassword();
  });

  function changePassword(){
    var oldPw = prompt("請輸入目前的密碼：");
    if(oldPw === null) return;
    sha256Hex(oldPw).then(function(oldHash){
      if(oldHash !== currentHash()){
        alert("目前密碼輸入錯誤，未變更。");
        return;
      }
      var newPw = prompt("請輸入新密碼：");
      if(newPw === null) return;
      if(!newPw){
        alert("密碼不能是空白，未變更。");
        return;
      }
      var confirmPw = prompt("請再輸入一次新密碼確認：");
      if(confirmPw === null) return;
      if(newPw !== confirmPw){
        alert("兩次輸入的新密碼不一致，未變更。");
        return;
      }
      sha256Hex(newPw).then(function(newHash){
        localStorage.setItem(PW_OVERRIDE_KEY, newHash);
        alert("密碼已更新！提醒：這組新密碼只在這個瀏覽器生效，換電腦或別的瀏覽器打開，還是要用原本的密碼。");
      });
    });
  }

  document.addEventListener("DOMContentLoaded", function(){
    var btn = document.getElementById("changePwBtn");
    if(btn) btn.addEventListener("click", changePassword);
  });
})();
</script>

const CHECK_KEY = 'robotplan_checks_v1';
let CHECK_STATE = {};
try { CHECK_STATE = JSON.parse(localStorage.getItem(CHECK_KEY) || '{}'); } catch(e){ CHECK_STATE = {}; }
function saveChecks(){ try{ localStorage.setItem(CHECK_KEY, JSON.stringify(CHECK_STATE)); }catch(e){} }
function isChecked(id, defaultVal){
  if(Object.prototype.hasOwnProperty.call(CHECK_STATE, id)) return !!CHECK_STATE[id];
  return !!defaultVal;
}
function toggleCheck(id, defaultVal){
  CHECK_STATE[id] = !isChecked(id, defaultVal);
  saveChecks();
}

// ---------- 匯出／匯入備份 ----------
function exportChecks(){
  const payload = {
    app: 'robotplan',
    version: 1,
    exportedAt: new Date().toISOString(),
    checks: CHECK_STATE
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  a.href = url;
  a.download = `robotplan-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importChecksFromFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch(e){ alert('匯入失敗：檔案不是有效的JSON格式'); return; }
    const checks = data && data.checks && typeof data.checks === 'object' ? data.checks : null;
    if(!checks){ alert('匯入失敗：找不到有效的打勾記錄（checks欄位）'); return; }
    const count = Object.keys(checks).length;
    if(!confirm(`即將匯入 ${count} 筆打勾記錄，會覆蓋目前瀏覽器中的紀錄，確定要匯入嗎？`)) return;
    CHECK_STATE = checks;
    saveChecks();
    renderContent();
    alert('匯入完成！');
  };
  reader.onerror = () => alert('匯入失敗：無法讀取檔案');
  reader.readAsText(file);
}
function checkboxHtml(id, defaultVal, extraClass){
  const checked = isChecked(id, defaultVal);
  return `<span class="chk ${checked?'checked':''} ${extraClass||''}" data-check-id="${esc(id)}" data-check-default="${defaultVal?1:0}" role="checkbox" aria-checked="${checked}">${checked?ico('checkCircle'):ico('circleEmpty')}</span>`;
}

const CHECKABLE_SHEETS = [
  '硬體採購清單', '🔧 硬體採購', '每季技術掃描檢核表', '📅 5月計畫', '19堂課程學習規劃',
  '📋 總覽', '整年目標計劃方向', '行動時程表', '個人硬體學習規劃(AGV+機械手臂)', '📌 ESP32腳位',

// 表格中「狀態」欄位在第幾個欄位（0-based），用於 generic 渲染器加上 checkbox
const GENERIC_CHECK_COL = { '19堂課程學習規劃': 5 };
// 沒有專屬狀態欄的 generic 表，改成每一列（含備註列）都加一個獨立的勾選記號
const GENERIC_CHECK_ROWS = ['圖例說明', '主軸二_樹莓派課程', '技能稀缺度與市場切入', '維修市場數據與商業模式', 'AI時代升級對照', '開發環境架構(筆電vs樹莓派)', '學習規劃平台對比'];
function sheetChecklistIds(sheetKey){
  const s = SHEETS[sheetKey];
  const out = [];
  if(sheetKey === '硬體採購清單'){
    s.payload.items.forEach((it,i)=> out.push({id:`hw-list::${i}`, def:/已購買/.test(it.status)}));
  } else if(sheetKey === '🔧 硬體採購'){
    s.payload.groups.forEach((g,gi)=> g.items.forEach((it,ii)=> out.push({id:`hw-grouped::${gi}-${ii}`, def:/✅/.test(it.bought)})));
  } else if(sheetKey === '每季技術掃描檢核表'){
    s.payload.sections.forEach((sec,si)=> sec.quarters.forEach((q,qi)=> q.items.forEach((_,ii)=> out.push({id:`quarterly::${si}-${qi}-${ii}`, def:false}))));
  } else if(sheetKey === '📅 5月計畫'){
    s.payload.weeks.forEach((w,wi)=> w.days.forEach((d,di)=> out.push({id:`may-plan::${wi}-${di}`, def:false})));
  } else if(sheetKey === '19堂課程學習規劃'){
    // 排除表頭列(第0列)與結尾單欄「說明」列，其餘每列一個 checkbox
    s.payload.rows.forEach((row,ri)=>{
      if(ri === 0) return; // 表頭
      const nn = row.filter(c => c !== null && c !== undefined && c !== '');
      if(nn.length <= 1) return; // 單欄說明列
      out.push({id:`course19::${ri}`, def:false});
    });
  } else if(sheetKey === '📋 總覽'){
    s.payload.roadmap.forEach((_,i)=> out.push({id:`overview::${i}`, def:false}));
  } else if(sheetKey === '整年目標計劃方向'){
    s.payload.listA.items.forEach((_,i)=> out.push({id:`duallist::A-${i}`, def:false}));
    s.payload.listB.items.forEach((_,i)=> out.push({id:`duallist::B-${i}`, def:false}));
  } else if(sheetKey === '行動時程表'){
    s.payload.items.forEach((_,i)=> out.push({id:`timeline::${i}`, def:false}));
  } else if(sheetKey === '個人硬體學習規劃(AGV+機械手臂)'){
    s.payload.timeline.forEach((_,i)=> out.push({id:`hwplan::${i}`, def:false}));
  } else if(sheetKey === '📌 ESP32腳位'){
    s.payload.groups.forEach((g,gi)=> g.items.forEach((_,ii)=> out.push({id:`pins::${gi}-${ii}`, def:false})));
  } else if(GENERIC_CHECK_ROWS.includes(sheetKey)){
    genericRowPlan(s.payload.rows).forEach(pl => { if(pl.checkable) out.push({id:`generic::${sheetKey}::${pl.ri}`, def:false}); });
  }
  return out;
}
// 重現 generic 渲染器判斷「哪些列是分隔線/表頭/可勾選內容」的邏輯，
// 供 sheetChecklistIds 與 RENDERERS.generic 共用，確保 ID 對應一致
function genericRowPlan(rows){
  const plan = [];
  let headers = null;
  let prevWasDividerOrStart = true;
  const nonNull = (row) => row.filter(c => c !== null && c !== undefined && c !== '');
  rows.forEach((row, ri) => {
    const nn = nonNull(row);
    if(nn.length === 1){
      const c = classifySingle(String(nn[0]));
      if(c.kind === 'divider'){
        headers = null;
        prevWasDividerOrStart = true;
        plan.push({ri, checkable:false});
        return;
      }
      plan.push({ri, checkable:true});
      return;
    }
    const maxLen = Math.max(...nn.map(c => String(c).replace(/\n/g,' ').length));
    if(prevWasDividerOrStart && !headers && maxLen <= 20){
      headers = row;
      prevWasDividerOrStart = false;
      plan.push({ri, checkable:false});
      return;
    }
    prevWasDividerOrStart = false;
    if(!headers) headers = row.map((_,i)=>'欄'+(i+1));
    plan.push({ri, checkable:true});
  });
  return plan;
}
function sheetProgress(sheetKey){
  const ids = sheetChecklistIds(sheetKey);
  const total = ids.length;
  const done = ids.filter(o => isChecked(o.id, o.def)).length;
  return {done, total};
}
function globalProgress(){
  let done=0, total=0;
  CHECKABLE_SHEETS.forEach(k=>{ const p = sheetProgress(k); done+=p.done; total+=p.total; });
  return {done, total};
}
function progressBarHtml(done, total, label){
  const pct = total ? Math.round(done/total*100) : 0;
  return `<div class="progress-wrap">
    <div class="progress-label"><span>${esc(label||'完成進度')}</span><span>${done} / ${total}（${pct}%）</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;
}
let FILTER_STATE = {};
function filterBarHtml(sheetKey){
  const mode = FILTER_STATE[sheetKey] || 'all';
  return `<div class="filter-bar">
    <button class="filter-btn ${mode==='all'?'active':''}" data-sheet="${esc(sheetKey)}" data-mode="all">全部</button>
    <button class="filter-btn ${mode==='todo'?'active':''}" data-sheet="${esc(sheetKey)}" data-mode="todo">只看未完成</button>
  </div>`;
}

}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function el(html){

function buildNav(){
  const nav = document.getElementById('navTree');

function refreshNavActive(){
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.key === activeTab);
  });
}

// ---------- tabs ----------
function openTab(key){
  if(!SHEETS[key]) return;
  if(!openTabs.includes(key)) openTabs.push(key);
  activeTab = key;
  renderTabs();
  renderContent();
  refreshNavActive();
  document.getElementById('content').scrollTop = 0;
}
function closeTab(key, evt){
  if(evt) evt.stopPropagation();
  const idx = openTabs.indexOf(key);
  if(idx === -1) return;
  openTabs.splice(idx,1);
  if(activeTab === key){
    activeTab = openTabs.length ? openTabs[Math.max(0, idx-1)] : null;
  }
  renderTabs();
  renderContent();
  refreshNavActive();
}
function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  openTabs.forEach(k => {
    const s = SHEETS[k];
    const tab = el(`<div class="tab ${k===activeTab?'active':''}" data-key="${esc(k)}">
      <span class="ti">${ico(s.icon||'info')}</span>
      <span class="tt">${esc((s.title||k).slice(0,14))}</span>
      <span class="tx">✕</span>
    </div>`);
    tab.addEventListener('click', (e) => { if(!e.target.classList.contains('tx')) openTab(k); });
    tab.querySelector('.tx').addEventListener('click', (e) => closeTab(k, e));
    bar.appendChild(tab);
  });
}

// ---------- render dispatch ----------
function renderContent(){
  const c = document.getElementById('content');
  if(!activeTab){
    c.innerHTML = `<div class="empty-state">
      <div class="es-icon">${ico('folder')}</div>
      <div>從左側選單挑一份資料表，或直接搜尋關鍵字開始瀏覽。</div>
    </div>`;
    return;
  }
  const s = SHEETS[activeTab];
  let bodyHtml = '';
  try{
    bodyHtml = RENDERERS[s.render] ? RENDERERS[s.render](s.payload, activeTab) : `<div class="gen-note">尚無渲染器：${esc(s.render)}</div>`;
  }catch(err){
    bodyHtml = `<div class="gen-note">內容渲染發生錯誤：${esc(err.message)}</div>`;
    console.error(err);
  }
  let extraTop = '';
  if(activeTab === '📋 總覽'){
    const g = globalProgress();
    extraTop = progressBarHtml(g.done, g.total, '四年計畫整體完成度') + filterBarHtml(activeTab);
  } else if(CHECKABLE_SHEETS.includes(activeTab)){
    const pr = sheetProgress(activeTab);
    extraTop = progressBarHtml(pr.done, pr.total) + filterBarHtml(activeTab);
  }
  c.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow"><span>${ico(s.icon||'info')}</span><span>${esc(s.category)}</span></div>
      <h2 class="page-title">${esc(s.title || activeTab)}</h2>
      ${s.subtitle ? `<p class="page-sub">${esc(s.subtitle)}</p>` : ''}
    </div>
    ${extraTop}
    ${bodyHtml}
    <footer class="site-footer">四年行動作戰室 · 資料整理自 AI機器人服務整合維修 行動時程表</footer>
  `;
}

// ============================================================
// GENERIC RENDERER — for the remaining 9 sheets
// ============================================================
function classifySingle(text){
  const t = text.trim();
  if(t.startsWith('▌')) return {kind:'divider', text:t.replace(/^▌\s*/,'')};
  if(t.startsWith('•') || t.startsWith('·')) return {kind:'note-bullet', text:t.replace(/^[•·]\s*/,'')};
  if(/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(t)) return {kind:'note-numbered', text:t};
  if(/。/.test(t) || /：.{10,}/.test(t)) return {kind:'note', text:t};
  if(t.length <= 34) return {kind:'divider', text:t};
  return {kind:'note', text:t};
}

function badgeCell(val){
  const s = String(val);
  const m = s.match(/^(✓✓|✓|△|✗|⭐+|☆+|✅|☐)\s*([\s\S]*)$/);
  if(!m) {
    if(s === '已完成') return `<span class="pill done">已完成</span>`;
    if(s === '進行中') return `<span class="pill doing">進行中</span>`;
    if(s === '未開始' || s === '未購買') return `<span class="pill todo">${esc(s)}</span>`;
    return nl2br(s);
  }
  const sym = m[1], rest = m[2];
  let iconKey = null, cls = 'b-mute';
  if(sym === '✓✓' || sym === '✅'){ iconKey='checkCircle'; cls='b-good'; }
  else if(sym === '✓'){ iconKey='checkCircle'; cls='b-good'; }
  else if(sym === '△'){ iconKey='alertTriangle'; cls='b-warn'; }
  else if(sym === '✗'){ iconKey='xCircle'; cls='b-bad'; }
  else if(sym === '☐'){ iconKey='circleEmpty'; cls='b-mute'; }
  else if(sym.startsWith('⭐')||sym.startsWith('☆')){
    return `<span class="badge-icon b-warn">${esc(sym)}</span>${nl2br(rest)}`;
  }
  const iconHtml = iconKey ? ico(iconKey, 'badge-icon '+cls) : `<span class="badge-icon ${cls}">${esc(sym)}</span>`;
  return `${iconHtml}${nl2br(rest)}`;
}

RENDERERS.generic = (p, sheetKey) => {
  const rows = p.rows;
  const checkColIdx = GENERIC_CHECK_COL[sheetKey];
  const rowCheckEnabled = GENERIC_CHECK_ROWS.includes(sheetKey);
  let html = '';
  let headers = null;
  let tableOpen = false;

  function nonNull(row){ return row.filter(c => c !== null && c !== undefined && c !== ''); }

  function closeTable(){
    if(tableOpen){ html += `</tbody></table></div>`; tableOpen = false; }
  }
  function openTable(hdrs){
    closeTable();
    const extraTh = rowCheckEnabled ? '<th style="width:36px"></th>' : '';
    html += `<div class="gen-table-wrap"><table class="gen-table"><thead><tr>` +
      hdrs.map(h=>`<th>${nl2br(h===null||h===undefined?'':h)}</th>`).join('') + extraTh + `</tr></thead><tbody>`;
    tableOpen = true;
  }

  let prevWasDividerOrStart = true;
  const mode = (checkColIdx !== undefined || rowCheckEnabled) ? (FILTER_STATE[sheetKey] || 'all') : 'all';

  rows.forEach((row, ri) => {
    const nn = nonNull(row);
    if(nn.length === 1){
      const c = classifySingle(String(nn[0]));
      if(c.kind === 'divider'){
        closeTable();
        headers = null;
        html += `<div class="gen-divider">${esc(c.text)}</div>`;
        prevWasDividerOrStart = true;
        return;
      }
      const cls = c.kind === 'note-bullet' ? 'bullet' : (c.kind === 'note-numbered' ? 'numbered' : '');
      let rowCheckId = null, rowChecked = false, cbHtml = '';
      if(rowCheckEnabled){
        rowCheckId = `generic::${sheetKey}::${ri}`;
        rowChecked = isChecked(rowCheckId, false);
        if(mode === 'todo' && rowChecked) return;
        cbHtml = checkboxHtml(rowCheckId, false, 'chk-inline');
      }
      if(tableOpen && headers){
        // keep this note INSIDE the open table (as a full-width row) so we
        // never emit a <div> as a direct child of <tbody> (invalid HTML).
        html += `<tr><td colspan="${headers.length + (rowCheckEnabled?1:0)}" class="gen-note ${cls} ${rowChecked?'is-done':''}" style="border:none;">${cbHtml}${esc(c.text)}</td></tr>`;
      } else {
        html += `<div class="gen-note ${cls} ${rowChecked?'is-done':''}">${cbHtml}${esc(c.text)}</div>`;
      }
      return;
    }
    // multi-cell row (positions preserved — nulls stay in place)
    const maxLen = Math.max(...nn.map(c => String(c).replace(/\n/g,' ').length));
    if(prevWasDividerOrStart && !headers && maxLen <= 20){
      headers = row;
      openTable(headers);
      prevWasDividerOrStart = false;
      return;
    }
    prevWasDividerOrStart = false;
    if(!headers){
      headers = row.map((_,i)=>'欄'+(i+1));
      openTable(headers);
    }
    let checkId = null, checkDone = false;
    if(checkColIdx !== undefined){
      checkId = `course19::${ri}`;
      checkDone = isChecked(checkId, false);
      if(mode === 'todo' && checkDone) return;
    } else if(rowCheckEnabled){
      checkId = `generic::${sheetKey}::${ri}`;
      checkDone = isChecked(checkId, false);
      if(mode === 'todo' && checkDone) return;
    }
    const groupStart = row[0] !== undefined && row[0] !== null && row[0] !== '';
    html += `<tr class="${groupStart?'grp-start':''} ${checkDone?'is-done':''}">` +
      headers.map((_,i) => {
        if(checkColIdx !== undefined && i === checkColIdx){
          return `<td style="text-align:center">${checkboxHtml(checkId, false)}</td>`;
        }
        return `<td>${row[i] !== undefined && row[i] !== null ? badgeCell(row[i]) : ''}</td>`;
      }).join('') +
      (rowCheckEnabled ? `<td style="text-align:center">${checkboxHtml(checkId, false)}</td>` : '') +
      `</tr>`;
  });
  closeTable();
  return html || '<div class="gen-note">（此工作表暫無可顯示內容）</div>';
};

// SEARCH
// ============================================================
function buildSearchIndex(){
  const idx = [];
  Object.keys(SHEETS).forEach(k => {
    const s = SHEETS[k];
    let text = (s.title||'') + ' ' + (s.subtitle||'') + ' ' + JSON.stringify(s.payload);
    idx.push({key:k, title:s.title||k, icon:ico(s.icon||'info'), text});
  });
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();

function doSearch(q){
  const box = document.getElementById('searchResults');
  q = q.trim();
  if(!q){ box.classList.remove('show'); return; }
  const ql = q.toLowerCase();
  const hits = SEARCH_INDEX
    .map(item => {
      const tl = item.text.toLowerCase();
      const count = tl.split(ql).length - 1;
      return {...item, count};
    })
    .filter(i => i.count > 0)
    .sort((a,b)=> b.count - a.count)
    .slice(0, 10);

  if(!hits.length){
    box.innerHTML = `<div class="sr-empty">找不到符合「${esc(q)}」的內容</div>`;
    box.classList.add('show');
    return;
  }
  box.innerHTML = hits.map(h => {
    const rawIdx = h.text.toLowerCase().indexOf(ql);
    let snip = h.text.substring(Math.max(0,rawIdx-18), rawIdx+40).replace(/[{}"\[\]]/g,' ');
    return `<div class="sr-item" data-key="${esc(h.key)}">
      <div class="sr-title"><span>${h.icon}</span><span>${esc(h.title)}</span></div>
      <div class="sr-snip">…${esc(snip)}…</div>
    </div>`;
  }).join('');
  box.classList.add('show');
  box.querySelectorAll('.sr-item').forEach(item => {
    item.addEventListener('click', () => {
      openTab(item.dataset.key);
      box.classList.remove('show');
      document.getElementById('searchInput').value = '';
    });
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => doSearch(e.target.value));
document.getElementById('searchInput').addEventListener('focus', (e) => { if(e.target.value) doSearch(e.target.value); });
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-wrap')) document.getElementById('searchResults').classList.remove('show');
});
